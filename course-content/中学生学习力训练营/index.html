ost likely to get wrong today?\n3. Post the \"Fact-Checking Checklist\" in your study area as a permanent habit.\n\n---\n\n## Lesson Summary & Next Steps\nAI \"confidently talks nonsense\" — that's its most dangerous trap. Facing any factual information, put a question mark first, then cross-check with authoritative sources. That is the most basic information literacy of the AI age. Remember: **what's credible is not \"what AI said\" but \"what reliable sources confirmed.\"** Check every fact first — write this into your user-manual red line.\n\n### Four types of high-mimicry rumors (be alert when you see them)\n1. **Misattribution**: pinning A's achievement onto B (e.g., crediting someone else's discovery to a celebrity).\n2. **Precise fabrication**: giving a very specific fake number or year to look authoritative.\n3. **Invented references**: fabricating book titles, authors, journals — nothing found on search.\n4. **Outdated info**: answering today's question with old data, without noting the time limit.\nFor all four, the first reaction should be: verify with an authoritative source.\n\n### A note for parents/teachers\nPlay a \"spot-the-error game\" with your child: deliberately give an AI answer mixed with mistakes and see if the child can catch and verify them. Turning \"seeing through false info\" into a point of pride works better than repeating \"don't trust the internet.\"\n\n## Grading Rubric (10 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Verification done | 3 | All 3 items effectively checked |\n| Source credibility | 3 | Used authoritative / cross sources |\n| Error spotted | 2 | Found and explained an AI error |\n| Habit internalized | 2 | Checklist-based, reusable long-term |\n", "07-演讲和表达-en.md": "# 07 · Presentation & Expression → Speech Draft + Feedback\n\n## Learning Goals\n1. Use AI as a \"speech coach\": help organize arguments, design structure, polish expression — not write the script for you.\n2. Finish a speech draft of your own and build a \"self-assessment + peer-assessment\" feedback loop.\n3. Improve logical organization and spoken-expression awareness (opening — body — ending).\n4. Hold the red line: the core content of the script comes from you; AI only gives structure and expression advice.\n\n---\n\n## Warm-up Question\n> Your class needs a 3-minute speech \"AI in My Eyes.\" What will you do?\n> A. Let AI write the whole thing and memorize it. → Not your voice; the teacher hears it instantly, and you can't deliver it alive.\n> B. First list 3 points you want to make, then ask AI to check \"is the structure clear, which part needs an example,\" and write the script yourself.\n>\n> A good speech has \"your idea\" first, then \"good expression.\"\n\n---\n\n## Core Concepts\n\n### 1. The three-part speech structure\n- **Opening**: grab attention (a story / a question / a contrast).\n- **Body**: 2–3 arguments, each with 1 example or data point.\n- **Ending**: echo the opening, leave one memorable point.\n\n### 2. AI's correct role\n- **Structure advisor**: check if your outline logic flows.\n- **Example coach**: suggest \"add a life example here to make it livelier.\"\n- **Expression polisher**: point out where it's too formal, where there are too many filler words.\n- **Not a ghostwriter**: it doesn't decide \"what you want to say.\"\n\n### 3. Two sources of feedback\n- **Self-assessment**: record yourself / read once, find stumbles and weak spots.\n- **Peer-assessment**: classmates give feedback by a standard (content / structure / expression).\n\n### 4. Spoken vs. written\nSpeeches use short sentences and natural connectors; avoid long, hard sentences and piled-up jargon.\n\n---\n\n## Real Learning-scenario Cases\n\n### Case: Topic \"Why study history\"\n- **Wrong**: \"Write me a speech on the meaning of studying history.\" → all AI, no you.\n- **Right**: You first list \"1. know where we come from 2. learn methods 3. avoid being misled\" as three points, then ask AI: \"Is my structure smooth? Can you give a direction for a historical anecdote I can fill in for part two?\" You write the script, then ask \"is my opening catchy enough?\"\n\n### Case: English speech \"My Hero\"\n- **Wrong**: AI writes the whole English script; you read it but don't understand.\n- **Right**: You write Chinese key points; AI helps turn key sentences into natural English and explains why; you finally deliver in your own words.\n\n---\n\n## Right vs. Wrong Use\n\n| | ❌ Wrong | ✅ Right |\n| --- | --- | --- |\n| Script source | AI writes it all | You write it; AI gives structure advice |\n| What AI gives | A complete new script | Structure / example / expression feedback |\n| What you do | Memorize AI's script | Express yourself, revise yourself |\n| Improvement | None | Logic + expression both improve |\n\n---\n\n## Hands-on Task\n1. Pick a 3-minute speech topic; first list your own \"opening — 3 arguments — ending\" outline.\n2. Give the outline to AI; ask it to give feedback only on \"is the structure clear, which part lacks an example,\" not to write the script.\n3. Write the speech yourself (300–400 Chinese characters / 150–200 English words).\n4. Record yourself reading it once; use the \"self-assessment form\" to find 2 improvable spots; then ask a classmate for \"peer-assessment form\" feedback.\n\n---\n\n## Prompt Template (student version)\n```\nI'm a [grade: ______] student doing a [3]-minute speech on [topic: ______].\nHere is the outline I wrote myself: [paste: ______].\nPlease do NOT write the script for me. Please:\n1. Evaluate whether my structure is clear (opening / body / ending);\n2. Point out which part most needs an example, and give me a \"fill-it-yourself\" example direction;\n3. Check if my expression is too formal, and give 1 spoken-language suggestion.\nI will write the script myself.\n```\n> Red line: your viewpoint, your script; AI is only a coach, it doesn't speak.\n\n---\n\n## Human Review Checklist (self-check)\n- [ ] The outline and core viewpoint came from me.\n- [ ] AI only gave structure / example / expression advice, didn't write the script.\n- [ ] I finished my own speech script and recorded a self-assessment.\n- [ ] I got a classmate's peer feedback and recorded improvements.\n\n---\n\n## Common Mistakes\n1. **Ghostwritten speech**: all-AI script, loses personal voice.\n2. **Take-but-don't-revise**: collect advice but don't act on it, script doesn't improve.\n3. **No practice**: finished but never read or recorded, freezes on stage.\n4. **Ignore peer feedback**: only self-assessing leaves blind spots; peer review fills them.\n\n---\n\n## Homework\n1. Submit: speech outline + your own script + self-assessment form (≥2 improvements) + classmate peer-assessment form.\n2. Use the guided template for real once; record AI's structure advice and your revisions.\n3. Write 1 sentence: what was your biggest expression improvement this time?\n\n---\n\n## Lesson Summary & Next Steps\nA good speech has \"your idea\" first, then \"good expression.\" AI fits the role of structure advisor and expression coach, but the soul of the script must come from you. The \"self + peer\" dual feedback improves faster than practicing alone — others immediately see where you stumble, go empty, or drift off topic.\n\n### Five tips to beat stage nerves\n1. **Three deep breaths at the opening**: steady the first sentence and the rest flows.\n2. **Lock onto \"friendly faces\"**: find a nodding, encouraging classmate and speak to them.\n3. **Use \"cue words\" not the full text**: remember only keywords, improvise naturally.\n4. **Allow pauses**: a pause isn't dead air, it lets the audience digest.\n5. **Use AI as a rehearsal audience**: deliver to AI first, let it point out what it doesn't understand, fix ahead.\n\n### A note for parents/teachers\nGiving children a real audience and real feedback matters more than a perfect script. At home, do a weekly \"3-minute share\" on any topic; at school, use the peer form for classmate feedback. Expression is trained, not talked about.\n\n### Quick self-check card (30 seconds before going on stage)\n- Are the outline and core viewpoint mine? Yes → continue.\n- Is the opening—body—ending structure complete? Yes → continue.\n- Have I practiced at least once and revised? Revised → speak with confidence.\nWith a \"share\" mindset rather than a \"perform\" mindset, nerves drop by more than half.\n\n## Grading Rubric (10 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Originality | 3 | Viewpoint and script truly yours |\n| Clear structure | 2 | Opening / body / ending complete |\n| Feedback used | 3 | Self + peer assessment, actually revised |\n| Expression improved | 2 | Spoken, supported by examples |\n", "08-个人学习助手设计-en.md": "# 08 · Personal Learning Assistant Design → User Manual\n\n## Learning Goals\n1. Assemble the methods from the previous 7 lessons into your own AI learning-assistant way of working.\n2. Design a three-in-one personal manual: \"role setting + common templates + red lines.\"\n3. Form a personalized learning system that is reusable long-term and iterable.\n4. Make \"academic integrity + fact-checking\" a permanent clause of the manual.\n\n---\n\n## Warm-up Question\n> In the previous 7 lessons you collected many good methods: guided questioning, mistake cards, revision records, checklists…\n> But methods sit scattered and get forgotten once exams get busy. This lesson, we **bind them into a book** — your \"AI Learning Assistant User Manual.\"\n> From now on, for any learning task, just open the manual.\n\n---\n\n## Core Concepts\n\n### 1. What is a \"personal learning assistant\"\nNot a piece of software, but **a stable way of working you set up for AI**: it knows who you are, what tone to use, and what red lines to keep.\n\n### 2. The three parts of the manual\n- **Role setting (System Prompt)**: tell AI \"you are my learning coach, guide me, don't give the final answer directly.\"\n- **Common templates**: collect the templates from lessons 02/03/04/05/06/07, categorized by scenario.\n- **Red-line clauses**: don't copy answers, check every fact first, note AI assistance, write the core content yourself.\n\n### 3. Role-setting example\n\"You are my middle-school learning coach. For any question, first guide me to understand, don't give the final answer directly; for any factual info, remind me to check; I am ultimately responsible for what I submit.\"\n\n### 4. The manual must be \"alive\"\nReview it once a month; delete what doesn't work, add newly discovered good templates. It is your learning asset and grows more valuable over time.\n\n---\n\n## Real Learning-scenario Cases\n\n### Case: One week before exams\nOpen the manual's \"review plan\" template, generate a weekly plan in 5 minutes; use the \"self-test question\" template for day-after self-tests; use the \"checklist\" to verify the exam-point data AI gave in the manual. The whole flow runs automatically.\n\n### Case: Stuck writing an essay\nOpen the \"writing revision record\" template: write a draft yourself first, then go through the \"mark 3 errors + explain\" flow, and finally fill the three-column table. No more random asking.\n\n---\n\n## Right vs. Wrong Use\n\n| | ❌ Wrong | ✅ Right |\n| --- | --- | --- |\n| Method state | Scattered, relies on memory | Bound into a manual |\n| Questioning | Made up each time | Apply fixed templates |\n| Red lines | Often forgotten | Written in manual, reviewed often |\n| Growth | Doesn't accumulate | Iterates and upgrades monthly |\n\n---\n\n## Hands-on Task\n1. Write a \"role setting\" that states who you are and how you want AI to help (including guiding style + check reminder).\n2. Organize the previous lessons' templates into the manual, categorized as \"questioning / breakdown / writing / review / checking / speech.\"\n3. Write 3–5 \"red-line clauses\" (must include: don't copy answers, check every fact first, note AI assistance).\n4. Add a \"monthly review\" page to the manual, recording which templates work and which to change.\n\n---\n\n## Prompt Template (student version · role setting)\n```\nYou are my [grade: ______] learning coach.\nPlease always:\n1. Guide me to understand, don't give the final answer directly;\n2. For any factual info, remind me to check before use;\n3. Where I might directly copy, remind me \"this is your homework, complete it yourself\";\n4. Use language I understand, with life examples when needed.\nI am ultimately responsible for what I submit.\n```\n> Red line: the manual's first clause is always \"don't copy answers, check every fact first, note AI assistance.\"\n\n---\n\n## Human Review Checklist (self-check)\n- [ ] I have a clear role setting, including guiding style and check reminder.\n- [ ] The manual collected ≥4 previous-lesson templates, clearly categorized.\n- [ ] Red-line clauses are explicit, including check and integrity requirements.\n- [ ] The manual has a \"monthly review\" mechanism and is iterable.\n\n---\n\n## Common Mistakes\n1. **Manual too vague**: only slogans, no applicable templates.\n2. **Missing red lines**: forgot to write integrity / checking in, easy to slide into ghostwriting.\n3. **Write but never update**: manual becomes decoration, methods stay scattered.\n4. **Role setting too broad**: let AI \"help with everything,\" losing boundaries instead.\n\n---\n\n## Homework\n1. Finish your \"AI Learning Assistant User Manual\" (role setting + template set + red lines + monthly review page).\n2. Using the manual's role setting, start one real new conversation to verify it \"guides rather than ghostwrites\" as you expected.\n3. One month later, write on the \"monthly review page\": which template works best? Which to change?\n\n---\n\n## Lesson Summary & Next Steps\nYour \"AI Learning Assistant User Manual\" is the training camp's \"final assembly\": the role setting tells AI how to help you, the template set lets you apply instantly, the red-line clauses hold the bottom line, and the monthly review makes it better the more you use it. It is not a document but your personal \"learning-method operating system.\"\n\n### Advanced: digitize the manual\nBeyond writing it in a doc, you can also:\n- Save the role setting as the AI tool's \"fixed prefix / system prompt,\" auto-attached to every conversation;\n- Make common templates into phone-memo quick phrases, paste anytime;\n- Use a table to record \"which template for which task type,\" forming a retrieval index.\nLet the manual truly blend into daily life, not be forgotten after writing.\n\n### A note for parents/teachers\nHave your child \"demo\" the manual to you once a quarter: open a conversation, paste the role setting, solve a real learning problem on the spot. You can directly see from their operation whether the method is internalized. Only when the manual comes alive does the camp truly end.\n\n### Quick self-check card (10 seconds before each AI use)\n- Did I attach my role setting? Attached → continue.\n- Is this \"guiding\" not \"ghostwriting\"? Yes → continue.\n- Did I hold the red-line clauses? Held → use with confidence.\nThe manual isn't finished by writing — it's \"used into being.\" Use it once more and it gets stronger.\n\n## Grading Rubric (10 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Role setting | 3 | Includes guiding + check + responsibility statement |\n| Template complete | 3 | ≥4 template types, applicable |\n| Red lines clear | 2 | Includes integrity and check hard requirements |\n| Iterable | 2 | Has review mechanism, usable long-term |\n", "09-Prompt模板库-en.md": "# 09 · Prompt Template Library (Student Quick-Reference)\n\n> This page collects all reusable questioning templates from the course. Every template carries the **red-line sentence by default**:\n> **\"Please guide me to understand, don't give the final answer directly; for any factual info, remind me to check; the core content I complete myself.\"**\n> Copy it together with the red-line sentence to build the habit.\n\n---\n\n## 0. Universal Role Setting (paste once at the start of each conversation)\n\n```\nYou are my [grade: ______] learning coach.\nPlease always:\n1. Guide me to understand, don't give the final answer directly;\n2. For any factual info, remind me to check before use;\n3. Where I might directly copy, remind me \"this is your homework, complete it yourself\";\n4. Use language I understand, with life examples when needed.\nI am ultimately responsible for what I submit.\n```\n\n---\n\n## 1. Concept Understanding (01 / cross-discipline)\n\n```\nI'm a [grade: ______] student wanting to understand [concept: ______].\nPlease help me build intuition with a life example, then give 1–2 hints for me to derive it myself,\nand finally test in 1 sentence whether I truly get it. Don't give the definition directly.\n```\n\n---\n\n## 2. Subject Questioning (02 · STAR method)\n\n```\nI'm a [grade: ______] student studying [subject / topic: ______].\nI'm stuck at: [specific sticking point: ______].\nPlease play my [subject] coach, guide me to understand, don't give the final answer directly.\n1. First confirm where I don't get it; 2. give 1–2 hints; 3. wait for my answer to judge the next step; 4. test me at the end.\n```\n\n---\n\n## 3. Hard-problem Breakdown (03 · mistake step-card)\n\n```\nI'm working on a [subject] problem: [paste problem: ______].\nI've done: [completed steps: ______]. Stuck at: [sticking point: ______].\nPlease give only the [next-step] hint, guide me to understand, don't give the full solution.\nI'll tell you when done, and you judge what I should do next.\n```\n\n---\n\n## 4. Writing Revision (04 · three-column record)\n\n```\nI wrote a [English / Chinese] essay on [topic: ______]. Draft: [paste: ______].\nPlease don't rewrite it for me. Please:\n1. Mark only the 3 problems most hurting the score;\n2. Explain \"why it's a problem\" for each;\n3. Give me a direction to fix it myself, no ready-made sentences.\nI will revise and record myself.\n```\n\n---\n\n## 5. Review Plan (05 · self-test questions)\n\n```\nI'm reviewing [subject / unit: ______]. Note key points: [paste: ______].\nPlease don't memorize for me. Please:\n1. Organize into \"core concepts + key relations + easy-mistake points\";\n2. Draw a text-based knowledge map;\n3. Give 5 self-test questions to quiz me; I answer first, then send you for feedback.\n```\n\n---\n\n## 6. Fact-Checking (06 · anti-hallucination)\n\n```\nI want to verify a fact: [fact statement: ______].\nPlease: 1. Say whether this is a \"fact\" or an \"opinion\";\n2. If unsure or possibly outdated, clearly say \"I cannot guarantee accuracy\";\n3. Give me 1–2 directions for authoritative sources I can check myself;\n4. Do not fabricate references.\n```\n\n---\n\n## 7. Speech Expression (07 · structure coach)\n\n```\nI'm doing a [3]-minute speech on [topic: ______]. Outline: [paste: ______].\nPlease don't write the script for me. Please:\n1. Evaluate whether the structure is clear;\n2. Point out which part most needs an example, give a \"fill-it-yourself\" example direction;\n3. Check if the expression is too formal, give 1 spoken-language suggestion.\nI write the script myself.\n```\n\n---\n\n## 8. Personal Assistant (08 · assembly)\n\n```\nBased on my \"AI Learning Assistant User Manual,\" this task: [task: ______].\nPlease assist me per the manual's red lines and template style: guide not ghostwrite, check facts first, core done by me.\n```\n\n---\n\n## 9. English Speaking Practice (supplement)\n\n```\nPlease chat with me in English on topic [______].\nWhen I make a grammar / word error, first let me try to fix it myself, then gently point it out and explain;\nno long corrections, 1–2 points each time. Use a pace and vocabulary I can follow.\n```\n\n---\n\n## 10. Mistake Explanation (supplement)\n\n```\nHere is one of my wrong problems: [paste: ______].\nPlease analyze: 1. what ability this problem tests; 2. which step I most likely thought wrong;\n3. give a similar variant for me to practice on the spot. Don't give the original answer directly.\n```\n\n---\n\n> Usage discipline: a template is a \"scaffold,\" not an \"answer machine.\" Before each use ask yourself — \"am I letting AI think for me at this step?\" If yes, take it back and do it yourself.\n", "10-学术诚信模块-en.md": "# 10 · Academic Integrity Module (Fact-Checking / Citing Sources / Avoiding Plagiarism)\n\n> This module is the training camp's **hard red line**, paired with Lesson 06 (Judging True from False) but focused on \"academic integrity\":\n> what counts as plagiarism, how to cite correctly, how to hold the honesty bottom line in the AI age.\n> Whether school, institution, or self-study at home, this module's content must be implemented.\n\n---\n\n## I. Why This Lesson\nAI makes \"writing a decent passage\" extremely easy, and also makes it easier for students to cross the line unintentionally:\n- Submitting AI-generated text as if self-written (concealment + plagiarism);\n- Directly copying web / encyclopedia without citation (theft);\n- Citing references AI fabricated (fabrication);\n- Using AI to take exams / do homework for you (academic fraud).\n\n**Academic integrity is not a skill of \"not getting caught,\" but a bottom line of \"being responsible for your own learning.\"**\nUsing AI to assist learning is totally OK; using AI to replace learning, conceal its use, or plagiarize others is not.\n\n---\n\n## II. Core Concepts\n\n### 1. What is \"Plagiarism\"\nSubmitting content you didn't originally create (text, ideas, data, images) as your own without citing the source is plagiarism. Including:\n- Copying AI / web / classmate homework in whole passages;\n- Changing only a few words and calling it your own (\"spin-plagiarism\" also counts);\n- Translating someone's article without citation.\n\n### 2. What is \"Reasonable Use of AI\"\n✅ Use AI to explain concepts, give ideas, give revision feedback, generate practice problems;\n✅ Form your own expression with AI's help, and truly understand it;\n✅ **Note \"this homework was completed with AI assistance\"** in the assignment / report.\n❌ Let AI write the full answer / essay / code and you only copy;\n❌ Conceal the use of AI;\n❌ Cite references AI fabricated.\n\n### 3. Citation basics\nWhen you use someone's words, data, or ideas, cite: who said it, where from, what year.\n- Book / article: Author, *Title*, publisher / journal, year.\n- Webpage: Site name, article title, URL, access date.\n- Data: Publishing body, data name, year.\n> Note: references AI gives are often **non-existent** — you must find the original yourself to cite.\n\n### 4. \"Citability\" of AI content\nAI-generated content usually **should not be cited directly as an authoritative source**. Correct approach:\n- Treat AI as \"inspiration / draft\"; ultimately support your argument with authoritative sources;\n- If you must mention AI assistance, write \"this was drafted with AI tool assistance; key facts were checked.\"\n\n---\n\n## III. Right vs. Wrong Use\n\n| Scenario | ❌ Dishonest | ✅ Honest approach |\n| --- | --- | --- |\n| Writing essay | AI writes the whole piece, submit as own | Write yourself, AI gives feedback, note assistance |\n| Using data | Copy AI's fake data | Use authoritative source, mark origin |\n| Citing | Cite AI's made-up book | Find the real source yourself then cite |\n| Doing homework | Let AI do it | Complete yourself, AI only tutors |\n| Submitting | Conceal AI use | Honestly note AI assistance |\n\n---\n\n## IV. Concrete Methods & Scripts\n\n### Method 1: Three-step self-check (must do before submitting)\n1. **Cited the source?** For others' words / data / ideas, did you mark the origin?\n2. **Do I really get it?** Can I explain this passage without AI? Can't = haven't learned yet.\n3. **Said I used AI?** If the assignment requires noting assistance, did I note it?\n\n### Method 2: Citation template scripts\n- Chinese assignment: \"This assignment was completed with AI learning-assistant help for idea organization and language polishing; key facts were checked, and the core content is original to me.\"\n- Citing a sentence: \"As XXX (year) pointed out, … (source).\"\n- Using data: \"According to XXX body (year), … (source link).\"\n\n### Method 3: Avoid \"spin-plagiarism\"\nDon't just swap synonyms. Correct approach:\n- Close the original, rewrite in your own words;\n- After writing, compare to ensure structure and expression are yours;\n- If you borrowed someone's framework, clearly acknowledge / mark it.\n\n### Method 4: Reference verification flow\n1. AI gives a \"reference\" → 2. search the title in an academic DB / library → 3. cite only after finding the original → 4. if not found, **delete, don't cite**.\n\n---\n\n## V. Real Learning-scenario Cases\n\n### Case: English essay\n- ❌ AI writes 120 words, submit directly. Teacher finds vocabulary far above usual level, classifies as ghostwriting.\n- ✅ Write a draft yourself; AI marks 3 errors and explains; you revise; note at end \"AI assisted language polish, content original to me.\"\n\n### Case: History short essay\n- ❌ Copy three encyclopedia paragraphs without citation, pass off as own analysis.\n- ✅ Read primary sources yourself, write the viewpoint; cite \"p. X of *XXX*\" where referenced; data from textbook / authoritative chronology.\n\n### Case: Science lab report\n- ❌ AI fabricates the conclusion \"experimental data matches expectations\" when no experiment was done.\n- ✅ Record real data yourself; AI only helps analyze \"why the trend is so\"; conclusion written by you.\n\n---\n\n## VI. Hands-on Task\n1. Take a previous assignment of yours and do an \"integrity scan\": any uncited content? Any AI-ghostwriting trace?\n2. Use the \"three-step self-check\" item by item; write down improvement actions.\n3. Add a permanent clause to your User Manual (08): \"must do the three-step integrity self-check before submitting.\"\n\n---\n\n## VII. Prompt Template (integrity version)\n```\nI'm writing [subject / assignment: ______].\nPlease help me check: among the content below, what might count as \"uncited source\" or \"looks like AI ghostwriting\"?\n[paste my text: ______]\nOnly give risk hints, don't rewrite for me; I will complete citations myself and ensure originality.\n```\n> Red line: AI can hint risks, can't whitewash for you; you are ultimately responsible for integrity.\n\n---\n\n## VIII. Human Review Checklist (self-check)\n- [ ] The content I submit, the core is completed by me.\n- [ ] For others' words / data / ideas, I marked the source.\n- [ ] I didn't cite any reference I hadn't verified myself.\n- [ ] If required, I noted AI assistance.\n- [ ] I can explain the content without AI (truly understand).\n\n---\n\n## IX. Common Mistakes\n1. **\"Only changed a few words\"**: think it's not copying, but it's still plagiarism.\n2. **Concealing AI use**: not noting it equals deception.\n3. **Citing fake references**: using AI's made-up books, fabrication.\n4. **Ghostwriting / exam-taking**: the most serious academic fraud, heaviest consequences.\n\n---\n\n## X. Homework\n1. Write an \"Academic Integrity Pledge\" (3–5 clauses, including: no ghostwriting, note use, check first).\n2. Complete one \"integrity scan\": pick a past assignment, find and fix 1 improvable point.\n3. Post the three-step integrity self-check in your study area as a fixed action before every submission.\n\n---\n\n## XI. Grading Rubric (10 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Originality confirmed | 3 | Core content truly yours |\n| Citation standard | 3 | Correct source marking, no fake references |\n| Integrity awareness | 2 | Specific pledge, can identify crossing-the-line behavior |\n| Self-check habit | 2 | Three-step self-check actionable, normalized |\n"};
const toc=document.getElementById('toc'), content=document.getElementById('content');
let cur=null;
function load(name){
  if(cur) cur.classList.remove('active');
  cur=[...toc.children].find(a=>a.dataset.f===name); if(cur)cur.classList.add('active');
  content.scrollTop=0; window.scrollTo(0,0);
  const md = DATA[name] || '';
  content.innerHTML='<h1>'+name.replace(/\.md$/,'')+'</h1>'+MD.render(md);
  location.hash=encodeURIComponent(name);
}
const names = Object.keys(DATA);
names.forEach(f=>{
  const a=document.createElement('a'); a.textContent=f.replace(/\.md$/,''); a.dataset.f=f;
  a.onclick=e=>{e.preventDefault();load(f)}; toc.appendChild(a);
});
const h=decodeURIComponent(location.hash.slice(1));
load(names.includes(h)?h:names[0]);
</script>
