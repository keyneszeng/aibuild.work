const MD = (function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(md){
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    let h='', i=0, inCode=false, code='';
    const flushCode=()=>{ if(inCode){ h+='<pre><code>'+esc(code)+'</code></pre>'; code=''; inCode=false; } };
    while(i<lines.length){
      let l=lines[i];
      if(l.trim().startsWith('```')){ if(inCode){flushCode();} else {flushCode(); inCode=true;} i++; continue; }
      if(inCode){ code+=l+'\n'; i++; continue; }
      let m;
      if(m=l.match(/^(#{1,6})\s+(.*)$/)){ const n=m[1].length; h+='<h'+n+'>'+inline(m[2])+'</h'+n+'>'; i++; continue; }
      if(l.match(/^(-{3,}|\*{3,})$/)){ h+='<hr>'; i++; continue; }
      if(l.match(/^>\s?/)){ let q=''; while(i<lines.length && lines[i].match(/^>\s?/)){ q+=lines[i].replace(/^>\s?/,'')+'<br>'; i++; } h+='<blockquote>'+inline(q)+'</blockquote>'; continue; }
      if(m=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/)){
        const ord = /\d+\./.test(m[2]); let items='';
        while(i<lines.length && lines[i].match(/^(\s*)([-*+]|\d+\.)\s+/)){
          const mm=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          items+='<li>'+inline(mm[3])+'</li>'; i++;
        }
        h+= (ord?'<ol>':'<ul>')+items+(ord?'</ol>':'</ul>'); continue;
      }
      if(l.trim()===''){ i++; continue; }
      h+='<p>'+inline(l)+'</p>'; i++;
    }
    flushCode();
    return h;
  }
  return {render:render};
})();

const DATA = {"00-总览.md": "# 中学生《AI 学习力训练营》· 课程总览\n\n> 面向初中生、高中生的一门「用 AI 辅助学习，而不是让 AI 代替学习」的实战训练营。\n> 目标不是教会你更多 Prompt，而是帮你建立一套**可迁移的学习方法**：会提问、会拆解、会核查、会表达、守住诚信底线。\n\n---\n\n## 一、课程定位\n\n这是一门「AI 素养 + 学习方法」双主线课程。AI 是工具，学习力是目的。我们不教你如何用 AI 抄作业、写作文、做项目，而是教你如何让 AI 成为你的「陪练教练」——它给你脚手架、反馈和追问，最终由你完成理解与产出。\n\n本课程改编自中学 AI 素养工作坊（Beyond AI Hype, Chinasa T. Okolo, RESPECT'24）、Prompt 工程指南（dair-ai / Learning Prompt）与 AI 入门课程（Microsoft AI-For-Beginners）的核心理念，结合中国中学生的真实学习场景（数学错题、英语作文、历史资料、物理概念等）重新设计。\n\n---\n\n## 二、目标用户\n\n- **初中生（7–9 年级）**：刚开始接触 AI 工具，需要建立正确的使用习惯与边界意识。\n- **高中生（10–12 年级）**：面临更复杂的学科任务与升学压力，需要用 AI 提升效率但不依赖、不抄袭。\n- **教师 / 家长 / 机构导师**：希望引导学生负责任地使用 AI，而非一刀切禁用。\n\n---\n\n## 三、学生真实痛点\n\n1. **一上来就「直接要答案」**：把 AI 当搜索引擎的升级版，抄完就忘，考试照样不会。\n2. **不会提问**：问题描述模糊（\"帮我写作文\"），拿到的东西用不上。\n3. **遇难就放弃**：遇到难题直接问 AI 要最终结果，跳过了最宝贵的「思考过程」。\n4. **分不清真假**：AI 会一本正经地胡说（幻觉），学生照抄进作业和考试。\n5. **学术诚信风险**：直接复制 AI 生成的段落，不知道这算抄袭。\n6. **不会复盘**：做了很多题，但没有错题本、复习计划，知识零散。\n\n本训练营的每一节，都围绕「**让 AI 辅助，但学习发生在你自己身上**」展开。\n\n---\n\n## 四、学习路径（00 → 10）\n\n| 编号 | 主题 | 核心产出 |\n| --- | --- | --- |\n| 00 | 课程总览 | 你正在读的这一页 |\n| 01 | AI 学习助手入门 → 我的 AI 学习规则 | 一份个人《AI 使用守则》 |\n| 02 | 如何问出好问题 → 学科提问模板 | 一份分学科提问模板卡 |\n| 03 | 难题拆解 → 错题分步卡 | 一张错题分步拆解卡 |\n| 04 | 英语和写作训练 → 写作修改记录 | 一篇带 AI 反馈的修改记录 |\n| 05 | 知识点复习 → 复习计划 | 一份周/月复习计划表 |\n| 06 | 信息真假判断 → 事实核查练习 | 一份事实核查清单与练习 |\n| 07 | 演讲和表达 → 演讲稿 + 反馈 | 一篇演讲稿 + 自评/互评表 |\n| 08 | 个人学习助手设计 → 使用手册 | 一份专属《AI 学习助手使用手册》 |\n| 09 | Prompt 模板库 | 可直接复用的提问模板合集 |\n| 10 | 学术诚信模块 | 核查 / 引用 / 避免抄袭的方法与话术 |\n\n---\n\n## 五、交付物（结营时你应拥有）\n\n- 个人《AI 使用守则》（01）\n- 学科提问模板卡（02）\n- 至少 3 张错题分步卡（03）\n- 1 篇英语/作文修改记录（04）\n- 1 份复习计划（05）\n- 1 份事实核查练习（06）\n- 1 篇演讲稿 + 反馈（07）\n- 个人《AI 学习助手使用手册》（08）\n- 可复用的 Prompt 模板库（09）\n- 学术诚信自查清单（10）\n\n---\n\n## 六、三场景使用说明\n\n### 场景 A：学校课堂（教师主导）\n- 每节课 45 分钟：10 分钟讲解 + 20 分钟动手任务 + 15 分钟展示互评。\n- 教师用 09 模板库统一话术，避免学生各写各的、质量参差。\n- 06 / 10 两节建议纳入「信息素养」或「班会/校本课」，与学校诚信教育衔接。\n- 设备：学校机房或学生自带设备，需联网的 AI 工具（如学校采购的教育版）。\n\n### 场景 B：培训机构 / 社团（导师主导）\n- 可压缩为 4–8 次工作坊，每次 90 分钟，两节合并讲。\n- 强调「作品集」：结营要求提交一份完整的学习力作品集（上述交付物打包）。\n- 用评分标准（每节末尾）做过程性评价，而非只看结果。\n\n### 场景 C：家庭自学（学生 + 家长）\n- 学生按 01→08 顺序自学，每节末尾「课后作业」独立完成，家长用「评分标准」做轻量检查。\n- 家长重点看 10（学术诚信）与 06（信息真假），帮助孩子守住红线。\n- 建议每周 1–2 节，8 周完成；09 模板库可作为随时查阅的速查表。\n\n---\n\n## 七、贯穿全课程的红线\n\n1. **不鼓励直接复制答案**：每一条 AI 回复，都要求学生「用自己的话解释一遍」。\n2. **每案例须要求学生解释理解**：不理解 = 没学会，AI 给了答案也要能讲清楚。\n3. **必含信息核查 + 学术诚信**：06、10 是硬要求，且其他各节也嵌入核查环节。\n\n---\n\n> 准备好开始了吗？从 **01-AI 学习助手入门** 出发，先给自己定下「使用规则」，这是你整个训练营的地基。\n", "01-AI学习助手入门.md": "# 01 · AI 学习助手入门 → 我的 AI 学习规则\n\n## 教学目标\n\n1. 理解「AI 学习助手」是什么、能做什么、不能做什么（认识大语言模型的边界）。\n2. 建立「AI 是陪练教练，不是代写机器」的基本心智模型。\n3. 亲手制定一份属于自己的《AI 使用守则》，作为后续所有学习活动的底线。\n4. 初步识别 AI 会「一本正经地胡说」（幻觉）的现象，养成质疑习惯。\n\n---\n\n## 开场问题\n\n> 如果有一天，你遇到一道不会的数学题，你会对 AI 说哪句话？\n> A. \"这道题答案是多少？\"\n> B. \"请引导我理解这道题的思路，不要直接给最终答案，我想自己算出来。\"\n>\n> 两种说法，AI 给你的东西会完全不同。这一节，我们就从「搞清楚 AI 到底是什么」开始。\n\n---\n\n## 核心概念\n\n### 1. 什么是 AI 学习助手\nAI 学习助手（如各类对话式大语言模型）是一个「读了很多书、会聊天、能生成文字」的软件。它不是人，没有真实经历，也不真正「理解」世界——它是在预测「下一个最合理的字」。\n\n### 2. 它能做什么（在学习上）\n- 解释概念（用你能听懂的话）\n- 给你提示、脚手架、思路，而不是直接答案\n- 批改你的作业并给反馈\n- 陪你练习（口语、背单词、讲题）\n- 帮你整理、归纳、提问\n\n### 3. 它不能做什么 / 会犯错的地方\n- **幻觉**：编造看起来很真的错误事实、假文献、假数据。\n- **不会真正思考**：它顺着你的问题走，不会主动指出你「问错了方向」。\n- **没有实时核实**：它不知道今天的新闻，也可能用旧知识。\n- **不懂你的考试范围**：它不知道你们老师这周教到哪。\n\n### 4. 关键心智模型\n> **AI 是陪练教练，不是代写机器。**\n> 教练给你方法、反馈、鼓励；上场踢球的始终是你自己。\n\n---\n\n## 学习场景案例\n\n### 案例：物理「浮力」概念没听懂\n- **错误用法**：问\"浮力是什么？给我一段定义背下来。\" → 你背了，但考试一变题型就不会。\n- **正确用法**：问\"我用喝汽水时吸管里的气泡举例，能帮我理解浮力为什么向上吗？请引导我，不要直接给定义。\" → AI 用你熟悉的生活例子，一步步带你建立直觉。\n\n### 案例：历史资料太多看不懂\n- **错误用法**：把一段材料丢给 AI 说\"总结成 200 字\"。 → 你没读，直接拿去交。\n- **正确用法**：\"这段材料在讲什么核心事件？请先只列出 3 个关键词，我再自己读原文核对。\" → 你仍然要读原文，AI 只是导航。\n\n---\n\n## 正确 vs 错误使用对比\n\n| 维度 | ❌ 错误使用 | ✅ 正确使用 |\n| --- | --- | --- |\n| 目的 | 要答案、要成品 | 要思路、要反馈、要理解 |\n| 提问 | \"帮我写作文\" | \"请给我 3 个开头思路，我再自己写\" |\n| 拿到结果后 | 直接复制提交 | 用自己的话复述、核查、标注来源 |\n| 遇到不懂 | 跳过，问下一个 | 追问\"为什么\"\"这步是怎么来的\" |\n| 态度 | AI 说的都对 | 凡事实类信息，先核查再相信 |\n\n---\n\n## 动手任务\n\n1. 打开你常用的 AI 工具，分别输入这两句话，观察回答的差异：\n   - \"解方程 2x+3=11，直接给答案。\"\n   - \"解方程 2x+3=11，请引导我理解每一步，不要直接给最终答案。\"\n2. 记录：第二种回答里，哪一步让你「啊，原来如此」？把它写下来。\n3. 找一段 AI 的回答，试着挑一个可能出错的地方（比如一个具体年份、一个人名），用教科书或搜索引擎核实它。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n你是一位耐心的中学生学习教练。\n请引导我理解【学科/主题：______】，不要直接给最终答案。\n我希望你：\n1. 先用我生活中的例子帮我建立直觉；\n2. 给我提示，让我自己一步步推导；\n3. 当我卡住时，再给多一点线索，而不是直接给结果；\n4. 最后用 1 句话考我，检验我是否真的懂了。\n```\n\n> 红线提醒：凡是模板，都默认带「请引导我理解，不要直接给最终答案」这一句。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我清楚 AI 会「幻觉」，不会全信它给的事实。\n- [ ] 我写下了一句自己的「AI 使用守则」（见下方作业）。\n- [ ] 我用「引导式提问」试过一次，并感受到了差别。\n- [ ] 我知道：提交给老师的任何内容，最终责任在我自己。\n\n---\n\n## 常见错误\n\n1. **把 AI 当百科全书**：以为它说的就是对的，不核查。\n2. **一上来就代写**：让 AI 写整篇，自己没参与，等于没学。\n3. **不说明用了 AI**：作业里直接贴 AI 内容，构成隐瞒。\n4. **过度依赖**：遇到一点困难就问 AI，放弃自己思考。\n\n---\n\n## 课后作业\n\n1. 写一份属于你自己的《AI 使用守则》（不少于 5 条，例如：「不复制 AI 原文交作业」「凡事实先核查」）。\n2. 用「引导式模板」向 AI 请教一个你最近没懂的知识点，把 AI 的引导和你的理解各写 3 句话。\n3. 和家长/老师分享你的守则，请他们提一条补充建议。\n\n---\n\n## 本节小结与进阶\n\nAI 学习助手是「陪练教练」，不是「代写机器」。记住三句话：**它会犯错，所以要核查；它给答案，所以要追问；它不负责，所以责任在我。** 这一节你制定的《AI 使用守则》，是整个训练营的地基——以后每一节的方法，都建立在这份守则之上。\n\n### 给家长/老师的一句话\n不要只告诉孩子「不许用 AI 抄作业」，更要和他们一起定下「怎么用才对」的规则。把孩子的守则贴在书桌前，比单纯禁止更有效。当孩子能说出「AI 这里可能错了」，他就真正建立了素养。\n\n### 进阶：三问自检法\n每次准备把 AI 的内容用进作业前，先问自己三句：\n1. 这句话我解释得出来吗？（解释不出 = 没懂）\n2. 这个事实我核查过吗？（没核查 = 不能用）\n3. 这到底是我写的，还是 AI 写的？（分不清 = 越线了）\n三问全过，才放心用。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 守则完整性 | 3 | 至少 5 条，具体可操作 |\n| 引导式提问实践 | 3 | 有真实对话记录 + 自己的理解 |\n| 红线意识 | 2 | 体现出「不复制、先核查」 |\n| 反思深度 | 2 | 能说出 AI 的局限与自己的责任 |\n", "02-如何问出好问题.md": "# 02 · 如何问出好问题 → 学科提问模板\n\n## 教学目标\n\n1. 理解「提问质量决定回答质量」——模糊的问题只会得到无用的回答。\n2. 掌握结构化提问的四要素：背景、目标、约束、角色。\n3. 建立分学科（数学 / 英语 / 历史 / 物理等）的提问模板卡。\n4. 学会在提问中嵌入「引导式」要求，避免 AI 直接给答案。\n\n---\n\n## 开场问题\n\n> 小明问 AI：\"帮我写一篇关于环保的作文。\"\n> 小红问 AI：\"我是初二学生，要写一篇 600 字议论文，观点是'垃圾分类从小事做起'，请先给我 3 个论点和对应的生活例子，不要写全文，我想自己写。\"\n>\n> 谁拿到的东西更有用？为什么？——**好问题，是学好的第一步。**\n\n---\n\n## 核心概念\n\n### 1. 为什么提问这么重要\n大语言模型是「顺着你的话走」的。你说得越清楚，它越能帮上忙；你说得含糊，它只能猜，结果往往用不上。\n\n### 2. 好问题的四要素（STAR 法）\n- **Situation 背景**：我是谁、在哪个年级、在学什么。\n- **Task 任务**：我想要什么（思路 / 反馈 / 解释 / 练习）。\n- **Action 约束**：长度、风格、不要直接给答案等。\n- **Role 角色**：让 AI 扮演「教练 / 老师 / 陪练」。\n\n### 3. 从「要答案」转向「要理解」\n在问题里加上：**\"请引导我理解，不要直接给最终答案，我想自己完成。\"**\n\n### 4. 迭代式提问\n第一轮先要框架，第二轮要提示，第三轮要反馈——好问题是一步步「问出来」的，不是一次到位。\n\n---\n\n## 学习场景案例\n\n### 数学错题\n- 模糊：\"这道函数题怎么做？\"\n- 好问题：\"我是高一学生，这道二次函数题我卡在'如何配方'这一步。请只提示配方的思路，引导我自己配出来，不要给完整解答。\"\n\n### 英语作文\n- 模糊：\"帮我改这篇作文。\"\n- 好问题：\"我是初三学生，下面是我写的 120 词英语短文，请指出 3 处最影响分数的语法/用词问题，并解释为什么错，让我自己改，不要重写。\"\n\n### 历史资料\n- 模糊：\"太平天国讲一下。\"\n- 好问题：\"我在预习太平天国，教材说它是'反封建反侵略'。请帮我列出 3 个能支撑这个评价的具体史实，并标出哪条争议最大、为什么有争议。\"\n\n### 物理概念\n- 模糊：\"牛顿第二定律是什么？\"\n- 好问题：\"我用'推购物车'的例子理解 F=ma 总卡在'质量越大越难加速'。请用这个例子引导我，不要直接背公式。\"\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误提问 | ✅ 正确提问 |\n| --- | --- | --- |\n| 信息量 | 没背景、没目标 | 有年级、有具体卡点 |\n| 期望 | 直接给成品 | 要思路/反馈/引导 |\n| 结果可用性 | 空泛，用不上 | 精准，能接着做 |\n| 学习发生 | 没发生 | 发生在你身上 |\n\n---\n\n## 动手任务\n\n1. 从你最近一门课的作业里，挑一个你没懂的点。\n2. 先写一个「模糊问题」，再改写成「STAR 好问题」。\n3. 把改写后的问题输入 AI，验证它给你的东西是否真的能用；若不行，继续迭代一轮。\n4. 把最终版问题抄进你的「学科提问模板卡」。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我是【年级______】学生，正在学【学科/知识点______】。\n我现在卡在：【具体卡点______】。\n请扮演我的【学科】教练，引导我理解，不要直接给最终答案。\n我希望你：\n1. 先确认我哪里没懂；\n2. 给 1–2 个提示让我自己往前走；\n3. 等我回答后，再判断要不要给更多线索；\n4. 最后用 1 个问题考我是否真懂。\n```\n\n> 红线：任何学科模板都带「引导我理解，不要直接给最终答案」。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我的问题里有「我是谁 / 在学什么 / 卡在哪」三要素。\n- [ ] 我明确要求 AI 不要直接给答案。\n- [ ] 我用过一次，并确认回答对我有用。\n- [ ] 我把好问题抄进了模板卡，方便下次复用。\n\n---\n\n## 常见错误\n\n1. **问题太短太泛**：\"帮我学数学\"——AI 无从下手。\n2. **一次要太多**：又要解释又要写作文又要出题，结果都浅。\n3. **忘了说「不要给答案」**：AI 顺手给了成品，你又抄了。\n4. **不迭代**：第一次不好用就放弃，其实改个问题就行。\n\n---\n\n## 课后作业\n\n1. 制作你的「学科提问模板卡」：数学、英语、历史/语文、物理/生物各写 1 条 STAR 好问题（共 4 条）。\n2. 选其中 1 条真实用 AI 试一次，记录 AI 的引导和你的收获。\n3. 反思：过去你最常犯哪种「坏问题」？以后怎么改？\n\n---\n\n## 本节小结与进阶\n\n好问题 = 清楚的背景 + 明确的目标 + 合理的约束 + 合适的角色。多数「AI 答非所问」，根子在「我问得不清楚」。把提问当成一种可练习的技能：先写草稿，再改精准，最后看 AI 给的东西能不能接住你的下一步。\n\n### 提问的五个「动词法」\n写问题时，多用这五个动词开头，问题立刻变具体：\n- **解释**：请解释……（要理解）\n- **提示**：请提示我……（要线索）\n- **比较**：请比较 A 和 B……（要辨析）\n- **举例**：请举一个生活中的例子……（要直觉）\n- **核查**：请帮我核查……（要验证）\n避免只用「写/做/给」这类一锤子买卖的动词。\n\n### 给家长/老师的一句话\n鼓励孩子把「好问题」存进文档，形成自己的提问库。班里可以每周评选「本周最佳提问」，让「会问」和「会答」一样被看见、被奖励。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 模板卡完整 | 3 | 4 学科各 1 条，要素齐全 |\n| STAR 运用 | 3 | 背景/任务/约束/角色清晰 |\n| 引导式要求 | 2 | 含「不要直接给答案」 |\n| 实践与反思 | 2 | 有真实试用 + 自我改进 |\n", "03-难题拆解.md": "# 03 · 难题拆解 → 错题分步卡\n\n## 教学目标\n\n1. 掌握「把大难题拆成小步骤」的拆解思维（类似 Chain-of-Thought 思路）。\n2. 用 AI 做「分步陪练」：它给一步提示，你做一步，而不是直接给全解。\n3. 建立「错题分步卡」工具，让每道错题都变成可复用的学习资产。\n4. 在拆解中坚持「引导式」：AI 不替你算，只帮你理清下一步该做什么。\n\n---\n\n## 开场问题\n\n> 一道几何压轴题，你盯着 10 分钟没思路。这时候你最该做的是什么？\n> A. 立刻问 AI：\"这道题答案多少？\"\n> B. 问 AI：\"这道题我能先确认哪些已知条件？第一步通常从哪里切入？引导我，不要直接解。\"\n>\n> 选 B 的人，虽然慢一点，但下次遇到同类题，他自己会拆了。\n\n---\n\n## 核心概念\n\n### 1. 拆解为什么有效\n大难题让人放弃，是因为它「太大、太模糊」。拆成 3–5 个小步骤后，每一步都变得可做。这也是 AI 推理常用的方法（逐步思考）。\n\n### 2. 拆解的通用框架\n- **已知条件**：题目给了什么？\n- **目标是什么**：要证明/求出什么？\n- **中间桥**：从已知到目标，通常要经过哪几步？\n- **卡点定位**：我具体卡在哪一步？\n- **下一步动作**：这一步我可以先试什么？\n\n### 3. AI 在拆解里的正确角色\nAI 不该「直接解完」，而该做：\n- 帮你列已知条件（你核对）\n- 提示「通常下一步可以这样想」（你决定采纳与否）\n- 你做一步，它看一步，再给下一步提示\n\n### 4. 错题分步卡的价值\n错题不是「错了就错了」，而是「我思维哪一步断了对」。分步卡把断点标出来，下次绕过。\n\n---\n\n## 学习场景案例\n\n### 数学：一道函数综合题\n- **错误用法**：\"这道函数题答案发我。\" → 抄完，下回还不会。\n- **正确用法**：\"这道题我要找抛物线与 x 轴交点。请提醒我：找交点通常该令 y 等于多少？引导我，我自己算。\" → AI 提示\"令 y=0\"，你算出交点，继续下一步。\n\n### 物理：一道力学受力分析\n- **错误用法**：直接要最终加速度。\n- **正确用法**：\"我对斜面物体的受力分析总漏掉摩擦力。请引导我用'先重力、再支持力、再摩擦力'的顺序一步步画，不要直接给结果。\"\n\n### 历史：一道材料分析题\n- **错误用法**：\"这段材料的主旨是什么？直接说。\"\n- **正确用法**：\"这段材料在讲洋务运动。请帮我拆成'背景—措施—结果'三步，每步先给我一个提示性问题，让我自己从原文找答案。\"\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| AI 给的 | 完整解答 | 单步提示 |\n| 你做的 | 复制粘贴 | 每步自己推导 |\n| 错题处理 | 划掉重做 | 标出断点、做分步卡 |\n| 收获 | 0 | 可迁移的拆解能力 |\n\n---\n\n## 动手任务\n\n1. 找一道你最近做错的题（任何学科）。\n2. 用上面的「拆解框架」把它拆成 3–5 步，写在一张「错题分步卡」上。\n3. 把卡片里的「卡点」单独挑出来，用引导式提问问 AI：\"我在第__步卡住了，请只给我一个提示，不要解。\"\n4. 自己补完这一步，并在卡片上记下「我为什么之前错了」。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我是【年级______】学生，正在做一道【学科】题。\n题目是：【粘贴题目______】。\n我已经想到：【已完成的步骤______】。\n我现在卡在：【具体卡点______】。\n请扮演教练，只给我【下一步】的提示，引导我理解，不要直接给最终答案或完整解答。\n等我做出来，我会把结果告诉你，你再判断我下一步该做什么。\n```\n\n> 红线：每次只问「下一步」，绝不一次要全解。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我把难题拆成了至少 3 个清晰步骤。\n- [ ] AI 只给了「下一步提示」，没有替我解完。\n- [ ] 我做完了每一步，并能说出每步在干什么。\n- [ ] 我标出了「卡点」和「之前错的原因」。\n\n---\n\n## 常见错误\n\n1. **一卡就全要**：问 AI 要整题解答，拆解练习白费。\n2. **不写卡片**：脑子里想一遍，没落笔，下次照样错。\n3. **只抄不悟**：AI 给提示，你抄提示当答案，没真懂。\n4. **错题不复盘**：做过分步卡就丢，没定期回看。\n\n---\n\n## 课后作业\n\n1. 完成至少 2 张「错题分步卡」（不同学科各 1 张），包含：已知条件、目标、分步、卡点、错因。\n2. 用引导式模板，对其中 1 张的卡点真实问 AI 一次，记录它的提示和你的补全。\n3. 一周后回看这两张卡片，写下「我现在还会不会再错这道题」。\n\n---\n\n## 本节小结与进阶\n\n拆解是把「做不到的大题」变成「做得到的小步」。核心心法是：**每次只问 AI 要「下一步」，绝不一次要全解。** 你做的每一步，都是自己在长本事；AI 只是扶你一把的教练。错题分步卡的价值，在于把「错在哪一步」标成路标，下次主动绕开。\n\n### 进阶：画一张「思维地图」\n当题目步骤超过 4 步，建议用纸笔画思维地图：左边写已知条件，中间画箭头连接每一步推导，右边写目标。卡住的那一步，往往就是箭头断掉的地方。把断点圈出来问 AI，比把整题丢过去高效得多。\n\n### 给家长/老师的一句话\n别急着看孩子「做对没有」，先看「拆解对不对」。一道题做错了但拆得有道理，比蒙对一道更有价值。在分步卡上给孩子写一句「这一步思路很棒」，比打分更能保护学习热情。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 拆解质量 | 3 | 步骤清晰、覆盖全题 |\n| 引导式实践 | 3 | AI 只给提示，自己补全 |\n| 错因分析 | 2 | 说清「为什么之前错」 |\n| 卡片可复用 | 2 | 格式规范、可回看复盘 |\n", "04-英语和写作训练.md": "# 04 · 英语和写作训练 → 写作修改记录\n\n## 教学目标\n\n1. 用 AI 做「写作教练」：改你的作文、指出问题、给可操作的建议，而不是替你重写。\n2. 建立「写作修改记录」习惯：一稿 → 反馈 → 二稿，看得见自己的进步。\n3. 提升英语表达与中文写作的逻辑、用词、结构意识。\n4. 守住红线：AI 改的是「怎么写得更好」，最终文字必须出自你自己。\n\n---\n\n## 开场问题\n\n> 你写了一篇英语短文，语法有点乱。你会怎么做？\n> A. 整篇丢给 AI：\"帮我重写一篇。\" → 变成 AI 写的，你没练到。\n> B. 丢给 AI：\"请只标出 3 处最影响分数的错误，解释为什么错，让我自己改。\" → 你练了、懂了、还会了。\n>\n> 写作能力，是「改」出来的，不是「生成」出来的。\n\n---\n\n## 核心概念\n\n### 1. AI 在写作里的好角色\n- **批改者**：指出语法、逻辑、结构问题。\n- **解释者**：说明「为什么这里不对」。\n- **陪练**：和你一起头脑风暴论点和例子。\n- **不是代笔**：不替你写完整文章。\n\n### 2. 修改记录的三栏结构\n| 原句/原段 | AI 指出的问题 | 我的修改 + 为什么 |\n这样你看得见「从哪改到哪、为什么改」。\n\n### 3. 英语写作常见发力点\n- 时态一致、主谓一致\n- 用词精准（别老用 very / good / big）\n- 连接词（however / therefore / for example）\n- 句子多样（长短句结合）\n\n### 4. 中文写作同理\n结构（总分总）、论据支撑、避免口语化、段落衔接。\n\n---\n\n## 学习场景案例\n\n### 英语作文：My Weekend（120 词）\n- **错误用法**：\"帮我写 My Weekend 120 词。\" → 直接交，老师一眼看出不是你写的。\n- **正确用法**：贴出自己写的稿，问\"请找出 3 处语法错误并解释，别重写，我要自己改。\" 你改完，再问\"这版的衔接能更好吗？给 1 个建议。\"\n\n### 中文议论文：关于\"坚持\"\n- **错误用法**：让 AI 生成整篇。\n- **正确用法**：你写一稿，问\"我的论点有没有被例子支撑？第二段逻辑跳了一步，请指出缺口让我自己补。\"\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| 输入 | 题目 | 你自己写的稿 |\n| AI 输出 | 完整新文章 | 问题标注 + 解释 |\n| 你做的 | 复制提交 | 自己修改、记录 |\n| 能力提升 | 无 | 看得见进步 |\n\n---\n\n## 动手任务\n\n1. 自己动手写一篇 100–150 词的英语短文（或 300 字中文小作文），主题自选。\n2. 把稿子贴给 AI，用「只标 3 处错误 + 解释」的方式要反馈。\n3. 根据反馈改出二稿，并填好「写作修改记录」三栏表。\n4. 把二稿再给 AI 看一次，确认是否还有明显问题（仍只问建议，不让人重写）。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我是【年级______】学生，刚写了一篇【英语/中文】作文，主题【______】。\n下面是我的原稿：【粘贴______】。\n请不要替我重写。请：\n1. 只标出【3】处最影响分数的问题（语法/逻辑/结构）；\n2. 每条解释\"为什么这是个问题\"；\n3. 给我一个可以自己动手改的方向，不要给现成句子。\n我要自己修改，并把修改过程记录下来。\n```\n\n> 红线：AI 不替你写；最终文字 100% 出自你手。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 原稿是我自己写的，没有 AI 代笔。\n- [ ] AI 只指出问题并解释，没有重写。\n- [ ] 我完成了二稿，并填了修改记录三栏。\n- [ ] 我能说出「我改对了哪类错误」。\n\n---\n\n## 常见错误\n\n1. **让人代写**：把 AI 成品当自己作业，学术不端。\n2. **只改不改懂**：照 AI 改完，但说不清为什么。\n3. **一次要太多反馈**：标 10 处，反而看不过来。\n4. **不记录**：改完就丢，进步看不见、也难复盘。\n\n---\n\n## 课后作业\n\n1. 完成 1 篇英语或中文作文的「写作修改记录」（含原稿、3 处反馈、二稿、修改说明）。\n2. 用引导式模板真实操作一次，把记录表交上来。\n3. 写一句话：这次修改让你在哪类错误上进步最大？\n\n---\n\n## 本节小结与进阶\n\n写作能力是「改」出来的。AI 最好的角色是批改者和解释者：它指出问题、说明原因，你动手改、并记录为什么改。三栏修改记录（原句 / 问题 / 我的修改）让进步看得见，也让老师、家长一眼看出这是你自己的成长，而非 AI 的成品。\n\n### 英语与中文写作的共通原则\n无论中英文，好文章都遵循三条：\n1. **一个清楚的主意**：一段只讲一件事。\n2. **用例子支撑**：说了观点，紧接着给证据或故事。\n3. **连接自然**：用「因为 / 但是 / 比如 / 所以」把句子串起来。\n把这三条当成检查清单，先自己审一遍，再交给 AI 查漏，效率最高。\n\n### 给家长/老师的一句话\n收作业时，重点看「修改记录」而不是只看终稿。记录里孩子自己写的那句「我改对了时态错误」，比满分作文更能说明真实进步。鼓励孩子保留一学期的修改记录，就是一份写作成长档案。\n\n### 快速自检卡（交作业前 30 秒）\n- 这篇是我自己写的吗？是 → 继续。\n- AI 只标了问题、没替我写吗？是 → 继续。\n- 我能说出改对了哪类错误吗？能 → 放心交。\n三问有一项「否」，就先补做再交。\n- 小提醒：写完后隔一天再读一遍，常能发现新问题，这叫「冷却效应」，是写作高手的秘密武器。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 原创性 | 3 | 原稿确为自己所写 |\n| 反馈运用 | 3 | 准确理解 AI 指出的问题 |\n| 修改质量 | 2 | 二稿明显优于一稿 |\n| 记录完整 | 2 | 三栏表清晰、可复盘 |\n", "05-知识点复习.md": "# 05 · 知识点复习 → 复习计划\n\n## 教学目标\n\n1. 用 AI 把「零散笔记」整理成「结构化知识网」，提升复习效率。\n2. 制定可执行的周/月复习计划，避免「考前突击、考完就忘」。\n3. 让 AI 出「小测题」帮你自测，而不是替你背书。\n4. 结合遗忘曲线意识，建立「间隔复习」习惯。\n\n---\n\n## 开场问题\n\n> 期末前一周，你面对 6 科笔记，压力山大。你通常会？\n> A. 从头翻到尾，看一遍，觉得\"差不多懂了\"。\n> B. 让 AI 帮我把每章整理成「3 个核心考点 + 1 张知识地图」，再让它出 5 道自测题考我。\n>\n> B 把「看」变成了「测」，记忆留存率高得多。\n\n---\n\n## 核心概念\n\n### 1. 复习的本质是「提取」，不是「重读」\n心理学研究（如测试效应）表明：主动回忆（自测）比反复阅读更能记住。AI 擅长帮你「出题考你」。\n\n### 2. 结构化：从笔记到知识网\n零散的划线笔记难以回忆。让 AI 帮你把一章内容归成：\n- 核心概念（是什么）\n- 关键关系（怎么连）\n- 易错点（常错在哪）\n- 典型题（怎么考）\n\n### 3. 间隔复习\n不要一天背完。把内容分散到多天，每次先自测旧内容，再学新内容。\n\n### 4. AI 的正确角色\n- 整理者：把你的笔记结构化（你提供素材）\n- 出题人：基于你学的范围出小测\n- 陪练：你答完它给反馈\n- 不是：替你背书、替你押题\n\n---\n\n## 学习场景案例\n\n### 生物：光合作用\n- **错误用法**：\"把光合作用总结一下我背。\" → 你没参与，背得慢忘得快。\n- **正确用法**：贴出你的课堂笔记，问\"请把这章整理成'核心概念+易错点+3 道自测题'，题目让我自己答，再给我反馈。\"\n\n### 历史：辛亥革命\n- **错误用法**：让 AI 写一份复习提纲直接背。\n- **正确用法**：\"我用时间轴整理辛亥革命，请帮我检查漏了哪 3 个关键节点，并出 2 道'原因—影响'的因果题考我。\"\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| 复习方式 | 重读笔记 | 自测 + 结构化 |\n| AI 角色 | 替你背 | 帮你整理、出题 |\n| 计划 | 无，考前突击 | 周/月间隔计划 |\n| 效果 | 短期、易忘 | 长期留存 |\n\n---\n\n## 动手任务\n\n1. 选一门你最近学的单元，贴出你的笔记/课本要点给 AI。\n2. 让它整理成「核心概念 + 易错点 + 知识地图（文字版）」。\n3. 再让它出 5 道自测题（覆盖不同角度），你闭卷作答。\n4. 把答错的题记进「复习计划」的「重点回看」栏。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我是【年级______】学生，正在复习【学科/单元：______】。\n下面是我的笔记要点：【粘贴______】。\n请不要替我背书。请：\n1. 整理成\"核心概念 + 关键关系 + 易错点\"三部分；\n2. 画一张文字版知识地图（用缩进/箭头表示关系）；\n3. 出【5】道自测题考我，覆盖不同角度；\n4. 我先自己答，答完再发给你，你再给反馈。\n```\n\n> 红线：AI 出题考你，不替你记忆；最终记住的必须是你自己。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我提供了自己的笔记作为素材，AI 只是整理。\n- [ ] 我做了自测题，且先答后看反馈。\n- [ ] 我制定了间隔复习计划（含回看时间）。\n- [ ] 答错的点被我记入「重点回看」。\n\n---\n\n## 常见错误\n\n1. **让 AI 替背**：直接拿提纲背，没经过自己提取。\n2. **只整理不测**：知识地图好看，但没真正记住。\n3. **无计划突击**：平时不复习，考前才慌。\n4. **不回看错点**：同样的坑下次还踩。\n\n---\n\n## 课后作业\n\n1. 制作一份「周复习计划表」：列出 3 门学科、每天 20 分钟自测内容、周末回看。\n2. 用模板对 1 个单元真实生成「知识地图 + 5 道自测题」，并自己作答、记录错题。\n3. 一周后，用同一份自测题再测一次，比较正确率变化。\n\n---\n\n## 本节小结与进阶\n\n复习的本质是「主动提取」，不是「反复阅读」。让 AI 帮你把笔记结构化、再出题考你，比干看书记得牢得多。把复习分散到每天 20 分钟，比考前一晚通宵有效——这就是「间隔复习」的威力。\n\n### 小知识：遗忘曲线\n心理学家艾宾浩斯发现，学完 1 天后不复习会忘掉约三分之二；但在第 1 天、第 3 天、第 7 天、第 30 天各回看一次，记忆就能长期留住。你的复习计划，就照这个节奏排：当天、隔天、周末、月末。\n\n### 给家长/老师的一句话\n帮孩子把「复习」从「看笔记」改成「做自测」。可以每周抽 5 分钟，用孩子自己出的自测题考考他——答得出来才是真会。把自测正确率当进度表，比分数更反映真实掌握。\n\n### 快速自检卡（翻开手册 30 秒）\n- 这单元我做了「主动提取」自测吗？做了 → 继续。\n- 知识地图我画了吗？画了 → 继续。\n- 答错的点回看了吗？回了 → 放心。\n只「看」不「测」，等于没复习——这是最容易被忽视的坑。\n- 小提醒：复习计划别排太满，留出约两成空白应对临时任务，否则一中断就容易整个放弃。计划能坚持，才算好计划。周末回看时，优先复习「答错率最高」的单元，把力气花在刀刃上，效率最高。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 结构化质量 | 3 | 概念/关系/易错点清晰 |\n| 自测实践 | 3 | 先答后反馈，真实参与 |\n| 计划可行性 | 2 | 周计划具体、可坚持 |\n| 复盘意识 | 2 | 错点回看、二次自测对比 |\n", "06-信息真假判断.md": "# 06 · 信息真假判断 → 事实核查练习\n\n## 教学目标\n\n1. 认识 AI「幻觉」：它会自信地编造错误事实、假文献、假数据。\n2. 掌握「事实 vs 观点」「来源可信度」的基本判断框架。\n3. 建立一套可操作的事实核查清单，对 AI 给的每一条事实类信息先核再用。\n4. 在全部学习活动中贯彻「凡事实先核查」的红线。\n\n---\n\n## 开场问题\n\n> AI 告诉你：\"爱因斯坦小学时数学不及格，后来才变厉害的。\" 这句话你信吗？\n> 事实上，这是广为流传的**都市传说**，爱因斯坦数学一直很好。\n> AI 不会主动告诉你这是假的——**它只知道\"这话常被这么说\"，于是就说了。**\n> 这一节，我们专门练「怎么不被 AI 骗」。\n\n---\n\n## 核心概念\n\n### 1. 什么是「幻觉」（Hallucination）\n大语言模型通过预测「下一个合理的字」生成内容，而不是从数据库里「查真相」。当它不知道时，会「编一个听起来合理的」——这就是幻觉。它**不会觉得自己错了**。\n\n### 2. 三类最容易出错的信息\n- **具体事实**：年份、人名、数据、地点（AI 常张冠李戴）。\n- **引用/文献**：它常编造「看起来很真」的书名、作者、论文。\n- **最新信息**：它训练数据有截止时间，不知道之后的事。\n\n### 3. 事实 vs 观点\n- **事实**：可被验证对错（\"水的沸点是 100℃\"）。\n- **观点**：主观判断（\"这部电影很好看\"）。\n- 对 AI 给的「事实」，要核查；「观点」也要看它有没有依据。\n\n### 4. 来源可信度阶梯\n一手资料（教科书/官方文件）> 权威媒体/学术库 > 普通网页 > 社媒/论坛 > 来路不明的截图。\n\n---\n\n## 学习场景案例\n\n### 案例：历史年代\n- AI 说\"辛亥革命发生于 1912 年\"。\n- 核查：教科书写为 1911 年（武昌起义）。AI 把\"民国成立 1912\"和\"辛亥革命 1911\"混淆了。\n- 做法：用教科书/权威百科核实，标注正确年份。\n\n### 案例：科学数据\n- AI 说\"光速是 3 万千米每秒\"。\n- 核查：实际约 30 万千米每秒。这是 10 倍误差。\n- 做法：凡数据，先查权威来源再引用。\n\n### 案例：文献引用\n- AI 给你一段\"某论文证明……\"，附了作者和期刊名。\n- 核查：去学术库搜不到这篇——典型编造引用。\n- 做法：绝不引用 AI 给的文献，除非你自己核实过原文。\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| 拿到事实 | 直接相信、写进作业 | 标记\"待核查\" |\n| 核查动作 | 无 | 用权威来源交叉验证 |\n| 引用文献 | 照抄 AI 给的 | 自己找到原文才引 |\n| 态度 | AI 说的都对 | 凡事实先疑后信 |\n\n---\n\n## 动手任务\n\n1. 让 AI 回答 3 个事实类问题（如\"某事件年份\"\"某科学家贡献\"\"某数据\"）。\n2. 对每条回答，用教科书/权威网站核查，记录「AI 说 / 实际是 / 是否错误」。\n3. 找出至少 1 处 AI 的错误，写下你是怎么发现并核实的。\n4. 填好你的「事实核查清单」（见下）。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我在做【学科/作业______】，需要核实一个事实：【事实陈述______】。\n请：\n1. 先说明这个信息属于\"事实\"还是\"观点\"；\n2. 如果不确定或可能过时，请明确告诉我\"我无法保证准确\"；\n3. 给我 1–2 个可以自己核查的权威来源方向（如某教科书章节、某官方站点）；\n4. 不要编造参考文献。\n```\n\n> 红线：凡事实类信息，先核查再使用；绝不引用未核实的 AI 文献。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我对 AI 给的事实类信息做了「待核查」标记。\n- [ ] 我用了至少 1 个权威来源交叉验证。\n- [ ] 我没引用任何自己没核实过的文献。\n- [ ] 我能举出 1 个 AI 幻觉的例子。\n\n---\n\n## 常见错误\n\n1. **照单全收**：把 AI 的事实直接写进作业/考试。\n2. **引用假文献**：用了 AI 编的书名/论文，学术不端。\n3. **不交叉验证**：只看 AI 一家之言。\n4. **混淆事实观点**：把 AI 的主观判断当客观真理。\n\n---\n\n## 课后作业\n\n1. 完成一份「事实核查练习」：3 条 AI 事实 + 你的核查结果 + 来源 + 是否错误。\n2. 写 1 句话总结：你今天发现 AI 最容易在哪种信息上出错？\n3. 把「事实核查清单」贴在你的学习区，作为永久习惯。\n\n---\n\n## 本节小结与进阶\n\nAI 会「一本正经地胡说」，这是它最危险的陷阱。面对任何事实类信息，先打一个问号，再用权威来源交叉验证，是 AI 时代最基本的信息素养。记住：**可信的不是「AI 说的」，而是「被可靠来源证实的」。** 凡事实先核查，这条要写进你的使用手册红线。\n\n### 四类高仿谣言清单（看到要警惕）\n1. **张冠李戴型**：把 A 的成就安到 B 头上（如把别人发现归功于名人）。\n2. **精确造假型**：给出一个很具体的假数字、假年份，显得权威。\n3. **虚构文献型**：编造书名、作者、期刊，查无此文。\n4. **过时信息型**：用旧数据回答今天的问题，不说明时效。\n遇到这四类，第一反应都应是：去权威来源核实。\n\n### 给家长/老师的一句话\n可以和孩子玩「找茬游戏」：故意给一段混了错误的 AI 回答，看孩子能不能揪出来并核实。把「识破假信息」变成一项值得骄傲的能力，比反复说「别信网上」更有效。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 核查执行 | 3 | 3 条均有效核查 |\n| 来源可信 | 3 | 用了权威/交叉来源 |\n| 错例识别 | 2 | 能发现并说明 AI 错误 |\n| 习惯内化程度 | 2 | 清单化、可长期复用 |\n", "07-演讲和表达.md": "# 07 · 演讲和表达 → 演讲稿 + 反馈\n\n## 教学目标\n\n1. 用 AI 做「演讲教练」：帮你梳理论点、设计结构、润色表达，而不是替你写稿。\n2. 完成一篇自己写的演讲稿，并建立「自评 + 互评」反馈机制。\n3. 提升逻辑组织与口语表达意识（开场—主体—结尾）。\n4. 守住红线：稿件核心内容来自你，AI 只做结构与表达建议。\n\n---\n\n## 开场问题\n\n> 班级要做一个 3 分钟演讲「我眼中的 AI」。你会？\n> A. 让 AI 写一整篇，你背下来。 → 不是你的声音，老师一听便知，你也讲不活。\n> B. 先自己列 3 个想讲的点，再让 AI 帮我看\"结构清不清晰、哪段需要例子\"，我自己写稿。\n>\n> 好的演讲，先有「你的想法」，才有「好的表达」。\n\n---\n\n## 核心概念\n\n### 1. 演讲的三段结构\n- **开场**：抓注意力（一个故事/一个问题/一句反差）。\n- **主体**：2–3 个论点，每个配 1 个例子或数据。\n- **结尾**：呼应开场，给一个让人记住的点。\n\n### 2. AI 的正确角色\n- **结构顾问**：看你的提纲逻辑顺不顺。\n- **例子教练**：建议你「这里加个生活例子会更生动」。\n- **表达润色**：指出哪里太书面、哪里口头禅多。\n- **不是代笔**：不替你决定「你想说什么」。\n\n### 3. 反馈的两种来源\n- **自评**：自己录音/读一遍，找卡顿和薄弱环节。\n- **互评**：同学按标准给反馈（内容/结构/表达）。\n\n### 4. 口语化 vs 书面化\n演讲用短句、自然连接词；避免长难句和堆砌术语。\n\n---\n\n## 学习场景案例\n\n### 案例：主题「为何要学历史」\n- **错误用法**：\"帮我写一篇关于学历史意义的演讲稿。\" → 全 AI，无你。\n- **正确用法**：你先列\"1. 懂来路 2. 学方法 3. 不被误导\"三点，问 AI：\"我的结构顺吗？第二段能不能给我一个可自己补充的历史小故事方向？\" 你写稿，再问\"我的开头够抓人吗？\"\n\n### 案例：英语演讲 My Hero\n- **错误用法**：AI 写整篇英语稿，你念但不懂。\n- **正确用法**：你写中文要点，AI 帮你把关键句翻成自然英语并解释 why，你最终用自己的话讲。\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| 稿件来源 | AI 全写 | 你写，AI 给结构建议 |\n| AI 给的 | 完整新稿 | 结构/例子/表达反馈 |\n| 你做的 | 背诵 AI 稿 | 自己表达、自己改 |\n| 提升点 | 无 | 逻辑 + 表达双提升 |\n\n---\n\n## 动手任务\n\n1. 自选一个 3 分钟演讲主题，先自己列「开场—3 论点—结尾」提纲。\n2. 把提纲给 AI，请它只反馈「结构是否清晰、哪段缺例子」，不写稿。\n3. 自己写完演讲稿（300–400 字 / 英语 150–200 词）。\n4. 录音读一遍，用「自评表」找 2 个可改进处；再请一位同学用「互评表」反馈。\n\n---\n\n## Prompt 模板（中学生版）\n\n```\n我是【年级______】学生，要做一个【3】分钟演讲，主题【______】。\n下面是我自己列的提纲：【粘贴______】。\n请不要替我写稿。请：\n1. 评价我的结构是否清晰（开场/主体/结尾）；\n2. 指出哪一段最需要一个例子，并给我一个\"可以自己补充\"的例子方向；\n3. 看我的表达是否太书面，给出 1 个口语化建议。\n稿子我会自己写。\n```\n\n> 红线：你的观点、你的稿；AI 只做教练，不发声。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 提纲与核心观点出自我自己。\n- [ ] AI 只给了结构/例子/表达建议，没写稿。\n- [ ] 我完成了自己写的演讲稿，并录音自评。\n- [ ] 我有同学互评反馈，并记录改进点。\n\n---\n\n## 常见错误\n\n1. **代写演讲**：整篇 AI 稿，失去个人声音。\n2. **只要不改**：收了建议不落地，稿子没变好。\n3. **不练习**：写完不读不录，上台卡壳。\n4. **忽视互评**：只自评容易盲区，互评能补。\n\n---\n\n## 课后作业\n\n1. 提交：演讲提纲 + 自己写的演讲稿 + 自评表（≥2 条改进）+ 同学互评表。\n2. 用引导式模板真实操作一次，记录 AI 的结构建议和你的修改。\n3. 写一句话：这次你最大的表达进步是什么？\n\n---\n\n## 本节小结与进阶\n\n好演讲先有「你的想法」，才有「好的表达」。AI 适合做结构顾问和表达教练，但稿子的灵魂必须来自你。用「自评 + 互评」双反馈，比自己闷头练进步更快——别人一眼就能看出你卡顿、空洞、跑题的地方。\n\n### 上台不紧张的五个小技巧\n1. **开场三秒深呼吸**：稳住第一句，后面就顺了。\n2. **盯「友善的脸」**：找一位点头鼓励的同学，对着他讲。\n3. **用「提示词」不是背全文**：只记关键词，自然发挥。\n4. **允许停顿**：停顿不是冷场，是给听众消化。\n5. **把 AI 当彩排观众**：先讲给 AI 听，让它指出哪里听不懂，提前修。\n\n### 给家长/老师的一句话\n给孩子真实的听众和真实的反馈，比完美稿子更重要。家庭里可以每周一次「3 分钟分享」，主题不限；学校里用互评表做同伴反馈。表达力是练出来的，不是讲出来的。\n\n### 快速自检卡（上台前 30 秒）\n- 提纲和核心观点是我自己的吗？是 → 继续。\n- 结构开场—主体—结尾齐全吗？齐 → 继续。\n- 我练过至少一遍并改了吗？改了 → 放心讲。\n带着「分享」而不是「表演」的心态，紧张会少一大半。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 原创性 | 3 | 观点与稿件确为自己 |\n| 结构清晰 | 2 | 开场/主体/结尾完整 |\n| 反馈运用 | 3 | 自评+互评并实际修改 |\n| 表达提升 | 2 | 口语化、有例子支撑 |\n", "08-个人学习助手设计.md": "# 08 · 个人学习助手设计 → 使用手册\n\n## 教学目标\n\n1. 把前 7 节的方法「组装」成一套属于你自己的 AI 学习助手使用方式。\n2. 设计「角色设定 + 常用模板 + 红线」三位一体的个人使用手册。\n3. 形成可长期复用、可迭代的个性化学习系统。\n4. 把「学术诚信 + 事实核查」作为手册的永久条款。\n\n---\n\n## 开场问题\n\n> 前面 7 节，你攒了不少好方法：引导式提问、错题卡、修改记录、核查清单……\n> 但方法散着，考试一忙就忘。这一节，我们把它们**装订成一本书**——你的《AI 学习助手使用手册》。\n> 以后遇到任何学习任务，翻手册就行。\n\n---\n\n## 核心概念\n\n### 1. 什么是「个人学习助手」\n不是某个软件，而是**你给 AI 设定的一套稳定工作方式**：它知道你是谁、该用什么语气、该守什么红线。\n\n### 2. 手册的三大部分\n- **角色设定（System Prompt）**：告诉 AI「你是我的学习教练，引导我，不直接给答案」。\n- **常用模板**：把 02/03/04/05/06/07 的模板收进来，按场景分类。\n- **红线条款**：不复制答案、凡事实先核查、注明 AI 协助、核心内容自己写。\n\n### 3. 角色设定示例\n\"你是我的中学生学习教练。面对任何问题，先引导我理解，不直接给最终答案；凡事实类信息提醒我核查；我提交的内容，最终责任在我。\"\n\n### 4. 手册要「活」\n每月回看一次，删掉不好用的，加上新发现的好模板。它是你的学习资产，会越长越值钱。\n\n---\n\n## 学习场景案例\n\n### 案例：考前一周\n翻开手册「复习计划」模板，5 分钟生成周计划；用「自测出题」模板做隔天自测；用「核查清单」核对手册里 AI 给的考点数据。一套流程自动跑起来。\n\n### 案例：写作文卡壳\n翻开「写作修改记录」模板，先自己写一稿，再走「标 3 处错误 + 解释」流程，最后填三栏表。不再是乱问一气。\n\n---\n\n## 正确 vs 错误使用对比\n\n| | ❌ 错误 | ✅ 正确 |\n| --- | --- | --- |\n| 方法状态 | 散落、靠记忆 | 装订成手册 |\n| 提问 | 每次现想 | 套用固定模板 |\n| 红线 | 常忘 | 写进手册常看 |\n| 成长性 | 不会积累 | 每月迭代升级 |\n\n---\n\n## 动手任务\n\n1. 写一段「角色设定」，明确你是谁、希望 AI 怎么帮你（含引导式 + 核查提醒）。\n2. 把前几节的模板整理进手册，按「提问 / 拆解 / 写作 / 复习 / 核查 / 演讲」分类。\n3. 写「红线条款」3–5 条（必须含：不复制答案、凡事实先核查、注明 AI 协助）。\n4. 给手册加一个「月度复盘」页，记录哪些模板好用、哪些要改。\n\n---\n\n## Prompt 模板（中学生版 · 角色设定）\n\n```\n你是我的【年级______】学习教练。\n请始终：\n1. 引导我理解，不直接给最终答案；\n2. 凡事实类信息，提醒我先核查再使用；\n3. 凡我可能直接复制的地方，提醒我\"这是你的作业，要自己完成\"；\n4. 用我能听懂的语言，必要时用生活例子。\n我提交的内容，最终责任在我自己。\n```\n\n> 红线：手册第一条永远是「不复制答案、凡事实先核查、注明 AI 协助」。\n\n---\n\n## 人工检查清单（学生自查）\n\n- [ ] 我有清晰的角色设定，且含引导式与核查提醒。\n- [ ] 手册收集了 ≥4 个前几节模板，分类清晰。\n- [ ] 红线条款明确，含核查与诚信要求。\n- [ ] 手册有「月度复盘」机制，可迭代。\n\n---\n\n## 常见错误\n\n1. **手册太虚**：只有口号，没有可套用的模板。\n2. **漏红线**：忘了把诚信/核查写进去，容易滑向代写。\n3. **写完不更新**：手册成摆设，方法依旧散。\n4. **角色设定过宽**：让 AI「啥都帮」，反而失去边界。\n\n---\n\n## 课后作业\n\n1. 完成你的《AI 学习助手使用手册》（含角色设定 + 模板集 + 红线 + 月度复盘页）。\n2. 用手册里的角色设定，真实开一次新对话，验证它是否如你预期地「引导而非代写」。\n3. 一个月后，在「月度复盘页」写下：哪条模板最好用？哪条要改？\n\n---\n\n## 本节小结与进阶\n\n你的《AI 学习助手使用手册》是整个训练营的「总装成果」：角色设定告诉你 AI 该怎么帮你，模板集让你随时套用，红线条款守住底线，月度复盘让它越用越好。它不是一个文档，而是你个人的「学习方法操作系统」。\n\n### 进阶：把手册「数字化」\n除了写在文档里，你还可以：\n- 把角色设定存成 AI 工具的「固定前缀 / 系统提示」，每次对话自动带上；\n- 把常用模板做成手机备忘录的快捷短语，随时粘贴；\n- 用一张表格记录「哪类任务用哪个模板」，形成检索索引。\n让手册真正融入日常，而不是写完就忘。\n\n### 给家长/老师的一句话\n请孩子每季度给你「演示」一次手册：打开对话，贴入角色设定，现场解决一个真实学习问题。你能从他的操作里，直接看出方法是否内化。手册活起来，训练营才真正结营。\n\n### 快速自检卡（每次用 AI 前 10 秒）\n- 我的角色设定带上了吗？带 → 继续。\n- 这次是「引导」不是「代写」吗？是 → 继续。\n- 红线条款我守住了吗？守 → 放心用。\n手册不是写完的，是「用出来」的——多用一次，它就强一分。\n\n## 评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 角色设定 | 3 | 含引导式+核查+责任声明 |\n| 模板完整 | 3 | ≥4 类模板，可套用 |\n| 红线明确 | 2 | 含诚信与核查硬要求 |\n| 可迭代性 | 2 | 有复盘机制，能长期用 |\n", "09-Prompt模板库.md": "# 09 · Prompt 模板库（中学生速查版）\n\n> 本页汇总全课程可直接复用的提问模板。所有模板默认携带**红线句**：\n> **「请引导我理解，不要直接给最终答案；凡事实类信息提醒我核查；核心内容由我自己完成。」**\n> 复制时连同红线句一起用，养成习惯。\n\n---\n\n## 0. 通用角色设定（每次对话开头贴一次）\n\n```\n你是我的【年级______】学习教练。\n请始终：\n1. 引导我理解，不直接给最终答案；\n2. 凡事实类信息，提醒我先核查再使用；\n3. 凡我可能直接复制的地方，提醒我\"这是你的作业，要自己完成\"；\n4. 用我能听懂的语言，必要时用生活例子。\n我提交的内容，最终责任在我自己。\n```\n\n---\n\n## 1. 概念理解（01 / 跨学科）\n\n```\n我是【年级______】学生，想理解【概念：______】。\n请用我生活中的例子帮我建立直觉，再给 1–2 个提示让我自己推导，\n最后用 1 句话考我是否真懂。不要直接给定义。\n```\n\n---\n\n## 2. 学科提问（02 · STAR 法）\n\n```\n我是【年级______】学生，正在学【学科/知识点______】。\n我现在卡在：【具体卡点______】。\n请扮演我的【学科】教练，引导我理解，不要直接给最终答案。\n1. 先确认我哪里没懂；2. 给 1–2 个提示；3. 等我回答再判断下一步；4. 最后考我。\n```\n\n---\n\n## 3. 难题拆解（03 · 错题分步卡）\n\n```\n我在做一道【学科】题：【粘贴题目______】。\n我已做到：【已完成步骤______】。卡在：【卡点______】。\n请只给【下一步】提示，引导我理解，不要给完整解答。\n我做完会告诉你，你再判断我下一步该做什么。\n```\n\n---\n\n## 4. 写作修改（04 · 三栏记录）\n\n```\n我写了一篇【英语/中文】作文，主题【______】。原稿：【粘贴______】。\n请不要替我重写。请：\n1. 只标出 3 处最影响分数的问题；\n2. 每条解释\"为什么是问题\"；\n3. 给我一个自己改的方向，不给现成句子。\n我要自己修改并记录。\n```\n\n---\n\n## 5. 复习计划（05 · 自测出题）\n\n```\n我在复习【学科/单元：______】。笔记要点：【粘贴______】。\n请不要替我背书。请：\n1. 整理成\"核心概念+关键关系+易错点\"；\n2. 画文字版知识地图；\n3. 出 5 道自测题考我；我先答，再发你给反馈。\n```\n\n---\n\n## 6. 事实核查（06 · 防幻觉）\n\n```\n我要核实一个事实：【事实陈述______】。\n请：1. 说明这是\"事实\"还是\"观点\"；\n2. 若不确定或可能过时，明确说\"我无法保证准确\"；\n3. 给我 1–2 个可自己核查的权威来源方向；\n4. 不要编造参考文献。\n```\n\n---\n\n## 7. 演讲表达（07 · 结构教练）\n\n```\n我要做【3】分钟演讲，主题【______】。提纲：【粘贴______】。\n请不要替我写稿。请：\n1. 评价结构是否清晰；\n2. 指出哪段最需例子，给一个\"可自己补充\"的例子方向；\n3. 看表达是否太书面，给 1 个口语化建议。\n稿子我自己写。\n```\n\n---\n\n## 8. 个人助手（08 · 组装）\n\n```\n基于我的《AI 学习助手使用手册》，本次任务：【任务______】。\n请按手册的红线与模板风格协助我：引导而非代写，事实先核查，核心我自己完成。\n```\n\n---\n\n## 9. 英语口语陪练（补充）\n\n```\n请用英语和我闲聊，话题【______】。\n当我语法/用词错了，先让我试着自己改，再温和指出并解释；\n不要长篇纠正，每次 1–2 点即可。用我能跟上的语速和词汇。\n```\n\n---\n\n## 10. 错题讲解（补充）\n\n```\n这是我的一道错题：【粘贴______】。\n请帮我分析：1. 这道题考的是什么能力；2. 我最可能哪一步想错；\n3. 给一个同类变式题让我当场练。不要直接给原题答案。\n```\n\n---\n\n> 使用纪律：模板是「脚手架」不是「答案机」。每次用前自问——「这一步我是不是在让 AI 替我思考？」如果是，收回，自己来。\n", "10-学术诚信模块.md": "# 10 · 学术诚信模块（信息核查 / 引用来源 / 避免抄袭）\n\n> 本模块是训练营的**硬红线**，与第 06 节（信息真假判断）配套，但更聚焦「学术诚信」：\n> 什么算抄袭、怎么正确引用、怎么在 AI 时代守住诚实底线。\n> 无论学校、机构还是家庭自学，本模块内容都必须落实。\n\n---\n\n## 一、为什么要有这一节\n\nAI 让「写出一段像样的文字」变得极容易，也让学生更容易在无意中越线：\n- 把 AI 生成的内容当自己写的交上去（隐瞒 + 抄袭）；\n- 直接复制网页/百科不注明（剽窃）；\n- 引用 AI 编造的文献（造假）；\n- 用 AI 代考、代做作业（学术欺诈）。\n\n**学术诚信不是「不被发现」的技巧，而是「对自己学习负责」的底线。**\n用 AI 辅助学习完全 OK；用 AI 代替学习、隐瞒使用、抄袭他人，不行。\n\n---\n\n## 二、核心概念\n\n### 1. 什么是「抄袭」（Plagiarism）\n把你没有原创的内容（文字、观点、数据、图像）当作自己的提交，且不注明来源，就是抄袭。包括：\n- 整段复制 AI / 网页 / 同学作业；\n- 只改几个词就当自己写的（\"洗稿\"也算）；\n- 翻译别人文章不注明。\n\n### 2. 什么是「合理使用 AI」\n✅ 用 AI 解释概念、给思路、批改反馈、出练习题；\n✅ 在 AI 帮助下形成自己的表达，且自己真正理解；\n✅ 在作业/报告中**注明「本作业在 AI 辅助下完成」**。\n❌ 让 AI 写完整答案/作文/代码，自己只复制；\n❌ 隐瞒使用了 AI；\n❌ 引用 AI 编造的文献。\n\n### 3. 引用来源（Citation） basics\n当你用了别人的话、数据、观点，要注明：谁说的、出自哪里、哪一年。\n- 书/文章：作者，《标题》，出版社/期刊，年份。\n- 网页：网站名，文章标题，网址，访问日期。\n- 数据：发布机构，数据名称，年份。\n> 注意：AI 给的文献常常**不存在**，必须自己找到原文才能引。\n\n### 4. AI 内容的「可引用性」\nAI 生成的内容通常**不应作为权威来源直接引用**。正确做法：\n- 把 AI 当「灵感/草稿」，最终用权威来源支撑你的论点；\n- 若必须提及 AI 协助，写「本文在 AI 工具辅助下起草，关键事实已核查」。\n\n---\n\n## 三、正确 vs 错误使用对比\n\n| 场景 | ❌ 不诚信 | ✅ 诚信做法 |\n| --- | --- | --- |\n| 写作文 | AI 写全篇，当自己交 | 自己写，AI 给反馈，注明协助 |\n| 用数据 | 抄 AI 给的假数据 | 用权威来源，标出处 |\n| 引文献 | 引 AI 编的书 | 自己找到真文献再引 |\n| 做作业 | 让 AI 代做 | 自己完成，AI 仅辅导 |\n| 交作业 | 隐瞒用了 AI | 如实注明 AI 辅助 |\n\n---\n\n## 四、具体方法与话术\n\n### 方法 1：三步自查（提交前必做）\n1. **来源标了吗？** 凡是别人的话/数据/观点，都标了出处吗？\n2. **我真的懂吗？** 这段我能不看 AI 自己讲一遍吗？不能 = 还没学会。\n3. **用了 AI 说了吗？** 作业要求注明协助的，我注了吗？\n\n### 方法 2：引用模板话术\n- 中文作业：「本文在 AI 学习助手辅助下完成思路梳理与语言润色，关键事实已核查，核心内容为本人原创。」\n- 引用一句：「正如 XXX（年份）指出，……（出处）。」\n- 用数据：「据 XXX 机构（年份）统计，……（来源链接）。」\n\n### 方法 3：避免「洗稿」式抄袭\n不要只替换同义词。正确做法：\n- 关掉原文，用自己的话重写；\n- 写完后对比，确保结构和表达都是你的；\n- 若借用了别人的框架，明确致谢/标注。\n\n### 方法 4：文献核实流程\n1. AI 给了一篇「参考文献」→ 2. 去学术库/图书馆搜标题 → 3. 找到原文才引用 → 4. 搜不到就**删除，不引用**。\n\n---\n\n## 五、学习场景案例\n\n### 案例：英语作文\n- ❌ AI 写 120 词，直接交。老师发现词汇远超平时水平，定性为代写。\n- ✅ 自己写一稿，AI 标 3 处错误并解释，自己改；文末注「AI 辅助语言润色，内容为本人原创」。\n\n### 案例：历史小论文\n- ❌ 复制百科三段，不注明，当成自己的分析。\n- ✅ 自己读史料写观点，引用处标「《XXX》第X页」，数据来自教材/权威年表。\n\n### 案例：理科实验报告\n- ❌ AI 编了\"实验数据符合预期\"的结论，实际没做实验。\n- ✅ 自己记录真实数据，AI 只帮分析\"为什么趋势是这样\"，结论自己写。\n\n---\n\n## 六、动手任务\n\n1. 取你之前某次作业，做一次「诚信扫描」：有没有未注明来源的内容？有没有 AI 代写痕迹？\n2. 用「三步自查」逐项核对，写下改进动作。\n3. 给你的《使用手册》（08）加一条永久条款：「提交前必做诚信三步自查。」\n\n---\n\n## 七、Prompt 模板（诚信版）\n\n```\n我在写【学科/作业______】。\n请帮我检查：我下面这段内容里，哪些可能属于\"未注明来源\"或\"像 AI 代写\"？\n【粘贴我的文字______】\n请只做风险提示，不要替我改写；我会自己补全引用、确保原创。\n```\n\n> 红线：AI 可提示风险，不可替你洗白；诚信最终由你自己负责。\n\n---\n\n## 八、人工检查清单（学生自查）\n\n- [ ] 我提交的内容，核心是我自己完成的。\n- [ ] 凡是别人的话/数据/观点，都标了来源。\n- [ ] 我没引用任何自己没核实过的文献。\n- [ ] 若作业要求，我已注明 AI 辅助。\n- [ ] 我能不看 AI 把内容讲一遍（真懂）。\n\n---\n\n## 九、常见错误\n\n1. **「只改几个词」**：以为不算抄，其实仍属剽窃。\n2. **隐瞒使用 AI**：不注明，等于欺骗。\n3. **引用假文献**：用 AI 编的书，造假。\n4. **代做代考**：最严重的学术欺诈，后果最重。\n\n---\n\n## 十、课后作业\n\n1. 写一份「我的学术诚信承诺」（3–5 条，含：不代写、要注明、先核查）。\n2. 完成一次「诚信扫描」：挑一份过往作业，找出并修正 1 处可改进点。\n3. 把诚信三步自查贴进你的学习区，作为每次提交前的固定动作。\n\n---\n\n## 十一、评分标准（满分 10 分）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 原创性确认 | 3 | 核心内容确为自己 |\n| 引用规范 | 3 | 来源标注正确、无假文献 |\n| 诚信意识 | 2 | 承诺具体、能识别越线行为 |\n| 自查习惯 | 2 | 三步自查可落地、常态化 |\n", "00-总览-en.md": "# Middle & High School \"AI Learning Power Bootcamp\" · Course Overview\n\n> A hands-on bootcamp for middle and high school students built on the principle of \"using AI to assist learning, not letting AI replace learning.\"\n> The goal is not to teach you more prompts, but to help you build a set of **transferable learning methods**: knowing how to ask, how to break problems down, how to verify, how to express yourself, and how to hold the line on academic integrity.\n\n---\n\n## I. Course Positioning\n\nThis is a dual-track course on \"AI literacy + learning methods.\" AI is the tool; learning power is the goal. We will not teach you how to use AI to copy homework, write essays, or do projects. Instead, we teach you how to make AI your \"sparring coach\" — it gives you scaffolding, feedback, and follow-up questions, but you are the one who achieves understanding and produces the work.\n\nThis course adapts the core ideas of the middle-school AI literacy workshop \"Beyond AI Hype\" (Chinasa T. Okolo, RESPECT'24), the Prompt engineering guides (dair-ai / Learning Prompt), and the introductory AI course \"Microsoft AI-For-Beginners,\" redesigned around the real learning scenarios of Chinese middle and high school students (math mistakes, English essays, history materials, physics concepts, etc.).\n\n---\n\n## II. Target Audience\n\n- **Middle school students (grades 7–9)**: Just starting to use AI tools; they need to build correct usage habits and a sense of boundaries.\n- **High school students (grades 10–12)**: Facing more complex academic tasks and college-prep pressure; they need to use AI to boost efficiency without becoming dependent or plagiarizing.\n- **Teachers / parents / tutors**: Who wish to guide students to use AI responsibly, rather than banning it outright.\n\n---\n\n## III. Students' Real Pain Points\n\n1. **Asking for the answer right away**: Treating AI as an upgraded search engine — copy the answer and forget it; still can't solve it on the exam.\n2. **Not knowing how to ask**: Describing the problem vaguely (\"help me write an essay\") yields something useless.\n3. **Giving up at the first difficulty**: Asking AI for the final result right away, skipping the most valuable \"thinking process.\"\n4. **Unable to tell true from false**: AI can confidently say nonsense (hallucination), and students copy it straight into homework and exams.\n5. **Academic integrity risk**: Copying AI-generated passages directly, not realizing this counts as plagiarism.\n6. **Not reviewing**: Doing many problems but keeping no mistake notebook or review plan; knowledge stays scattered.\n\nEvery session of this bootcamp revolves around the idea: \"**Let AI assist, but let the learning happen inside you.**\"\n\n---\n\n## IV. Learning Path (00 → 10)\n\n| No. | Topic | Core Deliverable |\n| --- | --- | --- |\n| 00 | Course Overview | This page you are reading |\n| 01 | Intro to the AI Study Assistant → My AI Study Rules | A personal \"AI Use Code of Conduct\" |\n| 02 | How to Ask Good Questions → Subject Question Templates | A subject-specific question template card |\n| 03 | Breaking Down Hard Problems → Step-by-Step Mistake Card | A step-by-step mistake-breakdown card |\n| 04 | English & Writing Training → Revision Log | A revision log with AI feedback |\n| 05 | Reviewing Knowledge Points → Review Plan | A weekly/monthly review plan |\n| 06 | Judging True vs. False Info → Fact-Check Practice | A fact-check list and exercise |\n| 07 | Speech & Expression → Speech Draft + Feedback | A speech draft + self/peer review form |\n| 08 | Designing Your Personal Study Assistant → User Manual | A personal \"AI Study Assistant User Manual\" |\n| 09 | Prompt Template Library | A collection of reusable question templates |\n| 10 | Academic Integrity Module | Methods and scripts for checking / citing / avoiding plagiarism |\n\n---\n\n## V. Deliverables (What You Should Have by the End)\n\n- Personal \"AI Use Code of Conduct\" (01)\n- Subject question template card (02)\n- At least 3 step-by-step mistake cards (03)\n- 1 English/essay revision log (04)\n- 1 review plan (05)\n- 1 fact-check exercise (06)\n- 1 speech draft + feedback (07)\n- Personal \"AI Study Assistant User Manual\" (08)\n- A reusable Prompt template library (09)\n- Academic integrity self-check list (10)\n\n---\n\n## VI. Usage Guide for Three Scenarios\n\n### Scenario A: School Classroom (teacher-led)\n- Each class is 45 minutes: 10 min explanation + 20 min hands-on task + 15 min showcase and peer review.\n- Teachers use the template library (09) for consistent wording, so students don't each write their own and end up with uneven quality.\n- Sessions 06 / 10 are recommended to be integrated into \"information literacy\" or \"homeroom/school-based classes,\" linking with the school's integrity education.\n- Equipment: School computer lab or students' own devices, with internet-connected AI tools (e.g., an education edition purchased by the school).\n\n### Scenario B: Training Institution / Club (mentor-led)\n- Can be compressed into 4–8 workshops, 90 minutes each, combining two sessions per meeting.\n- Emphasis on a \"portfolio\": at the end, students submit a complete learning-power portfolio (the deliverables above, packaged together).\n- Use the grading rubric (at the end of each session) for process-based assessment, not just final results.\n\n### Scenario C: Self-Study at Home (student + parent)\n- Students self-study in order 01→08, completing each session's \"Homework (Deliverables)\" independently; parents do a light check using the \"Grading Rubric.\"\n- Parents should focus on 10 (academic integrity) and 06 (true/false info) to help children hold the red lines.\n- Recommended pace: 1–2 sessions per week, finishing in 8 weeks; the template library (09) can serve as a quick-reference cheat sheet.\n\n---\n\n## VII. Red Lines Throughout the Course\n\n1. **Don't encourage copying answers directly**: For every AI reply, require the student to \"explain it back in their own words.\"\n2. **Every example must require the student to explain their understanding**: Not understanding = not learned; even if AI gives the answer, the student must be able to explain it clearly.\n3. **Fact-checking + academic integrity are mandatory**: 06 and 10 are hard requirements, and the other sessions also embed verification steps.\n\n> Ready to begin? Start with **01-Intro to the AI Study Assistant** — first set your own \"usage rules\"; that is the foundation of your entire bootcamp.\n", "01-AI学习助手入门-en.md": "# 01 · Intro to the AI Study Assistant → My AI Study Rules\n\n## Learning Goals\n\n1. Understand what an \"AI study assistant\" is, what it can do, and what it cannot do (recognize the limits of large language models).\n2. Build the basic mental model that \"AI is a sparring coach, not a ghostwriting machine.\"\n3. Personally draft your own \"AI Use Code of Conduct\" as the baseline for all your future learning activities.\n4. Begin to recognize that AI can \"confidently say nonsense\" (hallucination), and build the habit of questioning it.\n\n---\n\n## Warm-up Question\n\n> One day you come across a math problem you can't solve. Which sentence would you say to AI?\n> A. \"What's the answer to this problem?\"\n> B. \"Please guide me to understand how to think about this problem. Don't give me the final answer directly — I want to work it out myself.\"\n>\n> With these two phrasings, what AI gives you will be completely different. In this session, we start with \"figuring out exactly what AI is.\"\n\n---\n\n## Core Concepts\n\n### 1. What Is an AI Study Assistant\nAn AI study assistant (such as various conversational large language models) is software that \"has read a lot of books, can chat, and can generate text.\" It is not a person, has no real-life experience, and doesn't truly \"understand\" the world — it is predicting \"the next most reasonable word.\"\n\n### 2. What It Can Do (for Learning)\n- Explain concepts (in words you can understand)\n- Give you hints, scaffolding, and ways of thinking — not direct answers\n- Grade your homework and give feedback\n- Practice with you (speaking, memorizing vocabulary, explaining problems)\n- Help you organize, summarize, and ask questions\n\n### 3. What It Can't Do / Where It Goes Wrong\n- **Hallucination**: Making up false facts, fake references, and fake data that look very real.\n- **It doesn't really think**: It follows your question along; it won't proactively point out that you \"asked in the wrong direction.\"\n- **No real-time verification**: It doesn't know today's news and may use outdated knowledge.\n- **It doesn't know your exam scope**: It doesn't know how far your teacher has gotten this week.\n\n### 4. The Key Mental Model\n> **AI is a sparring coach, not a ghostwriting machine.**\n> A coach gives you methods, feedback, and encouragement; but you are always the one on the field playing the game.\n\n---\n\n## Learning Scenario Example\n\n### Example: Not understanding the physics concept of \"buoyancy\"\n- **Wrong use**: Ask \"What is buoyancy? Give me a definition to memorize.\" → You memorized it, but on the exam, a slightly different question format and you're stuck.\n- **Right use**: Ask \"Using the bubbles in the straw when I drink soda as an example, can you help me understand why buoyancy points upward? Please guide me, don't give the definition directly.\" → AI uses a life example you know well and, step by step, builds your intuition.\n\n### Example: Too much history material you can't understand\n- **Wrong use**: Throw a passage at AI and say \"Summarize it into 200 words.\" → You didn't read it; you just submitted what it gave.\n- **Right use**: \"What core event is this passage about? First just list 3 keywords, then I'll read the original myself and check.\" → You still have to read the original; AI is just navigation.\n\n---\n\n## Correct vs. Incorrect Usage\n\n| Dimension | ❌ Incorrect use | ✅ Correct use |\n| --- | --- | --- |\n| Purpose | Want the answer, want a finished product | Want thinking, feedback, understanding |\n| Questioning | \"Help me write an essay\" | \"Give me 3 opening ideas, then I'll write it myself\" |\n| After getting results | Copy and submit directly | Retell in your own words, verify, cite sources |\n| When confused | Skip it, ask the next thing | Follow up with \"why\" / \"how did this step come about\" |\n| Attitude | Everything AI says is right | For any factual info, verify before believing |\n\n---\n\n## Hands-on Task\n\n1. Open your usual AI tool and enter these two sentences separately; observe how the answers differ:\n   - \"Solve 2x+3=11, give the answer directly.\"\n   - \"Solve 2x+3=11, please guide me to understand each step, don't give the final answer directly.\"\n2. Record: In the second answer, which step made you go \"Ah, so that's how it works\"? Write it down.\n3. Find a passage from an AI answer and try to pick out one place that might be wrong (e.g., a specific year, a person's name), then verify it with a textbook or search engine.\n\n---\n\n## Prompt Template (for middle/high school students)\n\n```\nYou are a patient middle-school study coach.\nPlease guide me to understand [subject/topic: ______]; do not give the final answer directly.\nI'd like you to:\n1. First use examples from my daily life to help me build intuition;\n2. Give me hints so I can work it out step by step myself;\n3. When I get stuck, give me a bit more of a clue rather than the result directly;\n4. Finally, test me with one sentence to check whether I truly understand.\n```\n\n> Red-line reminder: Every template carries by default the sentence \"Please guide me to understand; do not give the final answer directly.\"\n\n---\n\n## Human Review Checklist (student self-check)\n\n- [ ] I understand that AI can \"hallucinate\" and I won't blindly trust the facts it gives.\n- [ ] I have written down my own \"AI Use Code of Conduct\" (see Homework below).\n- [ ] I have tried \"guided questioning\" once and felt the difference.\n- [ ] I know: for anything I submit to my teacher, the final responsibility is mine.\n\n---\n\n## Common Mistakes\n\n1. **Treating AI as an encyclopedia**: Assuming everything it says is right and not verifying.\n2. **Jumping straight to ghostwriting**: Letting AI write the whole thing while you don't participate — that's the same as not learning.\n3. **Not disclosing AI use**: Pasting AI content straight into homework counts as concealment.\n4. **Over-reliance**: Asking AI at the slightest difficulty and giving up on your own thinking.\n\n---\n\n## Homework (Deliverables)\n\n1. Write your own \"AI Use Code of Conduct\" (at least 5 rules, e.g., \"Don't submit AI's original text as homework,\" \"Verify all facts first\").\n2. Use the \"guided template\" to ask AI about a concept you recently didn't understand; write 3 sentences each for AI's guidance and your own understanding.\n3. Share your code of conduct with a parent/teacher and ask them for one additional suggestion.\n\n---\n\n## Section Summary & Extension\n\nThe AI study assistant is a \"sparring coach,\" not a \"ghostwriting machine.\" Remember three sentences: **It makes mistakes, so verify; it gives answers, so keep asking; it is not responsible, so the responsibility is mine.** The \"AI Use Code of Conduct\" you created in this session is the foundation of the whole bootcamp — every method in later sessions is built on this code.\n\n### One Sentence for Parents/Teachers\nDon't just tell children \"Don't use AI to copy homework\" — go further and set rules with them for \"how to use it correctly.\" Posting the child's code on the desk works better than a simple ban. When a child can say \"AI might be wrong here,\" they have truly built literacy.\n\n### Extension: The Three-Question Self-Check\nBefore using any AI content in your homework, ask yourself these three questions:\n1. Can I explain this sentence myself? (If not, you didn't understand.)\n2. Have I verified this fact? (If not, you can't use it.)\n3. Did I write this, or did AI? (If you can't tell, you've crossed the line.)\nOnly use it once all three pass.\n\n## Grading Rubric (out of 10)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Code completeness | 3 | At least 5 rules, concrete and actionable |\n| Guided-questioning practice | 3 | Real conversation log + own understanding |\n| Red-line awareness | 2 | Shows \"don't copy, verify first\" |\n| Reflection depth | 2 | Can state AI's limits and own responsibility |\n", "02-如何问出好问题-en.md": "# 02 · How to Ask Good Questions → Subject Question Templates\n\n## Learning Goals\n\n1. Understand that \"question quality determines answer quality\" — a vague question only gets a useless answer.\n2. Master the four elements of structured questioning: context, goal, constraints, role.\n3. Build subject-specific question template cards (math / English / history / physics, etc.).\n4. Learn to embed \"guided\" requirements in your questions so AI doesn't give the answer directly.\n\n---\n\n## Warm-up Question\n\n> Xiaoming asks AI: \"Help me write an essay about environmental protection.\"\n> Xiaohong asks AI: \"I'm a 8th-grader. I need to write a 600-word argumentative essay with the thesis 'garbage sorting starts with small things.' Please first give me 3 arguments with corresponding real-life examples. Don't write the whole thing — I want to write it myself.\"\n>\n> Whose result is more useful? Why? — **A good question is the first step to learning well.**\n\n---\n\n## Core Concepts\n\n### 1. Why Questioning Matters So Much\nLarge language models \"follow along with what you say.\" The clearer you are, the more they can help; if you're vague, they can only guess, and the result is often useless.\n\n### 2. The Four Elements of a Good Question (STAR Method)\n- **Situation (background)**: Who am I, what grade, what am I studying.\n- **Task**: What do I want (thinking / feedback / explanation / practice).\n- **Action (constraints)**: Length, style, don't give the answer directly, etc.\n- **Role**: Have AI play \"coach / teacher / sparring partner.\"\n\n### 3. Shift from \"Want the answer\" to \"Want understanding\"\nAdd to your question: **\"Please guide me to understand, don't give the final answer directly — I want to do it myself.\"**\n\n### 4. Iterative Questioning\nFirst round: ask for a framework. Second round: ask for hints. Third round: ask for feedback — a good question is \"asked out\" step by step, not in one shot.\n\n---\n\n## Learning Scenario Example\n\n### Math mistake\n- Vague: \"How do I do this function problem?\"\n- Good question: \"I'm a 10th-grader. I'm stuck on the step 'how to complete the square' in this quadratic-function problem. Please only hint at the idea of completing the square and guide me to do it myself; don't give the full solution.\"\n\n### English essay\n- Vague: \"Help me revise this essay.\"\n- Good question: \"I'm a 9th-grader. Below is my 120-word English short essay. Please point out the 3 grammar/word-choice issues that most hurt my score, and explain why each is wrong, so I can fix them myself. Don't rewrite.\"\n\n### History material\n- Vague: \"Tell me about the Taiping Rebellion.\"\n- Good question: \"I'm previewing the Taiping Rebellion. The textbook says it was 'anti-feudal and anti-aggression.' Please list 3 specific historical facts that support this evaluation, and mark which one is most disputed and why.\"\n\n### Physics concept\n- Vague: \"What is Newton's Second Law?\"\n- Good question: \"Using the example of 'pushing a shopping cart,' I keep getting stuck on F=ma at 'the bigger the mass, the harder to accelerate.' Please guide me with this example; don't just recite the formula.\"\n\n---\n\n## Correct vs. Incorrect Usage\n\n| | ❌ Incorrect question | ✅ Correct question |\n| --- | --- | --- |\n| Information | No background, no goal | Has grade, has specific sticking point |\n| Expectation | Want a finished product | Want thinking/feedback/guidance |\n| Usability of result | Vague, unusable | Precise, can continue working |\n| Learning happens | No | Inside you |\n\n---\n\n## Hands-on Task\n\n1. Pick a point you didn't understand from a recent assignment in one of your subjects.\n2. First write a \"vague question,\" then rewrite it as a \"STAR good question.\"\n3. Enter your rewritten question into AI and check whether what it gives you is actually usable; if not, iterate one more round.\n4. Copy your final question into your \"subject question template card.\"\n\n---\n\n## Prompt Template (for middle/high school students)\n\n```\nI am a [grade ______] student, studying [subject/topic ______].\nI'm currently stuck on: [specific sticking point ______].\nPlease play the role of my [subject] coach, guide me to understand, and don't give the final answer directly.\nI'd like you to:\n1. First confirm where I'm confused;\n2. Give 1–2 hints to let me move forward myself;\n3. After I answer, judge whether to give more clues;\n4. Finally test me with 1 question to see if I truly understand.\n```\n\n> Red line: Every subject template carries \"guide me to understand, don't give the final answer directly.\"\n\n---\n\n## Human Review Checklist (student self-check)\n\n- [ ] My question contains the three elements \"who am I / what am I studying / where am I stuck.\"\n- [ ] I explicitly asked AI not to give the answer directly.\n- [ ] I tried it once and confirmed the answer was useful to me.\n- [ ] I copied the good question into my template card for reuse next time.\n\n---\n\n## Common Mistakes\n\n1. **Question too short and vague**: \"Help me study math\" — AI has no way to start.\n2. **Asking for too much at once**: Wanting explanation + essay + problems all at once, so everything stays shallow.\n3. **Forgetting to say \"don't give the answer\"**: AI handily gives a finished product, and you copy it again.\n4. **Not iterating**: Giving up after the first try doesn't work, when actually rephrasing the question would fix it.\n\n---\n\n## Homework (Deliverables)\n\n1. Make your \"subject question template card\": write 1 STAR good question for each of math, English, history/Chinese, physics/biology (4 total).\n2. Pick 1 of them and actually try it with AI once; record AI's guidance and what you gained.\n3. Reflect: Which kind of \"bad question\" did you most often ask before? How will you fix it going forward?\n\n---\n\n## Section Summary & Extension\n\nA good question = clear background + clear goal + reasonable constraints + suitable role. Most \"AI answers the wrong thing\" cases root in \"I asked unclearly.\" Treat questioning as a practicable skill: write a draft first, then make it precise, and finally see whether what AI gives can catch your next step.\n\n### The Five \"Verb Methods\" for Questioning\nWhen writing a question, start with these five verbs and the question becomes specific instantly:\n- **Explain**: Please explain… (for understanding)\n- **Hint**: Please hint at… (for clues)\n- **Compare**: Please compare A and B… (for distinction)\n- **Give an example**: Please give a real-life example… (for intuition)\n- **Verify**: Please help me verify… (for validation)\nAvoid using only one-shot verbs like \"write / do / give.\"\n\n### One Sentence for Parents/Teachers\nEncourage children to save their \"good questions\" into a document, building their own question bank. The class can vote on \"best question of the week\" so that \"knowing how to ask\" is seen and rewarded just like \"knowing how to answer.\"\n\n## Grading Rubric (out of 10)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Template card complete | 3 | 1 question per 4 subjects, all elements present |\n| STAR application | 3 | Background/task/constraints/role clear |\n| Guided requirement | 2 | Contains \"don't give the answer directly\" |\n| Practice & reflection | 2 | Real trial + self-improvement |\n", "03-难题拆解-en.md": "# 03 · Breaking Down Hard Problems → Step-by-Step Mistake Card\n\n## Learning Goals\n\n1. Master the \"break a big problem into small steps\" decomposition mindset (similar to the Chain-of-Thought idea).\n2. Use AI as a \"step-by-step sparring partner\": it gives one hint, you do one step — instead of giving the whole solution.\n3. Build a \"step-by-step mistake card\" tool, turning every wrong problem into a reusable learning asset.\n4. Stick to \"guided\" decomposition: AI doesn't calculate for you, it only helps you figure out the next step.\n\n---\n\n## Warm-up Question\n\n> You stare at a hard geometry final problem for 10 minutes with no idea. What should you do first?\n> A. Immediately ask AI: \"What's the answer to this problem?\"\n> B. Ask AI: \"What known conditions can I confirm first for this problem? Where do I usually start? Guide me, don't solve it directly.\"\n>\n> Those who choose B are slower, but next time they meet a similar problem, they'll be able to break it down themselves.\n\n---\n\n## Core Concepts\n\n### 1. Why Decomposition Works\nBig hard problems make people give up because they are \"too big, too vague.\" Once broken into 3–5 small steps, each step becomes doable. This is also a common AI reasoning method (step-by-step thinking).\n\n### 2. A General Framework for Decomposition\n- **Given conditions**: What does the problem give you?\n- **What is the goal**: What to prove / find?\n- **Middle bridge**: From known to goal, what steps usually lie in between?\n- **Sticking-point location**: Exactly which step am I stuck on?\n- **Next action**: What can I try first for this step?\n\n### 3. AI's Correct Role in Decomposition\nAI should not \"solve it all at once,\" but should:\n- Help you list the given conditions (you verify)\n- Hint \"usually you can think about the next step this way\" (you decide whether to adopt it)\n- You do one step, it looks at it, then gives the next hint\n\n### 4. The Value of the Step-by-Step Mistake Card\nA mistake is not \"wrong and done\" — it's \"at which step did my thinking break.\" The step-by-step card marks the break point so you can avoid it next time.\n\n---\n\n## Learning Scenario Example\n\n### Math: a comprehensive function problem\n- **Wrong use**: \"Send me the answer to this function problem.\" → Copy it, still can't do it next time.\n- **Right use**: \"In this problem I need to find where the parabola intersects the x-axis. Please remind me: to find the intersection, what should y usually be set equal to? Guide me, I'll calculate it myself.\" → AI hints \"set y=0,\" you compute the intersection and continue to the next step.\n\n### Physics: a force-analysis problem\n- **Wrong use**: Ask directly for the final acceleration.\n- **Right use**: \"I always miss friction force in the force analysis of an object on an incline. Please guide me to draw it step by step in the order 'gravity first, then normal force, then friction,' don't give the result directly.\"\n\n### History: a document-analysis problem\n- **Wrong use**: \"What's the main point of this passage? Just say it.\"\n- **Right use**: \"This passage is about the Self-Strengthening Movement. Please break it into three steps 'background — measures — results,' and for each step give me one guiding question so I can find the answer in the original text myself.\"\n\n---\n\n## Correct vs. Incorrect Usage\n\n| | ❌ Incorrect | ✅ Correct |\n| --- | --- | --- |\n| What AI gives | Full solution | Single-step hint |\n| What you do | Copy-paste | Derive each step yourself |\n| Mistake handling | Cross it out and redo | Mark the break point, make a step card |\n| Gain | 0 | Transferable decomposition skill |\n\n---\n\n## Hands-on Task\n\n1. Find a problem you got wrong recently (any subject).\n2. Use the \"decomposition framework\" above to break it into 3–5 steps, writing it on a \"step-by-step mistake card.\"\n3. Take the \"sticking point\" from the card and ask AI with a guided question: \"I'm stuck at step ___, please give me only one hint, don't solve it.\"\n4. Complete that step yourself, and on the card note \"why I was wrong before.\"\n\n---\n\n## Prompt Template (for middle/high school students)\n\n```\nI am a [grade ______] student, working on a [subject] problem.\nThe problem is: [paste problem ______].\nWhat I've already figured out: [completed steps ______].\nI'm stuck at: [specific sticking point ______].\nPlease act as a coach and give me only a hint for the [next step], guiding me to understand, without giving the final answer or the full solution directly.\nAfter I work it out, I'll tell you the result, and you'll judge what my next step should be.\n```\n\n> Red line: Only ever ask for \"the next step\"; never ask for the full solution at once.\n\n---\n\n## Human Review Checklist (student self-check)\n\n- [ ] I broke the hard problem into at least 3 clear steps.\n- [ ] AI only gave \"the next-step hint,\" not solving it for me.\n- [ ] I completed every step and can say what each step does.\n- [ ] I marked the \"sticking point\" and \"why I was wrong before.\"\n\n---\n\n## Common Mistakes\n\n1. **Ask for the whole thing the moment you're stuck**: asking AI for the full solution wastes the decomposition practice.\n2. **Not writing the card**: thinking it through in your head without writing it down — you'll make the same mistake next time.\n3. **Copy without understanding**: AI gives a hint, you copy the hint as the answer without truly understanding.\n4. **No review of mistakes**: after making the card you throw it away, never looking back periodically.\n\n---\n\n## Homework (Deliverables)\n\n1. Complete at least 2 \"step-by-step mistake cards\" (1 each for different subjects), including: given conditions, goal, steps, sticking point, cause of error.\n2. Using the guided template, actually ask AI once about the sticking point of one card; record its hint and your completion.\n3. One week later, look back at these two cards and write \"Would I still get this problem wrong now?\"\n\n---\n\n## Section Summary & Extension\n\nDecomposition turns an \"undoable big problem\" into \"doable small steps.\" The core trick is: **Only ever ask AI for \"the next step,\" never the full solution at once.** Every step you do is you growing your own ability; AI is just the coach giving you a hand. The value of the step-by-step mistake card is marking \"where did I go wrong\" as a signpost, so you actively avoid it next time.\n\n### Extension: Draw a \"Mind Map\"\nWhen a problem has more than 4 steps, it's recommended to draw a mind map on paper: write the given conditions on the left, draw arrows connecting each derivation step in the middle, and write the goal on the right. The step you're stuck on is usually where the arrow breaks. Circle the break point and ask AI — far more efficient than throwing the whole problem at it.\n\n### One Sentence for Parents/Teachers\nDon't rush to see \"did the child get it right\"; first see \"did they break it down correctly.\" A problem done wrong but broken down sensibly is more valuable than one guessed right. Writing a line like \"great thinking on this step\" on the card protects learning motivation better than a score.\n\n## Grading Rubric (out of 10)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Decomposition quality | 3 | Clear steps, covers the whole problem |\n| Guided practice | 3 | AI only hints, you complete |\n| Error-cause analysis | 2 | Clearly states \"why I was wrong before\" |\n| Card reusability | 2 | Standard format, can be reviewed |\n", "04-英语和写作训练-en.md": "# 04 · English & Writing Training → Revision Log\n\n## Learning Goals\n\n1. Use AI as a \"writing coach\": revise your essay, point out problems, give actionable suggestions — not rewrite it for you.\n2. Build the habit of a \"revision log\": draft → feedback → second draft, so you can see your own progress.\n3. Improve English expression and Chinese writing awareness of logic, word choice, and structure.\n4. Hold the red line: AI improves \"how to write better,\" but the final text must come from you.\n\n---\n\n## Warm-up Question\n\n> You wrote an English short essay and the grammar is a bit messy. What would you do?\n> A. Throw the whole thing at AI: \"Rewrite it for me.\" → It becomes AI's writing; you didn't practice.\n> B. Throw it at AI: \"Please only mark the 3 errors that most hurt my score, explain why each is wrong, and let me fix them myself.\" → You practiced, understood, and now can do it.\n>\n> Writing ability is \"revised\" into being, not \"generated\" into being.\n\n---\n\n## Core Concepts\n\n### 1. AI's Good Role in Writing\n- **Reviewer**: Point out grammar, logic, and structure problems.\n- **Explainer**: Explain \"why this is wrong here.\"\n- **Sparring partner**: Brainstorm arguments and examples with you.\n- **Not a ghostwriter**: Not writing the whole essay for you.\n\n### 2. The Three-Column Structure of a Revision Log\n| Original sentence/paragraph | Problem AI points out | My fix + why |\nThis way you can see \"from what to what, and why.\"\n\n### 3. Common Levers in English Writing\n- Tense agreement, subject-verb agreement\n- Precise word choice (don't overuse very / good / big)\n- Connectors (however / therefore / for example)\n- Sentence variety (mix long and short sentences)\n\n### 4. Same for Chinese Writing\nStructure (thesis–argument–restatement), evidence support, avoid colloquialism, paragraph transitions.\n\n---\n\n## Learning Scenario Example\n\n### English essay: My Weekend (120 words)\n- **Wrong use**: \"Write my 120-word My Weekend for me.\" → Submit directly; the teacher sees at a glance it's not yours.\n- **Right use**: Paste your own draft and ask \"Find 3 grammar errors and explain them; don't rewrite, I'll fix them myself.\" After you fix them, ask \"Can the flow of this version be better? Give 1 suggestion.\"\n\n### Chinese argumentative essay: on \"Perseverance\"\n- **Wrong use**: Let AI generate the whole essay.\n- **Right use**: You write a draft, ask \"Are my arguments supported by examples? The logic in paragraph 2 skips a step — please point out the gap so I can fill it myself.\"\n\n---\n\n## Correct vs. Incorrect Usage\n\n| | ❌ Incorrect | ✅ Correct |\n| --- | --- | --- |\n| Input | The topic | Your own draft |\n| AI output | A brand-new article | Problem marking + explanation |\n| What you do | Copy and submit | Fix yourself, record it |\n| Skill gain | None | Visible progress |\n\n---\n\n## Hands-on Task\n\n1. Write a 100–150-word English short essay (or a 300-character Chinese mini-essay) yourself, any topic.\n2. Paste the draft to AI and ask for feedback in the mode \"only mark 3 errors + explain.\"\n3. Based on the feedback, revise into a second draft and fill in the three-column \"revision log.\"\n4. Show the second draft to AI once more to confirm whether obvious problems remain (still only ask for suggestions, don't let anyone rewrite).\n\n---\n\n## Prompt Template (for middle/high school students)\n\n```\nI am a [grade ______] student, just wrote a [English/Chinese] essay on the topic [______].\nBelow is my original draft: [paste ______].\nPlease do not rewrite it for me. Please:\n1. Only mark [3] issues that most hurt the score (grammar/logic/structure);\n2. For each, explain \"why this is a problem\";\n3. Give me a direction I can fix myself, without giving ready-made sentences.\nI want to revise it myself and record the revision process.\n```\n\n> Red line: AI doesn't write for you; the final text is 100% from your hand.\n\n---\n\n## Human Review Checklist (student self-check)\n\n- [ ] The original draft is my own writing, no AI ghostwriting.\n- [ ] AI only pointed out problems and explained, without rewriting.\n- [ ] I completed the second draft and filled the three-column revision log.\n- [ ] I can say \"which type of error I fixed correctly.\"\n\n---\n\n## Common Mistakes\n\n1. **Letting someone ghostwrite**: passing AI's output off as your own homework is academic misconduct.\n2. **Fixing without understanding**: following AI's fix but unable to say why.\n3. **Asking for too much feedback at once**: marking 10 issues, but then can't take them all in.\n4. **Not recording**: throwing it away after fixing, so progress is invisible and hard to review.\n\n---\n\n## Homework (Deliverables)\n\n1. Complete 1 \"revision log\" for an English or Chinese essay (including original draft, 3 pieces of feedback, second draft, revision notes).\n2. Actually operate once with the guided template and submit the log table.\n3. Write one sentence: Which type of error did this revision help you improve the most?\n\n---\n\n## Section Summary & Extension\n\nWriting ability is \"revised\" into being. AI's best role is reviewer and explainer: it points out problems and explains the reasons; you do the fixing and record why. The three-column revision log (original / problem / my fix) makes progress visible, and lets teachers and parents see at a glance that this is your own growth, not AI's output.\n\n### Shared Principles of English and Chinese Writing\nGood writing in any language follows three rules:\n1. **One clear idea**: one paragraph says one thing.\n2. **Support with examples**: after stating a point, immediately give evidence or a story.\n3. **Natural connections**: link sentences with \"because / but / for example / so.\"\nUse these three as a checklist: self-review once, then hand it to AI to catch gaps — best efficiency.\n\n### One Sentence for Parents/Teachers\nWhen collecting homework, focus on the \"revision log\" rather than just the final draft. The child's own line in the log — \"I fixed the tense error\" — shows real progress better than a perfect-score essay. Encourage keeping a semester of revision logs; it becomes a writing-growth portfolio.\n\n### Quick Self-Check Card (30 seconds before submitting)\n- Did I write this myself? Yes → continue.\n- Did AI only mark problems, not write for me? Yes → continue.\n- Can I say which type of error I fixed? Yes → submit with confidence.\nIf any of the three is \"no,\" do that step first before submitting.\n- Tip: Re-read your writing a day later; you'll often find new problems. This is the \"cooling effect,\" a secret weapon of good writers.\n\n## Grading Rubric (out of 10)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Originality | 3 | Draft is genuinely self-written |\n| Feedback use | 3 | Accurately understands AI's pointed-out problems |\n| Revision quality | 2 | Second draft clearly better than first |\n| Log completeness | 2 | Three-column table clear, reviewable |\n", "05-知识点复习-en.md": "# 05 · Reviewing Knowledge Points → Review Plan\n\n## Learning Goals\n\n1. Use AI to turn \"scattered notes\" into a \"structured knowledge web,\" improving review efficiency.\n2. Make an actionable weekly/monthly review plan, avoiding \"cram before the exam, forget after.\"\n3. Let AI generate \"quiz questions\" to self-test you, instead of memorizing for you.\n4. Combine awareness of the forgetting curve to build a \"spaced review\" habit.\n\n---\n\n## Warm-up Question\n\n> A week before finals, you face 6 subjects of notes and huge pressure. What do you usually do?\n> A. Flip through from start to finish, read once, feel \"roughly get it.\"\n> B. Have AI help me turn each chapter into \"3 core exam points + 1 knowledge map,\" then have it make 5 self-test questions to quiz me.\n>\n> B turns \"reading\" into \"testing,\" with much higher memory retention.\n\n---\n\n## Core Concepts\n\n### 1. The Essence of Review Is \"Retrieval,\" Not \"Re-reading\"\nPsychology research (e.g., the testing effect) shows: active recall (self-testing) works better for memory than repeated reading. AI excels at \"making questions to quiz you.\"\n\n### 2. Structuring: From Notes to Knowledge Web\nScattered underlined notes are hard to recall. Have AI help you organize a chapter into:\n- Core concepts (what is it)\n- Key relations (how they connect)\n- Easy-mistake points (where you often err)\n- Typical problems (how it's tested)\n\n### 3. Spaced Review\nDon't memorize everything in one day. Spread content across multiple days; each time, self-test the old content first, then learn new content.\n\n### 4. AI's Correct Role\n- Organizer: structure your notes (you provide the material)\n- Question maker: make quizzes based on your study scope\n- Sparring partner: gives feedback after you answer\n- Not: memorize for you, or predict the exam for you\n\n---\n\n## Learning Scenario Example\n\n### Biology: photosynthesis\n- **Wrong use**: \"Summarize photosynthesis for me to memorize.\" → You didn't participate; slow to memorize, fast to forget.\n- **Right use**: Paste your class notes and ask \"Organize this chapter into 'core concepts + easy-mistake points + 3 self-test questions'; let me answer the questions myself, then give me feedback.\"\n\n### History: the 1911 Revolution\n- **Wrong use**: Have AI write a review outline to memorize directly.\n- **Right use**: \"I organized the 1911 Revolution on a timeline. Please help me check which 3 key nodes I missed, and make 2 cause–effect questions of 'reason — impact' to quiz me.\"\n\n---\n\n## Correct vs. Incorrect Usage\n\n| | ❌ Incorrect | ✅ Correct |\n| --- | --- | --- |\n| Review method | Re-read notes | Self-test + structuring |\n| AI role | Memorize for you | Help organize, make questions |\n| Plan | None, cram before exam | Weekly/monthly spaced plan |\n| Effect | Short-term, easily forgotten | Long-term retention |\n\n---\n\n## Hands-on Task\n\n1. Pick a unit you recently studied, paste your notes/textbook key points to AI.\n2. Have it organize into \"core concepts + easy-mistake points + knowledge map (text version).\"\n3. Then have it make 5 self-test questions (covering different angles); you answer closed-book.\n4. Record the wrong questions in the \"key review\" column of your \"review plan.\"\n\n---\n\n## Prompt Template (for middle/high school students)\n\n```\nI am a [grade ______] student, reviewing [subject/unit: ______].\nBelow are my note key points: [paste ______].\nPlease do not memorize for me. Please:\n1. Organize into three parts \"core concepts + key relations + easy-mistake points\";\n2. Draw a text-version knowledge map (using indentation/arrows to show relations);\n3. Make [5] self-test questions to quiz me, covering different angles;\n4. I'll answer myself first, then send to you, and you give feedback.\n```\n\n> Red line: AI quizzes you, doesn't memorize for you; what's finally remembered must be you yourself.\n\n---\n\n## Human Review Checklist (student self-check)\n\n- [ ] I provided my own notes as material; AI only organized.\n- [ ] I did the self-test questions, answering before seeing feedback.\n- [ ] I made a spaced review plan (with review times).\n- [ ] The points I got wrong were recorded in \"key review.\"\n\n---\n\n## Common Mistakes\n\n1. **Letting AI memorize for you**: memorizing the outline directly without your own retrieval.\n2. **Only organizing, not testing**: the knowledge map looks nice but isn't really memorized.\n3. **No-plan cramming**: no review normally, panic only before exams.\n4. **Not reviewing wrong points**: stepping into the same pit next time.\n\n---\n\n## Homework (Deliverables)\n\n1. Make a \"weekly review plan table\": list 3 subjects, 20 minutes of daily self-test content, weekend review.\n2. Use the template to genuinely generate \"knowledge map + 5 self-test questions\" for 1 unit, answer them yourself, and record mistakes.\n3. One week later, re-test with the same self-test questions and compare accuracy change.\n\n---\n\n## Section Summary & Extension\n\nThe essence of review is \"active retrieval,\" not \"repeated reading.\" Having AI structure your notes and then quiz you sticks far better than dry reading. Spreading review across 20 minutes a day beats an all-nighter before the exam — that's the power of \"spaced review.\"\n\n### Did You Know: The Forgetting Curve\nPsychologist Ebbinghaus found that without review, you forget about two-thirds of what you learned after 1 day; but if you review once on day 1, day 3, day 7, and day 30, memory stays long-term. Schedule your review plan to this rhythm: same day, next day, weekend, month-end.\n\n### One Sentence for Parents/Teachers\nHelp children change \"review\" from \"reading notes\" to \"doing self-tests.\" You can spend 5 minutes a week quizzing them with their own self-test questions — being able to answer means truly knowing. Use self-test accuracy as a progress gauge; it reflects real mastery better than scores.\n\n### Quick Self-Check Card (30 seconds opening the manual)\n- Did I do \"active retrieval\" self-testing for this unit? Yes → continue.\n- Did I draw the knowledge map? Yes → continue.\n- Did I review the wrong points? Yes → at ease.\nOnly \"reading\" without \"testing\" equals no review — the most overlooked pitfall.\n- Tip: Don't over-pack your review plan; leave about 20% blank for sudden tasks, or one interruption can make you abandon it entirely. A plan you can stick to is a good plan. When reviewing on the weekend, prioritize the unit with the \"highest wrong rate\" — spend effort where it counts most, best efficiency.\n\n## Grading Rubric (out of 10)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Structuring quality | 3 | Concepts/relations/easy-points clear |\n| Self-test practice | 3 | Answer before feedback, real participation |\n| Plan feasibility | 2 | Weekly plan concrete, sustainable |\n| Review awareness | 2 | Wrong points reviewed, second self-test compared |\n", "06-信息真假判断-en.md": "# 06 · Judging True from False → Fact-Checking Practice\n\n## Learning Goals\n1. Understand AI \"hallucination\": it confidently makes up wrong facts, fake references, and fake data.\n2. Master a basic judgment framework for \"fact vs. opinion\" and \"source credibility.\"\n3. Build a practical fact-checking checklist — verify every factual claim AI gives you before using it.\n4. Apply the red line \"check every fact first\" throughout all learning activities.\n\n---\n\n## Warm-up Question\n> AI tells you: \"Einstein failed math in elementary school and only became great later.\" Do you believe it?\n> In fact, this is a widely spread **urban legend** — Einstein was always good at math.\n> AI won't tell you it's false on its own — **it only knows \"this gets said a lot,\" so it says it.**\n> This lesson is dedicated to practicing \"how not to be fooled by AI.\"\n\n---\n\n## Core Concepts\n\n### 1. What is \"Hallucination\"\nA large language model generates text by predicting \"the next plausible word,\" not by \"looking up the truth\" in a database. When it doesn't know, it \"makes up something that sounds reasonable\" — that's a hallucination. It **never thinks it's wrong**.\n\n### 2. Three types of information most likely to be wrong\n- **Specific facts**: years, names, data, places (AI often mixes them up).\n- **Citations / references**: it often fabricates \"looks-real\" book titles, authors, and papers.\n- **Latest information**: its training data has a cutoff date and knows nothing after it.\n\n### 3. Fact vs. Opinion\n- **Fact**: verifiable as right or wrong (e.g., \"water boils at 100°C\").\n- **Opinion**: a subjective judgment (e.g., \"this movie is great\").\n- For \"facts\" from AI, verify them; for \"opinions,\" check whether they have a basis.\n\n### 4. Source-credibility ladder\nPrimary sources (textbook / official document) > authoritative media / academic database > ordinary webpage > social media / forum > screenshots from unknown origin.\n\n---\n\n## Real Learning-scenario Cases\n\n### Case: Historical date\n- AI says \"the Xinhai Revolution happened in 1912.\"\n- Check: the textbook says 1911 (the Wuchang Uprising). AI confused \"Republic founded in 1912\" with \"Xinhai Revolution in 1911.\"\n- Action: verify with a textbook / authoritative encyclopedia and mark the correct year.\n\n### Case: Scientific data\n- AI says \"the speed of light is 30,000 km/s.\"\n- Check: it's actually about 300,000 km/s — a 10x error.\n- Action: for any data, check an authoritative source before citing it.\n\n### Case: Reference citation\n- AI gives you a passage \"a paper proves…\" with an author and journal name attached.\n- Check: search the academic database — no such paper exists. A classic fabricated citation.\n- Action: never cite a reference AI gives you unless you have verified the original yourself.\n\n---\n\n## Right vs. Wrong Use\n\n| | ❌ Wrong | ✅ Right |\n| --- | --- | --- |\n| Getting a fact | Believe it and put it in homework | Mark it \"to be checked\" |\n| Verifying | None | Cross-check with authoritative sources |\n| Citing | Copy what AI gave | Cite only after finding the original |\n| Attitude | \"AI is always right\" | Doubt facts first, believe after checking |\n\n---\n\n## Hands-on Task\n1. Ask AI 3 factual questions (e.g., \"the year of an event,\" \"a scientist's contribution,\" \"a data point\").\n2. For each answer, verify it with a textbook / authoritative website; record \"What AI said / What's actually true / Was it wrong?\"\n3. Find at least 1 AI mistake and write down how you discovered and verified it.\n4. Fill in your \"Fact-Checking Checklist\" (below).\n\n---\n\n## Prompt Template (student version)\n```\nI'm working on [subject/homework: ______] and need to verify a fact: [fact statement: ______].\nPlease:\n1. First tell me whether this is a \"fact\" or an \"opinion\";\n2. If you're unsure or the info may be outdated, tell me clearly \"I cannot guarantee accuracy\";\n3. Give me 1–2 directions for authoritative sources I can check myself (e.g., a textbook chapter, an official site);\n4. Do not fabricate references.\n```\n> Red line: for any factual information, verify before use; never cite an unchecked AI reference.\n\n---\n\n## Human Review Checklist (self-check)\n- [ ] I marked the factual info AI gave me as \"to be checked.\"\n- [ ] I cross-checked with at least 1 authoritative source.\n- [ ] I did not cite any reference I hadn't verified myself.\n- [ ] I can give 1 example of an AI hallucination.\n\n---\n\n## Common Mistakes\n1. **Accepting everything**: putting AI's \"facts\" straight into homework / exams.\n2. **Citing fake references**: using book titles/papers AI made up — academic misconduct.\n3. **No cross-check**: relying only on AI's single voice.\n4. **Confusing fact and opinion**: treating AI's subjective judgment as objective truth.\n\n---\n\n## Homework\n1. Complete a \"Fact-Checking Practice\": 3 AI facts + your verification result + source + whether wrong.\n2. Write 1 sentence: which type of information did you find AI m
