const MD = (function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(md){
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    let h='', i=0, inCode=false, code='';
    const flushCode=()=>{ if(inCode){ h+='<pre><code>'+esc(code)+'</code></pre>'; code=''; inCode=false; } };
    while(i<lines.length){
      let l=lines[i];
      if(l.trim().startsWith('```')){ if(inCode){flushCode();} else {flushCode(); inCode=true;} i++; continue; }
      if(inCode){ code+=l+'\n'; i++; continue; }
      let m;
      if(m=l.match(/^(#{1,6})\s+(.*)$/)){ const n=m[1].length; h+='<h'+n+'>'+inline(m[2])+'</h'+n+'>'; i++; continue; }
      if(l.match(/^(-{3,}|\*{3,})$/)){ h+='<hr>'; i++; continue; }
      if(l.match(/^>\s?/)){ let q=''; while(i<lines.length && lines[i].match(/^>\s?/)){ q+=lines[i].replace(/^>\s?/,'')+'<br>'; i++; } h+='<blockquote>'+inline(q)+'</blockquote>'; continue; }
      if(m=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/)){
        const ord = /\d+\./.test(m[2]); let items='';
        while(i<lines.length && lines[i].match(/^(\s*)([-*+]|\d+\.)\s+/)){
          const mm=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          items+='<li>'+inline(mm[3])+'</li>'; i++;
        }
        h+= (ord?'<ol>':'<ul>')+items+(ord?'</ol>':'</ul>'); continue;
      }
      if(l.trim()===''){ i++; continue; }
      h+='<p>'+inline(l)+'</p>'; i++;
    }
    flushCode();
    return h;
  }
  return {render:render};
})();

const DATA = {"00-课程总览.md": "# 《AI 工作提效实战营》课程总览\n\n> 面向普通职场人的 AI 落地课，不教代码、不堆概念，只解决一件事：**让你今天就能把 AI 用进每天的工作里**。\n\n---\n\n## 一、课程定位\n\n本营是「AI 技能升级课程体系」中面向社会普通从业者的生产线条，对象包括：行政文职、销售、客服、运营、人事、财务、个体户、小团队管理者。\n\n我们默认你**不具备任何编程能力**。你不需要理解模型参数、API 或训练原理。你只需要会用微信、会用电脑、能把一句话说清楚，就能学会。\n\n课程的核心主张只有一句话：\n\n> **人判断，AI 辅助。AI 是帮你省时间的副驾，方向盘和刹车永远在你手里。**\n\n---\n\n## 二、目标用户与典型痛点\n\n| 人群 | 每天最累的事 | AI 能立刻帮上的 |\n|---|---|---|\n| 行政文职 | 写通知、排表、整理会议纪要 | 起草+排版+摘要 |\n| 销售 | 找话术、跟进客户、写方案 | 话术生成+异议应对+跟进提醒 |\n| 客服 | 重复答疑、处理投诉 | 标准回复+情绪安抚+案例沉淀 |\n| 运营 | 选题、写文案、剪脚本 | 选题库+多版文案+脚本框架 |\n| 人事 | 写 JD、筛简历、出面试题 | JD 模板+面试题+复盘框架 |\n| 财务 | 对账、做表、写说明 | 数据总结+异常发现+经营话术 |\n| 个体户 | 一个人干全公司的活 | 全场景小助手 |\n| 小团队管理者 | 复盘、沟通、决策 | 会议纪要+复盘+决策清单 |\n\n**八个高频痛点**（课程全程围绕解决它们）：\n1. 同样的话反复写，累。\n2. 周报月报不知道写啥。\n3. 开会两小时，记不住、落不了地。\n4. 客户拒绝不会接，话术靠灵感。\n5. 要做内容，半天憋不出标题。\n6. 一堆表格，看不出所以然。\n7. 招人没标准，复盘靠拍脑袋。\n8. 学了很多 AI，回到岗位还是不会用。\n\n---\n\n## 三、学习目标（学完你能带走什么）\n\n- **知识**：搞懂 AI 能做什么、不能做什么、什么时候会\"胡说\"。\n- **能力**：掌握一套**标准 Prompt 结构**，面对任何工作任务都能自己写出可用的指令。\n- **作品**：8 节课产出 8 份可直接用的岗位素材（场景清单、周报模板、会议纪要、销售话术、选题库、数据看板话术、招聘包、个人 AI 工作助手说明书）+ 6 个岗位工具包。\n\n---\n\n## 四、学习路径（8 节课 + 2 个总表）\n\n```\n第1课  AI 工具入门        → 我的 10 个高频工作场景（找场景）\n第2课  写作和文档        → 通知 / 周报 / 方案模板（会写）\n第3课  会议和沟通        → 会议纪要 + 跟进清单（会说、会记）\n第4课  销售和客服        → 话术 / 异议处理 / 客户跟进（会卖、会服务）\n第5课  内容运营          → 选题 / 文案 / 短视频脚本（会涨）\n第6课  表格和数据        → 数据总结 + 经营分析（会看数）\n第7课  管理和招聘        → 招聘 JD / 面试题 / 团队复盘（会管人）\n第8课  私人工作流        → 个人 AI 工作助手说明书（固化成习惯）\n─────────────────────────────────────────\n09  六岗位工具包（行政/销售/客服/运营/人事/个体户）\n10  Prompt 模板库（所有模板汇总，可直接复制）\n11  人工检查清单总表（每步都留\"人把关\"的钩子）\n```\n\n---\n\n## 五、贯穿全课程的\"红线\"（务必牢记）\n\n1. **AI 会犯错，不能全信。** 它有时会编造数据、人名、法规、引用。凡是涉及金额、合同、时间、法律、医疗，必须人工核对。\n2. **不传机密。** 不得把公司机密、客户隐私、未公开数据、身份证/手机号/合同正文上传到任何 AI 工具。可用\"脱敏\"后的信息代替（如\"某客户\"\"12 月数据\"）。\n3. **人判断，AI 辅助。** AI 给的是草稿和建议，最终决策、对外口径、责任由你承担。\n4. **保护商业信息。** 竞品策略、定价、客户名单、内部架构属于敏感信息，不要喂给公开 AI。\n5. **保留可追溯。** 重要产出保留\"AI 初稿 + 你的修改\"两版，方便复盘和责任界定。\n\n---\n\n## 六、本体系标准 Prompt 结构（每节课都会用到）\n\n> 这是全课程的统一\"填空模板\"。不会写 Prompt，就照这个填。\n\n```\n你现在扮演：[角色]\n我的背景是：[背景]\n我要完成的任务是：[任务]\n目标用户/读者是：[读者]\n已有材料如下：[材料]\n请你输出：[输出]\n输出格式：[格式]\n限制条件：[限制]\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n（职场人版加：请输出可直接用于工作场景的版本，并附检查清单）\n```\n\n**怎么用**：把方括号里换成你的真实情况，整段复制给 AI 即可。第 1 课会带你练熟。\n\n---\n\n## 七、交付物清单（学完你将拥有）\n\n| 编号 | 文件 | 用途 |\n|---|---|---|\n| 00 | 课程总览 | 路线与红线 |\n| 01–08 | 八节课 | 逐步产出岗位素材 |\n| 09 | 六岗位工具包 | 行政/销售/客服/运营/人事/个体户，每岗≥10 场景 |\n| 10 | Prompt 模板库 | 所有模板汇总，随时复制 |\n| 11 | 人工检查清单总表 | 每步\"人把关\"钩子 |\n| 12 | 用 Codex 写代码做工具（补充） | 不会写代码也能让 AI 造小应用，据《Codex 橙皮书》本地化重组 |\n| 13 | 国产 Agent 平替 WorkBuddy（补充） | 用不上海外工具时的平替，微信远程控制，据苏乐原帖重组 |\n\n---\n\n## 八、给学员的一句话\n\n不用怕学不会，这套课的设计就是\"抄作业也能用\"——每节课给你能直接复制的模板和能直接交的作业。你只要**做一遍、改一遍、用一遍**，AI 就会变成你工位上最勤快的那个\"新同事\"。\n", "01-AI工具入门.md": "# 第 1 课  AI 工具入门 → 我的 10 个高频工作场景\n\n## 一、教学目标\n\n- **知识**：知道 AI 是什么、能干什么、不能干什么；分清\"对话式 AI\"和\"办公套件里的 AI 助手\"；理解\"幻觉\"这个概念。\n- **能力**：用本体系标准 Prompt 结构，把一件本职工作拆成\"可让 AI 帮忙的具体任务\"。\n- **作品**：产出《我的 10 个高频工作场景清单》（含场景、痛点、AI 能帮的环节）。\n\n## 二、开场问题\n\n> 你昨天一天里，有哪些事是\"重复性的、费时间的、但又不得不做\"的？\n> 比如：写一条群通知、整理一段聊天记录、把客户问题归纳成表、给领导写三行进度……\n\n请先花 2 分钟在纸上列出你脑子里跳出来的 5 件。这节课结束，你会拥有一份 10 件的清单，并且每一件都知道怎么让 AI 搭把手。\n\n## 三、核心概念\n\n### 1. 什么是\"生成式 AI\"（一句话版）\n你给它一段文字指令（叫\"提示 / Prompt\"），它还你一段文字/表格/方案。你问得越清楚，它答得越靠谱。\n\n### 2. 三类你马上能用上的 AI\n- **对话框型**（如 ChatGPT、文心一言、通义千问、Kimi、豆包等）：你打字，它回答，最适合写、改、总结、翻译、脑暴。\n- **办公内置型**：WPS/Word 的\"AI 改写\"、Excel/飞书表格的\"智能分析\"、会议纪要软件——不用换工具，在原地用。\n- **专业型**：做图、做视频、做表的专门工具，后面课程会用到。\n\n### 3. 最关键的一个词：幻觉（Hallucination）\nAI 有时会**一本正经地编造假信息**——假数据、假人名、假政策、假引用。它不是\"坏\"，是\"它不知道自己不知道\"。所以：\n> **凡是数字、人名、法规、合同条款、医疗建议，必须你亲自核对。**\n\n### 4. 一个通用心法：把\"大任务\"拆成\"小指令\"\n\"帮我写个周报\"太模糊。更好的拆法是：\n- 先让 AI 列周报结构 →\n- 你把本周做的事填进去 →\n- 让 AI 润色成正式语气 →\n- 你检查数字和口径。\n\n这就是\"人判断，AI 辅助\"的日常用法。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：行政小妹的\"每周通知地狱\"\n**场景**：每周一要在 3 个群发\"本周会议安排\"通知，格式一样但内容微调，手写 20 分钟。\n**AI 做法**：把会议清单贴给 AI，让它\"按群 A / 群 B 分别生成口吻不同的通知\"。1 分钟出 3 版，她只改时间。\n**红线提醒**：群名、参会人姓名属于内部信息，对外分享案例时要脱敏成\"某部门群\"。\n\n### 案例 2：销售的\"客户跟进忘了\"\n**场景**：手头 40 个微信客户，谁该回访了、谁上次说啥，全靠脑子。\n**AI 做法**：把聊天要点整理成表格（客户/上次沟通/下一步/建议时间），让 AI 排优先级。\n**红线提醒**：聊天记录含客户隐私，**不要用公开 AI 处理真实客户名和电话**，练习时用\"客户 A / 客户 B\"代替。\n\n### 案例 3：运营\"选题卡壳\"\n**场景**：每周要出 3 篇推文，标题想一下午。\n**AI 做法**：给 AI 你的产品卖点和目标人群，让它一次给 20 个标题 + 角度，你挑 3 个。\n\n## 五、动手任务\n\n- **背景**：你刚入职/正在岗，每天被杂事淹没。\n- **输入**：你脑子里最累的 5 件事（开场问题已列）。\n- **步骤**：\n  1. 用下面模板，让 AI 帮你把每件事拆成\"AI 能接手的子任务\"。\n  2. 补到 10 件，标注每件\"AI 负责 / 你负责\"。\n  3. 选出 3 件\"本周就试\"的高频场景。\n- **预期输出**：一份《我的 10 个高频工作场景清单》表格。\n\n### 本课 Prompt 模板（标准结构）\n\n```\n你现在扮演：一位擅长把重复性工作拆给 AI 的效率教练\n我的背景是：我是[你的岗位]，每天有大量重复性的文书/沟通/整理工作，不懂代码\n我要完成的任务是：把我列出的工作事项，逐条拆成\"AI 能帮忙的具体子任务\"和\"必须由我亲自做的人工判断\"\n目标用户/读者是：我自己（用于日常提效）\n已有材料如下：[贴入你开场问题写下的 5 件事]\n请你输出：一张表，列：序号 / 工作事项 / AI 能接手的环节 / 我必须亲自把关的环节 / 建议用的 AI 指令一句话\n输出格式：Markdown 表格\n限制条件：不出现任何真实姓名、客户名、电话等隐私；只谈方法不谈代码\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] 清单里的 10 件事确实来自我真实工作，不是瞎编。\n- [ ] 每件都标了\"AI 负责 / 我负责\"，没有把决策权全交给 AI。\n- [ ] 没有出现真实客户名、电话、合同、工资等敏感信息。\n- [ ] 我挑出了\"本周就试\"的 3 件，有了具体动作。\n- [ ] 我理解了\"幻觉\"：知道哪些产出必须人工核对。\n\n## 七、常见错误\n\n1. **把 AI 当搜索引擎**：问\"帮我查一下 2024 年最新税法\"——AI 可能编。应改为\"根据一般纳税人常见情况，帮我列一份自查清单，并标注'以税务机关最新文件为准'\"。\n2. **指令太笼统**：\"帮我写个方案\"——产出空泛。要填背景、读者、格式。\n3. **直接粘贴机密**：把含客户名单的 Excel 丢进公开 AI。红线！\n4. **照搬不核对**：AI 给的数据直接发领导。务必复核。\n5. **期待一步到位**：复杂任务要\"拆 + 迭代\"，别一次要完美答案。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：《我的 10 个高频工作场景清单》一份（Markdown 或表格截图均可），含：\n- 10 个真实场景\n- 每场景\"AI 负责 / 我负责\"两栏\n- 标注 3 个\"本周就试\"场景\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 10 个场景齐全、结构完整 |\n| 质量 | 25 | 场景真实具体，拆分合理 |\n| 独立思考 | 25 | 不是抄案例，结合自身岗位 |\n| 实用性 | 25 | 3 个\"本周就试\"场景可立刻执行 |\n\n---\n\n> **红线回顾**：本课所有练习均不可出现真实机密/隐私；AI 产出仅供参考，最终由你判断。\n", "02-写作和文档.md": "# 第 2 课  写作和文档 → 通知 / 周报 / 方案模板\n\n## 一、教学目标\n\n- **知识**：掌握\"角色 + 背景 + 读者 + 格式 + 限制\"的写法；理解\"先搭骨架再填肉\"比\"一口气写完\"更稳。\n- **能力**：用 AI 生成三类高频文档（通知、周报、方案）的初稿，并会按岗位语气改写。\n- **作品**：一套可直接复用的《通知 / 周报 / 方案》三件套模板。\n\n## 二、开场问题\n\n> 上一次你写周报， staring at 空白文档超过 10 分钟吗？\n> 你发出去的通知，有没有被人回\"没看懂 / 漏了时间\"？\n\n写作难的不是\"不会写\"，是\"不知道从哪下笔、写多正式、写多长\"。本课给你三个\"填空模板\"。\n\n## 三、核心概念\n\n### 1. 好 Prompt 写文档的五个零件\n参考 Prompt-Engineering-Guide 的\"Prompt Elements\"：指令、上下文、输入数据、输出指示、示例。落到职场人身上就是：\n- **角色**：让 AI 像\"资深行政/销售主管\"一样写。\n- **背景**：你的公司/事由/时间点。\n- **读者**：写给谁看（决定语气）。\n- **格式**：几段、几点、表格还是 bullet。\n- **限制**：字数、不能编造、必须包含某信息。\n\n### 2. 零样本 vs 给样例（Few-shot）\n- **零样本**：直接说要求，适合通用文书。\n- **给样例**：你贴一段\"以前写得好的周报\"，让 AI 模仿你的风格——这叫 few-shot，效果更贴你口味。\n\n### 3. 迭代优化\n第一版不满意？别重写，直接说：\"语气再正式点\"\"删掉第 2 点\"\"加一句风险提示\"。AI 改比人快。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：临时停水通知\n**输入**：\"明天 9-11 点维修停水，提醒大家接水。\"\n**AI 初稿**：分\"事由 / 时间 / 建议 / 联系人\"四段，加 emoji 标题。\n**人工核对**：确认时间、楼栋号无误后发出。\n\n### 案例 2：周报从\"流水账\"到\"有重点\"\n**痛点**：写一堆\"做了啥\"，领导嫌没重点。\n**AI 做法**：把本周事项贴给 AI，要求\"按 成果 / 进行中 / 风险与求助 三部分重写，每条一句话\"。\n**红线**：周报含未公开业绩，只对内用，别外发。\n\n### 案例 3：给客户的合作方案框架\n**输入**：产品卖点 + 客户行业。\n**AI 输出**：背景 / 痛点 / 我们的方案 / 预期收益 / 下一步，五段式。\n**人工把关**：收益数字必须你填真实数据，AI 不许编。\n\n## 五、动手任务\n\n- **背景**：你是[岗位]，本周要发 1 条通知 + 写 1 份周报 + 准备 1 份小方案。\n- **输入**：真实或模拟的工作材料（请脱敏）。\n- **步骤**：\n  1. 用下面 3 个模板分别生成初稿。\n  2. 各做 1 次迭代修改（语气/删减/补充）。\n  3. 人工核对关键事实。\n- **预期输出**：通知、周报、方案各 1 份成品。\n\n### 本课 Prompt 模板（标准结构，三选一复制）\n\n**通知模板**\n```\n你现在扮演：一位表达清晰、语气得体的行政同事\n我的背景是：[公司/部门]将于[时间]进行[事项]，需要通知相关同事\n我要完成的任务是：写一则内部通知\n目标用户/读者是：[哪些人]（如：全体住客 / 项目群成员）\n已有材料如下：[停水/会议/放假等关键信息]\n请你输出：一则通知，包含 事由 / 时间地点 / 需要对方做什么 / 联系人\n输出格式：分段清晰，标题加粗，不超过 200 字\n限制条件：不编造时间地点；语气[正式/亲切]；不出现真实姓名电话\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**周报模板**\n```\n你现在扮演：我的周报搭档\n我的背景是：我是[岗位]，本周工作如下[贴事项]\n我要完成的任务是：把流水账整理成有重点的周报\n目标用户/读者是：我的直属领导\n已有材料如下：[本周做的事，脱敏]\n请你输出：周报，分 本周成果 / 进行中 / 风险与需协调 三部分，每点一句话\n输出格式：Markdown，每部分 3 条左右\n限制条件：不夸大、不编造数据；未公开业绩仅对内\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**方案模板**\n```\n你现在扮演：一位有 10 年经验的[行业]方案顾问\n我的背景是：我们提供[产品/服务]，目标客户是[客户类型]\n我要完成的任务是：写一份给客户的初步合作方案框架\n目标用户/读者是：潜在客户决策人\n已有材料如下：[我们的卖点]、[客户痛点]\n请你输出：方案，含 背景与痛点 / 我们的方案 / 预期收益 / 合作步骤 / 下一步\n输出格式：五段式，每段小标题\n限制条件：收益数字用[待填]占位，绝不编造；不出现竞品机密\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] 通知的时间、地点、联系人我已核实。\n- [ ] 周报数据真实，未夸大，未外泄未公开业绩。\n- [ ] 方案里的收益/报价是\"待填\"占位，没有 AI 编造的数字。\n- [ ] 语气符合读者（对领导 vs 对群友不同）。\n- [ ] 三份都做了至少一次迭代修改，不是直接复制初稿。\n\n## 七、常见错误\n\n1. **读者不分**：用\"群聊语气\"写周报给领导。\n2. **让 AI 编数字**：方案收益直接编个\"提升 30%\"。必须你自己给数。\n3. **一次要太长**：让 AI 写 2000 字方案，结果空。先框架后填充。\n4. **不迭代**：初稿不顺眼就放弃。说一句\"再简练点\"往往就通了。\n5. **忘脱敏**：把真实客户名写进练习 Prompt 发到公开 AI。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：《通知+周报+方案》三件套各 1 份（可模拟数据，但结构完整、语气正确、关键事实有标注）。\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 三件套齐全 |\n| 质量 | 25 | 结构清晰、语气贴合读者 |\n| 独立思考 | 25 | 依据自身岗位调整，非照搬 |\n| 实用性 | 25 | 模板可下周直接复用 |\n\n---\n\n> **红线回顾**：数字、报价、业绩由你提供，AI 只搭框架；机密数据不外传。\n", "03-会议和沟通.md": "# 第 3 课  会议和沟通 → 会议纪要 + 跟进清单\n\n## 一、教学目标\n\n- **知识**：理解\"会议纪要\"的本质不是\"记下来\"，而是\"把发生的事变成要做的事\"；掌握\"信息抽取 / 文本摘要 / 语气改写\"三种 AI 能力分别对应开会前、中、后的哪个环节；知道为什么\"责任人 + 截止时间\"是纪要里最不能省的两栏。\n- **能力**：把一段杂乱的会议录音文字、聊天记录或对方邮件，整理成结构清晰、可直接转发的纪要或回复；会用\"给样例（Few-shot）\"让 AI 模仿你公司既有的纪要风格。\n- **作品**：一份《标准会议纪要模板》+ 一份《跨部门的清晰沟通回复》，本周开会就能用。\n\n> 本课方法参考 Prompt-Engineering-Guide 的「Text Summarization（文本摘要）」「Information Extraction（信息抽取）」「Prompt Elements（指令 / 上下文 / 输入 / 输出指示 / 示例）」等真实框架——我们把它翻译成职场人能直接用的动作。\n\n## 二、开场问题\n\n> 上周的会，你记下了几条？散会后，有几件事真的有人跟进、按时完成？\n> 有没有过这种经历：对方发来一段 300 字、没分段、重点藏在第三行的微信/邮件，你看了两遍还是不知道\"他到底要我干什么\"？\n\n大多数职场人不是\"不会开会\"，是\"开完会就丢了\"——记不全、理不清、传不准。这一课，AI 帮你做三件事：**会前想清楚要谈什么、会中/会后把话变成清单、对外沟通把含糊变成清楚**。\n\n## 三、核心概念\n\n### 1. 会议纪要 = 信息抽取（Information Extraction）\n开会最值钱的产出不是\"谁说了啥\"，而是\"谁、在什么时候前、要交什么\"。这正好是 AI 擅长的\"信息抽取\"：你给它一段原文，它帮你在里面找出\"决策 / 待办 / 责任人 / 截止时间 / 风险\"这几类要素，列成表。你再加一道人工核对——人名对不对、时间有没有写错。\n\n### 2. 三种会议，三种 AI 用法\n- **有录音/转写文字的会**（最常见）：把转写文字贴给 AI，让它输出\"决议 + 行动项表\"。\n- **只有零散聊天的会**（微信群、钉钉）：把聊天记录贴给 AI，让它归纳\"达成的共识\"和\"待办\"。\n- **纯脑内准备**：会前让 AI 帮你列\"本次会议要确认的 5 个问题\"，你带着清单去开，效率翻倍。\n\n### 3. 结构化纪要的\"黄金五栏\"\n一份能落地的纪要至少要有五栏：**事项 / 负责人 / 截止时间 / 当前状态 / 风险或需协调**。其中\"负责人\"和\"截止时间\"最不能省——没有这两栏的纪要，等于没开。\n\n### 4. 对外沟通 = 语气改写（Tone Rewriting）\n把对方含糊的话、你心里想说但怕得罪人的话，交给 AI 改写成\"清楚、得体、不背锅\"的版本。这是\"指令 + 读者\"的组合拳：你告诉 AI 读者是谁、想要什么语气，它就能拆掉你话里的刺。\n\n### 5. 给样例（Few-shot）模仿你的风格\n每个公司纪要风格不同。把一份你上司满意的旧纪要做样例贴给 AI，说\"按这个风格写\"，产出会贴你口味得多。这叫 few-shot（给样例提示），比从零描述风格更准。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：周会纪要从\"流水账\"到\"行动表\"\n**原始材料**（转写文字节选）：\"上周那个客户跟进还没弄完，小王说这周搞，然后那个海报也迟迟没出，设计那边说要等素材，还有下个月预算得提前报……\"\n**AI 做法**：贴入文字，要求\"抽取行动项，按 事项/负责人/截止/状态 四栏输出\"。\n**输出样例**：\n| 事项 | 负责人 | 截止 | 状态 |\n|---|---|---|---|\n| 客户跟进收尾 | 小王 | 本周五 | 进行中 |\n| 海报出图 | 设计（待素材） | 本周三 | 阻塞：等素材 |\n| 下月预算上报 | 我 | 本月25日 | 待启动 |\n**人工核对**：确认\"小王\"\"设计\"是正确人名/角色，截止时间与你记忆一致后再发群。\n\n### 案例 2：把含糊的对方邮件改写成清晰回复\n**对方原话**：\"那个事儿你们看怎么弄吧，反正尽快，对了之前说的费用也不太对。\"\n**AI 做法**：\"帮我把这封回复改写成专业、不含糊、能推动对方的版本，并列出我需要向对方确认的 2 个问题。\"\n**输出样例**：\"关于项目推进，我们建议本周三前确认方案 A/B 二选一；另需您确认两点：（1）费用差异具体指哪一笔？（2）'尽快'是否指本周内？确认后我们立即启动。\"\n**人工把关**：费用金额、方案名称必须你填真实信息，AI 不编数字。\n\n### 案例 3：向上汇报\"领导 3 分钟能看懂\"\n**痛点**：你手上 8 件事，领导只想知道\"进度到哪、有没有卡点、要我干什么\"。\n**AI 做法**：把杂乱进展贴入，要求\"重写为'结论先行 + 3 个要点 + 1 个求助'，每点一句话\"。\n**红线**：含未公开业绩/人事变动，只对内，不外发。\n\n## 五、动手任务\n\n- **背景**：你是[岗位]，本周至少有 1 次会 / 1 次跨部门的文字沟通。\n- **输入**：一段会议转写文字或一段对方发来的含糊消息（请脱敏，用\"某客户/小王\"代替真名）。\n- **步骤**：\n  1. 用下面\"纪要模板\"生成一份结构化行动表。\n  2. 用\"沟通回复模板\"把一段含糊消息改写成清晰回复。\n  3. 各做 1 次迭代：\"语气再正式点\"\"把截止时间加粗\"。\n  4. 人工核对人名、时间、金额。\n- **预期输出**：纪要 1 份 + 沟通回复 1 份。\n\n### 本课 Prompt 模板（标准结构）\n\n**会议纪要模板**\n```\n你现在扮演：一位资深行政/项目助理，擅长把会议录音整理成可落地的行动清单\n我的背景是：我是[岗位]，刚开完[周会/项目会/跨部门会]，手上有转写文字但不想自己逐条整理\n我要完成的任务是：把会议内容整理成结构化工件\n目标用户/读者是：[参会同事 / 我的领导]\n已有材料如下：[粘贴转写文字或聊天记录，已脱敏]\n请你输出：① 一句话会议结论；② 行动项表，列 事项/负责人/截止时间/状态/风险；③ 需升级给领导决策的事项\n输出格式：Markdown，先结论后表格\n限制条件：不编造人名与时间；人名用[待确认]占位若原文不清；不出现真实客户名电话\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**沟通回复模板**\n```\n你现在扮演：一位沟通得体、推动事情解决的职场同事\n我的背景是：对方发来一段含糊的消息[粘贴]，我需要回复但不想显得含糊或推诿\n我要完成的任务是：把我的回复改写成清楚、专业、能推动对方给明确信息的版本\n目标用户/读者是：[对方角色，如客户/合作方/上级]\n已有材料如下：[对方原话] + [我想达成的结果]\n请你输出：① 改写后的回复全文；② 我需要向对方确认的 2-3 个关键问题清单\n输出格式：回复正文 + 问题清单两段\n限制条件：不编造费用/时间等事实；语气[专业/亲切]；不暴露内部机密\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] 纪要里每个\"负责人\"都是真实存在的人/角色，没有 AI 凭空安名字。\n- [ ] 每个\"截止时间\"与我的记忆或日历一致，没有 AI 乱编日期。\n- [ ] 行动项表我真的打算发出去跟进，不是做完作业就丢。\n- [ ] 沟通回复里的费用、方案名、时间点是我填的真实信息。\n- [ ] 含未公开信息的纪要只对内发，没有误发外部群。\n\n## 七、常见错误\n\n1. **把 AI 当录音笔**：以为贴进去就全自动。AI 做的是\"整理\"，原始转写可能漏字，关键结论你要补。\n2. **漏了负责人/时间**：纪要只有\"要做 X\"，没人认领、没 deadline，等于没写。\n3. **照搬不改语气**：AI 给的回复太生硬/太软，不贴合你和对方的关系，发出去反而尴尬。\n4. **忘记脱敏**：把含客户真名的聊天记录丢进公开 AI 做纪要。\n5. **不迭代**：第一版格式不顺眼就重来；其实说一句\"加一列风险栏\"比重写快十倍。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：① 一份真实或模拟会议的《结构化纪要》（含结论 + 行动表 + 升级事项）；② 一段《跨部门清晰回复》（针对一段含糊消息）。可用模拟数据，但结构完整、关键事实有\"[待确认]\"标注。\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 纪要 + 回复两份齐全，结构完整 |\n| 质量 | 25 | 五栏齐全、结论先行、语气得体 |\n| 独立思考 | 25 | 结合自身岗位调整，非照搬案例 |\n| 实用性 | 25 | 模板本周开会能直接复用 |\n\n---\n\n> **红线回顾**：人名、时间、金额由你核对；客户/内部机密不进公开 AI；AI 给的是草稿，发出去前你过一遍。\n", "04-销售和客服.md": "# 第 4 课  销售和客服 → 话术 / 异议处理 / 客户跟进\n\n## 一、教学目标\n\n- **知识**：理解\"话术\"不是死背的，而是\"场景 + 对象\"现场生成的；掌握\"给样例（Few-shot）\"让 AI 学你赢单的话术风格；理解\"异议处理\"可以用\"一步步思考（Chain-of-Thought）\"拆成共情→澄清→举证→推进四步；知道为什么 AI 绝不能替你承诺价格、交付或政策。\n- **能力**：针对任意销售场景生成破冰/跟进/逼单话术；面对\"太贵了/再想想/竞品更便宜\"等常见异议产出得体应对；把产品 FAQ/制度文档交给 AI，让它基于\"你的资料\"答客户问题（检索增强 RAG 思路），而不是凭空编。\n- **作品**：一套《销售话术库》（含破冰、跟进、3 类异议）+ 一份《客服标准回复 + 投诉安抚模板》。\n\n> 本课方法参考 Prompt-Engineering-Guide 的「Few-shot」「Chain-of-Thought」「Classification（分类）」「RAG（检索增强）」「Responsible AI（负责任 AI）」等真实框架，以及 LLM Universe 中\"把资料变成可问答知识库\"的 RAG 思想。\n\n## 二、开场问题\n\n> 客户说\"太贵了\"，你下一句通常说什么？是卡壳、还是每次都不一样靠灵感？\n> 客户问一个你答过 100 遍的问题（\"能开发票吗\"\"多久发货\"），你还要手打第 101 遍吗？\n> 40 个微信客户，谁该回访了、谁上次说\"考虑一下\"，你脑子还装得下吗？\n\n销售和客服是\"话术密集 + 重复密集\"的岗位。AI 不是替你卖，是替你把\"灵感型话术\"变成\"随时可调用的弹药库\"，把\"重复答疑\"变成\"一次沉淀、次次复用\"。\n\n## 三、核心概念\n\n### 1. 话术 = 场景 × 对象，现场生成\n好话术没有标准答案，只有\"对的人 + 对的事 + 对的语气\"。你给 AI 三样东西——**客户类型、沟通阶段、你想要的氛围**——它就能生成好几版给你挑。这比背话术灵活，比临场编稳。\n\n### 2. 给样例（Few-shot）：让 AI 学你的\"赢单味\"\n把你过去一段真实赢单的聊天记录（脱敏）贴给 AI，说\"按这个语气和逻辑，写一段新的破冰话术\"。AI 会模仿你的节奏，而不是给你一套陌生的大众模板。这是 few-shot 的核心价值：**用你的好例子，教 AI 你的好**。\n\n### 3. 异议处理 = 一步步思考（Chain-of-Thought）\n客户说\"太贵了\"，别急着甩折扣。让 AI 按四步推：**① 共情（我理解预算要算）② 澄清（您是和哪家比/在意总价还是月费）③ 举证（我们的差异价值/案例）④ 推进（先给您一个小试用/方案）**。让它\"一步步来\"，回答比一句话甩优惠更专业。\n\n### 4. 客服标准回复 = 基于你的资料（RAG 思路）\n客服最怕 AI \"编公司政策\"。正确做法：把你的《产品 FAQ》《退换货制度》贴在对话里（或上传到支持知识库的工具），让 AI\"只依据我给的资料回答，资料没有的就如实说'我帮您确认后回复'\"。这就是检索增强生成（RAG）——**让 AI 基于你的事实答，而不是凭记忆编**。\n\n### 5. 客户分层与情绪识别 = 分类（Classification）\n把客户留言贴给 AI，让它标\"意向高/中/低\"\"情绪：平静/不满/愤怒\"，你优先处理高热度。这是分类任务的日常用法。\n\n### 6. 红线：AI 不替你承诺\n价格、折扣、交付时间、保修政策——这些**只能你给**，AI 不许编。话术里涉及具体承诺，一律用\"[待我确认]\"占位。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：首轮破冰话术（脱敏）\n**背景**：加了新的潜在客户微信，要开场不尬。\n**AI 输出**（节选）：\"王总好，我是做[行业]的[小名]，看到贵司在做[某业务]，我们刚帮一家类似企业把[痛点]缩短了 30%。方便的话，我发一份 1 页的案例给您参考？\"\n**人工把关**：30% 是你真实案例数据，别让 AI 编；称呼用真实姓。\n\n### 案例 2：\"太贵了\"异议处理\n**AI 四步**：①\"完全理解，预算肯定要算清楚\"②\"想确认下，您是和哪家的方案比？更看重总价还是长期使用成本？\"③\"我们的差异在[三点]，XX 客户用后[真实结果]\"④\"要不先给您开个[试用/小单]，您实际感受下再决定？\"\n**红线**：第③步的\"真实结果\"必须你填，AI 不编。\n\n### 案例 3：客服投诉安抚\n**背景**：客户因发货慢发飙。\n**AI 输出**：① 先认情绪\"让您久等确实抱歉\"② 给事实\"您的单目前在第 X 步，预计 Y 发出\"③ 给补偿方案\"[待我填]④ 留跟进\"发出后我第一时间通知您\"。\n**关键**：事实与补偿都必须你填真实信息。\n\n## 五、动手任务\n\n- **背景**：你是[销售/客服]，手上有真实或模拟的客户沟通场景。\n- **输入**：1 段你过去的话术（脱敏）或 1 个真实异议、1 条客户常见问题。\n- **步骤**：\n  1. 用\"话术生成模板\"产出破冰 + 跟进各 1 版（用你的样例做 few-shot）。\n  2. 用\"异议处理模板\"处理\"太贵了\"\"再想想\"两类。\n  3. 用\"客服回复模板\"基于你贴的 FAQ 回答 1 个客户问题。\n  4. 人工核对所有价格/政策/数据为\"[待我填]\"或真实值。\n- **预期输出**：话术库 1 份 + 异议应对 2 条 + 客服回复 1 条。\n\n### 本课 Prompt 模板（标准结构）\n\n**话术生成模板**\n```\n你现在扮演：一位有 5 年经验的[行业]销售，说话接地气、不油腻\n我的背景是：我是[岗位]，要触达[客户类型]，当前处于[破冰/跟进/逼单]阶段\n我要完成的任务是：写一段微信/电话开场话术\n目标用户/读者是：[客户角色与痛点]\n已有材料如下：[我的产品卖点] + [一段我过去的赢单话术（脱敏）作样例]\n请你输出：2 个版本的话术，分别偏[专业]和[亲切]，每段不超过 80 字\n输出格式：两个版本并列，标注适用时机\n限制条件：不编造客户案例数据；价格政策用[待我填]；不出现真实客户名\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**异议处理模板**\n```\n你现在扮演：一位擅长化解客户顾虑的销售顾问\n我的背景是：客户说\"[太贵了/再想想/竞品更便宜]\"，我不想直接降价\n我要完成的任务是：按 共情→澄清→举证→推进 四步，给出应对话术\n目标用户/读者是：该客户\n已有材料如下：[我们的差异化价值] + [一个真实客户结果，脱敏]\n请你输出：四步话术，每步一句话；最后给 1 个不降价的替代方案（如试用）\n输出格式：四步编号 + 替代方案\n限制条件：举证部分的数据必须我用[真实数据]填，AI 不编；不承诺我无权给的折扣\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**客服回复模板（基于资料 / RAG 思路）**\n```\n你现在扮演：一位耐心、专业的客服\n我的背景是：客户问\"[问题]\"，我有标准资料可参考\n我要完成的任务是：基于资料给一个准确、安抚情绪的回复\n目标用户/读者是：该客户\n已有材料如下：[粘贴你的 FAQ/制度文档相关段落]\n请你输出：① 先共情 1 句；② 依据资料的事实回答；③ 下一步动作\n输出格式：三段式，总字数控制在 120 字内\n限制条件：只依据我给的资料回答；资料没有的明确说\"帮您确认后回复\"，绝不编造政策/时间/补偿\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] 话术里的客户案例/数据是真实或明确\"[待填]\"，没有 AI 编造的百分比。\n- [ ] 异议处理第③步的\"证据\"来自我真实业务，不是 AI 编的。\n- [ ] 客服回复的事实（发货/退换/发票）与我的制度文档一致。\n- [ ] 凡涉及价格、折扣、交付承诺，都是我填的，AI 没擅自承诺。\n- [ ] 没有把真实客户名、电话、订单号喂给公开 AI。\n\n## 七、常见错误\n\n1. **让 AI 编案例**：\"提升 50%\"是 AI 拍的。案例数据必须你给。\n2. **异议一来就降价**：AI 帮你四步推进，别跳过共情澄清直接甩优惠。\n3. **客服让 AI 自由发挥政策**：没贴资料就问\"能退吗\"，AI 可能乱承诺。务必 RAG 思路——给资料、限范围。\n4. **话术太模板**：不喂自己的样例，产出像通用推销。用 few-shot 学你的味。\n5. **忘脱敏**：把客户聊天记录原样丢进公开 AI。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：《销售话术库》1 份（含破冰、跟进、2 类异议应对，结构清晰）+《客服标准回复》1 条（基于你贴的资料，含安抚+事实+下一步）。模拟数据需脱敏，关键事实标\"[待我填]\"。\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 话术库 + 客服回复齐全 |\n| 质量 | 25 | 异议四步完整、语气得体、基于资料 |\n| 独立思考 | 25 | 结合自身行业/样例，非照搬 |\n| 实用性 | 25 | 话术本周客户沟通能直接用 |\n\n---\n\n> **红线回顾**：价格、政策、交付承诺只能你给；客服回复必须基于你的真实资料；客户隐私不进公开 AI。\n", "05-内容运营.md": "# 第 5 课  内容运营 → 选题 / 文案 / 短视频脚本\n\n## 一、教学目标\n\n- **知识**：理解\"内容生产\"可以被拆成\"选题 → 标题 → 正文 → 改写分发\"四道工序，AI 在每一道都能搭手；掌握\"多角度头脑风暴\"和\"给爆款样例模仿风格（Few-shot）\"；知道为什么 AI 写的内容必须\"原创核查 + 不夸大功效\"，否则踩广告法红线。\n- **能力**：一次产出 20 个选题角度、多版标题、一版正文、一个短视频脚本框架；把一篇长文改写成朋友圈/微博/小红书三种不同语气的分发稿。\n- **作品**：一份《本周选题库（≥20 条）》+ 1 篇《多版文案》+ 1 个《短视频脚本框架》。\n\n> 本课方法参考 Prompt-Engineering-Guide 的「Creativity（创意生成）」「Few-shot（风格模仿）」「Text Summarization（缩写）」，以及\"Prompt Chaining（提示链）\"——把大任务拆成多步，前一步结果喂给下一步。\n\n## 二、开场问题\n\n> 这周要发 3 篇推文，你对着空白文档想了半天标题，最后发出去阅读量个位数？\n> 一条短视频脚本，你脑里有画面但写不出分镜，拖了一周没发？\n> 同一篇干货，公众号发了，朋友圈要不要改改再发？你通常是\"复制粘贴\"还是\"懒得发第二遍\"？\n\n内容运营的痛不是\"没东西写\"，是\"想不出来、写不快、发了没水花\"。AI 不是替你想创意，是给你**一桌子备选**，你挑最好的那个。\n\n## 三、核心概念\n\n### 1. 内容四道工序，每道都能让 AI 搭手\n- **选题**：给 AI 你的产品/赛道/目标人群，它一次给 20 个角度（情绪/干货/争议/故事/对比）。\n- **标题**：同一主题生成 10 个标题，分\"悬念型/数字型/痛点型/身份型\"，你挑。\n- **正文**：给骨架让它扩写，或给初稿让它改语气。\n- **分发改写**：同一内容改出公众号/朋友圈/短视频口播三版，省你重写。\n\n### 2. 多角度头脑风暴：别要一个，要一打\n\"给我 3 个标题\"不如\"给我 20 个，覆盖 5 种风格\"。AI 擅长批量，你擅长挑。创意活的本质是\"先广撒网，再精选\"——这正好是人机分工。\n\n### 3. 给爆款样例模仿（Few-shot）\n把你过往阅读量最高的 1 篇贴给 AI，说\"按这个开头方式和节奏，写新的 3 篇\"。AI 学的是你的\"爆款基因\"，比凭空写更贴粉丝口味。\n\n### 4. 提示链（Prompt Chaining）：长内容分步做\n做短视频脚本别一次要\"完整视频\"。先让 AI 出\"3 个选题\"→ 你选 1 个 → 让它出\"分镜脚本（画面/口播/时长）\"→ 再让它写\"标题和封面文案\"。每一步喂下一步，质量比一步到位高。\n\n### 5. 红线：原创、不夸大、不抄\nAI 可能\"拼接\"网上已有内容。发布前你要做**原创核查**：核心观点是不是你/团队的；数据有没有出处；功效描述有没有越过\"绝对化用语\"（最/第一/100% 有效）——那是广告法雷区。AI 写的不等于能直接发。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：一周选题库从 0 到 20\n**输入**：\"我们是做职场 Excel 培训的，目标用户是行政财务小白。\"\n**AI 输出**（节选）：①\"Excel 这 3 个快捷键，行政小妹当天就变快\"②\"财务月底对账，用这招省 2 小时\"③\"老板要的表，其实 1 个公式就搞定\"……共 20 条，标了\"干货/情绪/故事\"类型。\n**人工挑**：选 3 条本周做，其余进选题池。\n\n### 案例 2：同一干货三平台改写\n**原文**：一篇 800 字\"对账提速\"干货。\n**AI 分发**：公众号版（结构化长文）/ 朋友圈版（口语+emoji+提问钩子）/ 小红书版（清单体+封面标题\"财务姐妹必存\"）。\n**红线**：数据真实，不写\"提速 10 倍\"这类夸大词。\n\n### 案例 3：短视频脚本框架\n**输入**：\"讲'周报别写流水账'这个知识点，30 秒。\"\n**AI 输出**：分镜——0-5s 痛点钩子\"你周报领导不看？\"；5-20s 三招（结论先行/分块/写求助）；20-30s 引导\"评论区扣 1 领模板\"。\n**人工**：口播稿自己顺一遍，别照念像机器人。\n\n## 五、动手任务\n\n- **背景**：你是[运营/个体户]，本周要出内容。\n- **输入**：你的产品/赛道/目标人群（脱敏，别写真实公司机密打法）。\n- **步骤**：\n  1. 用\"选题模板\"产出≥20 条，标类型，挑 3 条。\n  2. 对选中的 1 条，用\"标题+正文模板\"出多版。\n  3. 用\"短视频脚本模板\"出 1 个 30-60s 分镜。\n  4. 做原创核查：数据有出处、无绝对化用语。\n- **预期输出**：选题库 + 多版文案 + 短视频脚本各 1 份。\n\n### 本课 Prompt 模板（标准结构）\n\n**选题模板**\n```\n你现在扮演：一位懂[行业]的内容运营，擅长抓用户痛点\n我的背景是：我们做[产品/服务]，目标用户是[人群]，本周要出[数量]篇内容\n我要完成的任务是：生成一批选题\n目标用户/读者是：[该人群的真实焦虑]\n已有材料如下：[我们的卖点/近期热点，脱敏]\n请你输出：≥20 个选题，每个含 标题方向 + 类型标签（干货/情绪/故事/对比/争议）\n输出格式：编号列表，类型用括号标在后面\n限制条件：不抄袭具体账号；不出现竞品机密；角度积极合规\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**标题+正文模板**\n```\n你现在扮演：一位转化率高、不说教的内容写手\n我的背景是：选题是\"[选中的选题]\"，读者是[人群]\n我要完成的任务是：写 1 篇正文 + 给它配 5 个风格不同的标题\n目标用户/读者是：[该人群]\n已有材料如下：[核心信息点，脱敏]\n请你输出：① 5 个标题（悬念/数字/痛点/身份/反差 各一）；② 正文一版，结构：钩子+3个要点+行动号召\n输出格式：标题列前，正文在后，Markdown\n限制条件：数据用[待填]或真实出处；不用\"最/第一/100%\"等绝对化用语；不编造案例\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**短视频脚本模板（提示链第 2 步）**\n```\n你现在扮演：一位短视频编导\n我的背景是：选定选题\"[选题]\"，时长[30/60]秒，平台[抖音/视频号]\n我要完成的任务是：写分镜脚本\n目标用户/读者是：[人群]\n已有材料如下：[知识点要点]\n请你输出：分镜表，列 时间/画面/口播词/字幕，最后给 1 句封面标题\n输出格式：表格 + 封面标题一行\n限制条件：口播自然不说教；不承诺夸张效果；知识点准确\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] 选题来自我的真实业务，不是抄某个具体账号。\n- [ ] 文案里的数据有真实出处或标\"[待填]\"，没有 AI 编的百分比。\n- [ ] 没有\"最/第一/100%有效\"等绝对化、夸大用语。\n- [ ] 核心观点是我们原创或已获授权，非直接搬运。\n- [ ] 短视频口播我顺读过，不像机器念稿。\n\n## 七、常见错误\n\n1. **一次要\"完整视频\"**：产出空。用提示链分步：选题→分镜→口播。\n2. **让 AI 编数据**：\"用户增长 200%\"是编的。数据你给或标出处。\n3. **照搬不核查原创**：AI 拼了网上内容，你发出去算抄袭。发布前自查。\n4. **标题党过头**：为点击写夸大标题，掉粉还违规。钩子要有、底线要守。\n5. **忘脱敏**：把未公开的活动打法写进 Prompt 发公开 AI。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：①《本周选题库》≥20 条（标类型）；② 选中 1 条的《多版文案》（5 标题 + 1 正文）；③ 1 个《短视频分镜脚本》。模拟数据需脱敏，数据标出处/[待填]。\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 选题库 + 文案 + 脚本三件齐全 |\n| 质量 | 25 | 角度多样、标题有钩子、脚本可拍 |\n| 独立思考 | 25 | 结合自己业务，非照搬案例 |\n| 实用性 | 25 | 本周内容生产能直接用 |\n\n---\n\n> **红线回顾**：数据给出处或标待填、不夸大、查原创；运营策略/未公开打法不进公开 AI。\n", "06-表格和数据.md": "# 第 6 课  表格和数据 → 数据总结 / 经营分析\n\n**适合人群**：行政、财务、店长、个体户、小团队管理者（不需要会写公式，不需要懂编程）\n**建议时长**：90 分钟（讲解 40 分钟 + 动手 50 分钟）\n\n## 一、教学目标\n\n- **知识**：理解\"看数据\"分成三层——**读数（发生了什么）→ 归因（为什么）→ 建议（那怎么办）**，AI 最擅长第一层和第三层的表达，第二层必须你来判断；掌握\"把表格粘给 AI 时要先说清每一列是什么\"（提供上下文）；理解 AI **不会算数**这件事有多重要，它是\"语言模型\"不是\"计算器\"，数字必须你自己核对。\n- **能力**：把一张月度报表变成一段领导三分钟能看懂的\"数据总结话术\"；给一堆零散经营数字设计一个\"经营分析看板\"该看哪几个指标、每个指标怎么解读；会让 AI 帮你写\"Excel 该用什么公式/怎么做透视表\"的操作步骤说明，而不是让它替你算。\n- **作品**：一份《数据总结话术》（可直接发群/汇报）+ 一份《经营分析看板说明书》（列清指标、口径、看法、预警线）。\n\n> 本课方法参考 Prompt-Engineering-Guide 的「Information Extraction（信息抽取）」「Text Summarization（摘要）」「Reasoning / Mathematics（推理与数学的局限）」「Factuality（事实性风险）」等真实框架——重点提醒：AI 算术会错，这是公认已知的弱点，所以本课把\"人核数\"设成硬红线。\n\n## 二、开场问题\n\n> 月底了，你把表做完了，领导问一句\"所以呢？\"——你是不是只能说\"嗯…数据都在表里\"？\n> 你手上有销售流水、有客户名单、有成本表，但你说不出\"这个月到底是好还是差、差在哪\"？\n> 或者相反：你心里明白业务好坏，但一写成汇报就变成一堆数字堆砌，领导看不下去？\n\n大多数人的问题不是\"没数据\"，是**数据到结论之间那段路没人帮你走**。这一课，AI 帮你做三件事：**把数字翻译成人话、把零散指标组织成看板、把结论写成能汇报的话**。而算数和归因，你来。\n\n## 三、核心概念\n\n### 1. AI 不是计算器：这是本课第一条红线\n把\"1234×0.87 等于多少\"交给 AI，它可能给你一个看起来很像但是错的数。**所有加总、百分比、环比同比，用 Excel 算，或者你自己按计算器。** AI 的价值在于：数你给它，它帮你**解释**、**组织**、**表达**。记住这个分工，你就不会出大事故。\n\n### 2. 粘表格前，先说清\"列是什么\"\n直接把一堆数字贴给 AI，它会瞎猜。正确做法是先给\"数据字典\"：\n> \"下面是我们 6 月的门店流水。A 列=日期，B 列=进店人数，C 列=成交单数，D 列=销售额（元），E 列=退货额（元）。\"\n说清口径，AI 的解读准确率立刻上一个档。这就是\"提供上下文\"。\n\n### 3. 数据总结的\"三段式话术\"\n一段能汇报的数据总结，永远是这三段：\n- **结论**：这个月整体如何（一句话，带最关键那个数）\n- **亮点与问题**：好在哪（2 条）、差在哪（2 条），每条带数字\n- **下一步**：所以我建议做什么（1-2 条具体动作）\n只有数字没有\"所以呢\"，就不叫汇报，叫交表。\n\n### 4. 经营分析看板 = 选对 5 个指标\n看板不是指标越多越好，是**越少越好但必须选对**。小生意通常盯这五类：\n- **进来多少**（客流/线索量）\n- **成了多少**（成交率）\n- **一单多少**（客单价）\n- **回头多少**（复购率/回购客户数）\n- **剩下多少**（毛利/净利）\n让 AI 帮你针对自己的生意，把这五格填成具体指标 + 口径 + 预警线。\n\n### 5. 让 AI 教你操作，而不是替你算\n\"这张表怎么按月份汇总销售额？\"——让 AI 给你**透视表的点击步骤**或**公式写法**，你在 Excel 里执行，结果是 Excel 算的，可信。这比让 AI 直接报数字安全一百倍。\n\n### 6. 异常数字要\"存疑\"不要\"编因\"\nAI 看到\"7 月销售额跌 30%\"会很自然地给你一堆理由：\"可能是季节性因素、可能是竞品促销\"——**这些全是猜的**。真正的原因只有你知道（那周店在装修、老客户那单推到 8 月了）。所以看板里要有一栏叫\"归因（人填）\"。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：门店月报从\"一堆数\"到\"三段话\"\n**原始材料**（个体户老板的手记）：\"6 月流水 18.6 万，5 月是 21.2 万。进店大概 1400 人，成交 620 单。退货 8000 多。周末比平时好很多。\"\n**AI 做法**：贴入数据 + 说明口径，要求\"输出三段式数据总结：结论 / 亮点与问题 / 下一步建议，每条带数字\"。\n**输出样例**：\n> **结论**：6 月销售额 18.6 万，环比 5 月下滑约 12%，主要拖累来自工作日客流。\n> **亮点**：成交率约 44%（620/1400），处于健康水平；周末贡献稳定。\n> **问题**：① 环比下滑 2.6 万；② 退货额 0.8 万，占流水约 4.3%，建议核查退货集中品类。\n> **下一步**：① 针对工作日做午市引流活动；② 拉退货明细，确认是否集中在某一批货。\n**人工核对**：18.6/21.2 的环比、620/1400 的成交率，我自己按计算器复核过；\"周末稳定\"这句是我的判断，不是 AI 编的。\n\n### 案例 2：给自己的小生意设计经营看板\n**输入**：\"我开一家 20 平的社区烘焙店，只有我和一个店员，现在什么都记在微信收款和一个本子上。\"\n**AI 输出**（节选）：\n| 指标 | 怎么算 | 多久看一次 | 预警线 |\n|---|---|---|---|\n| 日均客单价 | 当日流水 ÷ 当日单数 | 每天 | 低于 25 元查促销是否过度 |\n| 周复购客数 | 一周内到店≥2 次的顾客数 | 每周 | 连续两周下降则做会员回访 |\n| 报废率 | 报废成本 ÷ 当日进货成本 | 每天 | 高于 8% 就要调当日备货量 |\n**人工把关**：预警线必须我按自己的成本结构改——AI 给的 25 元、8% 只是参考起点，不是真理。\n\n### 案例 3：把老板的\"你分析一下\"变成有结构的答案\n**痛点**：老板扔来一句\"这季度数据你分析一下\"，你不知道从哪下手。\n**AI 做法**：\"我有[这些数据]，请先告诉我针对这类生意应该问哪 6 个问题，再告诉我每个问题需要哪列数据。\"\n**结果**：AI 给你一张\"分析提纲 + 所需数据清单\"，你照着去凑数、去算，思路一下就清了。\n**红线**：真实客户名单、员工工资明细不要整段贴进公开 AI，用\"客户A/员工1\"替代。\n\n## 五、动手任务\n\n- **背景**：你是[岗位/店主]，手上有一份本月或上月的真实（或模拟）经营数据。\n- **输入**：一份 10-30 行的表格数据，**必须脱敏**：客户名换成\"客户A\"，员工名换成\"店员1\"，不含身份证/手机号/银行卡。\n- **步骤**：\n  1. 先在 Excel（或手工）把该算的总和、百分比**算好**，写在旁边。\n  2. 用下面\"数据总结模板\"生成三段式总结，把你算好的数字给它，让它只负责表达。\n  3. 用\"看板设计模板\"生成属于你这门生意的 5 指标看板说明书。\n  4. 逐个核对：AI 复述的每个数字，和你算的是否一致？不一致的直接改。\n  5. 迭代一次：\"结论再短一点\"\"把建议改成我下周能执行的动作\"。\n- **预期输出**：《数据总结话术》1 份 + 《经营分析看板说明书》1 份。\n\n### 本课 Prompt 模板（标准结构）\n\n**数据总结模板**\n```\n你现在扮演：一位擅长把经营数据讲成人话的业务分析顾问\n我的背景是：我是[岗位/店主]，需要向[领导/合作人/自己]汇报[月份]经营情况，我不想只交一张表\n我要完成的任务是：把我的数据整理成一段能直接汇报的三段式总结\n目标用户/读者是：[我的领导 / 合伙人]，他只有 3 分钟，只关心结论和下一步\n已有材料如下：\n  数据口径说明：[A列=日期，B列=客流，C列=成交单数，D列=销售额…]\n  数据：[粘贴脱敏后的表格]\n  我已经算好的关键数字：[环比 -12%、成交率 44%…]\n请你输出：① 一句话结论（带最关键那个数）；② 亮点 2 条 + 问题 2 条，每条带数字；③ 下一步建议 1-2 条，要具体可执行\n输出格式：三段，标题分别为\"结论 / 亮点与问题 / 下一步\"\n限制条件：**绝对不要自己做任何加减乘除或百分比计算，只能引用我给你的数字**；数字不确定的地方写[待核]；不要凭空猜测下滑原因，原因处留\"[归因待填]\"；不出现真实客户名与员工姓名\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**经营分析看板设计模板**\n```\n你现在扮演：一位帮小生意搭建简易经营看板的顾问，务实、不堆术语\n我的背景是：我经营[生意类型/规模]，目前数据散落在[微信收款/本子/Excel]，没有固定看数习惯\n我要完成的任务是：设计一份我能长期用的经营分析看板说明书\n目标用户/读者是：我自己和[店员/合伙人]，都不懂数据分析\n已有材料如下：[我现在能拿到哪些数据、生意的基本成本结构，脱敏]\n请你输出：一张看板表格，列出 指标名称 / 怎么算（用大白话）/ 数据从哪来 / 多久看一次 / 预警线建议 / 归因栏（人填）；控制在 5-7 个指标，并说明为什么选这几个\n输出格式：Markdown 表格 + 每个指标一句\"这个数变差通常意味着什么\"\n限制条件：不要求我上任何新系统或写代码；预警线标注为\"建议起点，需我按实际成本调整\"；不编造行业标准数值，若引用请注明\"经验参考值\"\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n**Excel 操作教学模板**\n```\n你现在扮演：一位耐心的 Excel 老师，教零基础的行政财务\n我的背景是：我有一张表[描述结构]，我想做到[汇总/对比/去重/找异常]，但不会公式也不敢用透视表\n我要完成的任务是：拿到一份我照着点就能做出来的操作步骤\n目标用户/读者是：我自己，Excel 只会打字和求和\n已有材料如下：[表格列结构说明，不含真实数据]\n请你输出：① 推荐用哪种方法（公式还是透视表）及原因；② 分步操作说明，一步一行，写清点哪里；③ 做完后我该怎么验证结果对不对\n输出格式：编号步骤，每步一行短句\n限制条件：不要替我计算任何结果，只教方法；给出的公式要能直接粘贴使用并解释每一段的意思；如涉及不同 Excel 版本差异请提醒\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n请输出可直接用于工作场景的版本，并附检查清单\n```\n\n## 六、人工检查清单\n\n- [ ] **所有数字都是我用 Excel 或计算器算的**，不是 AI 报出来的；我逐个核对过 AI 复述的数字。\n- [ ] 环比、同比、百分比这三类最容易错的数，我单独复算了一遍。\n- [ ] 数据口径我写清楚了（\"销售额\"是含税还是不含税、是否扣退货），AI 没有自己假设。\n- [ ] 每个\"下滑/上涨\"的原因是我填的真实业务原因，不是 AI 猜的\"可能是季节性因素\"。\n- [ ] 表格里没有真实客户姓名、手机号、身份证号、银行账号、员工工资明细。\n- [ ] 看板的预警线我按自己的成本结构调过，不是照抄 AI 给的参考值。\n- [ ] 这份总结我真的敢发给领导——里面没有一个我解释不了的数字。\n\n## 七、常见错误\n\n1. **让 AI 算数**：最高频也最致命。AI 把 18.6÷21.2 算成 -12% 还是 -14%，你不核对就发出去，汇报现场被抓，信任全没。**数交给 Excel，话交给 AI。**\n2. **不说列的含义**：直接甩一堆数字，AI 把\"退货额\"当成\"销售额\"解读，整段结论全错。粘表格前先写数据字典。\n3. **接受 AI 编的原因**：\"下滑可能是市场竞争加剧\"——这话放哪个行业都对，等于什么都没说。归因必须你来，你才知道那周在装修。\n4. **看板指标堆到 20 个**：指标一多，你就一个都不看了。5-7 个，每个都有预警线和动作，才会真的被用起来。\n5. **把敏感数据整段粘进公开 AI**：客户名单、员工薪资、未公开的营收数字，属于商业机密。脱敏或改用公司内部合规工具。\n\n## 八、课后作业（明确提交物）\n\n**提交物**：\n1. 一份《数据总结话术》：三段式（结论/亮点与问题/下一步），每条带数字，文末附一行\"本报告数字由我本人用 Excel 核算并复核\"。\n2. 一份《经营分析看板说明书》：5-7 个指标，含算法、数据来源、频率、预警线、归因栏。\n3. 一段 100 字的《我的核数记录》：写清你复算了哪几个数、有没有发现 AI 复述出错的地方。\n\n可用模拟数据，但必须脱敏，且结构完整、关键事实用\"[待核]\"标注。\n\n## 九、评分标准\n\n| 维度 | 满分 | 说明 |\n|---|---|---|\n| 完成度 | 25 | 数据总结 + 看板说明书 + 核数记录三件齐全 |\n| 质量 | 25 | 三段式结构清晰、指标选得对、预警线合理、口径写明 |\n| 独立思考 | 25 | 归因是自己的业务判断，看板贴合自身生意，非照搬案例 |\n| 实用性 | 25 | 看板下个月真的能用、总结话术能直接发给领导 |\n\n---\n\n> **红线回顾**：**AI 不算数，数字一律人核**；数据口径先说清；下滑原因人来填，不许 AI 猜；客户名单、员工薪资、未公开营收不进公开 AI。记住这门课唯一的口号——**人判断，AI 辅助；数归 Excel，话归 AI。**\n", "07-管理和招聘.md": "# 第 7 课  管理和招聘 → 招聘 JD / 面试题 / 团队复盘\n\n## 一、教学目标\n\n- **知识**：理解\"招人\"和\"带人\"的文档工作可以被 AI 大幅压缩；掌握\"给要点→AI 扩写\"的 JD 写法；会用 AI 基于岗位画像生成结构化面试题；能把一次复盘会变成\"问题—原因—动作\"的清单。\n- **能力**：30 分钟产出一份专业 JD；针对一个岗位生成 8–10 道分层面试题；把团队复盘录音/纪要整理成可追踪的改进表。\n- **作品**：一份《岗位招聘包》（JD+面试题+评分维度）+ 一份《团队复盘改进表》。\n\n> 本课方法参考 LLM Universe 中\"用模板化提示生成结构化文档\"、Prompt-Engineering-Guide 的\"角色扮演 + 明确输出结构\"技巧。\n\n## 二、开场问题\n\n> 要招一个人，JD 写半天还是像抄的？\n> 面试问来问去就那几句，下来不知道怎么比？\n> 复盘会开了两小时，结论\"下次注意\"，然后没有下次？\n\n管理的事，一半是\"把标准写清楚\"。AI 帮你把脑子里的要求，变成可复用的文档。\n\n## 三、核心概念\n\n### 1. JD = 要点扩写，不是凭空编\n你给 AI\"岗位名 + 3 个核心职责 + 我们要什么样的人\"，它扩成专业 JD。你掌握\"要求从哪来\"，AI 负责\"写得像样\"。\n\n### 2. 面试题分层：行为 / 专业 / 文化\n让 AI 按\"行为题（过去怎么做）/专业题（会不会做）/文化题（合不合拍）\"三类出题，你挑。这是结构化面试的基本功。\n\n### 3. 复盘 = 问题—原因—动作\n把复盘内容给 AI，让它归成三列。重点：AI 给的是\"草稿\"，\"根因\"和\"谁负责\"必须你定。\n\n### 4. 红线：不写歧视性、不实表述\nJD 里不能出现年龄/性别等歧视用词；薪资范围、岗位职责必须真实，AI 编的\"假福利\"不能发。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：半天出 JD\n**背景**：要招\"社群运营\"。\n**AI 输出**：含【岗位职责 5 条 / 任职要求 4 条 / 加分项 / 我们提供】的专业 JD。\n**人工把关**：薪资、汇报线你填真实信息；删掉 AI 可能加的\"弹性无敌\"\"期权丰厚\"等不实词。\n\n### 案例 2：复盘变清单\n**背景**：一次项目延期复盘纪要。\n**AI 输出**：| 问题 | 根因（待确认）| 改进动作 | 负责人（待填）|。\n**人工把关**：根因你拍板，负责人你指定，AI 不替你决定人事。\n\n## 五、动手任务\n\n- **背景**：你正在招人或刚开完复盘会。\n- **输入**：岗位要点，或一段复盘记录。\n- **步骤**：\n  1. 用\"JD 模板\"生成招聘包。\n  2. 用\"面试题模板\"生成分层题目。\n  3. 用\"复盘模板\"整理改进表。\n- **预期输出**：《岗位招聘包》+《团队复盘改进表》。\n\n## 六、Prompt 模板\n\n```\n你现在扮演：资深 HR 顾问\n我要招： [岗位名]\n核心职责（我口述）： [3-5 条]\n我们要这样的人： [特质]\n请你输出：一份 JD，含【岗位职责 / 任职要求 / 加分项 / 我们提供】四段；\n再出 10 道面试题，按【行为/专业/文化】三类标注。\n限制：不出现任何歧视性表述；薪资福利只写我提供的，不编造。\n```\n\n## 七、人工检查清单\n\n- [ ] JD 无歧视用语、薪资真实\n- [ ] 面试题覆盖三类、可区分候选人\n- [ ] 复盘根因与负责人由我确认\n- [ ] 未把候选人隐私信息外泄\n\n## 八、常见错误\n\n1. 直接发 AI 编的\"虚假福利\"JD。\n2. 面试题全是\"你最大的缺点\"这类无效题。\n3. 复盘表根因让 AI 乱猜，不落地。\n4. 用 AI 生成带偏见的筛选标准。\n\n## 九、课后作业\n\n提交一份《岗位招聘包》（JD+≥8 道分层题）+ 一份《复盘改进表》（≥3 行，根因与负责人已填）。\n\n## 十、评分标准\n\n- 完成度：两份交付物齐全（40%）\n- 质量：JD 专业无歧视、面试题分层合理（35%）\n- 落地：复盘根因/负责人已人为确认（25%）\n", "08-私人工作流.md": "# 第 8 课  私人工作流 → 个人 AI 工作助手说明书\n\n## 一、教学目标\n\n- **知识**：理解\"工作流\"不是买个工具，而是把你反复做的事，固化成\"步骤 + 模板 + 检查点\"；掌握\"把前 7 课沉淀的模板串成一条线\"的方法。\n- **能力**：写出一份属于自己的《AI 工作助手说明书》——讲清\"我是谁、我常做啥、每件事用哪个模板、哪里必须我把关\"。\n- **作品**：一份可复用的《个人 AI 工作助手说明书》（含场景→模板→红线映射）。\n\n> 本课整合前 7 课方法论，参考 LLM Universe\"把能力沉淀为可复用流程\"、Generative-AI-For-Beginners\"把 AI 嵌进日常任务\"的思路。\n\n## 二、开场问题\n\n> 学了一堆 AI 技巧，下周还是遇事现想\"该怎么问\"？\n> 你团队里，换个人就不知道\"这事 AI 怎么用\"？\n> 想把自己用 AI 的经验，变成一套\"不用动脑也能跑\"的流程？\n\n私人工作流，就是把\"你的用法\"写下来，让 AI 变成你随叫随到的副驾。\n\n## 三、核心概念\n\n### 1. 工作流 = 场景 × 模板 × 红线\n每个高频场景，配一个固定模板，再标一个\"人把关点\"。三件套齐了，才叫流程。\n\n### 2. 说明书是给\"未来的自己\"看的\n写清楚：我是谁、我高频场景有哪些、每个场景调哪个模板、输出后我查哪几项。\n\n### 3. 持续迭代：用一次改一次\n哪次 AI 答得不对，就反过来改模板或加一条检查项。说明书是活的。\n\n### 4. 红线总纲：人判断、AI 辅助\n价格/政策/隐私/高风险决策，永远我定；AI 只出草稿。\n\n## 四、真实工作场景案例演示\n\n### 案例：把\"周报+客户跟进+数据\"串成周一流程\n**说明书片段**：\"周一 9:00 → 用『周报模板』汇总上周 → 用『跟进模板』生成客户清单 → 用『数据模板』出洞察 → 三份都过『人工检查清单』再发。\"\n**价值**：不用每次想，照流程走。\n\n## 五、动手任务\n\n- **背景**：回顾前 7 课你产出的所有模板与清单。\n- **输入**：你自己的岗位与高频场景。\n- **步骤**：\n  1. 列出你最常用的 5–8 个工作场景。\n  2. 每个场景绑定一个模板（引用前面文件）。\n  3. 每个场景标 1–2 个\"必须我把关\"的点。\n  4. 写成一份说明书。\n- **预期输出**：《个人 AI 工作助手说明书》。\n\n## 六、Prompt 模板（说明书骨架）\n\n```\n我的角色： [岗位]\n我的高频场景： [列出 5-8 个]\n每个场景对应模板与把关点：\n- 场景1 → 用[模板名] → 我查[检查项]\n- 场景2 → …\n总红线： [人判断、AI 辅助；不泄露隐私；不代做承诺]\n```\n\n## 七、人工检查清单\n\n- [ ] 场景覆盖我 80% 的重复工作\n- [ ] 每个场景都有对应模板\n- [ ] 每个场景都标了把关点\n- [ ] 红线写清楚、可执行\n\n## 八、常见错误\n\n1. 说明书太虚，\"多用 AI\"没有具体场景。\n2. 只列工具不列模板，换场景还是不会用。\n3. 漏掉把关点，等于没设防。\n\n## 九、课后作业\n\n提交一份《个人 AI 工作助手说明书》，含≥5 场景、每场景有模板与把关点。\n\n## 十、评分标准\n\n- 完成度：说明书齐全（40%）\n- 质量：场景真实、模板可引用（35%）\n- 安全：把关点与红线明确（25%）\n", "09-六岗位工具包.md": "# 第 9 课  六岗位工具包（行政 / 销售 / 客服 / 运营 / 人事 / 个体户）\n\n> 每个岗位 10+ 真实工作场景。每场景含【原始任务 / AI 协作方式 / 示例 Prompt / 输出样例 / 人工检查清单 / 隐私风险提醒】。\n> 核心原则：**人判断、AI 辅助；不涉及代码、API、模型参数**。\n\n---\n\n## 一、行政文职（10 场景）\n\n**场景 1：写会议通知**\n- 原始任务：发一则周三例会的通知。\n- AI 协作：给要点→扩写成正式通知。\n- 示例 Prompt：\"你是行政，写一则会议通知：时间周三 15:00、地点 3 楼、议题 Q3 复盘、要求带周报。语气正式。\"\n- 输出样例：含标题、时间地点、议程、落款的完整通知。\n- 人工检查：时间地点准确、参会人无误。\n- 隐私：不含涉密议程细节外发。\n\n**场景 2：整理会议纪要**\n- 原始任务：把 1 小时录音转成纪要。\n- AI 协作：贴转录文本→提炼\"决议/待办/负责人\"。\n- 示例 Prompt：\"把以下会议记录整理成【决议/待办/负责人/截止】四列表格。\"\n- 人工检查：待办与负责人属实。\n- 隐私：纪要含内部信息，仅内部分发。\n\n**场景 3：排月度值班表**\n- 原始任务：排 5 人轮值。\n- AI 协作：给规则→出表。\n- 示例 Prompt：\"排 8 月值班表，5 人轮换，避开周末两人同休。\"\n- 人工检查：无冲突、合规。\n\n**场景 4：起草制度说明**\n- 原始任务：把新考勤制度写成员工易懂的版本。\n- AI 协作：给条款→转白话。\n- 人工检查：不歪曲原制度。\n\n**场景 5：做 PPT 文字稿**\n- 原始任务：把汇报要点变成 PPT 每页文案。\n- AI 协作：给大纲→分页文案。\n- 人工检查：数据真实。\n\n**场景 6：邮件分类与回复草稿**\n- 原始任务：20 封邮件先分类再回。\n- AI 协作：贴邮件→标\"紧急/常规/垃圾\"+ 拟回。\n- 人工检查：紧急判断准确、外发语气。\n\n**场景 7：活动流程清单**\n- 原始任务：筹办部门团建。\n- AI 协作：给目标人数→出流程+物料清单。\n- 人工检查：预算与场地真实。\n\n**场景 8：公文格式校对**\n- 原始任务：检查一份请示格式。\n- AI 协作：贴文→列格式问题。\n- 人工检查：依单位规范终审。\n\n**场景 9：周报汇总**\n- 原始任务：把各部门周报合成一份。\n- AI 协作：贴多份→提炼重点。\n- 人工检查：不漏关键项。\n\n**场景 10：常见问题 FAQ**\n- 原始任务：整理员工常问的行政问题。\n- AI 协作：给问答→归库。\n- 人工检查：答案准确合规。\n\n---\n\n## 二、销售（10 场景）\n\n**场景 1：破冰话术** — 给客户类型→生成开场白（参考第 4 课 Few-shot）。人工查：真实案例数据不编。\n**场景 2：产品介绍** — 给卖点→写 1 分钟介绍。人工查：参数真实。\n**场景 3：异议\"太贵\"** — 用四步法生成。人工查：价值证据真实。\n**场景 4：竞品对比** — 给两品参数→客观对比表。人工查：不贬低竞品、数据真实。\n**场景 5：跟进提醒** — 给客户列表→生成回访计划。人工查：时间合理。\n**场景 6：方案草案** — 给客户需求→出方案框架。人工查：范围与报价你定。\n**场景 7：逼单话术** — 给阶段→出推进话术。人工查：不施压过度。\n**场景 8：客户分层** — 贴沟通记录→标意向高低。人工查：分层合理。\n**场景 9：回访问卷** — 给目标→出问卷。人工查：问题合规。\n**场景 10：销售日报** — 给数据→出日报。人工查：数字复核。\n隐私：客户名单/电话不外贴公开 AI；承诺价格政策只你填。\n\n---\n\n## 三、客服（10 场景）\n\n**场景 1：标准回复库** — 给 FAQ→出统一话术。人工查：依据真实制度。\n**场景 2：投诉安抚** — 给投诉→出\"认情绪+给事实+给方案\"。人工查：事实你填。\n**场景 3：退换货指引** — 给政策→出步骤。人工查：与政策一致。\n**场景 4：工单分类** — 贴工单→标优先级。人工查：紧急判对。\n**场景 5：话术优化** — 给一段生硬回复→润色。人工查：不失真。\n**场景 6：知识库问答** — 给资料→基于资料答（RAG）。人工查：只依资料，无则如实说。\n**场景 7：情绪识别** — 贴留言→标情绪。人工查：转人工判断。\n**场景 8：回访脚本** — 给目的→出脚本。人工查：合规。\n**场景 9：满意度问卷** — 出问卷。人工查：问题合理。\n**场景 10：案例沉淀** — 给典型对话→提炼可复用 SOP。人工查：脱敏。\n隐私：客户信息脱敏后再处理。\n\n---\n\n## 四、运营（10 场景）\n\n**场景 1：选题库** — 给领域→出 20 个选题。人工查：不夸大功效。\n**场景 2：多版标题** — 给主题→出 10 标题。人工查：不标题党。\n**场景 3：小红书文案** — 给卖点→出种草文。人工查：真实不虚假宣传。\n**场景 4：短视频脚本** — 给主题→出分镜脚本。人工查：可拍。\n**场景 5：朋友圈分发稿** — 给长文→改 3 种语气。人工查：不失真。\n**场景 6：评论区互动** — 给帖子→出互动话术。人工查：语气贴合。\n**场景 7：活动策划** — 给目标→出方案。人工查：预算真实。\n**场景 8：数据复盘** — 给数据→出洞察。人工查：数字复核。\n**场景 9：竞品监测摘要** — 给链接→出要点。人工查：客观。\n**场景 10：用户画像** — 给反馈→出画像。人工查：基于真实反馈。\n红线：广告法合规，不编功效、不伪造用户。\n\n---\n\n## 五、人事（10 场景）\n\n**场景 1：JD 撰写** — 给要点→出 JD（见第 7 课）。人工查：无歧视、薪资真实。\n**场景 2：面试题** — 给岗位→出分层题。人工查：合理区分度。\n**场景 3：简历初筛** — 贴简历→标匹配度。人工查：不唯 AI 判定。\n**场景 4：面试评价表** — 给维度→出表。人工查：维度合理。\n**场景 5：入职指引** — 出新人指引。人工查：流程真实。\n**场景 6：培训大纲** — 给目标→出大纲。人工查：可执行。\n**场景 7：绩效话术** — 给结果→出沟通稿。人工查：公正。\n**场景 8：离职访谈** — 出访谈提纲。人工查：合规。\n**场景 9：薪酬说明** — 给结构→出白话版。人工查：数字真实。\n**场景 10：员工 FAQ** — 出问答库。人工查：准确。\n隐私：候选人/员工信息严格保密，不进公开 AI。\n\n---\n\n## 六、个体户（10 场景）\n\n**场景 1：朋友圈卖货文案** — 给产品→出文案。人工查：真实不夸。\n**场景 2：客户回复** — 给问题→出回复。人工查：准确。\n**场景 3：进货清单** — 给销售数据→出补货建议。人工查：结合实情。\n**场景 4：促销方案** — 给目标→出方案。人工查：利润算清。\n**场景 5：简单记账分类** — 贴流水→分类。人工查：数字复核。\n**场景 6：商品描述** — 给特点→出详情页文案。人工查：不虚假。\n**场景 7：客户维护提醒** — 出回访计划。人工查：合理。\n**场景 8：短视频引流** — 出脚本。人工查：可拍。\n**场景 9：差评应对** — 出回应。人工查：态度诚恳。\n**场景 10：周度小结** — 给数据→出小结。人工查：数字复核。\n隐私：不让 AI 接触客户隐私明细。\n", "10-Prompt模板库.md": "# 第 10 课  Prompt 模板库（可直接复制使用）\n\n> 汇总本营所有可复制 Prompt，按任务分类。复制后把【括号】内容换成你的真实信息即可。\n> 通用原则：角色 + 背景 + 任务 + 输出格式 + 限制条件 + \"信息够就直接做，不够先问我 3 个问题\"。\n\n---\n\n## A. 通用标准结构（所有场景底座）\n\n```\n你现在扮演： [角色]\n我的背景是： [我是谁、在做什么]\n我要完成的任务是： [一句话]\n目标对象/读者是： [谁]\n已有材料如下：\n【粘贴你的材料】\n请你输出： [明确要什么]\n输出格式： [列表/表格/三段式]\n限制条件： [字数、语气、不能编数字等]\n请先问我 3 个关键问题，如果信息足够，再直接开始。\n```\n\n---\n\n## B. 写作与文档\n\n**B1 通知**\n```\n你是行政，写一则正式通知：\n时间[ ]、地点[ ]、议题[ ]、参会人[ ]。\n语气正式，含标题/时间地点/议程/落款。\n```\n\n**B2 周报**\n```\n你是[我的岗位]，帮我写本周周报。\n本周做了：[列 3-5 件事]\n请按【本周完成 / 进行中 / 下周计划 / 需协调】四段输出，每点不超过 2 行。\n```\n\n**B3 工作方案**\n```\n你是[岗位]，写一份[主题]方案草稿。\n背景：[ ] 目标：[ ] 约束：[ ]\n按【背景/目标/步骤/风险/所需资源】输出。\n```\n\n---\n\n## C. 会议与沟通\n\n**C1 会议纪要**\n```\n把以下会议记录整理成表格，列：【决议 / 待办 / 负责人 / 截止时间】。\n只基于原文，不要补充原文没有的内容。\n【粘贴转录文本】\n```\n\n**C2 跟进清单**\n```\n从以下会议/聊天记录中，提取所有\"需要我后续跟进\"的事项，\n按【事项 / 关联人 / 建议下一步 / 优先级】列表。\n```\n\n---\n\n## D. 销售与客服\n\n**D1 破冰话术（Few-shot）**\n```\n你是资深销售。参考下面这段我真实的赢单话术（脱敏）：\n【贴一段你的话术】\n按同样语气和逻辑，写一段新的破冰话术，对象：[客户类型]，阶段：[首次加微/复聊]。\n```\n\n**D2 异议四步**\n```\n客户说\"[太贵了/再想想/竞品更便宜]\"。\n请按四步生成回复：①共情 ②澄清 ③举证（用我提供的真实案例[ ]）④推进。\n涉及价格/政策的具体数字用\"[待我确认]\"占位，不要编造。\n```\n\n**D3 客服基于资料答（RAG）**\n```\n你是我方客服助理，只依据下面《资料》回答，资料没有的就说\"我帮您确认后回复\"。\n《资料》：【粘贴 FAQ/制度】\n客户问题：[ ]\n```\n\n---\n\n## E. 内容与运营\n\n**E1 选题库**\n```\n你是[平台]内容运营，围绕\"[领域]\"生成 20 个选题角度，\n覆盖：干货、痛点、案例、对比、趋势五类，每条一句话。\n```\n\n**E2 多版文案**\n```\n把以下产品卖点写成：①小红书种草文 ②朋友圈短文案 ③短视频口播稿。\n卖点：[ ] 注意：不夸大功效、不违反广告法。\n```\n\n**E3 数据洞察**\n```\n你是经营分析助理，分析下面这张表，按【总体趋势/3个异常点/3个建议动作】输出，\n数字必须来自原表，不确定处标\"[需我核对]\"。\n【粘贴表格】\n```\n\n---\n\n## F. 管理与人事\n\n**F1 JD**\n```\n你是资深 HR，我要招[岗位]，核心职责：[3-5条]，我们要这样的人：[特质]。\n输出 JD：【岗位职责/任职要求/加分项/我们提供】，不出现歧视性表述，薪资只写我提供的。\n```\n\n**F2 复盘**\n```\n把以下复盘内容整理成表格：【问题 / 根因(待我确认) / 改进动作 / 负责人(待我填)】。\n【粘贴记录】\n```\n\n---\n\n> 复制即用。每条都留了\"人把关\"的钩子（[待我确认]/[需我核对]/[待我填]），这是本营红线。\n", "11-人工检查清单总表.md": "# 第 11 课  人工检查清单总表（每步都留\"人把关\"的钩子）\n\n> 把所有场景的红线收口成一张总表。每条任务的最后一步，必须是\"人核对\"，AI 只出草稿。\n> 这是本营最重要的文件——它决定你用 AI 是\"提效\"还是\"埋雷\"。\n\n---\n\n## 一、通用红线（适用所有场景）\n\n- [ ] 我没把公司机密、客户隐私、未公开数据贴进不安全工具\n- [ ] 涉及价格/政策/承诺的内容，凡 AI 写的都标 [待我确认] 并由我填真实值\n- [ ] 所有关键数字（金额/占比/排名）我已用原表或计算器复核\n- [ ] 对外发布前，我读过一遍、改过一遍，不是直接转发 AI 原文\n- [ ] 高风险决策（医疗/法律/金融/人事）AI 仅整理信息，结论由专业人定\n\n---\n\n## 二、分场景检查清单\n\n### 写作 / 周报 / 方案\n- [ ] 事实与数据来自我提供，AI 未编造\n- [ ] 语气符合公司/品牌调性\n- [ ] 无错别字与歧义\n\n### 会议 / 纪要 / 跟进\n- [ ] 待办事项与负责人属实\n- [ ] 截止时间合理\n- [ ] 内部信息仅内部分发\n\n### 销售 / 客服\n- [ ] 话术中的案例/数据是真实的（不编赢单故事）\n- [ ] 价格、折扣、交付、保修政策只我给，AI 不代承诺\n- [ ] 客服回复严格基于我方资料，无资料处如实说\"确认后回复\"\n- [ ] 客户姓名/电话/聊天记录已脱敏\n\n### 内容 / 运营\n- [ ] 不夸大功效、不标题党、不伪造用户评价\n- [ ] 符合广告法与平台规范\n- [ ] 数据类表述可查证\n\n### 表格 / 数据\n- [ ] 关键数字已复核\n- [ ] 异常判断基于真实行，非 AI 推断\n- [ ] 敏感明细未外泄\n\n### 管理 / 人事 / 招聘\n- [ ] JD 无年龄/性别等歧视用语\n- [ ] 薪资福利真实，无 AI 编造的\"假福利\"\n- [ ] 面试题分层合理、可区分候选人\n- [ ] 复盘根因与负责人由我确认\n- [ ] 候选人/员工信息严格保密\n\n---\n\n## 三、\"人把关\"占位符规范\n\n在 Prompt 与产出中统一使用以下占位符，提醒自己哪里必须人工填：\n\n| 占位符 | 含义 | 用途 |\n|---|---|---|\n| `[待我确认]` | AI 不能定的事实 | 价格、政策、承诺 |\n| `[需我核对]` | AI 算的数/推断 | 金额、占比、趋势 |\n| `[待我填]` | 需我指定的项 | 负责人、根因、决策 |\n| `[脱敏]` | 已隐去的隐私 | 姓名、电话、客户名 |\n\n---\n\n## 四、使用纪律（建议贴桌上）\n\n1. **先想后问**：清楚自己要什么，再让 AI 做。\n2. **贴料不贴密**：给 AI 材料时，先删敏感字段。\n3. **算数自己来**：AI 给的数字，复核一遍。\n4. **发布前读一遍**：AI 草稿不等于成品。\n5. **留痕可追**：重要产出存本地，不留痕在聊天框里。\n\n> 记住一句话：**人判断，AI 辅助。方向盘和刹车，永远在你手里。**\n", "12-用Codex写代码做工具.md": "# 第 12 课  用 Codex 写代码做工具 —— 不会写代码，也能让 AI 帮你造个小应用\n\n## 一、教学目标\n\n- **知识**：知道 Codex 是什么、有哪几种用法（App / CLI / IDE 扩展 / Web）；理解\"编码智能体\"和\"聊天 AI\"的区别。\n- **能力**：用大白话给 Codex 下指令，做出一个能用的小工具（比如把一堆聊天记录转成表格、把报销单自动汇总）。\n- **作品**：跑通一个真实小项目，产出《我的第一个 AI 小工具》成品 + 一句能复用的需求描述。\n\n## 二、开场问题\n\n> 你工作里有没有这种事：要重复处理同一种文件——把 50 条客户留言整理成表、把每月发票合并成一个 Excel、把一堆截图里的文字抠出来？\n> 这些事\"写个程序\"最省事，但你不会写代码。\n> 这节课，你就用 Codex 把这件事办了——**你动嘴，它动手**。\n\n## 三、核心概念\n\n### 1. Codex 是什么（一句话版）\n\nCodex 是 OpenAI 出品的**编码智能体**：你用自然语言说\"我要做个啥\"，它自己写代码、建文件、跑起来、还帮你改 bug。\n它不是聊天机器人，而是**会操作你电脑里文件的\"编程同事\"**。\n\n橙皮书里把它分成四种形态：\n\n| 形态 | 入口 | 适合你吗 |\n|---|---|---|\n| **Codex App（桌面）** | 装个软件，选个文件夹就能用 | ⭐ 最推荐，新手最顺手、功能最全 |\n| **Codex CLI** | 终端命令行 | 想进阶、爱折腾可用 |\n| **Codex IDE 扩展** | VS Code / Cursor 里 | 本身就在写代码的人 |\n| **Codex Web（云端）** | 网页 chatgpt.com/codex | 不想装软件、临时用 |\n\n### 2. 它和普通聊天 AI 的区别\n\n- 聊天 AI（ChatGPT 对话框）：**给你答案文字**，你还得自己复制粘贴去干活。\n- Codex：**直接改你文件夹里的真实文件**，生成的是能跑的程序/网页，不是一段建议你照做的文本。\n\n### 3. 三种用法姿势（摘自橙皮书）\n\n- **对话式**：打开 App，聊天一样说需求，它边问边做。\n- **单次任务**：一句指令搞定，比如\"把这个 CSV 按客户名拆成 12 个表\"。\n- **文件夹工作模式**：选好一个项目目录，Codex 能读里面的所有文件、统一改写——这是干真实工作的主战场。\n\n### 4. 最关键心法：把\"想要的结果\"说清楚\n\n不要说\"帮我做个工具\"。要说：\n> \"读取 `客户留言.txt`，每行是一条留言，提取【客户名、问题、情绪、是否紧急】四列，输出 `result.csv`，并在最前面加一行统计总数。\"\n\n**结果越具体，它做出来的越能用。**\n\n## 四、真实工作场景案例演示\n\n### 案例 1：销售的\"客户留言 → 表格\"噩梦\n**场景**：每天收到几十条微信客户留言，要整理成跟进表，手工 1 小时。\n**Codex 做法**：把所有留言贴进一个 `txt`，对 Codex 说\"提取客户名/需求/紧急度，输出 Excel\"。1 分钟出表，销售只核对人名。\n**红线提醒**：客户姓名、电话是 PII（个人敏感信息）——**别把真实数据传出去练手**，先用假数据测试，确认工具好用再在本地副本跑真数据。\n\n### 案例 2：行政的\"发票合并\"\n**场景**：每月 30 张报销发票散在不同文件，要合成一张总表。\n**Codex 做法**：把发票图片/PDF 放一个文件夹，让它\"识别每张的金额、日期、类别，合并成 `汇总.xlsx`\"。\n**红线提醒**：发票含公司财务信息，**只在自己电脑本地跑，别用任何云端模式把文件传外网**。\n\n### 案例 3：运营的\"海报生成器\"\n**场景**：每周要出 5 张活动海报，排版重复。\n**Codex 做法**：让它写个网页小工具，填文字自动出图——这就是橙皮书第五篇\"做网站/视频\"的思路。\n\n## 五、标准工作流（照着做）\n\n橙皮书第四篇给了一条\"需求 → 交付\"链路，职场人版精简成 5 步：\n\n1. **定结果**：先想清楚\"我要一个什么样的文件/网页出来\"。\n2. **备原料**：把要处理的文件放进一个**专门文件夹**（别混进重要项目）。\n3. **下指令**：用\"读 X、做 Y、输出 Z\"的句式说需求。\n4. **看成品 + 人审**：AI 生成后，**你打开看一眼对不对**，数字/人名必须亲自核。\n5. **迭代**：不对就说\"把第 3 列改成按金额排序\"，它会接着改。\n\n## 六、红线总提醒（务必遵守）\n\n- 不把**公司涉密源码、客户 PII、未公开数据、密钥/Token** 喂给 Codex 或任何 AI。\n- AI 写的代码**可能出错**：人来判断、AI 辅助，关键结果自己核对。\n- 先在**副本/专门测试文件夹**里跑，确认安全再碰真数据。\n- Codex 更新很快（安装方式、模型名、入口都可能变），具体以 OpenAI 官方文档和你账号实际显示为准。\n\n## 七、课后小任务\n\n挑你工作里**一件重复处理文件的事**，用 Codex App 做一个小工具跑通它。把\"你下的那句指令\"记下来，这就是你第一个可复用的 Prompt。\n\n---\n\n*本课件根据《Codex 橙皮书》（bozhouDev/codex-orange-book，非官方开源）本地化重组，仅取\"职场人能用上\"的部分，非逐字翻译。*\n", "13-国产Agent平替WorkBuddy.md": "# 第 13 课  国产 Agent 平替：用 WorkBuddy 接住日常七成活\n\n## 一、教学目标\n\n- **知识**：知道 WorkBuddy 是什么（腾讯出品的国产通用 Agent）、它和 Claude Code / Codex 的关系、为什么它对\"用不上海外工具\"的人是关键的拼图。\n- **能力**：用 WorkBuddy 完成汇报 / 数据 / PPT / 代码四类办公活，并配好微信远程控制，把常用流程固化成自定义 Skill。\n- **作品**：跑通一个真实办公任务 + 配置好微信远程控制（\"已连接\"状态）。\n\n## 二、开场问题\n\n> 上节课学了 Codex，但有人卡在注册、支付、安装——\"好是好，用不了\"。\n> 你身边是不是也有人（或者你自己）被海外工具的门槛挡住了？\n> 这节课给你一个**国内能直接装、能直接用**的平替，把最日常的办公活自动化掉。\n\n## 三、核心概念\n\n### 1. WorkBuddy 是什么（一句话版）\n\n腾讯出品的**国产通用 Agent 客户端**（Mac / Windows 都有），本质也是\"能操作你电脑干活的 AI 同事\"。\n它最大的好处是**门槛低**——不用翻墙注册、不用绑境外支付、双击默认装完就能用。\n\n### 2. 它和 Claude Code / Codex 的关系：互补，不是替代\n\n- Codex / Claude Code：能力强，但海外工具在注册、支付、安装上仍有门槛，很多人\"用不上\"。\n- WorkBuddy：把国内用户最需要的**办公自动化拼图**补上了——日常七成以上的办公活它都能接。\n- 两者可以并存：海外工具啃复杂工程，国产 Agent 接日常琐碎。\n\n### 3. 最大亮点：原生打通微信远程控制\n\n因为是腾讯自家产品，WorkBuddy 的远程控制**原生打通了微信**——手机小程序就能让它干活。\n这是很多海外 Agent 想做都做不到的一点（后面第六节细讲）。\n\n### 4. 作者的一条诚实判断（务必记住）\n\n国产模型在**代码能力**上离最顶尖那批（Claude Code / Codex 背后模型）还有差距：\n- ✅ 小项目、小网页、小工具：没问题，能接住。\n- ⚠️ 真上**复杂大工程**：仍强烈建议想办法用 Claude Code 或 Codex。\n\n> 这句话搁两年后会不会翻，作者说\"不知道，但眼下就是这样\"。我们照当下事实用就好。\n\n## 四、真实工作场景案例演示\n\n### 案例 1：汇报地狱\n**场景**：每周要写结构化汇报，素材散、格式烦。\n**做法**：把要点 / 素材丢给 WorkBuddy，让它生成结构化汇报草稿，你只改口径和数字。\n\n### 案例 2：数据整理\n**场景**：一批杂乱数据要归类、出表格。\n**做法**：贴进去，让它归类、清洗、输出表。\n\n### 案例 3：PPT 产出\n**场景**：从主题到成稿要耗一下午。\n**做法**：给它主题和要点，产出可演示的幻灯片初稿。\n\n### 案例 4：人在外面被催\"发文件\"\n**场景**：不在电脑前，突然被催\"把电脑里某份文件发给财务\"。\n**做法**：手机微信小程序里跟它说一声，让它操作本地电脑把文件发走（前提：提前配好对应连接器；没配也能先扔进小程序对话框再手动转发）。\n**红线提醒**：远程控制开启后，注意授权范围，避免 Agent 越权操作；敏感文件先脱敏。\n\n## 五、标准工作流（照着做，5 步）\n\n1. **安装**：进 `workbuddy.cn`，按自己系统下 Mac / Windows 版，双击一路默认装完打开。\n2. **定任务**：选一件办公活（汇报 / 数据 / PPT / 代码）。\n3. **下指令**：说清楚\"要什么结果\"（参考第 12 课\"读 X、做 Y、输出 Z\"句式）。\n4. **人审 + 核对**：AI 生成后你打开看一眼，关键数字 / 人名自己核。\n5. **固化**：常用流程挂成**自定义 Skill**，以后一句话就能复用（比如\"用我那个服务器 Skill 把这个网页部署上线\"）。\n\n## 六、微信远程控制配置（它最差异化的地方）\n\n配置步骤：\n1. 打开左侧功能区里的「助理」。\n2. 点「设置」。\n3. 把里面两个开关打开。\n4. 掏出手机，微信扫码，进入小程序授权登录。\n5. 客户端左上角出现\"已连接\"字样，就 OK。\n\n手机端两种模式：\n- **云端工作**：任务在云端沙箱跑，电脑关着都行。\n- **连接电脑**：远程操控你本地这台机器干活，适合需要读本地文件的任务。\n\n> 除了小程序，微信里还能挂 ClawBot 插件做入口——作者体验小程序更稳定顺手，微信插件是备选。飞书、钉钉、QQ 也都能接助理，按页面提示走即可。\n\n## 七、红线总提醒（务必遵守）\n\n- 让 Agent 碰本地文件 / 发邮件前，确认它只访问你**授权的范围**；敏感文件先脱敏。\n- 涉及**公司数据、客户信息、密钥**，不要无脑交给任何 AI 工具——人判断、AI 辅助。\n- 远程控制（微信 / 小程序）开启后，注意授权范围，避免 Agent 越权操作。\n- AI 生成内容**可能出错**：关键结果自己核对；复杂工程优先用更强的海外工具。\n- WorkBuddy 更新很快（功能、入口、价格都可能变），以官网 `workbuddy.cn` 和客户端实际显示为准。\n\n## 八、课后小任务\n\n挑你工作里**一件日常办公活**（汇报 / 数据 / PPT / 小工具任一），用 WorkBuddy 跑通它；并顺手把微信远程控制配好，体验一次\"不在电脑前也能让它干活\"。\n\n---\n\n*本课件根据苏乐 @ai_suxiaole 原帖《WorkBuddy 国产通用 Agent 实操教程》（2026-07-02）本地化重组为课程，保留原意、补充结构化要点与红线，非逐字转载。原帖：x.com/ai_suxiaole/status/2072514519990223112*\n", "00-课程总览-en.md": "# AI Productivity Bootcamp — Course Overview\n\n> A hands-on AI course for everyday professionals. No coding, no jargon-stacking — it solves one thing only: **getting you to actually use AI in your daily work, starting today**.\n\n---\n\n## I. Course Positioning\n\nThis bootcamp is the \"getting-work-done\" track of the AI Skills Upgrade curriculum, aimed at ordinary working professionals. It serves: administrative staff, sales, customer service, operations, HR, finance, sole proprietors, and small-team managers.\n\nWe assume you have **no programming skills whatsoever**. You don't need to understand model parameters, APIs, or training principles. If you can use WeChat, operate a computer, and state a request clearly, you can learn this.\n\nThe course's core principle is one sentence:\n\n> **Human judgment, AI assistance. AI is your co-pilot for saving time — the steering wheel and the brakes are always in your hands.**\n\n---\n\n## II. Target Users & Typical Pain Points\n\n| Role | What drains them most each day | Where AI helps immediately |\n|---|---|---|\n| Administrative | Drafting notices, scheduling, organizing meeting notes | Drafting + formatting + summaries |\n| Sales | Finding pitches, following up clients, writing proposals | Pitch generation + objection handling + follow-up reminders |\n| Customer service | Repetitive Q&A, handling complaints | Standard replies + emotional soothing + case accumulation |\n| Operations | Topic selection, copywriting, script editing | Topic library + multiple copy variants + script frameworks |\n| HR | Writing JDs, screening resumes, designing interview questions | JD templates + interview questions + review frameworks |\n| Finance | Reconciling accounts, building spreadsheets, writing explanations | Data summaries + anomaly detection + business phrasing |\n| Sole proprietor | Doing the work of an entire company alone | All-scenario assistant |\n| Small-team manager | Reviews, communication, decisions | Meeting notes + reviews + decision lists |\n\n**Eight common pain points** (the whole course is built around solving them):\n\n1. Writing the same things over and over is exhausting.\n2. Not knowing what to write in weekly or monthly reports.\n3. Two-hour meetings you can't remember and can't act on.\n4. Fumbling when clients say no; pitches depend on inspiration.\n5. Needing content but unable to come up with a headline in half a day.\n6. Piles of spreadsheets that reveal no insight.\n7. Hiring with no standard; reviews based on gut feeling.\n8. Learning lots of AI but still unable to use it back on the job.\n\n---\n\n## III. Learning Goals (What You'll Take Away)\n\n- **Knowledge**: Understand what AI can do, what it can't, and when it will \"make things up\" (hallucinate).\n- **Skill**: Master a **standard Prompt structure** so you can write usable instructions for any work task on your own.\n- **Output**: Eight lessons produce eight ready-to-use job materials (scenario lists, weekly report templates, meeting minutes, sales scripts, topic libraries, data-dashboard phrasing, recruitment kits, a personal AI work-assistant spec) + six role toolkits.\n\n---\n\n## IV. Learning Path (8 Lessons + 2 Summary Tables)\n\n```\nLesson 1  AI Tools Primer           → My 10 high-frequency work scenarios (find your scenarios)\nLesson 2  Writing & Documents       → Notice / weekly report / proposal templates (learn to write)\nLesson 3  Meetings & Communication  → Meeting minutes + follow-up list (learn to speak, learn to record)\nLesson 4  Sales & Customer Service  → Scripts / objection handling / client follow-up (learn to sell, learn to serve)\nLesson 5  Content Operations        → Topic selection / copy / short-video scripts (learn to grow)\nLesson 6  Spreadsheets & Data       → Data summaries + business analysis (learn to read the numbers)\nLesson 7  Management & Recruitment  → Recruitment JD / interview questions / team review (learn to manage people)\nLesson 8  Personal Workflow         → Personal AI work-assistant spec (turn it into a habit)\n─────────────────────────────────────────\n09  Six-Role Toolkit (Admin / Sales / CS / Ops / HR / Sole Proprietor)\n10  Prompt Template Library (all templates compiled, ready to copy)\n11  Master Human Review Checklist (a \"human-in-the-loop\" hook at every step)\n```\n\n---\n\n## V. Red Lines (Must Remember)\n\n1. **AI makes mistakes — don't trust it blindly.** It sometimes fabricates data, names, regulations, and citations. Anything involving money, contracts, time, law, or medicine must be verified by a human.\n2. **Don't share secrets.** Never upload company secrets, customer privacy, unpublished data, or ID numbers / phone numbers / contract text to any AI tool. Use \"masked\" information instead (e.g., \"a certain client,\" \"December data\").\n3. **Human judgment, AI assistance.** AI gives you drafts and suggestions; the final decisions, external messaging, and accountability are yours.\n4. **Protect business information.** Competitor strategy, pricing, client lists, and internal structures are sensitive — don't feed them to public AI.\n5. **Keep things traceable.** For important deliverables, keep both the \"AI draft + your edits\" versions to support review and accountability.\n\n---\n\n## VI. Standard Prompt Structure (Used in Every Lesson)\n\n> This is the unified \"fill-in-the-blank\" template for the whole course. If you don't know how to write a Prompt, just fill this in.\n\n```\nYou are now playing the role of: [role]\nMy background is: [background]\nThe task I need to complete is: [task]\nThe target user / reader is: [reader]\nExisting materials are as follows: [materials]\nPlease output: [output]\nOutput format: [format]\nConstraints: [constraints]\nFirst ask me 3 key questions; if the information is sufficient, start directly.\n(Workplace edition add-on: please output a version directly usable in work scenarios, with a checklist attached)\n```\n\n**How to use**: Replace the bracketed parts with your real situation and copy the whole block to AI. Lesson 1 will walk you through it until it's second nature.\n\n---\n\n## VII. Deliverables Checklist (What You'll Have When Done)\n\n| No. | File | Purpose |\n|---|---|---|\n| 00 | Course Overview | Roadmap and red lines |\n| 01–08 | Eight lessons | Job materials produced step by step |\n| 09 | Six-Role Toolkit | Admin / Sales / CS / Ops / HR / Sole Proprietor, ≥10 scenarios per role |\n| 10 | Prompt Template Library | All templates compiled, copy anytime |\n| 11 | Master Human Review Checklist | \"Human-in-the-loop\" hook at every step |\n\n---\n\n## VIII. One Sentence for Learners\n\nDon't worry about not being able to learn — this course is designed so that \"copying the homework still works.\" Every lesson gives you templates you can copy directly and assignments you can hand in directly. As long as you **do it once, revise it once, use it once**, AI becomes the most hardworking \"new colleague\" at your desk.\n", "01-AI工具入门-en.md": "# Lesson 1 · AI Tools Primer → My 10 High-Frequency Work Scenarios\n\n## I. Learning Goals\n\n- **Knowledge**: Know what AI is, what it can do, and what it can't; distinguish \"conversational AI\" from \"AI assistants built into office suites\"; understand the concept of \"hallucination.\"\n- **Skill**: Use this system's standard Prompt structure to break a job task into \"specific tasks AI can help with.\"\n- **Output**: Produce the \"My 10 High-Frequency Work Scenarios\" list (with scenario, pain point, and the part AI can help with).\n\n## II. Warm-up Question\n\n> Think back over yesterday: which tasks were \"repetitive, time-consuming, yet unavoidable\"?\n> For example: writing a group notice, organizing a chat log, turning customer questions into a table, writing three lines of progress for your boss…\n>\n> Spend 2 minutes listing the 5 things that pop into your head on paper. By the end of this lesson, you'll have a 10-item list, and for each you'll know how to get AI to lend a hand.\n\n## III. Core Concepts\n\n### 1. What is \"Generative AI\" (in one sentence)\n\nYou give it a text instruction (called a \"prompt\"), and it returns text / a table / a plan. The clearer you ask, the more reliable the answer.\n\n### 2. Three types of AI you can use right away\n\n- **Chat-box type** (e.g., ChatGPT, Wenxin Yiyan, Tongyi Qianwen, Kimi, Doubao, etc.): you type, it answers — best for writing, editing, summarizing, translating, and brainstorming.\n- **Built into office tools**: WPS/Word's \"AI rewrite,\" Excel/Feishu Sheets' \"smart analysis,\" meeting-minutes software — no need to switch tools, use them in place.\n- **Specialized type**: dedicated tools for images, video, and spreadsheets, which later lessons will use.\n\n### 3. The most critical word: Hallucination\n\nAI sometimes **confidently fabricates false information** — fake data, fake names, fake policies, fake citations. It isn't \"bad\"; it's that \"it doesn't know what it doesn't know.\" So:\n\n> **Any numbers, names, regulations, contract clauses, or medical advice must be verified by you personally.**\n\n### 4. A general rule of thumb: break \"big tasks\" into \"small instructions\"\n\n\"Help me write a weekly report\" is too vague. A better breakdown:\n\n- First have AI list the report structure →\n- You fill in what you did this week →\n- Have AI polish it into a formal tone →\n- You check the numbers and wording.\n\nThis is the everyday use of \"human judgment, AI assistance.\"\n\n## IV. Real Work Scenario Demo\n\n### Case 1: The admin's \"weekly notice hell\"\n\n**Scenario**: Every Monday, post a \"this week's meeting schedule\" notice to 3 groups — same format but slightly different content; handwritten, 20 minutes.\n**AI approach**: Paste the meeting list to AI and ask it to \"generate notices with different tones for Group A / Group B.\" Three versions in 1 minute; she only changes the times.\n**Red-line reminder**: Group names and attendee names are internal information — when sharing the case externally, mask them as \"a certain department's group.\"\n\n### Case 2: The salesperson's \"forgotten client follow-up\"\n\n**Scenario**: 40 WeChat clients in hand; who needs a follow-up and what each said last time all rely on memory.\n**AI approach**: Organize the chat highlights into a table (client / last contact / next step / suggested time) and let AI prioritize.\n**Red-line reminder**: Chat logs contain customer privacy — **do not use public AI to process real client names and phone numbers**; use \"Client A / Client B\" for practice.\n\n### Case 3: The operator's \"topic block\"\n\n**Scenario**: Must produce 3 articles a week; coming up with headlines takes a whole afternoon.\n**AI approach**: Give AI your product's selling points and target audience, have it produce 20 headlines + angles at once, and you pick 3.\n\n## V. Hands-on Task\n\n- **Background**: You're newly hired / currently on the job, drowning in trivial tasks every day.\n- **Input**: The 5 most exhausting things on your mind (listed in the warm-up question).\n- **Steps**:\n  1. Use the template below to have AI break each item into \"subtasks AI can take over.\"\n  2. Expand to 10 items, marking \"AI handles / you handle\" for each.\n  3. Pick 3 high-frequency scenarios to \"try this week.\"\n- **Expected output**: A \"My 10 High-Frequency Work Scenarios\" table.\n\n### This Lesson's Prompt Template (Standard Structure)\n\n```\nYou are now playing the role of: an efficiency coach skilled at handing repetitive work to AI\nMy background is: I am a [your role], with lots of repetitive writing / communication / organizing work every day, and I don't know code\nThe task I need to complete is: break my listed work items one by one into \"specific subtasks AI can help with\" and \"human judgment I must do myself\"\nThe target user / reader is: myself (for daily efficiency)\nExisting materials are as follows: [paste the 5 things you wrote in the warm-up question]\nPlease output: a table with columns: No. / work item / part AI can take over / part I must check myself / one-line suggested AI instruction\nOutput format: Markdown table\nConstraints: no real names, client names, phone numbers, or other privacy; methods only, no code\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] The 10 items in the list genuinely come from my real work, not made up.\n- [ ] Each item is marked \"AI handles / I handle,\" and decision-making isn't fully handed to AI.\n- [ ] No real client names, phone numbers, contracts, salaries, or other sensitive info appears.\n- [ ] I picked the 3 \"try this week\" items and have concrete actions.\n- [ ] I understand \"hallucination\": I know which outputs must be human-verified.\n\n## VII. Common Mistakes\n\n1. **Using AI as a search engine**: asking \"help me look up the latest 2024 tax law\" — AI may make it up. Instead: \"based on common situations for general taxpayers, help me list a self-check checklist, and mark 'subject to the latest official tax authority documents.'\"\n2. **Instructions too vague**: \"help me write a proposal\" — output is hollow. Fill in background, reader, and format.\n3. **Pasting secrets directly**: dropping an Excel with client lists into public AI. Red line!\n4. **Copying without checking**: sending AI's data straight to the boss. Always double-check.\n5. **Expecting one-shot perfection**: complex tasks need \"break down + iterate\"; don't demand a perfect answer at once.\n\n## VIII. Homework (Deliverables)\n\n**Deliverable**: One copy of \"My 10 High-Frequency Work Scenarios\" list (Markdown or a table screenshot both fine), containing:\n\n- 10 real scenarios\n- Each scenario with \"AI handles / I handle\" two columns\n- Marked with 3 \"try this week\" scenarios\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | All 10 scenarios present, structure complete |\n| Quality | 25 | Scenarios real and specific, breakdown reasonable |\n| Independent thinking | 25 | Not copied from cases, integrated with own role |\n| Practicality | 25 | The 3 \"try this week\" scenarios are immediately actionable |\n\n---\n\n> **Red-line recap**: No real secrets/privacy may appear in any exercise of this lesson; AI output is for reference only, and final judgment is yours.\n", "02-写作和文档-en.md": "# Lesson 2 · Writing & Documents → Notice / Weekly Report / Proposal Templates\n\n## I. Learning Goals\n\n- **Knowledge**: Master the \"role + background + reader + format + constraints\" writing method; understand that \"build the skeleton first, then fill in the flesh\" is steadier than \"writing it all in one go.\"\n- **Skill**: Use AI to generate first drafts of three high-frequency documents (notice, weekly report, proposal), and rewrite them in your role's tone.\n- **Output**: A reusable three-piece template set of Notice / Weekly Report / Proposal.\n\n## II. Warm-up Question\n\n> The last time you wrote a weekly report, did you stare at a blank document for over 10 minutes?\n> Have you ever sent out a notice that got replies like \"didn't get it / missing the time\"?\n\nWriting is hard not because \"you can't write,\" but because \"you don't know where to start, how formal to be, or how long to make it.\" This lesson gives you three \"fill-in-the-blank\" templates.\n\n## III. Core Concepts\n\n### 1. The five parts of a good document-writing Prompt\n\nReferencing Prompt-Engineering-Guide's \"Prompt Elements\": instruction, context, input data, output indicator, and examples. For working professionals, it comes down to:\n\n- **Role**: Make AI write like a \"senior admin / sales manager.\"\n- **Background**: Your company / reason / timeframe.\n- **Reader**: Who it's written for (determines tone).\n- **Format**: How many paragraphs, how many points, table or bullets.\n- **Constraints**: Word count, no fabrication, must include certain info.\n\n### 2. Zero-shot vs. giving examples (Few-shot)\n\n- **Zero-shot**: State the requirement directly — good for general documents.\n- **Give examples**: You paste a \"previously well-written weekly report\" and have AI imitate your style — this is called few-shot, and it matches your taste better.\n\n### 3. Iterative refinement\n\nUnhappy with the first version? Don't rewrite — just say: \"make the tone more formal,\" \"delete point 2,\" \"add a risk note.\" AI edits faster than humans.\n\n## IV. Real Work Scenario Demo\n\n### Case 1: Temporary water-shutoff notice\n\n**Input**: \"Tomorrow 9–11am maintenance shutoff, remind everyone to store water.\"\n**AI draft**: Four sections — reason / time / suggestion / contact — with an emoji heading.\n**Human check**: Confirm time and building number are correct, then send.\n\n### Case 2: Weekly report from \"running log\" to \"with focus\"\n\n**Pain point**: Writing a pile of \"what I did,\" but the boss complains there's no focus.\n**AI approach**: Paste this week's items to AI, asking it to \"rewrite into three parts — results / in progress / risks & asks — one sentence each.\"\n**Red line**: Weekly reports contain unpublished performance; internal use only, don't send out.\n\n### Case 3: A collaboration proposal framework for a client\n\n**Input**: Product selling points + client's industry.\n**AI output**: Background / pain point / our solution / expected benefit / next steps, five-paragraph form.\n**Human check**: Benefit numbers must be filled with real data by you; AI must not invent them.\n\n## V. Hands-on Task\n\n- **Background**: You are a [role], and this week you need to send 1 notice + write 1 weekly report + prepare 1 small proposal.\n- **Input**: Real or simulated work materials (please mask sensitive info).\n- **Steps**:\n  1. Use the 3 templates below to generate first drafts respectively.\n  2. Do 1 round of iterative editing for each (tone / cutting / supplementing).\n  3. Human-verify the key facts.\n- **Expected output**: One finished notice, one weekly report, one proposal.\n\n### This Lesson's Prompt Template (Standard Structure, copy one of three)\n\n**Notice template**\n\n```\nYou are now playing the role of: a clear, tactful administrative colleague\nMy background is: [company/department] will conduct [matter] on [time], need to notify relevant colleagues\nThe task I need to complete is: write an internal notice\nThe target user / reader is: [who] (e.g., all residents / project group members)\nExisting materials are as follows: [key info such as water shutoff / meeting / holiday]\nPlease output: a notice containing reason / time & place / what the other party should do / contact person\nOutput format: clear sections, bold heading, under 200 words\nConstraints: don't fabricate time or place; tone [formal / friendly]; no real names or phone numbers\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Weekly report template**\n\n```\nYou are now playing the role of: my weekly-report partner\nMy background is: I am a [role], this week's work is as follows [paste items]\nThe task I need to complete is: turn the running log into a focused weekly report\nThe target user / reader is: my direct supervisor\nExisting materials are as follows: [what I did this week, masked]\nPlease output: a weekly report in three parts — this week's results / in progress / risks & coordination needed — one sentence per point\nOutput format: Markdown, about 3 points per section\nConstraints: no exaggeration, no fabricated data; unpublished performance internal only\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Proposal template**\n\n```\nYou are now playing the role of: a [industry] proposal consultant with 10 years of experience\nMy background is: we provide [product/service], target clients are [client type]\nThe task I need to complete is: write an initial collaboration-proposal framework for a client\nThe target user / reader is: the potential client's decision-maker\nExisting materials are as follows: [our selling points], [client pain points]\nPlease output: a proposal with background & pain point / our solution / expected benefit / collaboration steps / next step\nOutput format: five-paragraph form, each with a subheading\nConstraints: use [TBD] placeholder for benefit numbers, never invent; no competitor secrets\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] I verified the notice's time, place, and contact person.\n- [ ] Weekly-report data are real, not exaggerated, and no unpublished performance leaked.\n- [ ] The proposal's benefit / pricing uses a \"TBD\" placeholder — no AI-fabricated numbers.\n- [ ] Tone fits the reader (different for your boss vs. a group chat).\n- [ ] All three went through at least one round of iterative editing, not copied straight from the first draft.\n\n## VII. Common Mistakes\n\n1. **No reader distinction**: Writing a weekly report to your boss in \"group-chat tone.\"\n2. **Letting AI invent numbers**: The proposal benefit is just made up as \"30% improvement.\" You must supply the numbers yourself.\n3. **Asking for too much at once**: Having AI write a 2000-word proposal that comes out hollow. Frame first, then fill.\n4. **No iteration**: Abandoning the draft just because it's not smooth. One \"make it tighter\" often fixes it.\n5. **Forgetting to mask**: Writing a real client name into a practice Prompt and sending it to public AI.\n\n## VIII. Homework (Deliverables)\n\n**Deliverable**: One copy each of the Notice + Weekly Report + Proposal three-piece set (simulated data is fine, but structure complete, tone correct, and key facts annotated).\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | The three-piece set is complete |\n| Quality | 25 | Clear structure, tone fits the reader |\n| Independent thinking | 25 | Adjusted to your own role, not copied verbatim |\n| Practicality | 25 | Templates reusable directly next week |\n\n---\n\n> **Red-line recap**: Numbers, pricing, and performance are provided by you; AI only builds the framework. Confidential data is not shared externally.\n", "03-会议和沟通-en.md": "# Lesson 3 · Meetings & Communication → Meeting Minutes + Follow-up List\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that the essence of \"meeting minutes\" is not \"writing it down\" but \"turning what happened into what needs to be done\"; master which of the three AI capabilities — information extraction / text summarization / tone rewriting — map to pre-, mid-, and post-meeting stages; know why \"owner + deadline\" are the two columns you can least afford to skip.\n- **Skill**: Turn a messy meeting transcript, chat log, or incoming email into a clearly structured, forwardable minutes or reply; use \"give examples (Few-shot)\" to make AI imitate your company's existing minutes style.\n- **Output**: A \"Standard Meeting-Minutes Template\" + a \"clear cross-department communication reply\" you can use in this week's meetings.\n\n> This lesson's methods reference Prompt-Engineering-Guide's real frameworks — \"Text Summarization,\" \"Information Extraction,\" and \"Prompt Elements (instruction / context / input / output indicator / examples)\" — translated into actions a working professional can use directly.\n\n## II. Warm-up Question\n\n> From last week's meeting, how many points did you note down? After it ended, how many items were actually followed up and completed on time?\n> Have you ever had this experience: the other party sends a 300-character, un-paragraphed WeChat/email with the key point buried in the third line, and after reading it twice you still don't know \"what exactly do they want me to do\"?\n\nMost professionals don't \"not know how to meet\" — they \"lose it after the meeting\": incomplete notes, unclear logic, inaccurate relaying. This lesson has AI do three things for you: **think through what to discuss before the meeting, turn talk into a list during/after, and turn vague external communication into clear communication.**\n\n## III. Core Concepts\n\n### 1. Meeting minutes = Information Extraction\n\nThe most valuable output of a meeting isn't \"who said what,\" but \"who, by when, must deliver what.\" This is exactly AI's strength — \"information extraction\": you give it source text, and it finds the elements \"decision / to-do / owner / deadline / risk\" and lists them in a table. You add one human check — are the names right, are the times wrong.\n\n### 2. Three kinds of meetings, three AI uses\n\n- **Meetings with recording/transcript text** (most common): paste the transcript to AI and have it output \"decisions + action-item table.\"\n- **Meetings with only scattered chats** (WeChat groups, DingTalk): paste the chat log to AI and have it summarize \"consensus reached\" and \"to-dos.\"\n- **Pure mental prep**: before the meeting, have AI list \"5 questions to confirm in this meeting\" — walk in with the list, double the efficiency.\n\n### 3. The \"golden five columns\" of structured minutes\n\nActionable minutes need at least five columns: **item / owner / deadline / current status / risk or coordination needed**. Of these, \"owner\" and \"deadline\" are the least skippable — minutes without these two columns equal no meeting at all.\n\n### 4. External communication = Tone Rewriting\n\nHand the other party's vague words, or what you want to say but fear offending, to AI to rewrite into a \"clear, tactful, no-blame\" version. This is the combo of \"instruction + reader\": tell AI who the reader is and what tone you want, and it removes the sting from your words.\n\n### 5. Give examples (Few-shot) to imitate your style\n\nEvery company's minutes style differs. Paste an old minutes your boss was happy with as an example and say \"write in this style,\" and the output fits your taste far better. This is called few-shot (example prompting), more accurate than describing the style from scratch.\n\n## IV. Real Work Scenario Demo\n\n### Case 1: Weekly-meeting minutes from \"running log\" to \"action table\"\n\n**Source material** (transcript excerpt): \"That client follow-up from last week still isn't done, Xiao Wang said this week, and then that poster is also late, design says waiting for assets, and next month's budget needs to be reported early…\"\n**AI approach**: Paste the text, ask it to \"extract action items, output in four columns: item / owner / deadline / status.\"\n**Output sample**:\n\n| Item | Owner | Deadline | Status |\n|---|---|---|---|\n| Client follow-up wrap-up | Xiao Wang | This Friday | In progress |\n| Poster production | Design (awaiting assets) | This Wed | Blocked: awaiting assets |\n| Next-month budget report | Me | 25th of month | Not started |\n\n**Human check**: Confirm \"Xiao Wang\" and \"Design\" are correct names/roles, and the deadlines match your memory, before sending to the group.\n\n### Case 2: Rewrite a vague counterpart email into a clear reply\n\n**Counterpart's original**: \"You guys figure out how to handle that thing, anyway ASAP, oh and the fee we mentioned before isn't quite right either.\"\n**AI approach**: \"Help me rewrite this reply into a professional, unambiguous version that moves the other party, and list 2 questions I need to confirm with them.\"\n**Output sample**: \"Regarding project progress, we suggest confirming plan A or B before this Wednesday; we also need you to confirm two points: (1) which specific payment does the fee discrepancy refer to? (2) does 'ASAP' mean within this week? Upon confirmation we will start immediately.\"\n**Human check**: Fee amounts and plan names must be filled with real info by you; AI doesn't invent numbers.\n\n### Case 3: Report upward so \"the boss gets it in 3 minutes\"\n\n**Pain point**: You have 8 things in hand; the boss only wants to know \"where's the progress, any blockers, what do you need from me.\"\n**AI approach**: Paste the messy progress, ask it to \"rewrite as 'conclusion first + 3 key points + 1 ask,' one sentence each.\"\n**Red line**: Contains unpublished performance / personnel changes — internal only, don't send out.\n\n## V. Hands-on Task\n\n- **Background**: You are a [role], with at least 1 meeting / 1 cross-department written communication this week.\n- **Input**: A meeting transcript or a vague message from the other party (please mask, use \"a client / Xiao Wang\" instead of real names).\n- **Steps**:\n  1. Use the \"minutes template\" below to generate a structured action table.\n  2. Use the \"communication reply template\" to rewrite a vague message into a clear reply.\n  3. Do 1 round of iteration each: \"make the tone more formal,\" \"bold the deadlines.\"\n  4. Human-verify names, times, amounts.\n- **Expected output**: 1 minutes + 1 communication reply.\n\n### This Lesson's Prompt Template (Standard Structure)\n\n**Meeting-minutes template**\n\n```\nYou are now playing the role of: a senior admin / project assistant skilled at turning meeting recordings into actionable to-do lists\nMy background is: I am a [role], just finished a [weekly / project / cross-department meeting], with transcript text but don't want to organize it line by line myself\nThe task I need to complete is: turn the meeting content into a structured work product\nThe target user / reader is: [attending colleagues / my boss]\nExisting materials are as follows: [paste transcript text or chat log, masked]\nPlease output: ① one-sentence meeting conclusion; ② action-item table with columns item / owner / deadline / status / risk; ③ items to escalate to the boss for decision\nOutput format: Markdown, conclusion first then table\nConstraints: don't fabricate names or times; use [TBD] placeholder for names if the source is unclear; no real client names or phone numbers\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Communication-reply template**\n\n```\nYou are now playing the role of: a tactful colleague who gets things resolved\nMy background is: the other party sent a vague message [paste], I need to reply but don't want to seem vague or evasive\nThe task I need to complete is: rewrite my reply into a clear, professional version that pushes the other party to give definite info\nThe target user / reader is: [counterpart's role, e.g., client / partner / superior]\nExisting materials are as follows: [counterpart's original words] + [result I want to achieve]\nPlease output: ① the full rewritten reply; ② a list of 2–3 key questions I need to confirm with the counterpart\nOutput format: reply body + question list, two sections\nConstraints: don't fabricate fees / times etc.; tone [professional / friendly]; don't expose internal secrets\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] Every \"owner\" in the minutes is a real person/role — no name AI conjured from nothing.\n- [ ] Every \"deadline\" matches my memory or calendar — no AI-fabricated dates.\n- [ ] I genuinely intend to send out and follow up the action table, not just do the homework and drop it.\n- [ ] Fees, plan names, and time points in the reply are real info I filled in.\n- [ ] Minutes with unpublished info were sent internally only, not mistakenly to an external group.\n\n## VII. Common Mistakes\n\n1. **Treating AI like a voice recorder**: thinking pasting it in is fully automatic. AI does \"organizing\"; the raw transcript may drop words, and you must supply key conclusions.\n2. **Missing owner/time**: minutes only say \"do X\" with no one claiming it and no deadline — equal to not writing it.\n3. **Copying without adjusting tone**: AI's reply is too stiff/too soft, doesn't fit your relationship with the other party, and sending it is awkward.\n4. **Forgetting to mask**: dropping a chat log with real client names into public AI for minutes.\n5. **No iteration**: redoing from scratch just because the first version's format is off; actually saying \"add a risk column\" is ten times faster than rewriting.\n\n## VIII. Homework (Deliverables)\n\n**Deliverable**: ① A real or simulated \"Structured Minutes\" (with conclusion + action table + escalation items); ② a \"Clear Cross-Department Reply\" (targeting a vague message). Simulated data is fine, but structure complete and key facts annotated with \"[TBD].\"\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | Both minutes + reply present, structure complete |\n| Quality | 25 | All five columns, conclusion first, appropriate tone |\n| Independent thinking | 25 | Adjusted to your role, not a verbatim copy of the case |\n| Practicality | 25 | Template reusable directly in this week's meetings |\n\n---\n\n> **Red-line recap**: You verify names, times, and amounts; client/internal secrets stay out of public AI; AI gives a draft — you review it before sending.\n", "04-销售和客服-en.md": "# Lesson 4 · Sales & Customer Service → Scripts / Objection Handling / Client Follow-up\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that \"scripts\" aren't rote-memorized but generated live from \"scenario + audience\"; master \"give examples (Few-shot)\" to teach AI your winning-script style; understand that \"objection handling\" can be broken into four steps — empathize → clarify → evidence → advance — using \"Chain-of-Thought\"; know why AI must never promise price, delivery, or policy on your behalf.\n- **Skill**: Generate ice-breaking / follow-up / closing scripts for any sales scenario; produce tactful responses to common objections like \"too expensive\" / \"let me think\" / \"competitor is cheaper\"; hand your product FAQ / policy docs to AI so it answers customer questions based on \"your materials\" (a Retrieval-Augmented Generation / RAG approach) rather than making things up.\n- **Output**: A \"Sales Script Library\" (ice-breaking, follow-up, 3 objection types) + a \"Customer-Service Standard Reply + Complaint-Soothing Template.\"\n\n> This lesson's methods reference Prompt-Engineering-Guide's real frameworks — \"Few-shot,\" \"Chain-of-Thought,\" \"Classification,\" \"RAG (Retrieval-Augmented Generation),\" \"Responsible AI\" — plus the RAG idea from LLM Universe of \"turning materials into a queryable knowledge base.\"\n\n## II. Warm-up Question\n\n> When a client says \"too expensive,\" what's your usual next line? Do you freeze, or is it different every time, relying on inspiration?\n> When a client asks a question you've answered 100 times (\"can you issue an invoice?\" \"how long to ship?\"), are you hand-typing the 101st?\n> With 40 WeChat clients, who needs a follow-up, who last said \"let me think\" — can your brain still hold it all?\n\nSales and customer service are \"script-intensive + repetition-intensive\" roles. AI doesn't sell for you; it turns your \"inspiration-type scripts\" into an \"on-call ammunition library,\" and turns \"repetitive Q&A\" into \"capture once, reuse forever.\"\n\n## III. Core Concepts\n\n### 1. Script = scenario × audience, generated live\n\nGood scri
