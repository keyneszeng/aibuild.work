pts have no standard answer, only \"right person + right matter + right tone.\" You give AI three things — **client type, communication stage, desired vibe** — and it generates several versions for you to pick. More flexible than memorizing, steadier than improvising.\n\n### 2. Give examples (Few-shot): let AI learn your \"winning flavor\"\n\nPaste a real winning chat log of yours (masked) to AI and say \"in this tone and logic, write a new ice-breaking script.\" AI will imitate your rhythm instead of handing you a strange mass template. This is the core value of few-shot: **use your good examples to teach AI your good.**\n\n### 3. Objection handling = Chain-of-Thought\n\nWhen a client says \"too expensive,\" don't rush to throw a discount. Have AI reason in four steps: **① empathize (I get that the budget must be calculated) ② clarify (who are you comparing with / total price or monthly fee?) ③ evidence (our differentiated value / case) ④ advance (give you a small trial / plan first)**. Make it \"go step by step\" — more professional than a one-line discount.\n\n### 4. Customer-service standard reply = based on your materials (RAG approach)\n\nWhat customer service fears most is AI \"inventing company policy.\" The right way: paste your \"Product FAQ\" / \"Return & Exchange Policy\" into the conversation (or upload to a tool that supports a knowledge base), and tell AI \"answer only based on the materials I gave; if the materials don't cover it, honestly say 'I'll confirm and get back to you.'\" This is Retrieval-Augmented Generation (RAG) — **let AI answer based on your facts, not make them up from memory.**\n\n### 5. Client tiering & emotion recognition = Classification\n\nPaste client messages to AI and have it tag \"high/medium/low intent\" and \"emotion: calm / dissatisfied / angry,\" so you prioritize the high-heat ones. This is the everyday use of classification tasks.\n\n### 6. Red line: AI doesn't promise for you\n\nPrice, discount, delivery time, warranty policy — these **only you can give**; AI must not invent them. Any specific promise in a script uses a \"[TBD by me]\" placeholder.\n\n## IV. Real Work Scenario Demo\n\n### Case 1: First-touch ice-breaking script (masked)\n\n**Background**: Added a new potential client on WeChat; need a non-awkward opener.\n**AI output** (excerpt): \"Hi Manager Wang, I'm [nickname] in [industry]. Saw your company is doing [business]; we just helped a similar company cut [pain point] by 30%. If convenient, may I send you a 1-page case for reference?\"\n**Human check**: The 30% is your real case data — don't let AI invent it; use the real surname in the address.\n\n### Case 2: \"Too expensive\" objection handling\n\n**AI four steps**: ① \"Totally understand, the budget surely needs to be clear\" ② \"Just to confirm, are you comparing with which vendor's plan? More concerned about total price or long-term cost?\" ③ \"Our difference is [three points]; client XX achieved [real result] after use\" ④ \"How about I open a [trial / small order] first, so you can feel it before deciding?\"\n**Red line**: The \"real result\" in step ③ must be filled by you; AI doesn't invent.\n\n### Case 3: Customer-service complaint soothing\n\n**Background**: A client blows up over slow shipping.\n**AI output**: ① acknowledge emotion first — \"truly sorry for the long wait\" ② give facts — \"your order is currently at step X, expected to ship Y\" ③ give compensation plan — \"[TBD by me]\" ④ leave follow-up — \"I'll notify you the moment it ships.\"\n**Key**: Facts and compensation must both be filled with real info by you.\n\n## V. Hands-on Task\n\n- **Background**: You are a [sales / CS], with real or simulated client communication scenarios.\n- **Input**: 1 past script of yours (masked) or 1 real objection, 1 common client question.\n- **Steps**:\n  1. Use the \"script generation template\" to produce 1 version each of ice-breaking + follow-up (use your example for few-shot).\n  2. Use the \"objection handling template\" to handle \"too expensive\" and \"let me think.\"\n  3. Use the \"customer-service reply template\" to answer 1 client question based on your pasted FAQ.\n  4. Human-verify all prices / policies / data are \"[TBD by me]\" or real values.\n- **Expected output**: 1 script library + 2 objection responses + 1 customer-service reply.\n\n### This Lesson's Prompt Template (Standard Structure)\n\n**Script generation template**\n\n```\nYou are now playing the role of: a [industry] salesperson with 5 years of experience, down-to-earth, not sleazy\nMy background is: I am a [role], reaching [client type], currently at the [ice-breaking / follow-up / closing] stage\nThe task I need to complete is: write a WeChat / phone opening script\nThe target user / reader is: [client role and pain point]\nExisting materials are as follows: [my product selling points] + [a past winning script of mine (masked) as example]\nPlease output: 2 versions of the script, one leaning [professional] and one [friendly], each under 80 words\nOutput format: two versions side by side, labeled with suitable timing\nConstraints: don't fabricate client case data; price/policy use [TBD by me]; no real client names\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Objection handling template**\n\n```\nYou are now playing the role of: a sales consultant skilled at dissolving client concerns\nMy background is: the client says \"[too expensive / let me think / competitor cheaper]\", I don't want to cut price directly\nThe task I need to complete is: respond following the four steps empathize → clarify → evidence → advance\nThe target user / reader is: this client\nExisting materials are as follows: [our differentiated value] + [one real client result, masked]\nPlease output: four-step script, one sentence per step; end with 1 non-price alternative (e.g., trial)\nOutput format: four numbered steps + alternative\nConstraints: evidence-step data must be filled by me with [real data], AI doesn't invent; don't promise discounts I'm not authorized to give\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Customer-service reply template (based on materials / RAG approach)**\n\n```\nYou are now playing the role of: a patient, professional customer-service rep\nMy background is: the client asks \"[question]\", I have standard materials to reference\nThe task I need to complete is: based on the materials, give an accurate, emotion-soothing reply\nThe target user / reader is: this client\nExisting materials are as follows: [paste the relevant paragraphs of your FAQ / policy doc]\nPlease output: ① one sentence of empathy first; ② a facts-based answer from the materials; ③ next-step action\nOutput format: three-paragraph form, total under 120 words\nConstraints: answer only based on the materials I gave; if not covered, clearly say \"I'll confirm and get back to you\" — never fabricate policy / time / compensation\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] Client cases/data in the scripts are real or clearly \"[TBD],\" with no AI-fabricated percentages.\n- [ ] The \"evidence\" in objection-handling step ③ comes from my real business, not invented by AI.\n- [ ] Customer-service reply facts (shipping / returns / invoices) match my policy doc.\n- [ ] Anything involving price, discount, or delivery promises was filled by me; AI didn't promise on its own.\n- [ ] No real client names, phone numbers, or order numbers fed to public AI.\n\n## VII. Common Mistakes\n\n1. **Letting AI invent cases**: \"50% improvement\" was made up by AI. Case data must come from you.\n2. **Cutting price the moment an objection appears**: AI helps you advance in four steps — don't skip empathy/clarify and throw a discount.\n3. **Letting AI freelance the policy**: asking \"can I return it?\" without pasting materials — AI may promise recklessly. Always use the RAG approach: give materials, limit scope.\n4. **Too templated scripts**: not feeding your own examples yields generic pitches. Use few-shot to learn your flavor.\n5. **Forgetting to mask**: dropping client chat logs as-is into public AI.\n\n## VIII. Homework (Deliverables)\n\n**Deliverable**: 1 \"Sales Script Library\" (with ice-breaking, follow-up, 2 objection types, clear structure) + 1 \"Customer-Service Standard Reply\" (based on your pasted materials, with soothing + facts + next step). Simulated data must be masked, and key facts marked \"[TBD by me].\"\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | Script library + customer-service reply complete |\n| Quality | 25 | Four objection steps complete, tone appropriate, material-based |\n| Independent thinking | 25 | Integrated with your own industry/examples, not copied |\n| Practicality | 25 | Scripts directly usable in this week's client communication |\n\n---\n\n> **Red-line recap**: Price, policy, and delivery promises can only come from you; customer-service replies must be based on your real materials; client privacy stays out of public AI.\n", "05-内容运营-en.md": "# Lesson 5 · Content Operations → Topic Selection / Copy / Short-Video Script\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that \"content production\" can be broken into four steps — topic selection → headline → body → rewrite-for-distribution — and AI can lend a hand at each; master \"multi-angle brainstorming\" and \"imitate a hit example's style (Few-shot)\"; know why AI-written content must pass \"originality check + no exaggerated efficacy,\" or you cross the advertising-law red line.\n- **Skill**: Produce 20 topic angles, multiple headline versions, one body draft, and one short-video script framework at once; rewrite one long article into three distribution drafts with different tones for Moments / Weibo / Xiaohongshu.\n- **Output**: A \"This Week's Topic Library (≥20 items)\" + 1 \"Multi-version Copy\" + 1 \"Short-Video Script Framework.\"\n\n> This lesson's methods reference Prompt-Engineering-Guide's \"Creativity,\" \"Few-shot (style imitation),\" \"Text Summarization (condensing),\" and \"Prompt Chaining\" — breaking a big task into multiple steps, feeding each step's result into the next.\n\n## II. Warm-up Question\n\n> This week you need to post 3 articles; you stared at a blank doc half a day for a headline, and the one you finally posted got single-digit reads?\n> A short-video script — you have the scene in your head but can't write the shot list, so it sat a week unwritten?\n> Same piece of solid content posted on WeChat official account — should you tweak it before posting to Moments? Do you usually \"copy-paste\" or \"can't be bothered to post a second time\"?\n\nThe pain of content operations isn't \"nothing to write,\" but \"can't think of it, can't write fast, posted with no splash.\" AI doesn't invent creativity for you; it gives you **a whole table of candidates**, and you pick the best.\n\n## III. Core Concepts\n\n### 1. Four content steps, AI can help at each\n\n- **Topic selection**: Give AI your product / niche / target audience, and it gives 20 angles at once (emotion / substance / controversy / story / comparison).\n- **Headline**: Generate 10 headlines for the same theme, categorized as \"suspense / number / pain-point / identity,\" and you pick.\n- **Body**: Give it a skeleton to expand, or a first draft to retone.\n- **Distribution rewrite**: Rewrite the same content into official-account / Moments / short-video-narration versions, saving you a rewrite.\n\n### 2. Multi-angle brainstorming: don't ask for one, ask for a dozen\n\n\"Give me 3 headlines\" is worse than \"give me 20, covering 5 styles.\" AI excels at volume; you excel at picking. The essence of creative work is \"cast wide, then select\" — exactly the human-AI division.\n\n### 3. Imitate a hit example (Few-shot)\n\nPaste your single highest-read article to AI and say \"in this opening style and rhythm, write 3 new ones.\" AI learns your \"hit DNA,\" fitting your fans' taste better than writing from scratch.\n\n### 4. Prompt Chaining: do long content step by step\n\nDon't ask for a \"complete video\" at once for a short-video script. First have AI give \"3 topics\" → you pick 1 → have it give a \"shot-list script (visual / narration / duration)\" → then have it write \"headline and cover copy.\" Feed each step to the next; quality beats one-shot.\n\n### 5. Red line: original, no exaggeration, no copying\n\nAI may \"stitch together\" existing online content. Before publishing you must do an **originality check**: are the core views yours / your team's; do the data have sources; do the efficacy claims cross \"absolute language\" (best / #1 / 100% effective) — that's an advertising-law minefield. What AI writes isn't automatically publishable.\n\n## IV. Real Work Scenario Demo\n\n### Case 1: Topic library from 0 to 20 in a week\n\n**Input**: \"We do workplace Excel training; target users are admin/finance beginners.\"\n**AI output** (excerpt): ① \"These 3 Excel shortcuts make the admin girl faster the same day\" ② \"Finance month-end reconciliation — save 2 hours with this trick\" ③ \"The table the boss wants is actually solved by 1 formula\"… 20 items total, tagged \"substance / emotion / story\" type.\n**Human pick**: Choose 3 for this week, the rest go into the topic pool.\n\n### Case 2: Same substance rewritten for three platforms\n\n**Original**: An 800-word \"reconciliation speed-up\" piece.\n**AI distribution**: Official-account version (structured long-form) / Moments version (colloquial + emoji + question hook) / Xiaohongshu version (list format + cover title \"finance sisters must save\").\n**Red line**: Data real, no exaggerated words like \"10x faster.\"\n\n### Case 3: Short-video script framework\n\n**Input**: \"Explain the point 'don't write weekly reports as a running log,' 30 seconds.\"\n**AI output**: Shot list — 0–5s pain hook \"your boss doesn't read your weekly report?\"; 5–20s three tricks (conclusion first / chunking / write the ask); 20–30s call-to-action \"comment '1' to get the template.\"\n**Human**: Read the narration through yourself; don't read it like a robot.\n\n## V. Hands-on Task\n\n- **Background**: You are an [operator / sole proprietor], producing content this week.\n- **Input**: Your product / niche / target audience (masked — don't write real company secrets or tactics).\n- **Steps**:\n  1. Use the \"topic template\" to produce ≥20 items, tag types, pick 3.\n  2. For 1 chosen item, use the \"headline + body template\" to produce multiple versions.\n  3. Use the \"short-video script template\" to produce 1 30–60s shot list.\n  4. Do an originality check: data sourced, no absolute language.\n- **Expected output**: One each of topic library + multi-version copy + short-video script.\n\n### This Lesson's Prompt Template (Standard Structure)\n\n**Topic template**\n\n```\nYou are now playing the role of: a content operator who understands [industry] and is good at grabbing user pain points\nMy background is: we do [product/service], target users are [audience], this week need [number] pieces of content\nThe task I need to complete is: generate a batch of topics\nThe target user / reader is: [that audience's real anxiety]\nExisting materials are as follows: [our selling points / recent hotspots, masked]\nPlease output: ≥20 topics, each with a headline direction + a type tag (substance / emotion / story / comparison / controversy)\nOutput format: numbered list, type in parentheses after\nConstraints: don't copy specific accounts; no competitor secrets; positive and compliant angles\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Headline + body template**\n\n```\nYou are now playing the role of: a high-conversion, non-preachy content writer\nMy background is: the topic is \"[chosen topic]\", readers are [audience]\nThe task I need to complete is: write 1 body + give it 5 differently-styled headlines\nThe target user / reader is: [that audience]\nExisting materials are as follows: [core info points, masked]\nPlease output: ① 5 headlines (one each: suspense / number / pain-point / identity / contrast); ② one body version, structure: hook + 3 points + call-to-action\nOutput format: headlines first, body after, Markdown\nConstraints: data use [TBD] or real source; no \"best / #1 / 100%\" absolute language; don't fabricate cases\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Short-video script template (Prompt Chaining step 2)**\n\n```\nYou are now playing the role of: a short-video director\nMy background is: selected topic \"[topic]\", duration [30/60] seconds, platform [Douyin / Channels]\nThe task I need to complete is: write a shot-list script\nThe target user / reader is: [audience]\nExisting materials are as follows: [key knowledge points]\nPlease output: a shot-list table with columns time / visual / narration / caption, ending with 1 cover-title line\nOutput format: table + one cover-title line\nConstraints: natural non-preachy narration; no exaggerated-effect promises; accurate knowledge points\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] Topics come from my real business, not copied from a specific account.\n- [ ] Data in the copy have real sources or are marked \"[TBD]\" — no AI-fabricated percentages.\n- [ ] No absolute/exaggerated language like \"best / #1 / 100% effective.\"\n- [ ] Core views are our original or authorized, not directly lifted.\n- [ ] I read the short-video narration through; it doesn't sound like a robot reading.\n\n## VII. Common Mistakes\n\n1. **Asking for a \"complete video\" at once**: yields hollow output. Use prompt chaining step by step: topic → shot list → narration.\n2. **Letting AI invent data**: \"user growth 200%\" was made up. You supply data or cite sources.\n3. **Copying without originality check**: AI stitched online content; you publish it = plagiarism. Self-check before posting.\n4. **Clickbait overkill**: writing exaggerated headlines for clicks — loses followers and breaks rules. Have hooks, keep the bottom line.\n5. **Forgetting to mask**: writing unpublished campaign tactics into a Prompt sent to public AI.\n\n## VIII. Homework (Deliverables)\n\n**Deliverable**: ① \"This Week's Topic Library\" ≥20 items (tagged by type); ② \"Multi-version Copy\" for 1 chosen item (5 headlines + 1 body); ③ 1 \"Short-Video Shot-List Script.\" Simulated data must be masked, with data sourced / marked \"[TBD].\"\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | Topic library + copy + script all three present |\n| Quality | 25 | Diverse angles, hooks in headlines, shootable script |\n| Independent thinking | 25 | Integrated with your own business, not copied from the case |\n| Practicality | 25 | Directly usable in this week's content production |\n\n---\n\n> **Red-line recap**: Data sourced or marked TBD, no exaggeration, check originality; operations strategy / unpublished tactics stay out of public AI.\n", "06-表格和数据-en.md": "# Lesson 6 · Spreadsheets & Data → Data Summaries / Business Analysis\n\n**For**: Admins, finance staff, store managers, sole proprietors, small-team leads (no formula-writing or coding needed)\n**Recommended duration**: 90 min (40 min lecture + 50 min hands-on)\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that \"reading data\" has three layers — **read the numbers (what happened) → attribute the cause (why) → recommend (so what)**. AI is best at expressing the first and third layers; the second layer must be your judgment. Master \"explain what each column means before pasting a table to AI\" (provide context). Understand how important it is that AI **can't do arithmetic** — it is a \"language model,\" not a \"calculator,\" so you must verify every number yourself.\n- **Skill**: Turn a monthly report into a \"data summary script\" your boss can grasp in three minutes; design which metrics and how to read each for a \"business-analysis dashboard\" from scattered operational numbers; get AI to write the *how-to* steps for \"which Excel formula / how to build a pivot table\" instead of letting it calculate for you.\n- **Output**: A *Data-Summary Script* (ready to send to a group or report) + a *Business-Analysis Dashboard Spec* (lists metrics, definitions, interpretation, and warning thresholds).\n\n> This lesson references Prompt-Engineering-Guide's real frameworks — \"Information Extraction,\" \"Text Summarization,\" \"Reasoning / Mathematics (the limits of reasoning and math),\" and \"Factuality (factual-risk)\" — with one key reminder: AI gets arithmetic wrong, a well-known weakness, so this lesson makes \"you verify the numbers\" a hard red line.\n\n## II. Warm-up Question\n\n> Month-end: you've finished the spreadsheet, and your boss asks \"so?\" — can you only say \"uh… it's all in the table\"?\n> You have sales records, a client list, and a cost sheet, but can't say \"was this month good or bad, and where exactly did it fall short\"?\n> Or the opposite: you know perfectly well how the business is doing, but the moment you write the report it becomes a pile of numbers nobody can read?\n\nMost people's problem isn't \"no data\" — it's that **nobody walks the road from data to conclusion for them**. In this lesson, AI does three things for you: **translate numbers into plain language, organize scattered metrics into a dashboard, and write the conclusion into report-ready words.** Arithmetic and attribution stay with you.\n\n## III. Core Concepts\n\n### 1. AI is not a calculator — the first red line of this lesson\nHanding \"what is 1234 × 0.87\" to AI, it may give you a number that looks right but is wrong. **Do all sums, percentages, and period-over-period comparisons in Excel, or on your own calculator.** AI's value is: you give it the numbers, and it helps you *interpret*, *organize*, and *express*. Remember this division of labor and you won't have a major accident.\n\n### 2. Before pasting a table, explain \"what each column is\"\nPaste a pile of numbers straight to AI and it will guess blindly. The right move is to give a \"data dictionary\" first:\n> \"Below is our June store transaction flow. Column A = date, B = foot traffic, C = number of orders, D = sales amount (RMB), E = return amount (RMB).\"\nState the definitions and AI's interpretation accuracy jumps a tier immediately. That is \"providing context.\"\n\n### 3. The \"three-part script\" for a data summary\nA reportable data summary is always these three parts:\n- **Conclusion**: how the month went overall (one sentence, with the single most critical number)\n- **Highlights & problems**: what's good (2 points), what's bad (2 points), each with a number\n- **Next step**: so I suggest doing what (1–2 concrete actions)\nNumbers with no \"so what\" is not a report — it's just handing over a table.\n\n### 4. A business dashboard = choosing the right 5 metrics\nA dashboard is not \"more metrics are better\" — it's \"fewer is better, but you must pick right.\" A small business usually watches these five:\n- **How much came in** (foot traffic / leads)\n- **How much converted** (conversion rate)\n- **How much per order** (average order value)\n- **How much came back** (repurchase rate / returning customers)\n- **How much is left** (gross / net margin)\nHave AI help you fill these five boxes with concrete metrics + definitions + warning thresholds for your own business.\n\n### 5. Let AI teach you the operation, not calculate for you\n\"How do I summarize sales by month in this sheet?\" — have AI give you the *pivot-table click steps* or the *formula syntax*; you execute in Excel, so the result is Excel's calculation and is trustworthy. This is a hundred times safer than letting AI quote the number directly.\n\n### 6. Treat anomalous numbers as \"suspect,\" don't \"invent causes\"\nAI seeing \"July sales down 30%\" will naturally hand you a pile of reasons: \"could be seasonality, could be competitor promotions\" — **all of this is guessed.** Only you know the real cause (the store was under renovation that week; that big client order was pushed to August). So the dashboard needs a column called \"Attribution (filled by human).\"\n\n## IV. Real Work Scenario Demo\n\n### Case 1: A store's monthly report from \"a pile of numbers\" to \"three sentences\"\n**Source material** (a sole proprietor's notes): \"June flow 186k, May was 212k. About 1400 came in, 620 orders. Returns over 8k. Weekends much better than weekdays.\"\n**AI approach**: Paste the data + state definitions, ask for \"a three-part data summary: conclusion / highlights & problems / next-step recommendation, each with numbers.\"\n**Output sample**:\n> **Conclusion**: June sales 186k, down about 12% vs. May, mainly dragged by weekday foot traffic.\n> **Highlights**: conversion ~44% (620/1400), healthy; weekends contribute steadily.\n> **Problems**: ① down 26k vs. prior month; ② returns 8k, ~4.3% of flow, suggest checking the return-concentrated categories.\n> **Next step**: ① run a weekday lunchtime traffic campaign; ② pull return details, confirm if concentrated in a certain batch.\n**Human check**: I verified the 186/212 MoM and 620/1400 conversion on my calculator myself; the line \"weekends steady\" is my judgment, not AI-invented.\n\n### Case 2: Design a business dashboard for your own small business\n**Input**: \"I run a 20-sqm neighborhood bakery, just me and one clerk; everything is in WeChat Pay records and a notebook.\"\n**AI output** (excerpt):\n| Metric | How to compute | How often | Warning line |\n|---|---|---|---|\n| Avg daily order value | daily flow ÷ daily orders | daily | below 25 RMB, check over-promotion |\n| Weekly returning customers | customers who visited ≥2× in a week | weekly | two weeks of decline → member follow-up |\n| Spoilage rate | spoilage cost ÷ daily purchase cost | daily | above 8% → adjust daily stock |\n**Human gate**: The warning lines I must adjust by my own cost structure — AI's 25 RMB and 8% are only a starting reference, not truth.\n\n### Case 3: Turn the boss's \"analyze this\" into a structured answer\n**Pain point**: The boss drops \"analyze this quarter's data\" and you don't know where to start.\n**AI approach**: \"I have [these data]; first tell me which 6 questions to ask for this kind of business, then tell me which column each question needs.\"\n**Result**: AI gives you an \"analysis outline + required-data list\"; you go collect and calculate accordingly, and the thinking clears up at once.\n**Red line**: Don't paste real client lists or employee salary details wholesale into public AI; use \"Client A / Employee 1\" instead.\n\n## V. Hands-on Task\n\n- **Background**: You are a [role / store owner] with real (or simulated) operational data for this or last month.\n- **Input**: A 10–30 row table, **must be masked**: client names → \"Client A,\" employee names → \"Clerk 1,\" no ID numbers / phones / bank cards.\n- **Steps**:\n  1. First compute the sums and percentages you need in Excel (or by hand) and write them beside.\n  2. Use the \"Data Summary Template\" below to generate a three-part summary, giving AI the numbers you computed — let it only handle expression.\n  3. Use the \"Dashboard Design Template\" to generate a 5-metric dashboard spec for your business.\n  4. Check one by one: does each number AI repeats match what you computed? Fix directly if not.\n  5. One iteration: \"make the conclusion shorter\" / \"change the recommendation into actions I can execute next week.\"\n- **Expected output**: 1 *Data-Summary Script* + 1 *Business-Analysis Dashboard Spec*.\n\n### This Lesson's Prompt Template (Standard Structure)\n\n**Data summary template**\n```\nYou are now playing the role of: a business-analysis consultant skilled at turning operational data into plain language\nMy background is: I am a [role / store owner], need to report [month] operations to [boss / partner / myself], I don't want to just hand over a table\nThe task I need to complete is: organize my data into a report-ready three-part summary\nThe target user / reader is: [my boss / partner], who has only 3 minutes and cares only about conclusions and next steps\nExisting materials are as follows:\n  Data definition notes: [A=date, B=foot traffic, C=orders, D=sales amount…]\n  Data: [paste masked table]\n  Key numbers I already computed: [MoM -12%, conversion 44%…]\nPlease output: ① one-sentence conclusion (with the single most critical number); ② 2 highlights + 2 problems, each with a number; ③ 1–2 specific, actionable next-step recommendations\nOutput format: three parts, titled \"Conclusion / Highlights & Problems / Next Step\"\nConstraints: DO NOT do any addition, subtraction, multiplication, division, or percentage calculation yourself — only quote the numbers I give you; write [TBD] where a number is uncertain; do not guess the reason for a decline, leave \"[attribution pending]\" there; no real client or employee names\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Business-analysis dashboard design template**\n```\nYou are now playing the role of: a consultant who helps small businesses build simple dashboards — pragmatic, no jargon piles\nMy background is: I run a [business type / size], data currently scattered in [WeChat Pay / notebook / Excel], no fixed habit of checking numbers\nThe task I need to complete is: design a dashboard spec I can use long-term\nThe target user / reader is: myself and [clerk / partner], none of us know data analysis\nExisting materials are as follows: [what data I can get, basic cost structure of the business, masked]\nPlease output: a dashboard table listing metric name / how to compute (in plain words) / where the data comes from / how often to check / suggested warning line / attribution column (human-filled); keep to 5–7 metrics and explain why these\nOutput format: Markdown table + one line per metric \"what it usually means when this number gets worse\"\nConstraints: don't require me to adopt any new system or write code; mark warning lines as \"suggested starting point, adjust by my actual cost\"; don't fabricate industry-standard values — if cited, label as \"experience reference value\"\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n**Excel operation tutorial template**\n```\nYou are now playing the role of: a patient Excel teacher for zero-basis admin/finance staff\nMy background is: I have a table [describe structure], I want to [summarize / compare / dedupe / find anomalies], but I don't know formulas and dare not use pivot tables\nThe task I need to complete is: get step-by-step instructions I can follow by clicking\nThe target user / reader is: myself, who only knows typing and SUM in Excel\nExisting materials are as follows: [table column-structure description, no real data]\nPlease output: ① which method to use (formula or pivot) and why; ② step-by-step instructions, one action per line, stating clearly what to click; ③ how I verify the result is correct after finishing\nOutput format: numbered steps, one short sentence each\nConstraints: don't compute any result for me, only teach the method; formulas given must be paste-ready with each part explained; flag any Excel version differences\nFirst ask me 3 key questions; if the information is sufficient, start directly.\nPlease output a version directly usable in work scenarios, with a checklist attached\n```\n\n## VI. Human Review Checklist\n\n- [ ] **Every number was computed by me in Excel or on a calculator**, not reported by AI; I checked each number AI repeated against my own.\n- [ ] The three most error-prone types — MoM, YoY, percentages — I recomputed separately.\n- [ ] I stated the data definitions clearly (\"sales\" = tax-inclusive or not, returns deducted or not); AI did not assume on its own.\n- [ ] Every \"down / up\" reason is a real business reason I filled in, not AI's guessed \"could be seasonality.\"\n- [ ] The table contains no real client names, phones, ID numbers, bank accounts, or employee salary details.\n- [ ] I adjusted the dashboard warning lines to my own cost structure, not copied AI's reference values.\n- [ ] I genuinely dare to send this summary to my boss — not a single number in it I can't explain.\n\n## VII. Common Mistakes\n\n1. **Letting AI do arithmetic**: the most frequent and most fatal. Whether AI computes 18.6÷21.2 as -12% or -14%, if you don't check before sending, you get caught in the meeting and lose all trust. **Numbers to Excel, words to AI.**\n2. **Not stating column meanings**: dump a pile of numbers, AI reads \"return amount\" as \"sales amount,\" and the whole conclusion is wrong. Write the data dictionary before pasting.\n3. **Accepting AI-invented causes**: \"the decline may be intensified market competition\" — true for any industry, means nothing. Attribution must be yours; you know the store was under renovation that week.\n4. **Piling 20 dashboard metrics**: too many and you watch none. 5–7, each with a warning line and an action, is what actually gets used.\n5. **Pasting sensitive data wholesale into public AI**: client lists, employee salaries, unpublished revenue are trade secrets. Mask them or use an internal compliant tool.\n\n## VIII. Homework (Deliverables)\n\n**Deliverables**:\n1. A *Data-Summary Script*: three-part (conclusion / highlights & problems / next step), each with numbers, ending with one line \"all numbers in this report were computed and verified by me in Excel.\"\n2. A *Business-Analysis Dashboard Spec*: 5–7 metrics, with computation, data source, frequency, warning line, attribution column.\n3. A 100-word *My Number-Verification Log*: state which numbers you recomputed and whether you found AI repeating any wrong.\n\nSimulated data is fine, but must be masked, structurally complete, with key facts marked \"[TBD].\"\n\n## IX. Grading Rubric\n\n| Dimension | Max | Description |\n|---|---|---|\n| Completion | 25 | Data summary + dashboard spec + verification log all present |\n| Quality | 25 | Clear three-part structure, right metrics chosen, reasonable warning lines, definitions stated |\n| Independent thinking | 25 | Attribution is your own business judgment, dashboard fits your business, not copied from the case |\n| Practicality | 25 | Dashboard truly usable next month, summary script sendable to boss |\n\n---\n\n> **Red-line recap**: **AI doesn't calculate — every number is verified by a human**; state data definitions first; the reason for a decline is filled by a human, AI may not guess; client lists, employee salaries, and unpublished revenue stay out of public AI. Remember this lesson's only slogan — **human judges, AI assists; numbers to Excel, words to AI.**\n", "07-管理和招聘-en.md": "# Lesson 7 · Management & Hiring → Job Descriptions / Interview Questions / Team Retrospectives\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that the document work of \"hiring\" and \"leading\" can be massively compressed by AI; master the \"give key points → AI expands\" JD-writing method; use AI to generate structured interview questions from a role profile; turn a retrospective meeting into a \"problem — cause — action\" list.\n- **Skill**: Produce a professional JD in 30 minutes; generate 8–10 layered interview questions for a role; organize retrospective audio/notes into a trackable improvement table.\n- **Output**: A *Hiring Package* (JD + interview questions + scoring dimensions) + a *Team-Retrospective Improvement Table*.\n\n> This lesson references LLM-Universe's \"generate structured documents with templated prompts\" and Prompt-Engineering-Guide's \"role-play + explicit output structure\" techniques.\n\n## II. Warm-up Question\n\n> Hiring someone, but the JD takes half a day and still reads like a copy-paste?\n> Interview questions loop the same few lines, and afterward you can't compare candidates?\n> Two-hour retrospective, conclusion \"pay attention next time\" — and then there is no next time?\n\nHalf of management is \"writing the standard clearly.\" AI helps turn the requirements in your head into reusable documents.\n\n## III. Core Concepts\n\n### 1. JD = expand key points, not invent from nothing\nYou give AI \"role title + 3 core duties + what kind of person we want,\" and it expands into a professional JD. You own \"where the requirements come from\"; AI handles \"making it look proper.\"\n\n### 2. Layered interview questions: behavioral / professional / culture\nHave AI generate questions in three categories — behavioral (how they did in the past) / professional (can they do it) / culture (good fit) — and you pick. This is the basic skill of structured interviewing.\n\n### 3. Retrospective = problem — cause — action\nGive the retrospective content to AI and have it sort into three columns. Key point: what AI gives is a \"draft\"; the \"root cause\" and \"who's responsible\" must be decided by you.\n\n### 4. Red line: no discriminatory or untruthful wording\nNo age/gender discriminatory terms in the JD; salary range and duties must be real — don't publish AI-fabricated \"fake benefits.\"\n\n## IV. Real Work Scenario Demo\n\n### Case 1: A JD in half a day\n**Background**: Hiring a \"community operations\" specialist.\n**AI output**: A professional JD with [5 job duties / 4 requirements / plus-points / what we offer].\n**Human gate**: You fill real info for salary and reporting line; delete any untruthful words AI may add like \"ultimate flexibility\" or \"generous options.\"\n\n### Case 2: Retrospective becomes a list\n**Background**: Notes from a project-delay retrospective.\n**AI output**: | Problem | Root cause (to confirm) | Improvement action | Owner (to fill) |.\n**Human gate**: You decide the root cause, you assign the owner — AI doesn't make HR decisions for you.\n\n## V. Hands-on Task\n\n- **Background**: You are hiring or just finished a retrospective.\n- **Input**: Role key points, or a retrospective record.\n- **Steps**:\n  1. Use the \"JD Template\" to generate a hiring package.\n  2. Use the \"Interview Questions Template\" to generate layered questions.\n  3. Use the \"Retrospective Template\" to organize the improvement table.\n- **Expected output**: *Hiring Package* + *Team-Retrospective Improvement Table*.\n\n## VI. Prompt Template\n\n```\nYou are now playing the role of: a senior HR consultant\nI am hiring: [role title]\nCore duties (I'll dictate): [3–5 points]\nThe kind of person we want: [traits]\nPlease output: a JD with four sections [Job Duties / Requirements / Plus-points / What We Offer];\nthen 10 interview questions, tagged by [behavioral / professional / culture].\nConstraints: no discriminatory language of any kind; salary and benefits only what I provide, no fabrication.\n```\n\n## VII. Human Review Checklist\n\n- [ ] JD has no discriminatory language, salary is real\n- [ ] Interview questions cover all three types and can differentiate candidates\n- [ ] Retrospective root cause and owner confirmed by me\n- [ ] No candidate privacy leaked externally\n\n## VIII. Common Mistakes\n\n1. Publishing a JD with AI-fabricated \"fake benefits.\"\n2. Interview questions all useless ones like \"your biggest weakness.\"\n3. Letting AI guess the retrospective root cause, never landing it.\n4. Using AI to generate biased screening criteria.\n\n## IX. Homework\n\nSubmit a *Hiring Package* (JD + ≥8 layered questions) + a *Retrospective Improvement Table* (≥3 rows, root cause and owner filled in).\n\n## X. Grading Rubric\n\n- Completion: both deliverables present (40%)\n- Quality: professional JD with no discrimination, reasonable question layering (35%)\n- Grounding: retrospective root cause / owner human-confirmed (25%)\n", "08-私人工作流-en.md": "# Lesson 8 · Personal Workflow → Your Personal AI Assistant Spec\n\n## I. Learning Goals\n\n- **Knowledge**: Understand that a \"workflow\" is not buying a tool, but hardening what you repeatedly do into \"steps + templates + checkpoints\"; master the method of \"stringing the templates from the previous 7 lessons into one line.\"\n- **Skill**: Write your own *Personal AI Assistant Spec* — clearly stating \"who I am, what I often do, which template for each task, where I must gate it.\"\n- **Output**: A reusable *Personal AI Assistant Spec* (with scenario → template → red-line mapping).\n\n> This lesson integrates the previous 7 lessons' methodology, referencing LLM-Universe's \"harden capability into reusable process\" and Generative-AI-For-Beginners' \"embed AI into daily tasks\" ideas.\n\n## II. Warm-up Question\n\n> Learned a pile of AI tricks, but next week you still improvise \"how should I ask\" when something comes up?\n> On your team, if a different person takes over, nobody knows \"how do we use AI for this\"?\n> Want to turn your own AI experience into a process that \"runs without thinking\"?\n\nA personal workflow is writing down \"your way of using it,\" turning AI into a co-pilot that's there whenever you call.\n\n## III. Core Concepts\n\n### 1. Workflow = scenario × template × red line\nFor each high-frequency scenario, pair a fixed template and mark one \"human-gate point.\" Only with all three does it become a process.\n\n### 2. The spec is written for \"future you\"\nState clearly: who am I, what are my high-frequency scenarios, which template does each scenario call, and which items do I check after output.\n\n### 3. Continuous iteration: change it every time you use it\nWhenever AI answers wrong, reverse-engineer it — fix the template or add a checklist item. The spec is alive.\n\n### 4. Red-line principle: human judges, AI assists\nPrice / policy / privacy / high-risk decisions are always mine; AI only drafts.\n\n## IV. Real Work Scenario Demo\n\n### Case: String \"weekly report + client follow-up + data\" into a Monday routine\n**Spec excerpt**: \"Monday 9:00 → use the 'Weekly Report Template' to summarize last week → use the 'Follow-up Template' to generate the client list → use the 'Data Template' for insights → run all three through the 'Human Review Checklist' before sending.\"\n**Value**: No need to think each time — just follow the flow.\n\n## V. Hands-on Task\n\n- **Background**: Review all the templates and checklists you produced in the previous 7 lessons.\n- **Input**: Your own role and high-frequency scenarios.\n- **Steps**:\n  1. List your 5–8 most-used work scenarios.\n  2. Bind a template to each scenario (reference earlier files).\n  3. Mark 1–2 \"I must gate this\" points for each scenario.\n  4. Write it up as a spec.\n- **Expected output**: *Personal AI Assistant Spec*.\n\n## VI. Prompt Template (Spec Skeleton)\n\n```\nMy role: [position]\nMy high-frequency scenarios: [list 5–8]\nFor each scenario, the template and gate point:\n- Scenario 1 → use [template name] → I check [checklist item]\n- Scenario 2 → …\nOverall red lines: [human judges, AI assists; no privacy leakage; no making commitments on my behalf]\n```\n\n## VII. Human Review Checklist\n\n- [ ] Scenarios cover 80% of my repetitive work\n- [ ] Every scenario has a corresponding template\n- [ ] Every scenario marks a gate point\n- [ ] Red lines are clear and actionable\n\n## VIII. Common Mistakes\n\n1. The spec is too vague — \"use AI more\" with no concrete scenario.\n2. Lists only tools, not templates — still don't know how at a new scenario.\n3. Omits gate points, equal to no defense at all.\n\n## IX. Homework\n\nSubmit a *Personal AI Assistant Spec* with ≥5 scenarios, each with a template and a gate point.\n\n## X. Grading Rubric\n\n- Completion: spec complete (40%)\n- Quality: real scenarios, templates referenceable (35%)\n- Safety: gate points and red lines explicit (25%)\n", "09-六岗位工具包-en.md": "# Lesson 9 · Toolkit for Six Roles (Admin / Sales / Support / Operations / HR / Sole Proprietor)\n\n> 10+ real work scenarios per role. Each scenario includes [raw task / AI collaboration / sample Prompt / output sample / human review checklist / privacy-risk reminder].\n> Core principle: **human judges, AI assists; no code, API, or model parameters involved.**\n\n---\n\n## I. Admin & Clerical (10 scenarios)\n\n**Scenario 1: Write a meeting notice**\n- Raw task: Send a notice for the Wednesday regular meeting.\n- AI collaboration: Give key points → expand into a formal notice.\n- Sample Prompt: \"You are admin; write a meeting notice: time Wednesday 15:00, location 3rd floor, topic Q3 retrospective, bring weekly report. Formal tone.\"\n- Output sample: A complete notice with title, time/place, agenda, and signature.\n- Human check: Time/place accurate, attendees correct.\n- Privacy: No classified agenda details sent out.\n\n**Scenario 2: Organize meeting minutes**\n- Raw task: Turn a 1-hour recording into minutes.\n- AI collaboration: Paste transcript → extract \"decision / to-do / owner.\"\n- Sample Prompt: \"Organize the following meeting notes into a four-column table: [decision / to-do / owner / deadline].\"\n- Human check: To-dos and owners are truthful.\n- Privacy: Minutes contain internal info — distribute internally only.\n\n**Scenario 3: Monthly duty roster**\n- Raw task: Schedule 5 people on rotation.\n- AI collaboration: Give rules → produce table.\n- Sample Prompt: \"Build the August duty roster, 5 people rotating, avoid two on weekend leave at once.\"\n- Human check: No conflicts, compliant.\n\n**Scenario 4: Draft policy explanation**\n- Raw task: Rewrite a new attendance policy into employee-friendly language.\n- AI collaboration: Give clauses → plain-language version.\n- Human check: Doesn't distort the original policy.\n\n**Scenario 5: PPT script**\n- Raw task: Turn reporting points into per-slide copy.\n- AI collaboration: Give outline → paginated copy.\n- Human check: Data is real.\n\n**Scenario 6: Email sorting & reply drafts**\n- Raw task: Classify 20 emails then reply.\n- AI collaboration: Paste emails → tag \"urgent / routine / spam\" + draft replies.\n- Human check: Urgency judged correctly, outgoing tone right.\n\n**Scenario 7: Event flow checklist**\n- Raw task: Promote a department team-building.\n- AI collaboration: Give headcount → flow + material list.\n- Human check: Budget and venue real.\n\n**Scenario 8: Official-document format proofread**\n- Raw task: Check a request memo's format.\n- AI collaboration: Paste text → list format issues.\n- Human check: Final review against unit standards.\n\n**Scenario 9: Weekly-report consolidation**\n- Raw task: Merge department weekly reports into one.\n- AI collaboration: Paste several → extract key points.\n- Human check: No key items missed.\n\n**Scenario 10: Common FAQ**\n- Raw task: Organize admin questions employees often ask.\n- AI collaboration: Give Q&A → build a library.\n- Human check: Answers accurate and compliant.\n\n---\n\n## II. Sales (10 scenarios)\n\n**Scenario 1: Ice-breaker script** — give client type → generate opening (see Lesson 4 Few-shot). Human check: real case data not fabricated.\n**Scenario 2: Product intro** — give selling points → write a 1-minute intro. Human check: specs real.\n**Scenario 3: Objection \"too expensive\"** — generate with the four-step method. Human check: value evidence real.\n**Scenario 4: Competitor comparison** — give two products' specs → objective comparison table. Human check: don't disparage competitors, data real.\n**Scenario 5: Follow-up reminder** — give client list → generate回访 plan. Human check: timing reasonable.\n**Scenario 6: Proposal draft** — give client needs → proposal framework. Human check: scope and quote are yours.\n**Scenario 7: Closing script** — give stage → advancing script. Human check: no over-pressure.\n**Scenario 8: Client tiering** — paste communication log → tag intent level. Human check: tiering reasonable.\n**Scenario 9: Return-visit survey** — give goal → survey. Human check: questions compliant.\n**Scenario 10: Sales daily report** — give data → daily report. Human check: numbers verified.\nPrivacy: client lists / phones not pasted into public AI; promised price/policy filled by you only.\n\n---\n\n## III. Customer Support (10 scenarios)\n\n**Scenario 1: Standard-reply library** — give FAQ → unified scripts. Human check: based on real policy.\n**Scenario 2: Complaint de-escalation** — give complaint → \"acknowledge emotion + give facts + give solution.\" Human check: facts filled by you.\n**Scenario 3: Return/exchange guide** — give policy → steps. Human check: consistent with policy.\n**Scenario 4: Ticket classification** — paste tickets → tag priority. Human check: urgency judged right.\n**Scenario 5: Script polishing** — give a stiff reply → smooth it. Human check: no distortion.\n**Scenario 6: Knowledge-base Q&A** — give materials → answer based on materials (RAG). Human check: only from materials, say so if absent.\n**Scenario 7: Emotion detection** — paste message → tag emotion. Human check: hand off to human judgment.\n**Scenario 8: Return-visit script** — give purpose → script. Human check: compliant.\n**Scenario 9: Satisfaction survey** — generate survey. Human check: questions reasonable.\n**Scenario 10: Case沉淀** — give typical dialogue → extract reusable SOP. Human check: masked.\nPrivacy: mask customer info before processing.\n\n---\n\n## IV. Operations (10 scenarios)\n\n**Scenario 1: Topic pool** — give field → 20 topics. Human check: no exaggerated efficacy.\n**Scenario 2: Multiple headlines** — give theme → 10 headlines. Human check: no clickbait.\n**Scenario 3: Xiaohongshu copy** — give selling points → planting copy. Human check: real, no false advertising.\n**Scenario 4: Short-video script** — give theme → storyboard script. Human check: shootable.\n**Scenario 5: Moments distribution draft** — give long article → 3 tone versions. Human check: no distortion.\n**Scenario 6: Comment-zone interaction** — give post → interaction scripts. Human check: tone fits.\n**Scenario 7: Campaign planning** — give goal → plan. Human check: budget real.\n**Scenario 8: Data retrospective** — give data → insights. Human check: numbers verified.\n**Scenario 9: Competitor-monitoring digest** — give link → key points. Human check: objective.\n**Scenario 10: User persona** — give feedback → persona. Human check: based on real feedback.\nRed line: Advertising Law compliant; no fabricated efficacy, no fake users.\n\n---\n\n## V. HR (10 scenarios)\n\n**Scenario 1: JD writing** — give points → JD (see Lesson 7). Human check: no discrimination, salary real.\n**Scenario 2: Interview questions** — give role → layered questions. Human check: reasonable discrimination power.\n**Scenario 3: Resume pre-screen** — paste resumes → tag match. Human check: don't rely solely on AI.\n**Scenario 4: Interview evaluation form** — give dimensions → form. Human check: dimensions reasonable.\n**Scenario 5: Onboarding guide** — generate new-hire guide. Human check: process real.\n**Scenario 6: Training outline** — give goal → outline. Human check: executable.\n**Scenario 7: Performance conversation** — give result → communication draft. Human check: fair.\n**Scenario 8: Exit interview** — generate interview outline. Human check: compliant.\n**Scenario 9: Compensation explanation** — give structure → plain-language version. Human check: numbers real.\n**Scenario 10: Employee FAQ** — generate Q&A library. Human check: accurate.\nPrivacy: candidate / employee info strictly confidential, never into public AI.\n\n---\n\n## VI. Sole Proprietor (10 scenarios)\n\n**Scenario 1: Moments sales copy** — give product → copy. Human check: real, not exaggerated.\n**Scenario 2: Customer reply** — give question → reply. Human check: accurate.\n**Scenario 3: Purchase list** — give sales data → restock suggestion. Human check: combined with reality.\n**Scenario 4: Promotion plan** — give goal → plan. Human check: profit calculated clearly.\n**Scenario 5: Simple bookkeeping分类** — paste flow → categorize. Human check: numbers verified.\n**Scenario 6: Product description** — give features → detail-page copy. Human check: not false.\n**Scenario 7: Customer-maintenance reminder** — generate回访 plan. Human check: reasonable.\n**Scenario 8: Short-video引流** — generate script. Human check: shootable.\n**Scenario 9: Bad-review response** — generate reply. Human check: sincere attitude.\n**Scenario 10: Weekly summary** — give data → summary. Human check: numbers verified.\nPrivacy: don't let AI touch customer privacy details.\n", "10-Prompt模板库-en.md": "# Lesson 10 · Prompt Template Library (copy-paste ready)\n\n> A collection of every reusable Prompt from this camp, categorized by task. After copying, replace the 【bracketed】 parts with your real info.\n> General principle: role + background + task + output format + constraints + \"start directly if info is enough, else ask me 3 questions first.\"\n\n---\n\n## A. Universal Standard Structure (the base for all scenarios)\n\n```\nYou are now playing the role of: [role]\nMy background is: [who I am, what I'm doing]\nThe task I need to complete is: [one sentence]\nThe target / reader is: [who]\nExisting materials are as follows:\n【paste your materials】\nPlease output: [state exactly what you want]\nOutput format: [list / table / three-part]\nConstraints: [length, tone, no fabricated numbers, etc.]\nFirst ask me 3 key questions; if the information is sufficient, start directly.\n```\n\n---\n\n## B. Writing & Documents\n\n**B1 Notice**\n```\nYou are admin; write a formal notice:\ntime [ ], location [ ], topic [ ], attendees [ ].\nFormal tone; include title / time-location / agenda / signature.\n```\n\n**B2 Weekly report**\n```\nYou are [my role]; help me write this week's report.\nThis week I did: [list 3–5 things]\nOutput in four sections [Completed / In progress / Next-week plan / Needs coordination], each point ≤2 lines.\n```\n\n**B3 Work plan**\n```\nYou are [role]; draft a [topic] plan.\nBackground: [ ] Goal: [ ] Constraints: [ ]\nOutput by [Background / Goal / Steps / Risks / Resources needed].\n```\n\n---\n\n## C. Meetings & Communication\n\n**C1 Meeting minutes**\n```\nOrganize the following meeting notes into a table with columns: [decision / to-do / owner / deadline].\nBased only on the original text; do not add anything not in it.\n【paste transcript】\n```\n\n**C2 Follow-up list**\n```\nFrom the meeting/chat records below, extract all items \"I need to follow up later,\"\nlisted by [item / related person / suggested next step / priority].\n```\n\n---\n\n## D. Sales & Support\n\n**D1 Ice-breaker script (Few-shot)**\n```\nYou are a senior salesperson. Reference this real winning script of mine (masked):\n【paste a snippet of your script】\nIn the same tone and logic, write a new ice-breaker for: target [client type], stage [first add / re-engage].\n```\n\n**D2 Objection four-step**\n```\nThe client says \"[too expensive / let me think / competitor is cheaper].\"\nGenerate a reply in four steps: ① empathize ② clarify ③ evidence (use my real case [ ]) ④ advance.\nFor any specific price/policy number, use \"[to be confirmed by me]\" — do not fabricate.\n```\n\n**D3 Support answer based on materials (RAG)**\n```\nYou are our support assistant; answer only based on the 《Materials》 below; if not in them, say \"I'll confirm and get back to you.\"\n《Materials》: 【paste FAQ / policy】\nCustomer question: [ ]\n```\n\n---\n\n## E. Content & Operations\n\n**E1 Topic pool**\n```\nYou are [platform] content operator; around \"[field]\" generate 20 topic angles,\ncovering five types: tips / pain points / cases / comparisons / trends, one sentence each.\n```\n\n**E2 Multi-version copy**\n```\nWrite the following selling points as: ① Xiaohongshu planting copy ② Moments short copy ③ short-video voiceover.\nSelling points: [ ] Note: no exaggerated efficacy, no Advertising Law violation.\n```\n\n**E3 Data insight**\n```\nYou are a business-analysis assistant; analyze the table below, output by [overall trend / 3 anomalies / 3 recommended actions],\nnumbers must come from the original table, mark \"[needs my check]\" where uncertain.\n【paste table】\n```\n\n---\n\n## F. Management & HR\n\n**F1 JD**\n```\nYou are a senior HR; I'm hiring [role], core duties: [3–5 points], we want someone who: [traits].\nOutput JD: [Job Duties / Requirements / Plus-points / What We Offer]; no discriminatory language; salary only what I provide.\n```\n\n**F2 Retrospective**\n```\nOrganize the retrospective below into a table: [problem / root cause (to be confirmed by me) / improvement action / owner (to be filled by me)].\n【paste record】\n```\n\n---\n\n> Copy and use immediately. Every template leaves a \"human-gate\" hook ([to be confirmed by me] / [needs my check] / [to be filled by me]) — this is the camp's red line.\n", "11-人工检查清单总表-en.md": "# Lesson 11 · Master Human-Review Checklist (leave a \"human-gate\" hook at every step)\n\n> Convergence of every scenario's red lines into one master table. The last step of every task must be \"human verification\" — AI only drafts.\n> This is the camp's most important file — it decides whether you use AI to \"gain efficiency\" or \"plant a landmine.\"\n\n---\n\n## I. Universal Red Lines (apply to all scenarios)\n\n- [ ] I did not paste company secrets, customer privacy, or unpublished data into an unsafe tool\n- [ ] For any price / policy / commitment content, what AI wrote is marked [to be confirmed by me] and I fill the real value\n- [ ] All key numbers (amounts / ratios / rankings) I verified against the original table or calculator\n- [ ] Before publishing externally, I read it once and edited it once — not forwarding AI's original text directly\n- [ ] For high-risk decisions (medical / legal / financial / HR), AI only organizes info; the conclusion is set by a professional\n\n---\n\n## II. Scenario-Specific Checklists\n\n### Writing / Weekly report / Plan\n- [ ] Facts and data came from me; AI did not fabricate\n- [ ] Tone fits company / brand\n- [ ] No typos or ambiguity\n\n### Meeting / Minutes / Follow-up\n- [ ] To-dos and owners are truthful\n- [ ] Deadlines reasonable\n- [ ] Internal info distributed internally only\n\n### Sales / Support\n- [ ] Cases / data in scripts are real (no fabricated winning stories)\n- [ ] Price, discount, delivery, warranty policy given by me only; AI makes no commitments\n- [ ] Support replies strictly based on our materials; where none, honestly say \"I'll confirm and reply\"\n- [ ] Customer names / phones / chat logs masked\n\n### Content / Operations\n- [ ] No exaggerated efficacy, no clickbait, no fake user reviews\n- [ ] Compliant with Advertising Law and platform rules\n- [ ] Data claims verifiable\n\n### Spreadsheets / Data\n- [ ] Key numbers verified\n- [ ] Anomaly judgments based on real rows, not AI inference\n- [ ] Sensitive details not leaked\n\n### Management / HR / Hiring\n- [ ] JD has no age / gender etc. discriminatory language\n- [ ] Salary and benefits real; no AI-fabricated \"fake benefits\"\n- [ ] Interview questions layered reasonably, can differentiate candidates\n- [ ] Retrospective root cause and owner confirmed by me\n- [ ] Candidate / employee info strictly confidential\n\n---\n\n## III. \"Human-Gate\" Placeholder Convention\n\nUse these placeholders consistently in prompts and outputs to remind yourself where human input is mandatory:\n\n| Placeholder | Meaning | Use for |\n|---|---|---|\n| `[to be confirmed by me]` | Facts AI cannot decide | price, policy, commitment |\n| `[needs my check]` | Numbers / inferences AI computed | amount, ratio, trend |\n| `[to be filled by me]` | Items I must assign | owner, root cause, decision |\n| `[masked]` | Privacy already hidden | name, phone, client name |\n\n---\n\n## IV. Usage Discipline (suggested to keep on your desk)\n\n1. **Think before asking**: be clear what you want before letting AI act.\n2. **Share materials, not secrets**: when giving AI materials, delete sensitive fields first.\n3. **Do the arithmetic yourself**: verify any number AI gives.\n4. **Read once before publishing**: an AI draft is not a finished product.\n5. **Keep a trace**: store important outputs locally; don't leave them only in the chat box.\n\n> Remember one line: **human judges, AI assists. The steering wheel and the brakes are always in your hands.**\n", "12-用Codex写代码做工具-en.md": "# Lesson 12 · Coding with Codex — Build Small Tools Without Writing Code\n\n## I. Learning Goals\n\n- **Knowledge**: Know what Codex is and its four usage modes (App / CLI / IDE extension / Web); understand the difference between a \"coding agent\" and a \"chatbot.\"\n- **Skill**: Give Codex instructions in plain language to build a working small tool (e.g., turn a pile of chat logs into a table, auto-summarize expense receipts).\n- **Output**: Ship one real mini-project and produce *My First AI Tool* plus one reusable requirement description.\n\n## II. Warm-up Question\n\n> At work, do you have tasks where you repeatedly process the same kind of file — organizing 50 customer messages into a table, merging monthly receipts into one Excel, pulling text out of a bunch of screenshots?\n> Writing a program is the easiest fix, but you don't code.\n> In this lesson, you'll use Codex to get it done — **you talk, it builds.**\n\n## III. Core Concepts\n\n### 1. What is Codex (in one sentence)\n\nCodex is OpenAI's **coding agent**: you describe in natural language what you want, and it writes the code, creates files, runs it, and even fixes bugs for you. It isn't a chatbot — it's a **\"programming colleague\" that operates on the files on your computer.**\n\nThe Orange Book lays out four forms:\n\n| Form | Entry point | Right for you? |\n|---|---|---|\n| **Codex App (desktop)** | Install an app, pick a folder, use it | ⭐ Most recommended — easiest for beginners, most complete |\n| **Codex CLI** | Terminal command line | For the adventurous / tinkerers |\n| **Codex IDE extension** | Inside VS Code / Cursor | For people who already code |\n| **Codex Web (cloud)** | Web at chatgpt.com/codex | No install, occasional use |\n\n### 2. How it differs from a normal chatbot\n\n- Chatbot (ChatGPT dialog): **gives you answer text** — you still copy-paste to get work done.\n- Codex: **directly edits the real files in your folder**, producing runnable programs/web pages, not just text advising you what to do.\n\n### 3. Three ways to use it (from the Orange Book)\n\n- **Conversational**: open the App, talk like chatting, it asks and builds as you go.\n- **One-shot task**: one instruction gets it done, e.g. \"split this CSV into 12 tables by customer name.\"\n- **Folder work mode**: pick a project directory and Codex can read all its files and rewrite them together — this is the main battlefield for real work.\n\n### 4. The key rule: describe the result clearly\n\nDon't say \"help me build a tool.\" Say:\n> \"Read `customer_messages.txt`, each line is one message; extract four columns 【customer name, issue, sentiment, urgency】; output `result.csv`, with a summary row counting the total at the top.\"\n\n**The more specific the result, the more usable what it builds.**\n\n## IV. Worked Examples (Real Work Scenarios)\n\n### Case 1: Sales rep's \"messages → spreadsheet\" nightmare\n**Scenario**: dozens of daily WeChat customer messages to organize into a follow-up sheet — 1 hour by hand.\n**Codex approach**: paste all messages into a `txt`, tell Codex \"extract name / need / urgency, output Excel.\" A table in 1 minute; the rep only verifies names.\n**Red line**: customer names and phones are PII — **don't feed real data to practice**; test with fake data first, then run the real data on a local copy once the tool is proven.\n\n### Case 2: Admin's \"receipt merge\"\n**Scenario**: 30 reimbursement receipts scattered across files each month, to be combined into one sheet.\n**Codex approach**: put receipt images/PDFs in a folder, tell it \"recognize amount, date, category from each, merge into `summary.xlsx`.\"\n**Red line**: receipts contain company financial info — **run only locally on your own machine, never use cloud mode that uploads files to the internet.**\n\n### Case 3: Operations' \"poster generator\"\n**Scenario**: 5 campaign posters a week with repetitive layouts.\n**Codex approach**: have it write a small web tool where you fill in text and it auto-generates the image — this is the \"build website / video\" idea from Part Five of the Orange Book.\n\n## V. Standard Workflow (follow it)\n\nPart Four of the Orange Book gives a \"requirement → delivery\" chain. The workplace version boils down to 5 steps:\n\n1. **Define the result**: first be clear on \"what file/web page do I want out.\"\n2. **Prepare inputs**: put the files to process into a **dedicated folder** (don't mix with important projects).\n3. **Give the instruction**: use the \"read X, do Y, output Z\" pattern.\n4. **Check output + human review**: after AI generates, **you open it and glance to see if it's right** — verify numbers/names yourself.\n5. **Iterate**: if wrong, say \"sort column 3 by amount,\" and it keeps editing.\n\n## VI. Red Lines (must follow)\n\n- Never feed Codex or any AI **company confidential source code, customer PII, unpublished data, or keys/tokens.**\n- AI-written code **can be wrong**: human judges, AI assists; verify critical results yourself.\n- Run first on a **copy / dedicated test folder**; touch real data only after it's confirmed safe.\n- Codex evolves fast (install method, model name, entry point may all change) — follow OpenAI's official docs and what your account actually shows.\n\n## VII. After-class Task\n\nPick **one repetitive file-processing task** from your work, build a small tool with Codex App to get it running. Write down \"the instruction you gave\" — that's your first reusable Prompt.\n\n---\n\n*This lesson is a localized reorganization of the *Codex Orange Book* (bozhouDev/codex-orange-book, unofficial open-source), taking only the parts useful to workplace users — not a verbatim translation.*\n"};
const toc=document.getElementById('toc'), content=document.getElementById('content');
let cur=null;
function load(name){
  if(cur) cur.classList.remove('active');
  cur=[...toc.children].find(a=>a.dataset.f===name); if(cur)cur.classList.add('active');
  content.scrollTop=0; window.scrollTo(0,0);
  const md = DATA[name] || '';
  content.innerHTML='<h1>'+name.replace(/\.md$/,'')+'</h1>'+MD.render(md);
  location.hash=encodeURIComponent(name);
}
const names = Object.keys(DATA);
names.forEach(f=>{
  const a=document.createElement('a'); a.textContent=f.replace(/\.md$/,''); a.dataset.f=f;
  a.onclick=e=>{e.preventDefault();load(f)}; toc.appendChild(a);
});
const h=decodeURIComponent(location.hash.slice(1));
load(names.includes(h)?h:names[0]);
</script>
