const MD = (function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(md){
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    let h='', i=0, inCode=false, code='';
    const flushCode=()=>{ if(inCode){ h+='<pre><code>'+esc(code)+'</code></pre>'; code=''; inCode=false; } };
    while(i<lines.length){
      let l=lines[i];
      if(l.trim().startsWith('```')){ if(inCode){flushCode();} else {flushCode(); inCode=true;} i++; continue; }
      if(inCode){ code+=l+'\n'; i++; continue; }
      let m;
      if(m=l.match(/^(#{1,6})\s+(.*)$/)){ const n=m[1].length; h+='<h'+n+'>'+inline(m[2])+'</h'+n+'>'; i++; continue; }
      if(l.match(/^(-{3,}|\*{3,})$/)){ h+='<hr>'; i++; continue; }
      if(l.match(/^>\s?/)){ let q=''; while(i<lines.length && lines[i].match(/^>\s?/)){ q+=lines[i].replace(/^>\s?/,'')+'<br>'; i++; } h+='<blockquote>'+inline(q)+'</blockquote>'; continue; }
      if(m=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/)){
        const ord = /\d+\./.test(m[2]); let items='';
        while(i<lines.length && lines[i].match(/^(\s*)([-*+]|\d+\.)\s+/)){
          const mm=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          items+='<li>'+inline(mm[3])+'</li>'; i++;
        }
        h+= (ord?'<ol>':'<ul>')+items+(ord?'</ol>':'</ul>'); continue;
      }
      if(l.trim()===''){ i++; continue; }
      h+='<p>'+inline(l)+'</p>'; i++;
    }
    flushCode();
    return h;
  }
  return {render:render};
})();

const DATA = {"00-课程总览.md": "# AI 项目与职业能力营 · 课程总览\n\n> 面向大学生 / 研究生 / 应届求职者的一门「项目驱动 + 职业导向」AI 实战训练营。\n> 目标不是学会更多 Prompt，而是用 AI 完成一次完整的 **调研 → 设计 → 执行 → 展示** 闭环，产出能写进简历、带进面试、挂上个人主页的作品集。\n\n---\n\n## 一、这门课解决什么痛点\n\n很多同学对 AI 并不陌生：用 ChatGPT 写周报、用 Copilot 补全代码、刷过几个教程。但当被问到「你用 AI 做过什么项目」「你的作品集在哪」时，往往答不上来。问题不在工具，而在 **缺少一条把能力沉淀为作品的生产线**。\n\n本营把 AI 能力拆成 8 个可交付环节，每个环节都要求你产出一个真实文档或原型：\n\n- 调研能力（行业调研报告）\n- 阅读能力（论文 / 资料阅读笔记）\n- 分析能力（数据洞察小报告）\n- 求职能力（简历 + 模拟面试记录）\n- 设计能力（项目计划书）\n- 原型能力（无代码 / 低代码 Demo）\n- 包装能力（作品集 / 展示页）\n\n这 8 个环节最终汇聚成一份 **AI 原生作品集**，它比「我会用 AI」这句话有力一百倍。\n\n---\n\n## 二、目标人群\n\n| 人群 | 典型诉求 | 本营能给到的 |\n| --- | --- | --- |\n| 本科生 | 想做科研 / 竞赛 / 实习，但不知从哪下手 | 论文阅读、行业调研、项目雏形 |\n| 研究生 | 有研究方向，缺工程化与表达 | 数据分析、原型、作品集包装 |\n| 应届求职者 | 简历单薄、面试没故事 | 简历优化、模拟面试、可展示项目 |\n| 转行 / 跨专业者 | 非技术背景，想用 AI 提效 | 低代码路径、非工程视角的应用认知 |\n\n本营不要求你有编程基础。涉及代码的部分都提供「无代码替代方案」（如 Coze、Dify、飞书多维表格、Streamlit 模板），你可以只做文档与产品侧交付物。\n\n---\n\n## 三、课程地图（8 节课 → 8 件作品）\n\n| 课次 | 主题 | 核心交付物 | 对应能力 |\n| --- | --- | --- | --- |\n| 01 | AI 学习与职业定位 | 个人 AI 能力地图 | 自我认知 / 规划 |\n| 02 | AI 资料调研 | 一个行业调研报告 | 信息检索 / 综述 |\n| 03 | AI 论文和资料阅读 | 一篇论文阅读笔记 | 批判性阅读 |\n| 04 | AI 数据分析入门 | 一个数据洞察小报告 | 数据思维 |\n| 05 | AI 辅助简历和面试 | 简历优化 + 模拟面试记录 | 求职表达 |\n| 06 | AI 项目设计 | 一个项目计划书 | 产品设计 |\n| 07 | AI 应用原型 | 一个无代码 / 低代码 Demo | 工程落地 |\n| 08 | 作品集包装 | 一份项目展示页 / 作品集 | 个人品牌 |\n\n毕业要求：从 09 课的三个方案中选 1 个做深（或自选），结合 01–08 的产物，形成可上线、可展示的毕业作品。\n\n---\n\n## 四、内容来源与方法论（已抓取并本地化重组的参考仓库）\n\n本课程并非凭空编写，而是对以下 7 个国际权威开源仓库进行 **抓取 + 中文本地化重组 + 学生视角重构** 而来。每个仓库贡献了不同的底层方法论：\n\n1. **microsoft/AI-For-Beginners** —— AI 基础框架：符号 AI、神经网络、计算机视觉、NLP、Transformer、LLM 与提示编程、AI 伦理。对应本营「基础认知」与「负责任使用」。\n2. **microsoft/generative-ai-for-beginners** —— 21 课生成式 AI 应用：提示工程、RAG、向量库、低代码应用、AI Agent、函数调用、微调。对应本营「应用原型」「项目设计」。\n3. **openai/openai-cookbook** —— API 实战示例库：如何把大模型能力落到具体任务（分类、摘要、抽取、生成数据、评估）。对应本营「把 API 思路转成非工程可理解的应用认知」。\n4. **mlabonne/llm-course** —— 技术进阶框架：LLM Fundamentals / LLM Scientist / LLM Engineer 三段式，覆盖微调、量化、部署、评测。对应本营「进阶路径」与「技术纵深地图」。\n5. **DataTalksClub/llm-zoomcamp** —— RAG / 知识库实战：Agentic RAG、向量检索、评估、监控、端到端 Capstone。对应本营「知识库助手」「毕业项目」结构。\n6. **datawhalechina/llm-universe** —— 中文社区「动手学大模型应用开发」：调用 API、搭知识库、构建 RAG、Streamlit 部署、验证迭代。对应本营「低代码 Demo」「本地化表达」。\n7. **dair-ai/Prompt-Engineering-Guide** —— 提示工程方法论：Zero-Shot / Few-Shot / CoT / Prompt Chaining / ToT / RAG / ReAct 等技术谱系。对应本营「Prompt 模板库」「大学生版三问结构」。\n\n> 重组原则：原仓库偏「技术实现 / 英文读者 / 工程师」，本营偏「学生视角 / 中文 / 项目与职业产出」。只保留与「调研—设计—执行—展示」主线相关的内容，删除纯算法推导，补充求职、作品集、可展示交付物等本地化模块。\n\n---\n\n## 五、每节课的统一结构（你会在 01–08 每课看到）\n\n- **教学目标**：这节课结束你能做到什么\n- **开场问题**：用一个真实困境引入\n- **核心概念**：必须掌握的知识点（口语化）\n- **真实场景案例**：来自学生 / 求职者的真实情境\n- **动手任务**：含 工具清单 / 任务说明 / 示例 Prompt / 评价标准\n- **Prompt 模板（大学生版）**：额外要求给出【资料来源】【分析过程】【可复用结构】\n- **人工检查清单**：AI 生成后你人工必须核对的项\n- **常见错误**：新人最容易踩的坑\n- **课后作业**：必须是一个可展示作品\n- **评分标准**：可量化打分，便于自评与他评\n\n---\n\n## 六、学习成果与考核\n\n**过程分（60%）**：01–08 每课交付物，按评分标准自评 + 同伴互评。\n**毕业分（40%）**：09 课三选一毕业项目，或自选等价项目，需满足：\n- 有可演示的 Demo 或完整文档\n- 有作品集展示页\n- 能一句话讲清「解决了什么问题、怎么解决的、结果如何」\n\n**红线（不可逾越）**：\n1. 至少完成 1 个可展示作品（不满足则不予结业）。\n2. 内容不能只停留在 Prompt，必须有完整的项目过程（调研 / 设计 / 执行 / 展示）。\n3. 作品必须能进简历、面试、个人主页，语言项目化、职业化，杜绝「AI 帮我写」的空泛表述。\n\n---\n\n## 七、工具箱（全程可用，按课次逐步引入）\n\n| 类别 | 工具示例 | 用途 |\n| --- | --- | --- |\n| 对话 / 写作 | ChatGPT、Claude、通义千问、Kimi、DeepSeek | 调研、阅读、写作、面试陪练 |\n| 检索 | 谷歌学术、arXiv、Semantic Scholar、知网、秘塔搜索 | 论文与资料 |\n| 数据分析 | Excel、飞书多维表格、Python（可选）、NotebookLM | 数据洞察 |\n| 无代码原型 | Coze、Dify、飞书、Streamlit（模板）、Gradio | 应用 Demo |\n| 知识库 | 腾讯文档、Notion、Obsidian、本地向量库（进阶） | 个人知识管理 |\n| 展示 | GitHub Pages、Notion、个人博客、Canva | 作品集主页 |\n| 评测参考 | LLM-as-Judge、人工互评 | 质量把关 |\n\n---\n\n## 八、给学习者的三条建议\n\n1. **先完成，再完美**：每一课先产出一个「能看」的版本，再迭代。作品集是迭代出来的，不是一次写成的。\n2. **让你的 AI 留下痕迹**：保留 Prompt、原始资料、修改过程，这本身就是面试时能讲的故事。\n3. **公开学习（Learning in Public）**：把作品发到 GitHub / 博客 / 朋友圈，参考 llm-zoomcamp 的「Learning in Public」理念，曝光会带来反馈与机会。\n\n---\n\n## 九、配套文件清单\n\n- `01` ~ `08`：八节主课\n- `09-三个毕业项目.md`：AI 简历面试助手 / AI 学习资料整理助手 / AI 行业调研助手 详细方案\n- `10-作品集模板.md`：项目背景 / 问题定义 / 解决方案 / 过程截图 / 结果反思 模板\n- `11-Prompt模板库.md`：全课程可复用 Prompt 合集（含大学生版三问结构）\n- `示例作品/`：本课程自带的可展示样例（行业调研报告、论文笔记、作品集主页 HTML），既是示范也是你可直接改写的脚手架\n\n> 下一节，我们从「认识自己」开始：画出你的个人 AI 能力地图。\n", "01-AI学习与职业定位.md": "# 第 01 课 · AI 学习与职业定位 → 个人 AI 能力地图\n\n## 教学目标\n学完本课，你将能够：\n1. 用一张图说清自己「现在会什么、缺什么、下一步学什么」；\n2. 把模糊的「我想学 AI」拆成可执行的技能节点；\n3. 产出第一件作品：**《个人 AI 能力地图》**（一张表 + 一段 200 字自我定位），它可以作为你整个营的学习导航，也能在面试开场 30 秒讲清楚你的 AI 素养。\n\n---\n\n## 开场问题\n> 面试官问：「你平时怎么用 AI？」你答：「就用 ChatGPT 写写东西。」——然后呢？\n> 大多数同学不是没用过 AI，而是**用过就忘、用过没沉淀**。本课帮你把散落的体验收拢成一张可展示的能力地图。\n\n---\n\n## 核心概念\n\n**1. AI 素养不是「会用工具」，而是「会用 AI 解决问题」**\n参考 microsoft/AI-For-Beginners 的定义，AI 能力至少包含：理解 AI 能做什么（认知层）、能用 AI 完成具体任务（应用层）、知道 AI 的边界与风险（伦理层）。本营聚焦应用层与伦理层，认知层只做够用的铺垫。\n\n**2. 能力地图 = 维度 × 等级 × 证据**\n- 维度：调研、阅读、分析、写作、原型、求职、协作……\n- 等级：0 没接触 / 1 试用过 / 2 能独立做 / 3 能做给别人看 / 4 能教别人\n- 证据：每个等级都要有一件作品或一次经历做支撑，避免「自评 4 分但拿不出东西」。\n\n**3. 职业定位 = 你想解决的问题 × 你的专业背景**\nAI 不是专业，是「放大镜」。生化专业 + AI = 文献检索助手；商科 + AI = 行业调研助手；设计 + AI = 原型生成。定位的关键是把 AI 接到你的专业上，而不是脱离专业去「学 AI 本身」。\n\n**4. 进阶路径参考（mlabonne/llm-course 三段式）**\n- LLM Fundamentals（数学/Python/神经网络基础，可选）\n- LLM Scientist（把模型做到最好：微调、量化、评测）\n- LLM Engineer（把模型做成应用并部署）\n本营主要落在 Engineer 的应用侧，按需回看 Scientist 做技术纵深。\n\n---\n\n## 真实场景案例\n> 小雨，大三，环境科学。她用 AI 写过实验报告、查过文献，但简历上只能写「熟练使用办公软件」。\n> 上完本课，她画出能力地图：调研 3 分（做过 2 份文献综述）、阅读 2 分（会读但慢）、原型 1 分（没搭过）。她把地图放进简历附录，并在面试中说：「我用 AI 做过 2 份行业文献综述，平均把检索时间从 3 天压到 6 小时。」——这句话让她拿到实习。\n\n---\n\n## 动手任务\n\n**工具清单**：ChatGPT / Kimi / DeepSeek（任一对话模型）、飞书多维表格或 Excel、Markdown 编辑器（Typora / Obsidian）。\n\n**任务说明**：\n1. 列出 6–8 个 AI 能力维度（建议：资料调研、论文阅读、数据分析、内容写作、代码/原型、求职表达、项目管理、AI 伦理与风控）。\n2. 给每个维度打 0–4 分，并写一句「证据」（如「调研 3 分：用 AI 完成过课程小论文的资料搜集」）。\n3. 标出 2 个「最想提升」的维度，对应到本营 02–08 课。\n4. 写一段 200 字自我定位：我是谁、我的专业、我想用 AI 解决什么、结营时我希望地图变成什么样。\n\n**示例 Prompt（大学生版 · 生成能力地图草稿）**：\n```\n你是我的 AI 学习教练。我是【专业/年级】的学生，平时用 AI 做过【举 2 个真实例子】。\n请帮我：\n1）列出适合学生评价的 8 个 AI 能力维度；\n2）对每个维度给出 0–4 分的自评锚点（什么表现算 1 分、2 分、3 分）；\n3）基于我提供的信息，先给一个初步打分建议。\n要求：用中文、结构化、不要空话，每个维度都和「学生能产出的作品」挂钩。\n```\n\n**评价标准**：\n- 维度覆盖 ≥6 个，且含伦理/风控（30%）\n- 每个维度有等级 + 证据，不空评（30%）\n- 自我定位 200 字内、有专业锚点（20%）\n- 明确连接到本营后续课程（20%）\n\n---\n\n## Prompt 模板（大学生版 · 三问结构）\n\n> 【资料来源】本节课基于 microsoft/AI-For-Beginners 的 AI 素养三层模型、mlabonne/llm-course 的进阶三段式。\n> 【分析过程】先定义「能力维度」而非「工具名称」，避免把地图做成软件清单；再用「证据」约束自评水分；最后用「专业锚点」把 AI 接回个人背景。\n> 【可复用结构】维度 × 等级(0–4) × 证据 三列表，适用于任何技能自评场景（如编程能力、英语能力）。\n\n---\n\n## 人工检查清单\n- [ ] 我没有把「会用 ChatGPT」当成唯一能力点\n- [ ] 每个分数都有一句具体证据，不是凭感觉\n- [ ] 我标出了和本营后续课对应的提升项\n- [ ] 自我定位里出现了我的专业，而不是泛泛的「我想学 AI」\n- [ ] 我保留了生成地图用的 Prompt 与原始对话（作为过程痕迹）\n\n---\n\n## 常见错误\n1. **把能力地图写成工具清单**：「我会 ChatGPT、Midjourney」——这不是能力，是软件名。\n2. **自评虚高**：全打 4 分却拿不出作品。面试一问就露馅。\n3. **脱离专业**：只谈「学 AI」，不谈「用 AI 解决我专业里的问题」。\n4. **一次成型不迭代**：地图是活的，结营时应回来更新一次。\n\n---\n\n## 课后作业（可展示作品）\n提交 **《个人 AI 能力地图》**，包含：\n- 一张能力维度表（维度 / 等级 / 证据 / 想提升项）\n- 一段 200 字自我定位\n- 建议用 Markdown 或表格截图保存，后续可放进作品集首页\n\n**展示要求**：能在一分钟内用这张图向同学讲清「你是谁、你会什么、你要去哪」。\n\n---\n\n## 评分标准（满分 100）\n\n| 项 | 分值 | 说明 |\n| --- | --- | --- |\n| 维度完整性 | 25 | ≥6 维度，含伦理/风控 |\n| 证据充分性 | 30 | 每个维度有具体事例 |\n| 自我定位质量 | 20 | 200 字内、有专业锚点 |\n| 与课程链接 | 15 | 明确指向 02–08 课 |\n| 可展示性 | 10 | 格式清晰、可一图讲清 |\n\n> 下一课，我们用这张地图里的「调研」维度，去完成第一份真实交付物：一个行业调研报告。\n", "02-AI资料调研.md": "# 第 02 课 · AI 资料调研 → 一个行业调研报告\n\n## 教学目标\n学完本课，你将能够：\n1. 用 AI 把一个陌生行业/领域从「零了解」推进到「能讲清全貌」；\n2. 掌握「问题拆解 → 多源检索 → 交叉验证 → 结构化输出」的调研工作流；\n3. 产出第二件作品：**一份 8–12 页的《行业/领域调研报告》**，可用于实习申请、课程作业、创业调研或面试谈资。\n\n---\n\n## 开场问题\n> 导师丢给你一句：「下周把『AI+医疗影像』这个方向摸清楚。」你打开浏览器，20 个标签页，越查越乱。\n> 问题不是资料太少，而是**没有调研框架**。AI 能把你从「大海捞针」变成「按图索骥」。\n\n---\n\n## 核心概念\n\n**1. 调研 = 回答一组结构化问题，而非收集一堆链接**\n好的调研先定义「要回答什么」：市场规模、玩家格局、技术路线、痛点、趋势、风险。带着问题去查，效率提升数倍。\n\n**2. AI 在调研里的三种角色**\n- **拆解器**：把大问题拆成子问题清单；\n- **摘要器**：把长文/多文压缩成要点；\n- **对比器**：把多个来源的说法并列，帮你发现分歧。\n\n**3. 交叉验证与「幻觉」防御**\n参考 dair-ai/Prompt-Engineering-Guide 的 Factuality 章节：大模型会编造看似可信的数据与来源。**任何数字、公司名、论文标题都必须回到原始来源核对**。方法：让 AI 给出可核查的线索（关键词、机构、年份），你自己去搜索确认，而不是直接采信 AI 给的链接。\n\n**4. RAG 思维的雏形（来自 llm-universe / llm-zoomcamp）**\n把你收集的资料喂给 AI，让它「基于我给的材料回答」，比让它「凭记忆回答」可靠得多。这就是检索增强（RAG）的核心直觉——先检索、再生成。本课用「粘贴资料 + 让 AI 基于资料总结」的手动 RAG，07 课会做自动化版本。\n\n---\n\n## 真实场景案例\n> 阿哲，投递 AI 产品经理岗，面试前要了解「AI 陪练/口语练习赛道」。他用 AI 先生成 12 个调研子问题，再逐个用秘塔搜索 + 官网 + 应用商店评论交叉验证，2 天产出一份含 5 家玩家对比表的报告。面试时他直接调出报告：「我梳理了这个赛道的 5 个玩家和 3 个未被满足的需求。」面试官当场加分。\n\n---\n\n## 动手任务\n\n**工具清单**：对话模型（ChatGPT/Kimi/DeepSeek）、AI 搜索（秘塔/Perplexity/纳米）、行业数据源（艾瑞、36氪、企业官网、应用商店、招聘网站 JD）、飞书文档/Notion（整理）。\n\n**任务说明**：\n1. 选一个你真正关心的行业/赛道（结合求职方向）。\n2. 用 AI 生成 10–15 个调研子问题，删改成你自己的调研提纲。\n3. 每个子问题至少查 2 个独立来源，记录来源链接与核对结果。\n4. 用 AI 辅助把材料整理成报告，结构建议：概述 / 市场规模 / 玩家格局（对比表）/ 技术路线 / 核心痛点 / 趋势判断 / 风险 / 参考来源。\n5. 报告末尾必须有【参考来源】清单和【AI 使用说明】（你用 AI 做了什么、人工核对了什么）。\n\n**示例 Prompt（大学生版 · 生成调研提纲）**：\n```\n我要调研【行业/赛道名】，用途是【实习申请/课程/面试】。\n请帮我：\n1）列出 12 个能覆盖该行业全貌的调研子问题，按「市场/玩家/技术/痛点/趋势/风险」分组；\n2）每个子问题标注建议的资料来源类型（如行研报告、官网、JD、用户评论）；\n3）提醒我哪些问题最容易出现数据造假或口径不一，需要交叉验证。\n【资料来源】请说明你依据了哪些常识框架。\n【分析过程】请说明你为什么这样分组。\n【可复用结构】请把提纲整理成我下次能复用的模板。\n```\n\n**评价标准**：\n- 调研提纲结构化、覆盖 6 大板块（20%）\n- 关键数据/主体均有 ≥2 来源交叉验证（30%）\n- 有玩家对比表等结构化呈现（20%）\n- 有参考来源清单 + AI 使用说明（15%）\n- 有作者自己的趋势判断，而非纯罗列（15%）\n\n---\n\n## Prompt 模板（大学生版 · 三问结构）\n\n> 【资料来源】务必要求 AI 标注它的说法来自常识/推测/还是需要外部核实，并给出可搜索的关键词。\n> 【分析过程】要求 AI 展示它如何从子问题推导到结论，便于你判断逻辑是否成立。\n> 【可复用结构】把「概述-市场-玩家-技术-痛点-趋势-风险-来源」固化为调研报告模板，任何行业可套用。\n\n---\n\n## 人工检查清单\n- [ ] 报告里每一个数字都能追到原始来源\n- [ ] 玩家名称、产品名、融资信息经过官网/权威媒体核对\n- [ ] 我删掉了 AI 编造的、查不到出处的「事实」\n- [ ] 报告有我自己的判断段落，不是纯 AI 复述\n- [ ] 参考来源清单可点击、可核查\n- [ ] 保留了调研提纲 Prompt 与检索记录\n\n---\n\n## 常见错误\n1. **直接采信 AI 给的链接/数字**：AI 常编造 URL 和统计数据。\n2. **只用一个来源**：单一来源 = 无验证，容易被误导。\n3. **报告变成资料堆砌**：没有对比、没有判断，读者看不到你的思考。\n4. **忘记标注 AI 使用**：诚实标注反而是加分项，隐瞒则是学术/职业风险。\n\n---\n\n## 课后作业（可展示作品）\n提交 **《XX 行业调研报告》**（8–12 页），必须包含：\n- 结构化目录\n- 至少一张玩家/方案对比表\n- 你自己的趋势判断段落\n- 参考来源清单 + AI 使用说明\n\n**展示要求**：能用 3 分钟向他人讲清「这个行业是什么样、谁在玩、机会在哪」。\n\n---\n\n## 评分标准（满分 100）\n\n| 项 | 分值 | 说明 |\n| --- | --- | --- |\n| 提纲结构 | 20 | 覆盖 6 大板块 |\n| 来源交叉验证 | 30 | 关键信息 ≥2 来源 |\n| 结构化呈现 | 20 | 有对比表/图 |\n| 来源与 AI 说明 | 15 | 可核查、透明 |\n| 独立判断 | 15 | 有作者观点 |\n\n> 参见 `示例作品/行业调研报告-AI口语陪练赛道.md`，这是一份可直接改写的样例。下一课，我们把调研能力聚焦到最硬的一类资料上：论文。\n", "03-AI论文和资料阅读.md": "# 第 03 课 · AI 论文和资料阅读 → 一篇论文阅读笔记\n\n## 教学目标\n学完本课，你将能够：\n1. 用 AI 把一篇英文/专业论文从「读不进」变成「读得懂、讲得出」；\n2. 掌握「三遍读法 + AI 辅助」的论文精读流程；\n3. 产出第三件作品：**一篇结构化《论文阅读笔记》**，可作为课程作业、组会汇报、保研/留学材料中的科研能力证明。\n\n---\n\n## 开场问题\n> 导师甩来一篇 arXiv 论文：「这周看一下。」你打开，摘要里全是 transformer、token、benchmark，读三行就关了。\n> 论文不是用来「读完」的，是用来「榨取价值」的。AI 是你的同声翻译 + 苏格拉底式陪练。\n\n---\n\n## 核心概念\n\n**1. 三遍读法（AI 时代增强版）**\n- 第一遍：看标题/摘要/图/结论，判断是否值得读（用 AI 一句话翻译核心贡献）。\n- 第二遍：读方法主干，用 AI 把公式与术语翻译成你能懂的比喻。\n- 第三遍：复现思路——让 AI 出了「如果我要在我的专业里用这个思路，可以做什么」。\n\n**2. 让 AI 当「费曼老师」**\n参考 dair-ai 的 Chain-of-Thought 与 Few-Shot 思路：让 AI 用「给大一新生讲清楚」的语气解释，比直接要摘要更能暴露你哪里没懂。不要只问「这篇讲了什么」，要问「用我已知的【XX 知识】做类比，这篇的创新点是什么」。\n\n**3. 批判性阅读：识别局限与可质疑点**\n好笔记不只记「它做了什么」，更要记「它没做什么、数据是否可疑、是否 overclaim」。这正是 microsoft/AI-For-Beginners 强调的 Responsible AI 意识——对模型结论保持审视。\n\n**4. 把论文接回你的场景（本地化重组）**\ndatawhalechina/llm-universe 的核心理念是「从实践出发」。读论文的终点不是写笔记，而是想清楚：这个方法能不能解决我专业里的一个具体问题？本课笔记必须含「对我的启发」段落。\n\n---\n\n## 真实场景案例\n> 小满，统计研一，导师方向是时间序列预测。她用 AI 把一篇 LLM-for-forecasting 论文拆成「问题-方法-实验-局限」四块，AI 把注意力机制类比成「给历史数据不同位置不同权重」。她据此在组会汇报，并写出「能否用该方法改进我校气象数据缺测补全」的设想，被导师采纳为小课题。\n\n---\n\n## 动手任务\n\n**工具清单**：arXiv / 谷歌学术 / Semantic Scholar、对话模型、笔记工具（Obsidian/Notion）、翻译辅助（可选沉浸式翻译插件）。\n\n**任务说明**：\n1. 选一篇与你方向相关、近 2 年、你能勉强看懂摘要的论文（3–8 页最佳，先别碰 50 页巨著）。\n2. 第一遍：让 AI 用一句话 + 三个关键词总结；判断相关性。\n3. 第二遍：把方法章节贴给 AI，要求「用比喻解释 + 标出我必须懂的 3 个前提概念」。\n4. 第三遍：让 AI 出 5 道理解题，你自答，错的回去重读。\n5. 输出笔记，结构见下。\n\n**示例 Prompt（大学生版 · 费曼式讲解）**：\n```\n我正在读论文《标题》，我的背景是【你的专业/已知知识】。\n请用「给大一新生讲清楚」的语气，解释这篇论文：\n1）它要解决什么问题（用生活类比）；\n2）核心方法一句话 + 一个比喻；\n3）我必须提前懂哪 3 个概念才能读懂；\n4）它声称的效果是什么，用什么实验证明的。\n【资料来源】请只基于我粘贴的论文正文，不要编造正文外的内容。\n【分析过程】请展示你是如何从摘要推出「问题-方法-证据」结构的。\n【可复用结构】请把你的解释整理成我读下一篇论文也能用的四件套模板。\n```\n\n**评价标准**：\n- 完成三遍读法的痕迹记录（20%）\n- 笔记含「问题-方法-证据-局限」四块（30%）\n- 有作者自己的「对我的启发」（25%）\n- AI 解释基于粘贴原文、未编造（15%）\n- 格式可读、可分享（10%）\n\n---\n\n## Prompt 模板（大学生版 · 三问结构）\n\n> 【资料来源】强制 AI 只基于你粘贴的原文，杜绝它用训练记忆「补戏」。\n> 【分析过程】要求 AI 显式从摘要推导结构，便于你核对它的理解是否准确。\n> 【可复用结构】「问题-方法-证据-局限-启发」五段式，是所有论文笔记的通用骨架。\n\n---\n\n## 人工检查清单\n- [ ] 我粘贴了论文原文片段，AI 没有凭空编造内容\n- [ ] 术语解释我能真正看懂，而不是换成另一个不懂的词\n- [ ] 笔记里有「局限/可质疑点」，不是单方面吹捧\n- [ ] 有「对我的启发」，接回了我的专业\n- [ ] 我记录了读不懂的地方并标红，准备去问\n- [ ] 保留了与 AI 的对话，作为阅读过程证据\n\n---\n\n## 常见错误\n1. **让 AI 直接「总结这篇论文」却不给原文**：它会按标题瞎编，产出看似专业实则虚假的笔记。\n2. **只记方法不记局限**：显得没思考，组会/面试容易被追问击穿。\n3. **不做「对我的启发」**：笔记成为信息孤岛，无法转化为能力或项目。\n4. **选文过难**：一上来啃 50 页 SOTA 论文，挫败感劝退。先易后难。\n\n---\n\n## 课后作业（可展示作品）\n提交 **《一篇论文阅读笔记》**，结构：\n- 基本信息（标题/作者/年份/来源/一句话贡献）\n- 问题 / 方法 / 证据 / 局限\n- 我的启发（≥200 字，接专业）\n- AI 使用说明 + 原文片段存档位置\n\n**展示要求**：能就这篇论文做 5 分钟组会式汇报，并回答「它哪里可能不靠谱」。\n\n---\n\n## 评分标准（满分 100）\n\n| 项 | 分值 | 说明 |\n| --- | --- | --- |\n| 读法痕迹 | 20 | 三遍读法的过程记录 |\n| 四块完整 | 30 | 问题/方法/证据/局限 |\n| 启发质量 | 25 | 接专业、可执行 |\n| 来源真实 | 15 | 基于原文、未编造 |\n| 可读性 | 10 | 可分享、格式清 |\n\n> 参见 `示例作品/论文阅读笔记样例.md`。下一课，我们把「读得懂」延伸到「看得透数据」：AI 数据分析入门。\n", "04-AI数据分析入门.md": "# 第 04 课 · AI 数据分析入门 → 一个数据洞察小报告\n\n## 教学目标\n学完本课，你将能够：\n1. 用自然语言驱动一次完整的数据分析（无需写代码，或只写极少量）；\n2. 区分「描述数据」和「洞察数据」——后者才是报告价值所在；\n3. 产出第四件作品：**一份《数据洞察小报告》**（含问题、数据、发现、建议），可用于课程大作业、实习产出、商业分析岗面试。\n\n---\n\n## 开场问题\n> 社团拉了一份 2000 人的活动报名表，会长说「你分析一下」。你对着 Excel 发呆：人数、均值、图表都做了，然后呢？「然后」才是洞察。\n> 数据本身不说话，AI 帮你把「数字」翻译成「结论」和「行动」。\n\n---\n\n## 核心概念\n\n**1. 描述 ≠ 洞察**\n- 描述：去年报名 2000 人，女生占 60%。\n- 洞察：女生占比偏高且来自 3 个院系，说明活动主题对理工科男生吸引力不足，下次应调整宣传渠道。\n洞察 = 描述 + 对比/归因 + 行动建议。\n\n**2. 分析工作流（无代码版）**\n参考 openai/openai-cookbook 的「分类 / 摘要 / 抽取」思路，把分析拆成：明确问题 → 清洗数据 → 描述统计 → 找异常/分组差异 → 形成假设 → 给建议。AI 在每一步都能辅助，但「假设」必须你来提。\n\n**3. 数据清洗是 80% 的活**\n缺失值、重复行、格式不一致——这些脏活 AI 能帮你写公式/脚本处理，但你要先说清规则。参考 llm-zoomcamp 的 Data Ingestion 模块理念：先把数据弄干净，模型才有用。\n\n**4. 用 Python/Notebook 的进阶路径（可选）**\n若你有基础，可用 Python（pandas）+ 对话模型写脚本；无基础用飞书多维表格 / Excel + AI 公式助手同样能完成。本课两条路径都给。\n\n---\n\n## 真实场景案例\n> 佳怡，市营大四，在电商实习。她拿到一份 3 万行的订单表，用 AI 写出 Python 脚本做 RFM 分层（最近购买/频率/金额），发现「高价值低活跃」客户占比 18% 却贡献 45% 营收，建议做召回活动。这份分析被主管采用，成为她简历上「用数据驱动决策」的实锤。\n\n---\n\n## 动手任务\n\n**工具清单**：Excel / 飞书多维表格、Python（可选，pandas）、对话模型、公开数据集（Kaggle / 国家数据 / 学校公开数据）。\n\n**任务说明**：\n1. 找一份真实的表格数据（课程成绩、问卷、销售、活动报名皆可），≥200 行。\n2. 用 AI 帮你列 3 个分析假设（如「不同渠道转化差异显著」）。\n3. 清洗：让 AI 写公式/脚本处理缺失与重复，你核对结果。\n4. 描述 + 洞察：对每个假设给出数据证据，并写「这对决策意味着什么」。\n5. 输出报告：问题 → 数据与方法 → 3 个发现 → 行动建议 → 局限。\n\n**示例 Prompt（大学生版 · 无代码分析）**：\n```\n我有一份【数据描述，如 2000 行活动报名表，字段有院系/年级/渠道/是否到场】。\n请帮我：\n1）提出 3 个有价值的分析假设（要能指导后续行动，而非纯描述）；\n2）列出我需要在表格里做的清洗步骤（用自然语言，我会用 Excel/多维表格操作）；\n3）对每个假设，给出我应该看的指标和对比维度；\n4）提醒我这份数据可能有哪些偏差（如样本不均）会影响结论。\n【资料来源】请只基于我描述的字段和常见问题类型，不要编造我数据里没有的列。\n【分析过程】请说明你如何从「字段」推导出「假设」。\n【可复用结构】请给我一个「假设-指标-结论-建议」四段分析模板。\n```\n\n**评价标准**：\n- 数据已清洗并说明规则（20%）\n- 有 ≥3 个分析假设而非纯描述（30%）\n- 每个发现都有数据证据 + 行动建议（30%）\n- 标注数据局限/偏差（10%）\n- 报告可展示（10%）\n\n---\n\n## Prompt 模板（大学生版 · 三问结构）\n\n> 【资料来源】要求 AI 只基于你真实拥有的字段，防止它假设不存在的列。\n> 【分析过程】要求 AI 显式从字段推出假设，便于你判断假设是否合理。\n> 【可复用结构】「假设-指标-结论-建议」四段式，适用于所有业务分析。\n\n---\n\n## 人工检查清单\n- [ ] 我核对了 AI 生成的公式/脚本确实跑对了\n- [ ] 结论都有数据支撑，没有「感觉应该是」\n- [ ] 我区分了相关与因果，没有乱下结论\n- [ ] 报告里有「这对决策意味着什么」\n- [ ] 我标注了数据的样本偏差与局限\n- [ ] 保留了原始数据与处理记录\n\n---\n\n## 常见错误\n1. **只做描述统计**：堆图表但无结论，读者不知道「所以呢」。\n2. **AI 编造字段**：它假设了「消费金额」列，而你数据里根本没有。\n3. **相关当因果**：A 和 B 同时出现就说是因果，被追问就露馅。\n4. **忽略样本偏差**：2000 人全来自一个院系，结论不能外推。\n\n---\n\n## 课后作业（可展示作品）\n提交 **《数据洞察小报告》**，含：\n- 数据来源与字段说明\n- 清洗规则\n- 3 个发现（证据 + 建议）\n- 局限声明\n\n**展示要求**：能用「我们发现了 X，建议做 Y，因为数据表明 Z」的句式讲清楚。\n\n---\n\n## 评分标准（满分 100）\n\n| 项 | 分值 | 说明 |\n| --- | --- | --- |\n| 清洗规范 | 20 | 规则清晰、已执行 |\n| 假设质量 | 30 | ≥3 个、可行动 |\n| 证据+建议 | 30 | 有数据、有建议 |\n| 局限声明 | 10 | 标注偏差 |\n| 可展示 | 10 | 清晰可读 |\n\n> 参见 `示例作品/数据洞察小报告样例.md`。下一课，我们把能力直接用到期中最大的关卡：简历与面试。\n", "05-AI辅助简历和面试.md": "# 第 5 课  AI 辅助简历和面试\n\n## 一、教学目标\n\n- **知识**：理解 AI 在求职里是\"打磨助手\"不是\"代写枪手\"；掌握\"用 STAR 结构讲经历\"\"用岗位 JD 反推简历重点\"的方法；知道 AI 编的实习/项目不能写进简历（诚信红线）。\n- **能力**：把一段模糊经历改成有数据、有动作的简历条目；针对一个岗位 JD 优化简历侧重点；生成模拟面试问答并自评。\n- **作品**：一份《优化后简历（重点标注版）》+ 一份《模拟面试记录（问/答/改进）》。\n\n> 本课参考 Generative-AI-For-Beginners 的\"用 AI 做文本改写与结构化\"、Prompt-Engineering-Guide 的\"角色扮演 + 迭代优化\"技巧，结合求职真实场景重构。\n\n## 二、开场问题\n\n> 简历写\"负责项目管理工作\"，面试官为啥没兴趣？\n> 同一个你，投不同岗位却用同一份简历？\n> 面试被问\"讲讲你最有挑战的事\"，当场卡壳？\n\n简历和面试考的不是\"你多厉害\"，是\"你会不会把厉害讲清楚\"。AI 帮你把经历翻译成猎头和面试官爱看的语言。\n\n## 三、核心概念\n\n### 1. STAR：让经历有骨架\nSituation（背景）/ Task（任务）/ Action（动作）/ Result（结果）。AI 帮你把流水账改成 STAR，但**结果里的数字必须真实**。\n\n### 2. JD 反推：投其所好不造假\n把目标岗位 JD 给 AI，让它标\"这个岗位最看重的 3 项能力\"，你再把简历里对应经历往前放、写透。\n\n### 3. 模拟面试：用 AI 当面试官\n让 AI 扮演严苛面试官，基于你的简历追问。你练表达，它给反馈。这是\"迭代优化\"的真实用法。\n\n### 4. 红线：不编经历\n没做过的实习、没参与的项目，AI 能编但你不能写。诚信一旦破，代价远大于一份Offer。\n\n## 四、真实场景案例演示\n\n### 案例 1：经历改写\n**原**：\"参与了校园公众号运营。\"\n**AI 改**：\"运营校级公众号（粉丝 8000+），独立选题 12 篇，单篇最高阅读 1.2w，带来新生关注 1500+。\"\n**人工把关**：8000/1.2w/1500 这些数你真有吗？没有就别写。\n\n### 案例 2：模拟面试\n**AI 问**：\"你刚说负责数据分析，用的什么方法、得出什么结论？\"\n**你答**后 AI 评：\"结论清晰但缺'所以呢'——下次补一句业务影响。\"\n**价值**：提前暴露表达短板。\n\n## 五、动手任务\n\n- **背景**：你有一份简历草稿 + 一个目标岗位 JD。\n- **输入**：现简历文本、目标 JD。\n- **步骤**：\n  1. 用\"简历优化模板\"改 3 条经历为 STAR。\n  2. 用\"JD 反推模板\"重排简历重点。\n  3. 用\"模拟面试模板\"跑 5 轮问答并记改进点。\n- **预期输出**：《优化后简历》+《模拟面试记录》。\n\n## 六、Prompt 模板\n\n```\n你现在扮演：资深求职教练\n我的背景：[专业/年级/经历草稿]\n目标岗位 JD：[粘贴]\n请你：\n1. 把我的 3 段经历改成 STAR 结构，结果数字用[真实数据]占位让我填；\n2. 标出该 JD 最看重的 3 项能力，建议我把哪些经历前置；\n3. 基于我的简历，模拟 5 个面试官可能追问的问题，并附评分维度。\n限制：绝不编造我没做过的经历。\n```\n\n## 七、人工检查清单\n\n- [ ] 简历所有数字真实可答\n- [ ] 无编造的实习/项目/技能\n- [ ] JD 重点已体现且不造假\n- [ ] 模拟面试的改进点我已消化\n\n## 八、常见错误\n\n1. 让 AI 编\"看起来很牛\"的假经历。\n2. 一份简历投所有岗位不调整。\n3. 只改措辞不改结构，仍像流水账。\n4. 模拟面试练了但没复盘。\n\n## 九、课后作业\n\n提交《优化后简历（重点标注版）》+《模拟面试记录》（≥5 问，含改进点）。\n\n## 十、评分标准\n\n- 完成度：两份交付物齐全（40%）\n- 质量：STAR 清晰、JD 匹配（35%）\n- 诚信：无编造、数字真实（25%）\n", "06-AI项目设计.md": "# 第 06 课 · AI 项目设计 → 一份能落地的项目计划书\n\n**适合人群**：想做出可展示 AI 项目的大学生、研究生、应届生\n**建议时长**：120 分钟\n\n## 一、课程目标\n学完本课，你将能够：\n1. **知识**：理解「问题定义 > 技术选型」，掌握 AI 项目从需求到落地的标准拆解框架；\n2. **能力**：把一个模糊的想法收敛成有边界、可验证、能在 2～4 周内做出最小版本（MVP）的方案；\n3. **作品**：产出**《AI 项目计划书》**，包含问题定义、方案、里程碑、风险与验收标准，可直接作为毕业项目或作品集的开篇。\n\n---\n\n## 二、开场问题\n> 「我想做一个 AI 助手，帮所有人解决所有问题。」——这句话的问题在哪？\n> 它没有具体用户、没有具体场景、没有验收标准，所以永远做不完也做不出来。好项目的第一步不是写代码，而是把范围**砍小**：为**谁**、解决**哪一个**具体痛点、做到**什么程度**算成功。\n\n---\n\n## 三、核心概念\n\n**1. 问题定义先于技术**\n先回答「谁、什么痛点、痛到什么程度、现在怎么解决、我的方案好在哪」，再谈用什么模型、什么工具。90% 的学生项目失败于问题太大或根本不算痛点。\n\n**2. AI 项目的标准拆解框架（七要素）**\n- 用户与场景：目标用户是谁，在什么场景下用。\n- 问题与价值：解决什么痛点，带来什么可衡量的价值。\n- 方案与技术：核心流程 + 技术选型（是否需要 RAG、是否需要微调、能否用无代码平台）。\n- MVP 范围：最小可用版本只做哪一条主流程，砍掉一切「锦上添花」。\n- 里程碑与分工：2～4 周拆成周节点。\n- 验收标准：怎么证明「做成了」（可量化指标 + 可演示 Demo）。\n- 风险与边界：数据从哪来、幻觉如何控制、隐私如何处理。\n\n**3. 是否需要 RAG / 微调？**\n- 需要「基于特定资料回答、可溯源」→ 用 RAG（检索增强），成本低、见效快，适合学生项目（参考 llm-zoomcamp 的 RAG 实战路线）。\n- 需要「模型风格/格式稳定改变」→ 才考虑微调，学生阶段一般不必。\n- 大多数展示型项目：一个好 Prompt + RAG + 无代码平台就足够。\n\n**4. MVP 思维**：先做「能跑通一条主流程」的版本给人看，再迭代，而不是憋大招。\n\n---\n\n## 四、案例演示（真实场景）\n\n**场景 A：从「太大」到「刚好」**\n- 初始想法：「做一个帮大学生的学习 AI。」\n- 收敛后：「为**备考期末的本专业同学**，做一个**把课程 PPT + 笔记变成 20 道自测题**的工具，正确题目标注来源页码。」用户明确、痛点明确、验收明确（能生成 20 题且题题可溯源）。\n\n**场景 B：验收标准救了项目**\n- 小组做「AI 行业调研助手」，前两周越做越发散，一会儿想加图表、一会儿想接实时新闻。加入验收标准后——「输入一个行业名，10 分钟内产出含 5 家公司、3 个趋势、每条结论带来源链接的报告」——范围立刻清晰，第三周就跑通了 Demo，多出来的想法被移入「二期」，不再拖垮一期。\n\n**场景 C：技术选型先问「要不要 RAG」**\n- 有人想给「校园活动通知助手」做模型微调，被评审拦下：它只需要按固定格式汇总通知，一个好 Prompt + 飞书多维表格自动化就够了，微调只会拖长周期、还不一定更好。省下的两周用来打磨输出格式，反而更受同学欢迎。\n\n---\n\n## 五、动手任务\n\n**工具清单**：对话模型（ChatGPT/Kimi/DeepSeek）、飞书文档/Notion/Markdown 写计划书。\n\n1. 用一句话写清你的项目：「为【谁】解决【什么痛点】，做到【什么程度】算成功。」\n2. 按核心概念的七要素框架，逐项填写，特别打磨「MVP 范围」和「验收标准」。\n3. 用下方模板让 AI 当「项目评审」，挑出你计划里「范围太大 / 没法验收 / 有伦理风险」的地方，你据此收敛。\n4. 画一张 2～4 周的里程碑甘特草表（周 × 任务）。\n\n---\n\n## 六、Prompt 模板（项目设计版）\n\n```\n你是一位务实的 AI 产品导师，擅长帮学生把项目砍到能落地。\n我的项目想法是：【一句话描述】。\n请帮我：\n1. 用「用户/场景、问题/价值、方案/技术、MVP 范围、里程碑、验收标准、风险」七要素审视它；\n2. 明确指出哪里范围太大、哪里没有可验收的成功标准，并给出收敛建议；\n3. 判断这个项目是否需要 RAG 或微调，能否用无代码平台（Coze/Dify）实现，给出理由；\n4. 帮我把它拆成 2-4 周、每周一个可交付节点的计划。\n要求：直接、具体，宁可让项目更小也要能做完做出来。\n```\n\n---\n\n## 七、人工检查清单\n- [ ] 我能一句话说清「为谁、解决什么、做到什么算成功」\n- [ ] MVP 只保留一条主流程，砍掉了所有「顺便也做」\n- [ ] 验收标准是可量化、可演示的，不是「效果不错」\n- [ ] 里程碑落到每周，且第一周就有可见产出\n- [ ] 我评估了数据来源、幻觉与隐私风险，并写进了计划\n\n---\n\n## 八、常见错误\n1. **范围太大**：想做「万能助手」，结果什么都做不完。\n2. **先选技术后想问题**：一上来纠结用哪个模型，却说不清解决谁的痛点。\n3. **没有验收标准**：无法判断做完没做完，项目无限拖延。\n4. **忽略数据与伦理**：不想清楚数据从哪来、是否涉及隐私，后期返工。\n5. **计划书写完就锁死**：不允许迭代，遇到现实困难无法调整。\n\n---\n\n## 九、课后作业（明确提交物）\n提交 **《AI 项目计划书》**（1～2 页），必须包含：\n- 一句话项目定义\n- 七要素完整填写（用户/场景、问题/价值、方案/技术、MVP 范围、里程碑、验收标准、风险）\n- 一张 2～4 周里程碑表\n- 一段「为什么这个范围我能做完」的自我论证\n> 建议直接从第 09 课「三个毕业项目」里挑一个来写，本课计划书即为毕业项目的开题。\n\n---\n\n## 十、评分标准（满分 100）\n\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 问题定义清晰度 | 25 | 用户、痛点、成功标准明确 |\n| MVP 收敛合理 | 20 | 范围小而可完成 |\n| 验收标准可量化 | 20 | 可演示、可衡量 |\n| 里程碑可执行 | 15 | 周节点清晰、第一周有产出 |\n| 风险与伦理 | 10 | 覆盖数据/幻觉/隐私 |\n| 可展示性 | 10 | 结构规范、逻辑通顺 |\n\n> 【资料来源】RAG/微调选型参考 llm-zoomcamp 的 RAG 实战与 mlabonne/llm-course 的工程侧路线；MVP 与问题定义为通用产品方法论。\n> 下一课，我们把这份计划书里的核心流程，用无代码平台做成一个能点开就用的 Demo。\n", "07-AI应用原型.md": "# 第 7 课  AI 应用原型\n\n## 一、教学目标\n\n- **知识**：理解\"原型\"是把计划书变成能演示的东西，不一定要写代码；掌握无代码/低代码路径（Coze / Dify / 飞书多维表格 / Streamlit 模板）；知道原型目的是\"验证想法\"不是\"做产品\"。\n- **能力**：把一个简单 AI 助手想法，搭成一个能跑的演示（对话机器人或自动化表格）；讲清\"我用了什么、怎么用\"。\n- **作品**：一个可演示的《无代码/低代码 AI Demo》+ 一段使用说明。\n\n> 本课参考 LLM Universe\"动手学大模型应用开发（无代码思路）\"、DataTalksClub/llm-zoomcamp 的\"从原型到可用\"、Generative-AI-For-Beginners 的\"低代码 AI 应用\"章节。\n\n## 二、开场问题\n\n> 计划书有了，但别人说\"演示看看\"，你只能掏 PPT？\n> 不会 Python，是不是就和\"做 AI 项目\"绝缘了？\n> 想验证想法值不值得做，却卡在\"怎么把它弄出来\"？\n\n原型不一定写代码。今天你能用拖拽工具，半小时做出一个能对话的 AI 助手。\n\n## 三、核心概念\n\n### 1. 原型 = 最小可演示\n目标不是完美，是\"让人一眼看懂你在解决什么\"。一个能对话的 bot，胜过十页架构图。\n\n### 2. 无代码路径\n- **Coze / Dify**：拖拽搭一个带知识库和插件的对话机器人，零代码。\n- **飞书多维表格 + AI 字段**：把表格变\"智能助手\"，适合资料整理类。\n- **Streamlit 模板**：会一点 Python 可用现成模板改，部署快。\n\n### 3. 该选哪条\n资料问答类 → Coze/Dify 知识库；表格智能类 → 飞书多维表格；要嵌网页 → Streamlit。\n\n### 4. 红线：别用真实隐私数据训练/上传\n原型阶段用脱敏样例；涉及校内/公司真实数据，先授权。\n\n## 四、真实场景案例演示\n\n### 案例：课程资料问答 bot（Coze）\n- 步骤：新建 bot → 上传课程笔记为知识库 → 设\"只依知识库答\" → 发布试聊。\n- 演示：问\"第三章重点\"，bot 基于笔记答。\n- 价值：半小时做出，验证\"资料整理\"需求是否成立。\n\n## 五、动手任务\n\n- **背景**：基于第 6 课的项目计划书。\n- **输入**：计划书 MVP 范围。\n- **步骤**：\n  1. 选一条无代码路径。\n  2. 搭出最小可演示版（含知识库或自动化）。\n  3. 录屏/截图 + 写使用说明。\n- **预期输出**：《AI Demo》+ 使用说明。\n\n## 六、Prompt / 搭建模板\n\n```\n我的 MVP 是：[一句话]\n目标用户试用场景：[ ]\n我选的工具：[Coze/Dify/飞书多维表格/Streamlit]\n请给我：①该工具的搭建步骤清单 ②知识库/数据怎么准备 ③演示时该展示的 3 个关键动作\n限制：用脱敏样例，不碰真实隐私数据。\n```\n\n## 七、人工检查清单\n\n- [ ] Demo 能真实跑通核心路径\n- [ ] 未上传未授权/隐私数据\n- [ ] 使用说明他人能照做\n- [ ] 范围符合 MVP，没过度膨胀\n\n## 八、常见错误\n\n1. 一上来想做\"完整产品\"，迟迟做不出。\n2. 用真实隐私数据训练原型。\n3. 选了不匹配需求的工具。\n4. 只有截图没有说明，别人看不懂。\n\n## 九、课后作业\n\n提交一个可演示 Demo（链接/录屏）+ 一段使用说明（≥200 字）。\n\n## 十、评分标准\n\n- 完成度：Demo 可运行 + 说明齐全（40%）\n- 质量：路径选得对、核心路径跑通（35%）\n- 安全：数据脱敏合规（25%）\n", "08-作品集包装.md": "# 第 8 课  作品集包装\n\n## 一、教学目标\n\n- **知识**：理解\"作品集\"是比简历更有力的证据——它让人看到你\"怎么做、做成啥\"；掌握\"项目背景—问题—方案—过程—结果—反思\"的展示结构；知道个人主页/展示页的价值。\n- **能力**：把前 7 课产物（调研报告/论文笔记/数据报告/简历/计划书/Demo）打包成一份统一风格的作品集；写一份项目展示页。\n- **作品**：一份《AI 项目作品集》（含≥2 个完整项目展示 + 个人简介）。\n\n> 本课整合前 7 课产出，参考 LLM Universe\"把学习成果沉淀为项目\"、product-on-purpose/pm-skills 的\"作品即证据\"理念。\n\n## 二、开场问题\n\n> 面试官问\"你做过什么项目\"，你翻聊天记录现找？\n> 一堆零散文档，没人知道你到底会啥？\n> 想挂个人主页，却不知放什么、怎么写？\n\n作品集就是把你的能力\"陈列\"出来。它让\"我会用 AI\"变成\"你看，这是我做的\"。\n\n## 三、核心概念\n\n### 1. 展示结构六段\n背景（为什么做）→ 问题（解决啥）→ 方案（怎么做）→ 过程（关键步骤/截图）→ 结果（数据/反馈）→ 反思（踩坑与改进）。\n\n### 2. 质量 > 数量\n2 个写透的项目，胜过 10 个半成品。每个都要有\"结果\"和\"反思\"。\n\n### 3. 个人主页\n用飞书/Notion/GitHub Pages 搭一页，放简介+作品链接，面试直接发链接。\n\n### 4. 红线：如实呈现\nDemo 截图、数据必须真实；写\"主导\"还是\"参与\"要诚实。\n\n## 四、真实场景案例演示\n\n### 案例：作品集项目卡\n- 标题：AI 学习资料整理助手\n- 背景：期末资料散乱\n- 方案：Coze 知识库 bot（见第 7 课）\n- 过程：截图 3 张（搭建/知识库/试聊）\n- 结果：同学试用\"找资料快一倍\"\n- 反思：知识库需更结构化，否则答偏\n\n## 五、动手任务\n\n- **背景**：汇总前 7 课所有产物。\n- **输入**：你的报告/笔记/Demo/计划书。\n- **步骤**：\n  1. 选≥2 个项目按六段结构写成展示页。\n  2. 写一段个人简介（能力地图）。\n  3. 组装成一份作品集文档或主页。\n- **预期输出**：《AI 项目作品集》。\n\n## 六、Prompt 模板\n\n```\n你现在扮演：作品集导师\n我有以下项目产物：[列出]\n请帮我：\n1. 按【背景/问题/方案/过程/结果/反思】六段，为其中 2 个写成展示文案；\n2. 写一段 100 字个人简介，突出我的 AI 能力地图；\n3. 给出作品集排版建议（用 Notion/飞书均可）。\n限制：所有数据/截图必须真实，不夸大我的角色。\n```\n\n## 七、人工检查清单\n\n- [ ] 每个项目有结果与反思\n- [ ] 数据/截图真实\n- [ ] 角色描述诚实（主导/参与）\n- [ ] 主页/文档他人可访问\n\n## 八、常见错误\n\n1. 只放截图不放说明。\n2. 项目无\"结果\"，像没做完。\n3. 夸大个人贡献。\n4. 作品集无统一风格，像拼凑。\n\n## 九、课后作业\n\n提交一份《AI 项目作品集》（≥2 项目六段展示 + 个人简介）。\n\n## 十、评分标准\n\n- 完成度：作品集齐全（40%）\n- 质量：结构完整、有结果反思（35%）\n- 诚信：真实不夸大（25%）\n", "09-三个毕业项目.md": "# 第 09 课 · 三个毕业项目 → 可直接开做的详细设计\n\n**适合人群**：想用一份完整项目结业、并放进作品集的大学生、研究生、应届生\n**建议时长**：120 分钟（选择一个项目深化，或通读三选一）\n\n## 一、课程目标\n学完本课，你将能够：\n1. **知识**：掌握「从痛点出发、到可验收 Demo 收尾」的完整项目设计范式的三个实例；\n2. **能力**：从三个候选毕业项目中选定一个，套用第 06 课计划书框架完成自己的开题；\n3. **作品**：选定项目的**详细设计方案**（含背景、问题定义、解决方案、过程步骤、预期成果），可直接进入 07 课做原型。\n\n---\n\n## 二、开场问题\n> 结营要交一个项目，但你不知道做什么。本课给你三个「已经验证过价值、且学生能做完」的方向：简历面试助手、学习资料整理助手、行业调研助手。挑一个离你最近的，今天就能开做。\n\n---\n\n## 三、核心概念\n三个项目都遵循同一范式（详见 06/10 课）：**真实痛点 → 可量化价值 → 无代码可落地 → 可演示验收**。它们分别覆盖「求职」「学习」「研究」三类高频场景，难度递增，但都能在 2～4 周用无代码/低代码完成。技术选型上，三者都适合 RAG（基于专属资料问答）或规则 + Prompt 组合，优先 Coze/Dify/飞书多维表格，需要上传文件分析时可考虑 Streamlit。\n\n---\n\n## 四、案例演示（真实场景）\n- **方向一已被验证**：学员用 Coze 搭「简历体检 + 模拟面试」智能体，投实习时当作作品展示，面试官当场体验，直接加分。\n- **方向二已被验证**：研究生用飞书多维表格把 200 页课程 PDF 拆成「知识点 + 自测题」，期末复习效率翻倍。\n- **方向三已被验证**：商科生用 AI 把一周行业调研压到一天，产出含来源链接的报告，被实习导师采纳。\n\n---\n\n## 五、动手任务\n1. 通读下面三个设计，用「哪个痛点离我最近、哪个我的资料最齐」标准选一个。\n2. 套用 06 课七要素框架，把选定项目写成自己的计划书（用户/场景、问题/价值、方案/技术、MVP、里程碑、验收、风险）。\n3. 标注：这个项目要用 Coze/Dify、飞书多维表格、还是 Streamlit？为什么？\n4. 进入 07 课，把 MVP 跑成 Demo。\n\n---\n\n## 六、Prompt 模板（项目选型版）\n```\n我的情况：【专业/年级/手头资料】，时间约【X 周】。\n请基于「AI简历面试助手 / AI学习资料整理助手 / AI行业调研助手」三个方向，\n帮我判断哪个最适合我，说明理由，并给每个选项列 3 条我需要提前准备的素材。\n要求：结合我的专业和现有资料，不推荐需要我现去收集大量数据的方向。\n```\n\n---\n\n## 七、人工检查清单\n- [ ] 我选的项目痛点真实，不是「我觉得应该有」\n- [ ] 我已列出做它需要的真实资料（简历/JD、课件、行业数据）\n- [ ] 我标注了技术路径与理由\n- [ ] 我能写出 1 句验收标准\n- [ ] 范围在 2～4 周可完成\n\n---\n\n## 八、常见错误\n1. **三个都想要**：贪多导致全做一半，不如一个做透。\n2. **选最炫的不选最近的**：选了资料最缺的方向，后期卡在找数据。\n3. **忽略验收**：没有「做成什么样算成功」的标准。\n4. **低估隐私**：把含个人信息的简历/未公开资料直接上传第三方平台不加处理。\n\n---\n\n## 九、课后作业（明确提交物）\n提交**选定项目的详细设计书**（1～2 页）：背景、问题定义、解决方案、过程步骤（周里程碑）、预期成果（可量化）。下一课即可据模板生成作品集卡片。\n\n---\n\n## 十、评分标准（满分 100）\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 选型合理性 | 25 | 痛点真实、资料齐备 |\n| 设计完整性 | 30 | 含五要素、验收可量化 |\n| 技术路径清晰 | 25 | 工具选型有论证 |\n| 可执行性 | 20 | 2～4 周可完成 |\n\n---\n\n## 附录：三个毕业项目详细设计\n\n### 项目一 · AI 简历面试助手\n- **背景**：大学生求职时，简历表达弱、不懂岗位匹配、面试临场慌。市面通用工具不适配个人真实经历。\n- **问题定义**：帮助用户在 30 分钟内把一段真实经历改写成 STAR 简历条目，并针对目标 JD 完成一轮结构化模拟面试。\n- **解决方案**：知识库 = 用户真实经历 + 目标岗位 JD；用 Coze/Dify 搭智能体，分「简历优化」「模拟面试」「缺口分析」三个技能；AI 只能优化表达、不得编造经历（设红线校验）。\n- **过程步骤**：①收集自身经历与 JD；②搭知识库与 Prompt；③分技能测试；④录 8～10 轮面试；⑤输出优化前后对照 + 面试记录。\n- **预期成果**：《简历优化对照表》+《模拟面试记录》，可分享 Demo 链接，作为作品集核心卡片。\n\n### 项目二 · AI 学习资料整理助手\n- **背景**：课程/论文资料多而散，看书慢、复习无重点。\n- **问题定义**：把 PPT/PDF/笔记自动整理成「知识点 + 自测题 + 来源页码」的结构化复习包。\n- **解决方案**：用飞书多维表格「AI 字段」对每段资料生成摘要与题目；或用 Dify 上传资料做 RAG 问答；保留来源标注以控幻觉。\n- **过程步骤**：①整理资料入库；②配置抽取/出题 Prompt；③批量产出并人工抽检准确率；④做成可分享复习表/问答助手。\n- **预期成果**：一份结构化复习包 + Demo，体现「把 AI 接回专业学习」。\n\n### 项目三 · AI 行业调研助手\n- **背景**：实习/课业常需快速看懂一个行业，人工检索耗时、易漏源。\n- **问题定义**：输入行业名，10 分钟内产出含「头部公司、关键趋势、风险、每条结论带来源链接」的结构化报告。\n- **解决方案**：RAG + 规则工作流（Coze/Dify 或 Streamlit），先做检索聚合再让模型按模板产出，强制每条结论带引用。\n- **过程步骤**：①确定报告模板与信源白名单；②搭检索+生成流程；③测试 3 个行业、核对来源真实性；④导出报告模板化。\n- **预期成果**：可复用的行业调研工作流 + 3 份样例报告，强证明「研究力 + AI 落地力」。\n\n> 【资料来源】RAG 与工作流范式参考 llm-zoomcamp；无代码平台能力见微软 generative-ai-for-beginners 的部署章节与 Coze/Dify 官方文档（以当前版本为准）。\n", "10-作品集模板.md": "# 第 10 课 · 作品集模板 → 一套可复用的标准展示框架\n\n**适合人群**：需要把任意项目规范化展示的大学生、研究生、应届生\n**建议时长**：90 分钟\n\n## 一、课程目标\n学完本课，你将能够：\n1. **知识**：掌握「背景 / 问题定义 / 解决方案 / 过程截图 / 结果反思」五段式作品集卡片结构及其填写逻辑；\n2. **能力**：用统一模板把 05–09 课的任何产出，快速包装成专业、可信、可横向对比的项目卡片；\n3. **作品**：产出**一份填好的标准作品集模板**（以你的真实项目为例），作为作品集（08 课）的统一底座。\n\n---\n\n## 二、开场问题\n> 两个同学都做了 AI 项目：一个写「我做了一个很厉害的助手」，另一个写「背景…问题…方案…截图…结果提升 40%」。招聘方信谁？显然第二个。\n> 本课给你一套「填空式」模板——只要按格子填，你的项目就天然专业。\n\n---\n\n## 三、核心概念\n\n**1. 五段式是说服力的最小闭环**\n- **项目背景**：谁、在什么情境下、为什么需要它（建立共鸣）。\n- **问题定义**：具体痛点 + 一句可验收的成功标准（没有这步，项目会发散）。\n- **解决方案**：核心流程（输入→处理→输出）+ 关键选型理由（为什么用这个工具）。\n- **过程截图**：2～3 张真实界面/输出，证明「真的做出来了」（无截图 = 像没做）。\n- **结果反思**：量化成果 + 1 条踩坑 + 1 条改进（敢写坑，反而更可信）。\n\n**2. 每个格子都有「反例红线」**\n- 背景不写「AI 很火」，要写「我/用户具体遇到的麻烦」。\n- 问题定义不写「做一个助手」，要写「做到 X 算成功」。\n- 截图不用网图，必须是自己的真实界面。\n\n**3. 模板 = 可复用资产**\n同一套五段式，可套简历助手、学习助手、调研助手任意一个，招聘方一眼就能横向比较你的多个项目。\n\n---\n\n## 四、案例演示（真实场景）\n\n**场景 A：同一模板套不同项目**\n- 小林用五段式写了「简历助手」和「行业调研助手」两张卡，结构一致、信息密度高，面试官说「终于看到一个把项目讲明白的」。\n\n**场景 B：反思栏救场**\n- 「结果反思」里写：「RAG 初版召回不准，加关键词过滤后准确率从 60% 到 90%」。这条踩坑让项目显得真实、有工程思考，比只写「准确率 90%」更得分。\n\n---\n\n## 五、动手任务\n1. 复制下方模板到飞书文档/Markdown。\n2. 选你 05–09 课里**最完整**的一个项目，逐格填写。\n3. 重点补「过程截图」（去跑一次 Demo 截图）和「结果反思」的量化数字。\n4. 通读一遍，用「陌生人 30 秒能否看懂」做自检。\n\n---\n\n## 六、Prompt 模板（模板填写助手）\n```\n你是一位作品集编辑。我做了一个 AI 项目，真实信息如下：【背景/我做了什么/用了什么工具/真实结果数据/踩过的坑】。\n请按「项目背景/问题定义/解决方案/过程截图(描述应截什么)/结果反思」五段，帮我生成一份作品集卡片草稿。\n要求：每个数字必须来自我提供的事实，我没有的用【待我补充：___】标记，绝不编造。\n```\n\n---\n\n## 七、人工检查清单\n- [ ] 背景写的是具体麻烦，不是「AI 很火」\n- [ ] 问题定义里有可验收的成功标准\n- [ ] 解决方案写清了流程与选型理由\n- [ ] 过程截图是自己的真实界面（≥2 张）\n- [ ] 结果反思有量化 + 真实踩坑 + 改进\n\n---\n\n## 八、常见错误\n1. **背景空泛**：写「AI 是趋势」代替真实场景，无共鸣。\n2. **问题不可验收**：只说「做个助手」，没说做成什么样。\n3. **截图造假/缺失**：用示意图代替真实界面，可信度归零。\n4. **只写成功不写坑**：显得不真实、无反思。\n5. **数字无来源**：写「提升 90%」却说不出怎么算的。\n\n---\n\n## 九、课后作业（明确提交物）\n提交**一份填好的标准作品集模板**：五段齐全，含 ≥2 张真实截图、可量化结果、真实反思。它应可直接作为 08 课作品集的一个项目卡片。\n\n---\n\n## 十、评分标准（满分 100）\n| 项目 | 分值 | 说明 |\n| --- | --- | --- |\n| 背景与问题 | 20 | 具体、可验收 |\n| 解决方案 | 25 | 流程+选型清晰 |\n| 过程截图 | 25 | 真实、≥2 张 |\n| 结果量化 | 20 | 数字可溯源 |\n| 反思真实 | 10 | 有坑有改进 |\n\n---\n\n## 附录：标准作品集模板（含填写说明与示例）\n\n### 【模板结构】\n```\n# 项目名：________\n## 一、项目背景\n[填写说明] 写给「完全不认识你的人」。说清：谁、在什么情境、遇到什么具体麻烦。\n[示例] 备考期末的我，面对 200 页课程 PPT，不知道重点在哪、复习没方向。\n\n## 二、问题定义\n[填写说明] 一句话痛点 + 一句成功标准（做到什么算做完）。\n[示例] 痛点：资料多、抓不住重点。成功标准：输入资料，10 分钟内产出 20 道带来源页码的自测题。\n\n## 三、解决方案\n[填写说明] 核心流程(输入→处理→输出) + 为什么选这个工具。\n[示例] 飞书多维表格导入 PDF，AI 字段按段落抽取知识点并出题，标注来源页码。选它是因为零代码、可分享。\n\n## 四、过程截图\n[填写说明] 2~3 张：资料导入界面、AI 生成结果、一次完整输出。必须是自己的真实界面。\n[示例] （图1：导入 PDF 后的表格；图2：AI 字段生成题目；图3：一张自测题卡片）\n\n## 五、结果反思\n[填写说明] 量化成果 + 1 条踩坑 + 1 条改进。\n[示例] 成果：复习时间从 6 小时压到 2 小时，题目覆盖 85% 考点。踩坑：初版题目偏简单，后加了「按难度分级」 Prompt。改进：若重做会加错题回溯。\n```\n\n### 【填写红线】\n- 所有数字必须可溯源，AI 不该替你编任何事实。\n- 截图必须真实，不可用网络示意图。\n- 「成功标准」必须可验收，否则项目视为未完成。\n\n> 【资料来源】五段式承袭本营 06 课「问题定义先于技术」与 08 课作品集包装范式。\n", "00-课程总览-en.md": "# AI Project & Career Capability Camp · Course Overview\n\n> A \"project-driven + career-oriented\" hands-on AI bootcamp for university students / graduate students / new graduates.\n> The goal is not to learn more Prompts, but to use AI to complete a full **research → design → execution → showcase** loop, producing a portfolio you can put on your résumé, bring to interviews, and host on a personal homepage.\n\n---\n\n## 1. What Pain Points This Course Solves\n\nMany students are no strangers to AI: they have used ChatGPT to write weekly reports, Copilot to autocomplete code, and watched a few tutorials. But when asked \"What AI projects have you built?\" or \"Where is your portfolio?\", they often have no answer. The problem is not the tools — it is the **lack of a production line that turns capability into tangible artifacts**.\n\nThis camp breaks AI capability into 8 deliverable stages, each requiring you to produce a real document or prototype:\n\n- Research capability (industry research report)\n- Reading capability (paper / material reading notes)\n- Analysis capability (data insight mini-report)\n- Job-seeking capability (résumé + mock interview notes)\n- Design capability (project plan)\n- Prototyping capability (no-code / low-code Demo)\n- Packaging capability (portfolio / showcase page)\n\nThese 8 stages converge into an **AI-native portfolio** — far more powerful than the phrase \"I know how to use AI\".\n\n---\n\n## 2. Target Audience\n\n| Audience | Typical Need | What This Camp Provides |\n| --- | --- | --- |\n| Undergraduates | Want to do research / competitions / internships but don't know where to start | Paper reading, industry research, project prototypes |\n| Graduate students | Have a research direction but lack engineering and presentation skills | Data analysis, prototyping, portfolio packaging |\n| New graduates | Thin résumé, no interview stories | Résumé optimization, mock interviews, demonstrable projects |\n| Career switchers / cross-discipline learners | Non-technical background, want to use AI for efficiency | No-code path, non-engineering application perspective |\n\nThis camp does not require a programming background. Code-related parts offer \"no-code alternatives\" (e.g., Coze, Dify, Feishu Multi-dimensional Tables, Streamlit templates) so you can deliver only documents and product-side artifacts.\n\n---\n\n## 3. Course Map (8 Lessons → 8 Artifacts)\n\n| Lesson | Topic | Core Deliverable | Capability |\n| --- | --- | --- | --- |\n| 01 | AI Learning & Career Positioning | Personal AI Capability Map | Self-awareness / planning |\n| 02 | AI Information Research | An industry research report | Information retrieval / synthesis |\n| 03 | AI Paper & Material Reading | A paper reading note | Critical reading |\n| 04 | AI Data Analysis Primer | A data insight mini-report | Data thinking |\n| 05 | AI-Assisted Résumé & Interview | Résumé optimization + mock interview notes | Job-seeking expression |\n| 06 | AI Project Design | A project plan | Product design |\n| 07 | AI Application Prototype | A no-code / low-code Demo | Engineering execution |\n| 08 | Portfolio Packaging | A project showcase page / portfolio | Personal branding |\n\nGraduation requirement: choose 1 of the 3 capstone options in Lesson 09 (or a self-chosen equivalent), combine it with the outputs of Lessons 01–08, and produce a launchable, demonstrable capstone work.\n\n---\n\n## 4. Content Sources & Methodology (fetched and localized repositories)\n\nThis course was not written from scratch. It was produced by **fetching + Chinese-localization restructuring + student-perspective reconstruction** of the following 7 internationally authoritative open-source repositories. Each contributes a different underlying methodology:\n\n1. **microsoft/AI-For-Beginners** — AI fundamentals: symbolic AI, neural networks, computer vision, NLP, Transformer, LLM & prompt programming, AI ethics. Maps to this camp's \"foundational literacy\" and \"responsible use\".\n2. **microsoft/generative-ai-for-beginners** — 21 lessons on generative AI applications: prompt engineering, RAG, vector stores, low-code apps, AI Agent, function calling, fine-tuning. Maps to this camp's \"application prototype\" and \"project design\".\n3. **openai/openai-cookbook** — API practical examples: how to apply LLM capability to specific tasks (classification, summarization, extraction, data generation, evaluation). Maps to this camp's \"translating API thinking into non-engineering-comprehensible application awareness\".\n4. **mlabonne/llm-course** — Technical progression framework: LLM Fundamentals / LLM Scientist / LLM Engineer three-stage, covering fine-tuning, quantization, deployment, evaluation. Maps to this camp's \"progression path\" and \"technical depth map\".\n5. **DataTalksClub/llm-zoomcamp** — RAG / knowledge base practice: Agentic RAG, vector retrieval, evaluation, monitoring, end-to-end Capstone. Maps to this camp's \"knowledge-base assistant\" and \"capstone project\" structure.\n6. **datawhalechina/llm-universe** — Chinese-community \"Hands-on LLM Application Development\": calling APIs, building knowledge bases, constructing RAG, Streamlit deployment, validation iteration. Maps to this camp's \"low-code Demo\" and \"localized expression\".\n7. **dair-ai/Prompt-Engineering-Guide** — Prompt engineering methodology: Zero-Shot / Few-Shot / CoT / Prompt Chaining / ToT / RAG / ReAct technique spectrum. Maps to this camp's \"Prompt template library\" and \"student-version three-question structure\".\n\n> Restructuring principle: the original repos lean toward \"technical implementation / English readers / engineers\", while this camp leans toward \"student perspective / Chinese / project & career output\". We keep only content relevant to the \"research—design—execution—showcase\" main line, delete pure algorithmic derivations, and add localized modules such as job-seeking, portfolio, and demonstrable deliverables.\n\n---\n\n## 5. Unified Structure of Each Lesson (seen in Lessons 01–08)\n\n- **Learning Goals**: what you can do after this lesson\n- **Warm-up Question**: introduced with a real dilemma\n- **Core Concepts**: knowledge points you must master (in plain language)\n- **Real-scenario Case**: real situations from students / job seekers\n- **Hands-on Task**: includes tool list / task description / sample Prompt / evaluation criteria\n- **Prompt Template (student version)**: additionally requires 【Sources】【Analysis Process】【Reusable Structure】\n- **Human Review Checklist**: items you must manually verify after AI generation\n- **Common Mistakes**: the pitfalls beginners most easily fall into\n- **Homework**: must be a demonstrable artifact\n- **Grading Rubric**: quantifiable scoring for self- and peer-assessment\n\n---\n\n## 6. Learning Outcomes & Assessment\n\n**Process score (60%)**: deliverables of Lessons 01–08, self-assessed + peer-assessed per the grading rubric.\n**Capstone score (40%)**: choose 1 of 3 capstone projects in Lesson 09, or an equivalent self-chosen project, satisfying:\n- Has a demonstrable Demo or complete documentation\n- Has a portfolio showcase page\n- Can state in one sentence \"what problem it solved, how it was solved, and what the result was\"\n\n**Red Lines (cannot be crossed)**:\n1. Complete at least 1 demonstrable artifact (failure to do so means no graduation).\n2. Content must go beyond Prompts — it must include a complete project process (research / design / execution / showcase).\n3. The artifact must be résumé-, interview-, and homepage-ready: phrased project-wise and professionally, eliminating empty statements like \"AI helped me write it\".\n\n---\n\n## 7. Toolbox (available throughout, introduced gradually per lesson)\n\n| Category | Example Tools | Use |\n| --- | --- | --- |\n| Conversation / Writing | ChatGPT, Claude, Tongyi Qianwen, Kimi, DeepSeek | Research, reading, writing, interview practice |\n| Retrieval | Google Scholar, arXiv, Semantic Scholar, CNKI, MetaSo | Papers & materials |\n| Data analysis | Excel, Feishu Multi-dimensional Tables, Python (optional), NotebookLM | Data insight |\n| No-code prototype | Coze, Dify, Feishu, Streamlit (templates), Gradio | Application Demo |\n| Knowledge base | Tencent Docs, Notion, Obsidian, local vector store (advanced) | Personal knowledge management |\n| Showcase | GitHub Pages, Notion, personal blog, Canva | Portfolio homepage |\n| Evaluation reference | LLM-as-Judge, human peer review | Quality control |\n\n---\n\n## 8. Three Suggestions for Learners\n\n1. **Finish first, perfect later**: for each lesson, produce a \"viewable\" version first, then iterate. A portfolio is iterated, not written once.\n2. **Let your AI leave traces**: keep Prompts, raw materials, and revision history — this is itself a story you can tell in interviews.\n3. **Learn in Public**: publish your work to GitHub / blog / social feed, following llm-zoomcamp's \"Learning in Public\" philosophy — exposure brings feedback and opportunities.\n\n---\n\n## 9. Supplementary File List\n\n- `01` ~ `08`: eight main lessons\n- `09-三个毕业项目.md`: detailed plans for AI résumé-interview assistant / AI study-material organizer / AI industry-research assistant\n- `10-作品集模板.md`: template for project background / problem definition / solution / process screenshots / results & reflection\n- `11-Prompt模板库.md`: reusable Prompt collection for the whole course (including the student-version three-question structure)\n- `示例作品/`: demonstrable samples bundled with this course (industry research report, paper notes, portfolio homepage HTML) — both exemplars and scaffolds you can directly rewrite\n\n> Next lesson, we start with \"knowing yourself\": drawing your personal AI capability map.\n", "01-AI学习与职业定位-en.md": "# Lesson 01 · AI Learning & Career Positioning → Personal AI Capability Map\n\n## Learning Goals\nAfter this lesson, you will be able to:\n1. Use one diagram to clearly state \"what I can do now, what I lack, what to learn next\";\n2. Break the vague \"I want to learn AI\" into executable skill nodes;\n3. Produce your first artifact: **\"Personal AI Capability Map\"** (one table + a 200-character self-positioning paragraph). It serves as your navigation through the whole camp and lets you explain your AI literacy in the first 30 seconds of an interview.\n\n---\n\n## Warm-up Question\n> Interviewer: \"How do you usually use AI?\" You: \"Just use ChatGPT to write stuff.\" — And then?\n> Most students have used AI, but **use it and forget, use it without retaining anything**. This lesson helps you gather scattered experiences into a demonstrable capability map.\n\n---\n\n## Core Concepts\n\n**1. AI literacy is not \"knowing how to use tools\" but \"knowing how to use AI to solve problems\"**\nFollowing microsoft/AI-For-Beginners' definition, AI capability includes at least: understanding what AI can do (cognitive layer), being able to use AI for specific tasks (application layer), and knowing AI's boundaries and risks (ethics layer). This camp focuses on the application and ethics layers, with only enough cognitive-layer groundwork.\n\n**2. Capability map = dimension × level × evidence**\n- Dimension: research, reading, analysis, writing, prototyping, job-seeking, collaboration…\n- Level: 0 never touched / 1 tried it / 2 can do independently / 3 can do for others to see / 4 can teach others\n- Evidence: each level must be backed by an artifact or experience, avoiding \"self-rated 4 but nothing to show\".\n\n**3. Career positioning = problems you want to solve × your professional background**\nAI is not a major, it is a \"magnifier\". Biochemistry + AI = literature-retrieval assistant; business + AI = industry-research assistant; design + AI = prototype generation. The key is to connect AI to your major, not to \"learn AI itself\" detached from your field.\n\n**4. Progression path reference (mlabonne/llm-course three-stage)**\n- LLM Fundamentals (math / Python / neural-network basics, optional)\n- LLM Scientist (push the model to its best: fine-tuning, quantization, evaluation)\n- LLM Engineer (turn the model into a deployed application)\nThis camp mainly lands on the Engineer application side; return to Scientist as needed for technical depth.\n\n---\n\n## Real-scenario Case\n> Xiaoyu, junior, Environmental Science. She used AI to write lab reports and look up literature, but her résumé could only say \"proficient in office software\".\n> After this lesson, she drew a capability map: research 3 (did 2 literature reviews), reading 2 (can read but slowly), prototyping 1 (never built one). She put the map in her résumé appendix and said in interviews: \"I used AI to do 2 industry literature reviews, cutting retrieval time from 3 days to 6 hours on average.\" — That sentence got her an internship.\n\n---\n\n## Hands-on Task\n\n**Tool list**: ChatGPT / Kimi / DeepSeek (any conversational model), Feishu Multi-dimensional Tables or Excel, Markdown editor (Typora / Obsidian).\n\n**Task description**:\n1. List 6–8 AI capability dimensions (suggested: material research, paper reading, data analysis, content writing, code/prototyping, job-seeking expression, project management, AI ethics & risk control).\n2. Score each dimension 0–4 and write one \"evidence\" sentence (e.g., \"Research 3: used AI to complete course-paper material collection\").\n3. Mark 2 \"most want to improve\" dimensions, mapping to Lessons 02–08 of this camp.\n4. Write a 200-character self-positioning: who am I, my major, what I want to solve with AI, what I want this map to become by camp end.\n\n**Sample Prompt (student version · generate capability map draft)**:\n```\nYou are my AI learning coach. I am a [major/year] student who has used AI to [give 2 real examples].\nPlease help me:\n1) List 8 AI capability dimensions suitable for student self-assessment;\n2) For each dimension give 0–4 self-rating anchors (what counts as 1 / 2 / 3 points);\n3) Based on my info, first give a preliminary scoring suggestion.\nRequirements: in Chinese, structured, no empty talk; each dimension tied to \"artifacts a student can produce\".\n```\n\n**Evaluation criteria**:\n- Dimension coverage ≥6, including ethics/risk control (30%)\n- Each dimension has level + evidence, no empty rating (30%)\n- Self-positioning within 200 chars, with professional anchor (20%)\n- Clear connection to subsequent camp lessons (20%)\n\n---\n\n## Prompt Template (student version · three-question structure)\n\n> 【Sources】This lesson is based on microsoft/AI-For-Beginners' three-layer AI-literacy model and mlabonne/llm-course's three-stage progression.\n> 【Analysis Process】First define \"capability dimensions\" rather than \"tool names\" to avoid turning the map into a software list; then use \"evidence\" to constrain self-rating inflation; finally use \"professional anchor\" to reconnect AI to personal background.\n> 【Reusable Structure】Dimension × Level (0–4) × Evidence three-column table, applicable to any skill self-assessment scenario (e.g., programming ability, English ability).\n\n---\n\n## Human Review Checklist\n- [ ] I did not treat \"know how to use ChatGPT\" as my only capability point\n- [ ] Every score has a concrete evidence sentence, not a feeling\n- [ ] I marked improvement items mapped to later camp lessons\n- [ ] My self-positioning mentions my major, not the vague \"I want to learn AI\"\n- [ ] I kept the Prompt and original conversation used to generate the map (as process traces)\n\n---\n\n## Common Mistakes\n1. **Writing the capability map as a tool list**: \"I know ChatGPT, Midjourney\" — that is not capability, it is software names.\n2. **Inflated self-rating**: rating everything 4 but showing no artifact. Exposed the moment you are asked.\n3. **Detached from major**: only talking about \"learning AI\", not \"using AI to solve problems in my field\".\n4. **One-shot, no iteration**: the map is alive; return to update it once at camp end.\n\n---\n\n## Homework (Demonstrable Artifact)\nSubmit **\"Personal AI Capability Map\"**, containing:\n- One capability-dimension table (dimension / level / evidence / improvement item)\n- A 200-character self-positioning paragraph\n- Suggested to save as Markdown or table screenshot, later placeable on portfolio homepage\n\n**Showcase requirement**: within one minute, use this diagram to clearly tell a classmate \"who you are, what you can do, where you are going\".\n\n---\n\n## Grading Rubric (100 points)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Dimension completeness | 25 | ≥6 dimensions, including ethics/risk control |\n| Evidence sufficiency | 30 | Each dimension has concrete examples |\n| Self-positioning quality | 20 | Within 200 chars, with professional anchor |\n| Link to curriculum | 15 | Clearly points to Lessons 02–08 |\n| Showcase readiness | 10 | Clear format, explainable in one diagram |\n\n> Next lesson, using the \"research\" dimension of this map, we complete the first real deliverable: an industry research report.\n", "02-AI资料调研-en.md": "# Lesson 02 · AI Information Research → An Industry Research Report\n\n## Learning Goals\nAfter this lesson, you will be able to:\n1. Use AI to push an unfamiliar industry/field from \"zero understanding\" to \"able to explain the whole picture\";\n2. Master the research workflow \"problem decomposition → multi-source retrieval → cross-validation → structured output\";\n3. Produce your second artifact: **an 8–12 page \"Industry/Field Research Report\"**, usable for internship applications, course assignments, startup research, or interview talking points.\n\n---\n\n## Warm-up Question\n> Your advisor drops one line: \"Figure out the 'AI + medical imaging' direction by next week.\" You open the browser, 20 tabs, getting more confused as you search.\n> The problem is not too little information, but **no research framework**. AI can turn you from \"finding a needle in a haystack\" to \"searching with a map\".\n\n---\n\n## Core Concepts\n\n**1. Research = answering a set of structured questions, not collecting a bunch of links**\nGood research first defines \"what to answer\": market size, player landscape, technical路线, pain points, trends, risks. Searching with questions in mind multiplies efficiency.\n\n**2. Three roles of AI in research**\n- **Decomposer**: breaks a big question into a sublist of sub-questions;\n- **Summarizer**: compresses long/multiple texts into key points;\n- **Comparator**: places multiple sources' claims side by side to help you spot disagreements.\n\n**3. Cross-validation and \"hallucination\" defense**\nFollowing dair-ai/Prompt-Engineering-Guide's Factuality section: LLMs fabricate plausible-looking data and sources. **Any number, company name, or paper title must be traced back to the original source for verification**. Method: ask AI for verifiable clues (keywords, institutions, years), and you search to confirm yourself, rather than directly trusting the links AI gives.\n\n**4. The prototype of RAG thinking (from llm-universe / llm-zoomcamp)**\nFeed the materials you collected to AI and let it \"answer based on the materials I give\", which is far more reliable than \"answer from memory\". This is the core intuition of Retrieval-Augmented Generation (RAG) — retrieve first, then generate. This lesson uses manual RAG (\"paste materials + let AI summarize based on materials\"); Lesson 07 will do the automated version.\n\n---\n\n## Real-scenario Case\n> Azhe, applying for an AI Product Manager role, needed to understand the \"AI speaking-practice / oral-practice track\" before interviews. He used AI to first generate 12 research sub-questions, then cross-validated each with MetaSo search + official sites + app-store reviews, producing a report with a 5-player comparison table in 2 days. In the interview he pulled up the report directly: \"I mapped the 5 players and 3 unmet needs in this track.\" The interviewer added points on the spot.\n\n---\n\n## Hands-on Task\n\n**Tool list**: conversational model (ChatGPT/Kimi/DeepSeek), AI search (MetaSo/Perplexity/Nanmi), industry data sources (iResearch, 36Kr, company sites, app stores, recruitment JD), Feishu Docs/Notion (organizing).\n\n**Task description**:\n1. Choose an industry/track you genuinely care about (tied to job direction).\n2. Use AI to generate 10–15 research sub-questions, then trim into your own outline.\n3. For each sub-question, check at least 2 independent sources, recording source links and verification results.\n4. Use AI to help organize materials into a report. Suggested structure: overview / market size / player landscape (comparison table) / technical route / core pain points / trend judgment / risks / references.\n5. The report must end with a 【References】 list and an 【AI Usage Statement】 (what you used AI for, what you manually verified).\n\n**Sample Prompt (student version · generate research outline)**:\n```\nI want to research [industry/track name], for use in [internship application / course / interview].\nPlease help me:\n1) List 12 research sub-questions covering the industry's full picture, grouped by \"market / players / technology / pain points / trends / risks\";\n2) For each sub-question, mark the suggested source type (e.g., industry report, official site, JD, user reviews);\n3) Remind me which questions are most prone to data fabrication or inconsistent caliber, needing cross-validation.\n【Sources】Please state which common-sense frameworks you relied on.\n【Analysis Process】Please state why you grouped them this way.\n【Reusable Structure】Please organize the outline into a template I can reuse next time.\n```\n\n**Evaluation criteria**:\n- Structured research outline covering 6 major sections (20%)\n- Key data/subjects cross-validated by ≥2 sources (30%)\n- Structured presentation such as player comparison table (20%)\n- References list + AI usage statement (15%)\n- Author's own trend judgment, not pure listing (15%)\n\n---\n\n## Prompt Template (student version · three-question structure)\n\n> 【Sources】Must require AI to label whether its claims come from common sense / speculation / or need external verification, and provide searchable keywords.\n> 【Analysis Process】Require AI to show how it derives conclusions from sub-questions, so you can judge whether the logic holds.\n> 【Reusable Structure】Solidify \"overview-market-players-technology-pain points-trends-risks-sources\" into a research-report template, reusable for any industry.\n\n---\n\n## Human Review Checklist\n- [ ] Every number in the report can be traced to its original source\n- [ ] Player names, product names, financing info verified via official sites / authoritative media\n- [ ] I deleted AI-fabricated \"facts\" with no findable origin\n- [ ] The report has my own judgment paragraphs, not pure AI recitation\n- [ ] References list is clickable and verifiable\n- [ ] I kept the research-outline Prompt and retrieval records\n\n---\n\n## Common Mistakes\n1. **Directly trusting AI-given links/numbers**: AI often fabricates URLs and statistics.\n2. **Using only one source**: a single source = no verification, easily misleading.\n3. **Report becomes a pile of materials**: no comparison, no judgment, reader sees no thinking.\n4. **Forgetting to label AI usage**: honest labeling is a plus; hiding it is an academic/career risk.\n\n---\n\n## Homework (Demonstrable Artifact)\nSubmit **\"XX Industry Research Report\"** (8–12 pages), must include:\n- Structured table of contents\n- At least one player/solution comparison table\n- Your own trend-judgment paragraph\n- References list + AI usage statement\n\n**Showcase requirement**: able to explain in 3 minutes \"what this industry looks like, who is playing, where the opportunities are\".\n\n---\n\n## Grading Rubric (100 points)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Outline structure | 20 | Covers 6 major sections |\n| Source cross-validation | 30 | Key info from ≥2 sources |\n| Structured presentation | 20 | Has comparison table/chart |\n| Sources & AI statement | 15 | Verifiable, transparent |\n| Independent judgment | 15 | Has author's viewpoint |\n\n> See `示例作品/行业调研报告-AI口语陪练赛道.md`, a sample you can directly rewrite. Next lesson, we focus this research capability on the hardest type of material: papers.\n", "03-AI论文和资料阅读-en.md": "# Lesson 03 · AI Paper & Material Reading → A Paper Reading Note\n\n## Learning Goals\nAfter this lesson, you will be able to:\n1. Use AI to turn an English/professional paper from \"can't get into it\" to \"understand it and can explain it\";\n2. Master the \"three-pass reading + AI assistance\" paper close-reading workflow;\n3. Produce your third artifact: **a structured \"Paper Reading Note\"**, usable as course assignment, lab-meeting report, or research-capability proof in grad-school/study-abroad materials.\n\n---\n\n## Warm-up Question\n> Your advisor throws an arXiv paper: \"Take a look this week.\" You open it; the abstract is full of transformer, token, benchmark — you close it after three lines.\n> A paper is not for \"finishing reading\" but for \"extracting value\". AI is your simultaneous translator + Socratic sparring partner.\n\n---\n\n## Core Concepts\n\n**1. Three-pass reading (AI-era enhanced version)**\n- First pass: look at title/abstract/figures/conclusion, judge whether worth reading (ask AI for one-sentence translation of core contribution).\n- Second pass: read the method body, ask AI to translate formulas and terms into analogies you understand.\n- Third pass: reproduce the thinking — ask AI to suggest \"if I were to use this idea in my field, what could I do\".\n\n**2. Let AI be the \"Feynman teacher\"**\nFollowing dair-ai's Chain-of-Thought and Few-Shot ideas: ask AI to explain in the tone of \"explaining clearly to a freshman\", which exposes what you don't understand better than directly asking for a summary. Don't just ask \"what does this paper say\" — ask \"using my known 【XX knowledge】 as analogy, what is this paper's innovation\".\n\n**3. Critical reading: identify limitations and questionable points**\nGood notes record not only \"what it did\" but also \"what it didn't do, whether the data is suspicious, whether it overclaims\". This is exactly the Responsible AI awareness emphasized by microsoft/AI-For-Beginners — maintaining scrutiny of model conclusions.\n\n**4. Connect the paper back to your scenario (localized restructuring)**\ndatawhalechina/llm-universe's core idea is \"start from practice\". The endpoint of reading a paper is not writing notes, but figuring out: can this method solve a specific problem in my field? This lesson's notes must include an \"inspiration for me\" section.\n\n---\n\n## Real-scenario Case\n> Xiaoman, first-year stats grad, advisor's direction is time-series forecasting. She used AI to break an LLM-for-forecasting paper into \"problem-method-experiment-limitation\" four blocks; AI analogized attention mechanism as \"giving different weights to different positions of historical data\". Based on this she reported in lab meeting and wrote the idea \"can this method improve our school's meteorological data missing-value imputation\", which the advisor adopted as a small project.\n\n---\n\n## Hands-on Task\n\n**Tool list**: arXiv / Google Scholar / Semantic Scholar, conversational model, note tool (Obsidian/Notion), translation aid (optional immersive-translation plugin).\n\n**Task description**:\n1. Pick a paper relevant to your direction, within 2 years, whose abstract you can barely understand (3–8 pages best; don't touch 50-page tomes yet).\n2. First pass: ask AI for one-sentence + three-keyword summary; judge relevance.\n3. Second pass: paste the method section to AI, require \"explain with analogy + mark the 3 prerequisite concepts I must understand\".\n4. Third pass: ask AI for 5 comprehension questions, answer yourself, re-read where wrong.\n5. Output notes, structure below.\n\n**Sample Prompt (student version · Feynman-style explanation)**:\n```\nI am reading the paper \"Title\", my background is [your major / known knowledge].\nPlease explain this paper in the tone of \"explaining clearly to a freshman\":\n1) What problem does it solve (with a life analogy);\n2) Core method in one sentence + one analogy;\n3) Which 3 concepts must I understand first to read it;\n4) What effect does it claim, and what experiment proves it.\n【Sources】Please base only on the paper body I paste, do not fabricate content outside the body.\n【Analysis Process】Please show how you derived the \"problem-method-evidence\" structure from the abstract.\n【Reusable Structure】Please organize your explanation into a four-piece template I can reuse for the next paper.\n```\n\n**Evaluation criteria**:\n- Records of three-pass reading traces (20%)\n- Notes contain \"problem-method-evidence-limitation\" four blocks (30%)\n- Author's own \"inspiration for me\" (25%)\n- AI explanation based on pasted original text, not fabricated (15%)\n- Readable, shareable format (10%)\n\n---\n\n## Prompt Template (student version · three-question structure)\n\n> 【Sources】Force AI to base only on the original text you paste, preventing it from \"improvising\" with training memory.\n> 【Analysis Process】Require AI to explicitly derive structure from the abstract, so you can check whether its understanding is accurate.\n> 【Reusable Structure】The \"problem-method-evidence-limitation-inspiration\" five-section form is the universal skeleton of all paper notes.\n\n---\n\n## Human Review Checklist\n- [ ] I pasted paper original-text snippets, AI did not fabricate content from nothing\n- [ ] Term explanations are truly understandable, not replaced by another unknown word\n- [ ] Notes have \"limitations / questionable points\", not one-sided praise\n- [ ] Has \"inspiration for me\", connected back to my major\n- [ ] I recorded what I didn't understand and marked it red, ready to ask\n- [ ] Kept the conversation with AI as evidence of reading process\n\n---\n\n## Common Mistakes\n1. **Asking AI to \"summarize this paper\" without giving the original text**: it will make things up from the title, producing seemingly professional but actually fake notes.\n2. **Only recording method, not limitations**: looks thoughtless, easily broken by follow-up questions in lab/interview.\n3. **No \"inspiration for me\"**: notes become an information island, unable to convert into capability or project.\n4. **Choosing too-hard papers**: tackling a 50-page SOTA paper at once causes frustration. Easy first, then hard.\n\n---\n\n## Homework (Demonstrable Artifact)\nSubmit **\"A Paper Reading Note\"**, structure:\n- Basic info (title/author/year/source/one-sentence contribution)\n- Problem / Method / Evidence / Limitation\n- My inspiration (≥200 chars, tied to major)\n- AI usage statement + where original-text snippets are archived\n\n**Showcase requirement**: able to give a 5-minute lab-meeting-style report on this paper and answer \"where might it be unreliable\".\n\n---\n\n## Grading Rubric (100 points)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Reading-trace | 20 | Process records of three-pass reading |\n| Four blocks complete | 30 | Problem/Method/Evidence/Limitation |\n| Inspiration quality | 25 | Tied to major, actionable |\n| Source authenticity | 15 | Based on original text, not fabricated |\n| Readability | 10 | Shareable, clean format |\n\n> See `示例作品/论文阅读笔记样例.md`. Next lesson, we extend \"understandable\" to \"see through data\": AI Data Analysis Primer.\n", "04-AI数据分析入门-en.md": "# Lesson 04 · AI Data Analysis Primer → A Data Insight Mini-Report\n\n## Learning Goals\nAfter this lesson, you will be able to:\n1. Drive a complete data analysis with natural language (no code needed, or only minimal);\n2. Distinguish \"describing data\" from \"insighting data\" — the latter is where the report's value lies;\n3. Produce your fourth artifact: **a \"Data Insight Mini-Report\"** (with problem, data, findings, recommendations), usable for course projects, internship output, business-analyst interviews.\n\n---\n\n## Warm-up Question\n> The club pulled a 2000-person event signup sheet, the president says \"analyze it\". You stare at Excel: headcount, averages, charts all done, then what? \"Then\" is the insight.\n> Data doesn't speak for itself; AI helps translate \"numbers\" into \"conclusions\" and \"actions\".\n\n---\n\n## Core Concepts\n\n**1. Description ≠ Insight**\n- Description: 2000 signed up last year, 60% female.\n- Insight: female share is high and concentrated in 3 departments, meaning the event theme attracts too few science/engineering males; next time adjust promotion channels.\nInsight = description + comparison/attribution + action recommendation.\n\n**2. Analysis workflow (no-code version)**\nFollowing openai/openai-cookbook's \"classification / summarization / extraction\" thinking, break analysis into: clarify question → clean data → descriptive stats → find anomalies/group differences → form hypothesis → give recommendations. AI can assist at each step, but \"hypothesis\" must come from you.\n\n**3. Data cleaning is 80% of the work**\nMissing values, duplicate rows, inconsistent formats — AI can help write formulas/scripts for these dirty tasks, but you must state the rules first. Following llm-zoomcamp's Data Ingestion module philosophy: clean the data first, then the model is useful.\n\n**4. Python/Notebook progression path (optional)**\nIf you have basics, use Python (pandas) + conversational model to write scripts; without basics, Feishu Multi-dimensional Tables / Excel + AI formula assistant can also complete it. Both paths provided.\n\n---\n\n## Real-scenario Case\n> Jiayi, senior marketing major, interning in e-commerce. She got a 30,000-row order table, used AI to write a Python script for RFM segmentation (Recency/Frequency/Monetary), found \"high-value low-activity\" customers were 18% but contributed 45% of revenue, and recommended a win-back campaign. This analysis was adopted by her supervisor, becoming hard proof on her résumé of \"data-driven decision making\".\n\n---\n\n## Hands-on Task\n\n**Tool list**: Excel / Feishu Multi-dimensional Tables, Python (optional, pandas), conversational model, public datasets (Kaggle / national data / school public data).\n\n**Task description**:\n1. Find a real tabular dataset (course grades, survey, sales, event signup all fine), ≥200 rows.\n2. Use AI to help list 3 analysis hypotheses (e.g., \"conversion differs significantly by channel\").\n3. Cleaning: let AI write formulas/scripts to handle missing and duplicates, you verify results.\n4. Description + insight: give data evidence for each hypothesis, and write \"what this means for decisions\".\n5. Output report: problem → data & method → 3 findings → action recommendations → limitations.\n\n**Sample Prompt (student version · no-code analysis)**:\n```\nI have [data description, e.g., 2000-row event signup sheet, fields: department/grade/channel/attended or not].\nPlease help me:\n1) Propose 3 valuable analysis hypotheses (guiding follow-up action, not pure description);\n2) List cleaning steps I need in the sheet (in natural language, I will use Excel/Multi-dimensional Tables);\n3) For each hypothesis, give the metrics and comparison dimensions I should look at;\n4) Remind me of possible biases in this data (e.g., uneven sample) that affect conclusions.\n【Sources】Please base only on the fields I described and common problem types, do not fabricate columns not in my data.\n【Analysis Process】Please state how you derived \"hypotheses\" from \"fields\".\n【Reusable Structure】Give me a \"hypothesis-metric-conclusion-recommendation\" four-section analysis template.\n```\n\n**Evaluation criteria**:\n- Data cleaned and rules stated (20%)\n- ≥3 analysis hypotheses not pure description (30%)\n- Each finding has data evidence + action recommendation (30%)\n- Data limitations/biases labeled (10%)\n- Report presentable (10%)\n\n---\n\n## Prompt Template (student version · three-question structure)\n\n> 【Sources】Require AI to base only on fields you actually have, preventing it from assuming non-existent columns.\n> 【Analysis Process】Require AI to explicitly derive hypotheses from fields, so you can judge whether hypotheses are reasonable.\n> 【Reusable Structure】The \"hypothesis-metric-conclusion-recommendation\" four-section form applies to all business analysis.\n\n---\n\n## Human Review Checklist\n- [ ] I verified the AI-generated formula/script actually ran correctly\n- [ ] Conclusions are all data-supported, no \"feels like it should be\"\n- [ ] I distinguished correlation from causation, no reckless conclusions\n- [ ] Report has \"what this means for decisions\"\n- [ ] I labeled the sample bias and limitations of the data\n- [ ] Kept original data and processing records\n\n---\n\n## Common Mistakes\n1. **Only descriptive stats**: pile up charts but no conclusion, reader doesn't know \"so what\".\n2. **AI fabricates fields**: it assumes a \"spending amount\" column that your data doesn't have.\n3. **Correlation as causation**: A and B co-occur so claimed causal, exposed when questioned.\n4. **Ignoring sample bias**: 2000 people all from one department, conclusions can't generalize.\n\n---\n\n## Homework (Demonstrable Artifact)\nSubmit **\"Data Insight Mini-Report\"**, containing:\n- Data source and field description\n- Cleaning rules\n- 3 findings (evidence + recommendation)\n- Limitation statement\n\n**Showcase requirement**: able to clearly state in the form \"We found X, recommend doing Y, because data shows Z\".\n\n---\n\n## Grading Rubric (100 points)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Cleaning standard | 20 | Clear rules, executed |\n| Hypothesis quality | 30 | ≥3, actionable |\n| Evidence + recommendation | 30 | Has data, has recommendation |\n| Limitation statement | 10 | Labeled bias |\n| Presentable | 10 | Clear, readable |\n\n> See `示例作品/数据洞察小报告样例.md`. Next lesson, we apply the capability directly to the biggest mid-term hurdle: résumé and interview.\n", "05-AI辅助简历和面试-en.md": "# Lesson 05 · AI-Assisted Résumé & Interview\n\n## 1. Learning Goals\n\n- **Knowledge**: Understand that AI in job-seeking is a \"polishing assistant\", not a \"ghostwriting gunman\"; master the methods of \"telling experience with STAR structure\" and \"reverse-deriving résumé focus from the job JD\"; know that AI-fabricated internships/projects must not be written into the résumé (integrity red line).\n- **Capability**: Rewrite a vague experience into a résumé entry with data and action; optimize résumé focus for a specific job JD; generate mock-interview Q&A and self-assess.\n- **Artifact**: An \"Optimized Résumé (key-points highlighted)\" + a \"Mock Interview Record (Q/A/improvement)\".\n\n> This lesson references Generative-AI-For-Beginners' \"using AI for text rewriting and structuring\", Prompt-Engineering-Guide's \"role-play + iterative optimization\" techniques, reconstructed with real job-seeking scenarios.\n\n## 2. Warm-up Question\n\n> Résumé says \"responsible for project management\", why isn't the interviewer interested?\n> The same you, but one résumé for every job?\n> Asked in interview \"tell me your most challenging thing\", freeze on the spot?\n\nRésumé and interview test not \"how impressive you are\" but \"whether you can explain your impressiveness clearly\". AI helps translate your experience into the language headhunters and interviewers love.\n\n## 3. Core Concepts\n\n### 1. STAR: give experience a skeleton\nSituation / Task / Action / Result. AI helps turn a running account into STAR, but **numbers in results must be real**.\n\n### 2. JD reverse-derivation: cater to preferences without faking\nGive the target job JD to AI, let it mark \"the 3 capabilities this job values most\", then you move the corresponding experience forward and write it thoroughly.\n\n### 3. Mock interview: use AI as the interviewer\nLet AI play a strict interviewer, probing based on your résumé. You practice expression, it gives feedback. This is the real usage of \"iterative optimization\".\n\n### 4. Red line: don't fabricate experience\nInternships you didn't do, projects you didn't join — AI can fabricate them but you cannot write them. Once integrity breaks, the cost far exceeds one Offer.\n\n## 4. Real-scenario Case Demonstration\n\n### Case 1: Experience rewriting\n**Original**: \"Participated in campus official-account operation.\"\n**AI rewrite**: \"Operated a university-level official account (8000+ followers), independently pitched 12 articles, single-article max reads 12k, brought 1500+ new-student follows.\"\n**Human check**: Do you really have those 8000/12k/1500 numbers? If not, don't write them.\n\n### Case 2: Mock interview\n**AI asks**: \"You just said responsible for data analysis, what method, what conclusion?\"\n**After you answer** AI comments: \"Conclusion clear but missing 'so what' — next time add one line of business impact.\"\n**Value**: exposes expression weaknesses in advance.\n\n## 5. Hands-on Task\n\n- **Background**: You have a résumé draft + a target job JD.\n- **Input**: current résumé text, target JD.\n- **Steps**:\n  1. Use the \"résumé optimization template\" to rewrite 3 experiences into STAR.\n  2. Use the \"JD reverse-derivation template\" to reorder résumé focus.\n  3. Use the \"mock interview template\" to run 5 rounds of Q&A and record improvements.\n- **Expected output**: \"Optimized Résumé\" + \"Mock Interview Record\".\n\n## 6. Prompt Template\n\n```\nYou are now playing: senior career coach\nMy background: [major/year/experience draft]\nTarget job JD: [paste]\nPlease:\n1. Rewrite my 3 experiences into STAR structure, use [real data] placeholders for result numbers for me to fill;\n2. Mark the 3 capabilities this JD values most, suggest which experiences I should move forward;\n3. Based on my résumé, simulate 5 questions the interviewer might probe, with scoring dimensions.\nConstraint: never fabricate experiences I haven't done.\n```\n\n## 7. Human Review Checklist\n\n- [ ] All résumé numbers are real and answerable\n- [ ] No fabricated internships/projects/skills\n- [ ] JD focus reflected and not faked\n- [ ] I have digested the mock interview improvement points\n\n## 8. Common Mistakes\n\n1. Letting AI fabricate \"impressive-looking\" fake experiences.\n2. One résumé for all jobs without adjustment.\n3. Only changing wording not structure, still like a running account.\n4. Practiced mock interview but didn't review.\n\n## 9. Homework\n\nSubmit \"Optimized Résumé (key-points highlighted)\" + \"Mock Interview Record\" (≥5 questions, with improvement points).\n\n## 10. Grading Rubric\n\n- Completion: both deliverables complete (40%)\n- Quality: clear STAR, JD match (35%)\n- Integrity: no fabrication, real numbers (25%)\n", "06-AI项目设计-en.md": "# Lesson 06 · AI Project Design → A Feasible Project Plan\n\n**Suitable for**: university students, graduate students, new graduates who want to build a demonstrable AI project\n**Suggested duration**: 120 minutes\n\n## 1. Course Goals\nAfter this lesson, you will be able to:\n1. **Knowledge**: Understand \"problem definition > technology selection\", master the standard decomposition framework for taking an AI project from requirement to execution;\n2. **Capability**: Converge a vague idea into a bounded, verifiable plan that produces a minimum version (MVP) in 2–4 weeks;\n3. **Artifact**: Produce **\"AI Project Plan\"**, containing problem definition, solution, milestones, risks and acceptance criteria, directly usable as the opening of a capstone or portfolio.\n\n---\n\n## 2. Warm-up Question\n> \"I want to build an AI assistant that helps everyone solve all problems.\" — what's wrong with this sentence?\n> It has no specific user, no specific scenario, no acceptance criteria, so it can never be finished or built. The first step of a good project is not writing code, but **cutting the scope small**: for **whom**, solving **which** specific pain point, to **what degree** counts as success.\n\n---\n\n## 3. Core Concepts\n\n**1. Problem definition precedes technology**\nFirst answer \"who, what pain point, how painful, how solved now, what's better about my solution\", then talk about which model or tool. 90% of student projects fail because the problem is too big or not even a real pain point.\n\n**2. Standard decomposition framework for AI projects (seven elements)**\n- User & scenario: who is the target user, in what scenario used.\n- Problem & value: what pain point solved, what measurable value brought.\n- Solution & technology: core flow + technology selection (does it need RAG, does it need fine-tuning, can no-code platform be used).\n- MVP scope: the minimal usable version does only one main flow, cut all \"nice-to-haves\".\n- Milestones & division: 2–4 weeks broken into weekly nodes.\n- Acceptance criteria: how to prove \"done\" (quantifiable metric + demonstrable Demo).\n- Risks & boundaries: where data comes from, how hallucination is controlled, how privacy is handled.\n\n**3. Does it need RAG / fine-tuning?**\n- Need \"answer based on specific materials, traceable\" → use RAG (Retrieval-Augmented Generation), low cost, fast effect, suitable for student projects (see llm-zoomcamp's RAG practice route).\n- Need \"model style/format stably changed\" → only then consider fine-tuning, generally unnecessary at student stage.\n- Most showcase projects: a good Prompt + RAG + no-code platform is enough.\n\n**4. MVP thinking**: first build a version \"that runs one main flow\" for people to see, then iterate, rather than holding back a big move.\n\n---\n\n## 4. Case Demonstration (real scenarios)\n\n**Scenario A: from \"too big\" to \"just right\"**\n- Initial idea: \"Build a learning AI for college students.\"\n- Converged: \"For **classmates reviewing for finals in my major**, build a tool that **turns course PPT + notes into 20 self-test questions**, with correct questions marked by source page number.\" Clear user, clear pain point, clear acceptance (can generate 20 questions, each traceable).\n\n**Scenario B: acceptance criteria saved the project**\n- A group built an \"AI industry-research assistant\", the first two weeks got more scattered — wanted charts, then real-time news. After adding acceptance criteria — \"input an industry name, produce a report with 5 companies, 3 trends, each conclusion with source link within 10 minutes\" — scope instantly clear, Demo ran in week 3, extra ideas moved to \"phase 2\", no longer dragging phase 1.\n\n**Scenario C: technology selection — first ask \"need RAG?\"**\n- Someone wanted to fine-tune a \"campus event-notice assistant\", blocked by review: it only needs to summarize notices in fixed format, a good Prompt + Feishu Multi-dimensional Tables automation is enough, fine-tuning only lengthens the cycle and may not be better. The two weeks saved were used to polish output format, actually more popular with classmates.\n\n---\n\n## 5. Hands-on Task\n\n**Tool list**: conversational model (ChatGPT/Kimi/DeepSeek), Feishu Docs/Notion/Markdown for the plan.\n\n1. Write your project in one sentence: \"For 【whom】 solve 【what pain point】, to 【what degree】 counts as success.\"\n2. Fill in the seven-element framework from Core Concepts, especially polish \"MVP scope\" and \"acceptance criteria\".\n3. Use the template below to let AI play \"project reviewer\", pointing out where your plan is \"too big / not verifiable / has ethical risk\", you converge accordingly.\n4. Draw a 2–4 week milestone Gantt rough table (week × task).\n\n---\n\n## 6. Prompt Template (project design version)\n\n```\nYou are a pragmatic AI product mentor, good at helping students cut projects to be executable.\nMy project idea is: [one-sentence description].\nPlease help me:\n1. Examine it with the seven elements \"user/scenario, problem/value, solution/technology, MVP scope, milestones, acceptance criteria, risks\";\n2. Clearly point out where scope is too big, where there is no verifiable success criterion, and give convergence suggestions;\n3. Judge whether this project needs RAG or fine-tuning, whether it can be implemented with no-code platform (Coze/Dify), with reasons;\n4. Help me break it into a 2-4 week plan with one deliverable node per week.\nRequirement: direct answers, specific; rather make the project smaller to ensure it gets finished and built.\n```\n\n---\n\n## 7. Human Review Checklist\n- [ ] I can state in one sentence \"for whom, what solved, what counts as success\"\n- [ ] MVP keeps only one main flow, cut all \"by the way also do\"\n- [ ] Accep
