tance criteria are quantifiable and demonstrable, not \"effect is good\"\n- [ ] Milestones land weekly, and week 1 has visible output\n- [ ] I assessed data source, hallucination and privacy risks, and wrote them into the plan\n\n---\n\n## 8. Common Mistakes\n1. **Scope too big**: want to build a \"universal assistant\", end up finishing nothing.\n2. **Choose technology before thinking about problem**:纠结 which model at the start, but can't state whose pain point it solves.\n3. **No acceptance criteria**: can't judge done or not, project drags infinitely.\n4. **Ignore data and ethics**: don't think through where data comes from, whether privacy is involved, rework later.\n5. **Plan locked after writing**: no iteration allowed, can't adjust when reality bites.\n\n---\n\n## 9. Homework (Explicit Deliverable)\nSubmit **\"AI Project Plan\"** (1–2 pages), must contain:\n- One-sentence project definition\n- Seven elements fully filled (user/scenario, problem/value, solution/technology, MVP scope, milestones, acceptance criteria, risks)\n- A 2–4 week milestone table\n- A paragraph of self-argument \"why I can finish this scope\"\n> Suggest directly picking one from Lesson 09's \"three capstone projects\" to write; this lesson's plan is the capstone's opening proposal.\n\n---\n\n## 10. Grading Rubric (100 points)\n\n| Item | Points | Description |\n| --- | --- | --- |\n| Problem-definition clarity | 25 | User, pain point, success criterion clear |\n| MVP convergence reasonable | 20 | Small scope, completable |\n| Acceptance criteria quantifiable | 20 | Demonstrable, measurable |\n| Milestones executable | 15 | Weekly nodes clear, week 1 has output |\n| Risk & ethics | 10 | Covers data/hallucination/privacy |\n| Presentable | 10 | Standard structure, logical flow |\n\n> 【Sources】RAG/fine-tuning selection references llm-zoomcamp's RAG practice and mlabonne/llm-course's engineering route; MVP and problem definition are general product methodology.\n> Next lesson, we turn the core flow of this plan into a clickable Demo using a no-code platform.\n", "07-AI应用原型-en.md": "# Lesson 07 · AI Application Prototype\n\n## 1. Learning Goals\n\n- **Knowledge**: Understand that \"prototype\" turns a plan into something demonstrable, not necessarily requiring code; master no-code/low-code paths (Coze / Dify / Feishu Multi-dimensional Tables / Streamlit templates); know the prototype's purpose is \"validate the idea\" not \"build the product\".\n- **Capability**: Build a simple AI-assistant idea into a runnable demo (chatbot or automated table); clearly state \"what I used, how I used it\".\n- **Artifact**: A demonstrable \"No-code/Low-code AI Demo\" + a usage note.\n\n> This lesson references LLM Universe's \"Hands-on LLM Application Development (no-code thinking)\", DataTalksClub/llm-zoomcamp's \"from prototype to usable\", Generative-AI-For-Beginners' \"low-code AI applications\" section.\n\n## 2. Warm-up Question\n\n> You have the plan, but others say \"show me a demo\", you can only pull out PPT?\n> No Python, so barred from \"doing AI projects\"?\n> Want to validate if an idea is worth building, but stuck at \"how to get it out\"?\n\nA prototype doesn't necessarily need code. Today you can use drag-and-drop tools to build a conversational AI assistant in half an hour.\n\n## 3. Core Concepts\n\n### 1. Prototype = minimal demonstrable\nThe goal is not perfection, but \"let people instantly get what you're solving\". A conversational bot beats ten pages of architecture diagrams.\n\n### 2. No-code paths\n- **Coze / Dify**: drag to build a chatbot with knowledge base and plugins, zero code.\n- **Feishu Multi-dimensional Tables + AI fields**: turn a table into a \"smart assistant\", good for material organization.\n- **Streamlit templates**: a bit of Python lets you modify ready templates, fast deployment.\n\n### 3. Which to choose\nQ&A over materials → Coze/Dify knowledge base; table-intelligence → Feishu Multi-dimensional Tables; embed in webpage → Streamlit.\n\n### 4. Red line: don't train/upload real private data\nUse desensitized samples at prototype stage; for school/company real data, get authorization first.\n\n## 4. Real-scenario Case Demonstration\n\n### Case: course-material Q&A bot (Coze)\n- Steps: create bot → upload course notes as knowledge base → set \"answer only from knowledge base\" → publish and test chat.\n- Demo: ask \"chapter 3 key points\", bot answers based on notes.\n- Value: built in half an hour, validates whether the \"material organization\" need holds.\n\n## 5. Hands-on Task\n\n- **Background**: Based on Lesson 06's project plan.\n- **Input**: plan's MVP scope.\n- **Steps**:\n  1. Choose a no-code path.\n  2. Build the minimal demonstrable version (with knowledge base or automation).\n  3. Record screen/screenshot + write usage note.\n- **Expected output**: \"AI Demo\" + usage note.\n\n## 6. Prompt / Build Template\n\n```\nMy MVP is: [one sentence]\nTarget user trial scenario: [ ]\nTool I choose: [Coze/Dify/Feishu Multi-dimensional Tables/Streamlit]\nPlease give me: ① this tool's build step list ② how to prepare knowledge base/data ③ the 3 key actions to show in demo\nConstraint: use desensitized samples, no real private data.\n```\n\n## 7. Human Review Checklist\n\n- [ ] Demo truly runs the core path\n- [ ] No unauthorized/private data uploaded\n- [ ] Usage note reproducible by others\n- [ ] Scope matches MVP, no over-inflated\n\n## 8. Common Mistakes\n\n1. Want to build a \"complete product\" at the start, never gets built.\n2. Train prototype with real private data.\n3. Chose a tool mismatched to needs.\n4. Only screenshots no explanation, others can't understand.\n\n## 9. Homework\n\nSubmit a runnable Demo (link/screen recording) + a usage note (≥200 chars).\n\n## 10. Grading Rubric\n\n- Completion: Demo runnable + note complete (40%)\n- Quality: right path chosen, core path runs (35%)\n- Safety: data desensitized and compliant (25%)\n", "08-作品集包装-en.md": "# Lesson 08 · Portfolio Packaging\n\n## 1. Learning Goals\n\n- **Knowledge**: Understand that a \"portfolio\" is stronger evidence than a résumé — it lets people see \"how you did it, what you made\"; master the showcase structure \"project background—problem—solution—process—result—reflection\"; know the value of a personal homepage/showcase page.\n- **Capability**: Package the outputs of the previous 7 lessons (research report / paper notes / data report / résumé / plan / Demo) into a unified-style portfolio; write a project showcase page.\n- **Artifact**: An \"AI Project Portfolio\" (with ≥2 complete project showcases + personal intro).\n\n> This lesson integrates the previous 7 lessons' outputs, referencing LLM Universe's \"turn learning outcomes into projects\" and product-on-purpose/pm-skills' \"artifact as evidence\" philosophy.\n\n## 2. Warm-up Question\n\n> Interviewer asks \"what projects have you done\", you flip through chat history to find now?\n> A pile of scattered documents, nobody knows what you can actually do?\n> Want to host a personal homepage, but don't know what to put, how to write?\n\nA portfolio is displaying your capability. It turns \"I know how to use AI\" into \"look, this is what I built\".\n\n## 3. Core Concepts\n\n### 1. Six-section showcase structure\nBackground (why built) → Problem (what solved) → Solution (how built) → Process (key steps/screenshots) → Result (data/feedback) → Reflection (pitfalls & improvement).\n\n### 2. Quality > Quantity\n2 thoroughly-written projects beat 10 half-done ones. Each must have \"result\" and \"reflection\".\n\n### 3. Personal homepage\nUse Feishu/Notion/GitHub Pages to build a page with intro + project links, send the link directly in interviews.\n\n### 4. Red line: present truthfully\nDemo screenshots and data must be real; write \"led\" vs \"participated\" honestly.\n\n## 4. Real-scenario Case Demonstration\n\n### Case: portfolio project card\n- Title: AI study-material organizer\n- Background: scattered final-exam materials\n- Solution: Coze knowledge-base bot (see Lesson 07)\n- Process: 3 screenshots (build / knowledge base / test chat)\n- Result: classmates tried \"find materials twice as fast\"\n- Reflection: knowledge base needs more structure, else answers drift\n\n## 5. Hands-on Task\n\n- **Background**: Aggregate all outputs of the previous 7 lessons.\n- **Input**: your reports / notes / Demo / plan.\n- **Steps**:\n  1. Pick ≥2 projects, write as showcase pages in the six-section structure.\n  2. Write a personal intro paragraph (capability map).\n  3. Assemble into a portfolio document or homepage.\n- **Expected output**: \"AI Project Portfolio\".\n\n## 6. Prompt Template\n\n```\nYou are now playing: portfolio mentor\nI have the following project outputs: [list]\nPlease help me:\n1. In the six sections [background/problem/solution/process/result/reflection], write showcase copy for 2 of them;\n2. Write a 100-char personal intro highlighting my AI capability map;\n3. Give portfolio layout suggestions (Notion/Feishu both fine).\nConstraint: all data/screenshots must be real, don't exaggerate my role.\n```\n\n## 7. Human Review Checklist\n\n- [ ] Each project has result and reflection\n- [ ] Data/screenshots real\n- [ ] Role description honest (led/participated)\n- [ ] Homepage/document accessible to others\n\n## 8. Common Mistakes\n\n1. Only screenshots no explanation.\n2. Project has no \"result\", looks unfinished.\n3. Exaggerate personal contribution.\n4. Portfolio has no unified style, looks patched together.\n\n## 9. Homework\n\nSubmit an \"AI Project Portfolio\" (≥2 projects in six-section showcase + personal intro).\n\n## 10. Grading Rubric\n\n- Completion: portfolio complete (40%)\n- Quality: complete structure, has result & reflection (35%)\n- Integrity: real, not exaggerated (25%)\n", "09-三个毕业项目-en.md": "# Lesson 09 · Three Capstone Projects → Detailed Designs You Can Start Directly\n\n**Suitable for**: university students, graduate students, new graduates who want to graduate with one complete project and put it in their portfolio\n**Suggested duration**: 120 minutes (choose one project to deepen, or read all three to choose one)\n\n## 1. Course Goals\nAfter this lesson, you will be able to:\n1. **Knowledge**: Master three instances of the complete project-design paradigm \"start from pain point, end with verifiable Demo\";\n2. **Capability**: Select one of three candidate capstones, apply Lesson 06's plan framework to complete your own proposal;\n3. **Artifact**: The **detailed design** of the selected project (background, problem definition, solution, process steps, expected outcomes), ready to enter Lesson 07 for prototyping.\n\n---\n\n## 2. Warm-up Question\n> You must submit a project at camp end but don't know what to do. This lesson gives you three directions \"already validated for value and completable by students\": résumé-interview assistant, study-material organizer, industry-research assistant. Pick the one closest to you, start today.\n\n---\n\n## 3. Core Concepts\nAll three projects follow the same paradigm (see Lessons 06/10): **real pain point → quantifiable value → no-code executable → demonstrable acceptance**. They cover three high-frequency scenarios \"job-seeking\" / \"learning\" / \"research\", with increasing difficulty, but all completable in 2–4 weeks with no-code/low-code. On technology selection, all three suit RAG (Q&A based on exclusive materials) or rule + Prompt combinations, prioritizing Coze/Dify/Feishu Multi-dimensional Tables, and Streamlit when file-upload analysis is needed.\n\n---\n\n## 4. Case Demonstration (real scenarios)\n- **Direction 1 validated**: a student built a \"résumé checkup + mock interview\" agent with Coze, showed it as a portfolio piece when applying for internships; the interviewer experienced it on the spot, direct plus.\n- **Direction 2 validated**: a grad student used Feishu Multi-dimensional Tables to break 200 pages of course PDF into \"knowledge points + self-test questions\", doubling final-review efficiency.\n- **Direction 3 validated**: a business-major student used AI to compress a week of industry research into one day, producing a report with source links, adopted by the internship mentor.\n\n---\n\n## 5. Hands-on Task\n1. Read the three designs below, choose one by \"which pain point is closest to me, which has the most complete materials\".\n2. Apply Lesson 06's seven-element framework to write the selected project as your own plan (user/scenario, problem/value, solution/technology, MVP, milestones, acceptance, risks).\n3. Mark: will this project use Coze/Dify, Feishu Multi-dimensional Tables, or Streamlit? Why?\n4. Enter Lesson 07, run the MVP into a Demo.\n\n---\n\n## 6. Prompt Template (project selection version)\n```\nMy situation: [major/year/materials at hand], time about [X weeks].\nBased on the three directions \"AI résumé-interview assistant / AI study-material organizer / AI industry-research assistant\",\nhelp me judge which suits me best, with reasons, and list 3 materials I need to prepare in advance for each option.\nRequirement: combine my major and existing materials, don't recommend directions needing me to collect lots of data now.\n```\n\n---\n\n## 7. Human Review Checklist\n- [ ] The project I chose has a real pain point, not \"I think there should be one\"\n- [ ] I have listed the real materials needed (résumé/JD, courseware, industry data)\n- [ ] I marked the technical path and reasons\n- [ ] I can write 1 acceptance criterion\n- [ ] Scope completable in 2–4 weeks\n\n---\n\n## 8. Common Mistakes\n1. **Want all three**: greed leads to all half-done, better do one thoroughly.\n2. **Choose flashiest not closest**: chose the direction with the least materials, stuck finding data later.\n3. **Ignore acceptance**: no standard for \"what counts as success\".\n4. **Underestimate privacy**: upload résumés with personal info / unpublished materials directly to third-party platforms without handling.\n\n---\n\n## 9. Homework (Explicit Deliverable)\nSubmit the **detailed design of the selected project** (1–2 pages): background, problem definition, solution, process steps (weekly milestones), expected outcomes (quantifiable). Next lesson can generate portfolio cards from the template.\n\n---\n\n## 10. Grading Rubric (100 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Selection rationality | 25 | Real pain point, complete materials |\n| Design completeness | 30 | Contains five elements, quantifiable acceptance |\n| Technical path clarity | 25 | Tool selection argued |\n| Executability | 20 | Completable in 2–4 weeks |\n\n---\n\n## Appendix: Detailed Designs of the Three Capstone Projects\n\n### Project 1 · AI Résumé-Interview Assistant\n- **Background**: When job-seeking, students have weak résumé expression, don't understand job matching, panic in live interviews. General tools don't fit personal real experience.\n- **Problem definition**: Help users rewrite a real experience into a STAR résumé entry within 30 minutes, and complete one structured mock interview for the target JD.\n- **Solution**: Knowledge base = user's real experience + target job JD; build agent with Coze/Dify, with three skills \"résumé optimization\" / \"mock interview\" / \"gap analysis\"; AI can only optimize expression, must not fabricate experience (set red-line validation).\n- **Process steps**: ① collect own experience and JD; ② build knowledge base and Prompt; ③ test per skill; ④ record 8–10 interview rounds; ⑤ output before/after comparison + interview record.\n- **Expected outcome**: \"Résumé Optimization Comparison Table\" + \"Mock Interview Record\", shareable Demo link, as the portfolio's core card.\n\n### Project 2 · AI Study-Material Organizer\n- **Background**: Course/paper materials are many and scattered, slow reading, unfocused review.\n- **Problem definition**: Automatically organize PPT/PDF/notes into a structured review pack of \"knowledge points + self-test questions + source page numbers\".\n- **Solution**: Use Feishu Multi-dimensional Tables' \"AI fields\" to generate summaries and questions per material segment; or use Dify to upload materials for RAG Q&A; keep source annotations to control hallucination.\n- **Process steps**: ① organize materials into base; ② configure extraction/question-generation Prompt; ③ batch-produce and manually spot-check accuracy; ④ make a shareable review table / Q&A assistant.\n- **Expected outcome**: a structured review pack + Demo, reflecting \"connect AI back to professional learning\".\n\n### Project 3 · AI Industry-Research Assistant\n- **Background**: Internships/coursework often need to quickly understand an industry; manual retrieval is time-consuming and easily misses sources.\n- **Problem definition**: Input an industry name, produce a structured report within 10 minutes containing \"top companies, key trends, risks, each conclusion with source link\".\n- **Solution**: RAG + rule workflow (Coze/Dify or Streamlit), first do retrieval aggregation then let the model produce by template, forcing each conclusion to carry a citation.\n- **Process steps**: ① define report template and source whitelist; ② build retrieval+generation flow; ③ test 3 industries, verify source authenticity; ④ export report templated.\n- **Expected outcome**: a reusable industry-research workflow + 3 sample reports, strongly proving \"research ability + AI execution ability\".\n\n> 【Sources】RAG and workflow paradigm reference llm-zoomcamp; no-code platform capabilities see Microsoft generative-ai-for-beginners' deployment section and Coze/Dify official docs (subject to current version).\n", "10-作品集模板-en.md": "# Lesson 10 · Portfolio Template → A Reusable Standard Showcase Framework\n\n**Suitable for**: university students, graduate students, new graduates who need to standardize any project's showcase\n**Suggested duration**: 90 minutes\n\n## 1. Course Goals\nAfter this lesson, you will be able to:\n1. **Knowledge**: Master the five-section portfolio-card structure \"background / problem definition / solution / process screenshots / results & reflection\" and its filling logic;\n2. **Capability**: Use a unified template to quickly package any output from Lessons 05–09 into professional, credible, horizontally-comparable project cards;\n3. **Artifact**: Produce **a filled standard portfolio template** (using your real project as example), as the unified base of the portfolio (Lesson 08).\n\n---\n\n## 2. Warm-up Question\n> Two students both built AI projects: one writes \"I built a very impressive assistant\", the other writes \"background… problem… solution… screenshots… result up 40%\". Who does the recruiter trust? Obviously the second.\n> This lesson gives you a \"fill-in-the-blank\" template — just fill the boxes and your project is naturally professional.\n\n---\n\n## 3. Core Concepts\n\n**1. Five sections are the minimal loop of persuasiveness**\n- **Project background**: who, in what situation, why needed it (build resonance).\n- **Problem definition**: specific pain point + one acceptable success criterion (without this step, the project scatters).\n- **Solution**: core flow (input→process→output) + key selection reason (why this tool).\n- **Process screenshots**: 2–3 real interface/output shots, proving \"really built it\" (no screenshot = looks unfinished).\n- **Results & reflection**: quantified outcome + 1 pitfall + 1 improvement (daring to write pitfalls makes it more credible).\n\n**2. Each box has an \"anti-example red line\"**\n- Background not \"AI is hot\", but \"the specific trouble I/user encountered\".\n- Problem definition not \"a helper\", but \"success = achieving X\".\n- Screenshots not web images, must be your own real interface.\n\n**3. Template = reusable asset**\nThe same five-section form fits résumé assistant, study assistant, research assistant any of them; recruiters can horizontally compare your multiple projects at a glance.\n\n---\n\n## 4. Case Demonstration (real scenarios)\n\n**Scenario A: same template for different projects**\n- Xiaolin wrote two cards \"résumé assistant\" and \"industry-research assistant\" with the five sections, consistent structure, high information density; the interviewer said \"finally someone who explains projects clearly\".\n\n**Scenario B: reflection column saves the day**\n- In \"results & reflection\" wrote: \"RAG v1 had poor recall; after adding keyword filtering accuracy went from 60% to 90%\". This pitfall makes the project look real, with engineering thinking, scoring more than just \"90% accuracy\".\n\n---\n\n## 5. Hands-on Task\n1. Copy the template below into Feishu Docs/Markdown.\n2. Pick your **most complete** project from Lessons 05–09, fill box by box.\n3. Focus on补充 \"process screenshots\" (run a Demo and screenshot) and quantified numbers in \"results & reflection\".\n4. Read through once, self-check with \"can a stranger understand in 30 seconds\".\n\n---\n\n## 6. Prompt Template (template-filling assistant)\n```\nYou are a portfolio editor. I built an AI project, real info as follows: [background/what I did/what tools used/real result data/pitfalls hit].\nPlease generate a portfolio-card draft in the five sections \"project background / problem definition / solution / process screenshots (describe what to screenshot) / results & reflection\".\nRequirement: every number must come from facts I provide; what I don't have mark with 【to be filled by me: ___】, never fabricate.\n```\n\n---\n\n## 7. Human Review Checklist\n- [ ] Background writes a specific trouble, not \"AI is hot\"\n- [ ] Problem definition has an acceptable success criterion\n- [ ] Solution clearly states flow and selection reason\n- [ ] Process screenshots are your own real interface (≥2)\n- [ ] Results & reflection have quantification + real pitfall + improvement\n\n---\n\n## 8. Common Mistakes\n1. **Vague background**: writing \"AI is a trend\" instead of real scenario, no resonance.\n2. **Unacceptable problem**: only says \"build a helper\", not what done looks like.\n3. **Fabricated/missing screenshots**: using schematic instead of real interface, credibility to zero.\n4. **Only success no pitfalls**: looks unreal, no reflection.\n5. **Numbers without source**: write \"up 90%\" but can't say how calculated.\n\n---\n\n## 9. Homework (Explicit Deliverable)\nSubmit **a filled standard portfolio template**: five sections complete, with ≥2 real screenshots, quantifiable results, real reflection. It should directly serve as one project card in the Lesson 08 portfolio.\n\n---\n\n## 10. Grading Rubric (100 points)\n| Item | Points | Description |\n| --- | --- | --- |\n| Background & problem | 20 | Specific, acceptable |\n| Solution | 25 | Flow + selection clear |\n| Process screenshots | 25 | Real, ≥2 |\n| Result quantification | 20 | Numbers traceable |\n| Real reflection | 10 | Has pitfall & improvement |\n\n---\n\n## Appendix: Standard Portfolio Template (with filling notes and examples)\n\n### 【Template Structure】\n```\n# Project name: ________\n## 1. Project Background\n[Filling note] Write for \"someone who doesn't know you at all\". State: who, in what situation, what specific trouble encountered.\n[Example] Me reviewing for finals, facing 200 pages of course PPT, don't know the key points, no direction for review.\n\n## 2. Problem Definition\n[Filling note] One-sentence pain point + one-sentence success criterion (what counts as done).\n[Example] Pain point: many materials, can't grasp key points. Success criterion: input materials, produce 20 self-test questions with source page numbers within 10 minutes.\n\n## 3. Solution\n[Filling note] Core flow (input→process→output) + why this tool.\n[Example] Import PDF into Feishu Multi-dimensional Tables, AI fields extract knowledge points and generate questions per paragraph, mark source page numbers. Chose it because zero-code, shareable.\n\n## 4. Process Screenshots\n[Filling note] 2~3 shots: material import interface, AI generation result, one complete output. Must be your own real interface.\n[Example] (Fig1: table after PDF import; Fig2: AI fields generate questions; Fig3: one self-test question card)\n\n## 5. Results & Reflection\n[Filling note] Quantified outcome + 1 pitfall + 1 improvement.\n[Example] Outcome: review time from 6 hours to 2 hours, questions cover 85% of exam points. Pitfall: v1 questions too easy, later added \"grade by difficulty\" Prompt. Improvement: if redo would add wrong-question review.\n```\n\n### 【Filling Red Lines】\n- All numbers must be traceable; AI should not fabricate any fact for you.\n- Screenshots must be real, no web schematics.\n- \"Success criterion\" must be acceptable, else project deemed unfinished.\n\n> 【Sources】The five-section form inherits this camp's Lesson 06 \"problem definition precedes technology\" and Lesson 08 portfolio-packaging paradigm.\n"};
const toc=document.getElementById('toc'), content=document.getElementById('content');
let cur=null;
function load(name){
  if(cur) cur.classList.remove('active');
  cur=[...toc.children].find(a=>a.dataset.f===name); if(cur)cur.classList.add('active');
  content.scrollTop=0; window.scrollTo(0,0);
  const md = DATA[name] || '';
  content.innerHTML='<h1>'+name.replace(/\.md$/,'')+'</h1>'+MD.render(md);
  location.hash=encodeURIComponent(name);
}
const names = Object.keys(DATA);
names.forEach(f=>{
  const a=document.createElement('a'); a.textContent=f.replace(/\.md$/,''); a.dataset.f=f;
  a.onclick=e=>{e.preventDefault();load(f)}; toc.appendChild(a);
});
const h=decodeURIComponent(location.hash.slice(1));
load(names.includes(h)?h:names[0]);
</script>
