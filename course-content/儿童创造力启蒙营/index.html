const MD = (function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(md){
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    let h='', i=0, inCode=false, code='';
    const flushCode=()=>{ if(inCode){ h+='<pre><code>'+esc(code)+'</code></pre>'; code=''; inCode=false; } };
    while(i<lines.length){
      let l=lines[i];
      if(l.trim().startsWith('```')){ if(inCode){flushCode();} else {flushCode(); inCode=true;} i++; continue; }
      if(inCode){ code+=l+'\n'; i++; continue; }
      let m;
      if(m=l.match(/^(#{1,6})\s+(.*)$/)){ const n=m[1].length; h+='<h'+n+'>'+inline(m[2])+'</h'+n+'>'; i++; continue; }
      if(l.match(/^(-{3,}|\*{3,})$/)){ h+='<hr>'; i++; continue; }
      if(l.match(/^>\s?/)){ let q=''; while(i<lines.length && lines[i].match(/^>\s?/)){ q+=lines[i].replace(/^>\s?/,'')+'<br>'; i++; } h+='<blockquote>'+inline(q)+'</blockquote>'; continue; }
      if(m=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/)){
        const ord = /\d+\./.test(m[2]); let items='';
        while(i<lines.length && lines[i].match(/^(\s*)([-*+]|\d+\.)\s+/)){
          const mm=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          items+='<li>'+inline(mm[3])+'</li>'; i++;
        }
        h+= (ord?'<ol>':'<ul>')+items+(ord?'</ol>':'</ul>'); continue;
      }
      if(l.trim()===''){ i++; continue; }
      h+='<p>'+inline(l)+'</p>'; i++;
    }
    flushCode();
    return h;
  }
  return {render:render};
})();

const DATA = {"00-课程总览.md": "# 儿童《AI 创造力启蒙营》· 课程总览\n\n> 这是一门给 6–12 岁小朋友和爸爸妈妈一起上的「AI 创造力」课。\n> 我们不讲高深技术，只做三件事：**认识 AI、学会提问、用 AI 把心里的想法变成故事和图画**。\n> 记住一句话：AI 是帮我们动脑筋的好帮手，不是什么都知道的老师。\n\n---\n\n## 一、课程定位\n\n这是一门「AI 素养 + 创造力」启蒙课。我们把 AI 当成一支彩笔、一本故事书、一个爱聊天的小伙伴——它帮我们画得更快、想得更远，但**真正的想象力和决定权，永远在孩子自己手里**。\n\n本课程参考了三份权威资料里的好方法，再改成小朋友能听懂、能动手的样子：\n\n- **中学 AI 素养工作坊（Beyond AI Hype, Chinasa T. Okolo, RESPECT'24）**：教孩子批判性使用 AI、识别 AI 生成内容、理解 AI 也会出错。\n- **Prompt 工程指南（dair-ai / Prompt Engineering Guide）**：教孩子「怎么把话说清楚，AI 才听得懂」。\n- **AI 入门课程（Microsoft AI-For-Beginners）**：用最生活化的方式解释「AI 到底是什么」。\n\n我们做的，是把这些大孩子的办法，变成 6–12 岁能玩、能做的游戏。\n\n---\n\n## 二、目标用户\n\n- **6–8 岁（小宝贝组）**：需要爸爸妈妈多陪伴，重在「玩」和「感受」，画画、编一句故事就好。\n- **9–12 岁（小能手组）**：可以自己操作，重在「想」和「做」，完成一篇童话、一张角色卡、一本小绘本。\n- **家长**：你是孩子最重要的「安全守门员」和「啦啦队长」，陪着、问着、夸着就好。\n\n---\n\n## 三、四个核心目标\n\n1. **AI 是工具，不是权威**：AI 会帮忙，也会犯错，答案要自己判断，不能盲信。\n2. **把问题说清楚**：学会「我想让 AI 帮我……」这样清楚地表达，AI 才帮得上忙。\n3. **把想法变成作品**：用 AI 一起写故事、画角色、设计发明，产出属于孩子自己的创作。\n4. **建立安全三意识**：保护隐私、分辨真假、不依赖 AI 替自己思考。\n\n---\n\n## 四、学习路径（00 → 11）\n\n| 编号 | 主题 | 核心产出 |\n| --- | --- | --- |\n| 00 | 课程总览 | 你正在读的这一页 |\n| 01 | AI 是什么 → 画我心中的 AI 助手 | 一幅 AI 助手画像 + 名字 |\n| 02 | 如何提问 → 三种提问对比卡 | 一张「好问题 / 坏问题」对比卡 |\n| 03 | 一起讲故事 → 原创童话 | 一篇自己和 AI 合写的小童话 |\n| 04 | 一起画角色 → 角色设定 + 提示词 | 一张角色卡 + 一段「给 AI 的话」 |\n| 05 | 认识世界 → 科学小问题卡 | 一叠「为什么」科学问题卡 |\n| 06 | AI 也会错 → 真假判断小游戏 | 一张「找一找 AI 说错哪」游戏卡 |\n| 07 | 我的未来发明 → 未来物品设计稿 | 一张未来发明设计稿 |\n| 08 | 创作展示 → AI 绘本 / 作品集 | 一本属于孩子的作品集 |\n| 09 | 家长指南 | 家长怎么陪、怎么问、怎么管屏幕 |\n| 10 | 安全手册 | 孩子能懂的隐私 / 真假 / 依赖规则 |\n| 11 | Prompt 模板库（儿童版） | 随时能用的「我想让 AI 帮我……」模板 |\n\n---\n\n## 五、结营时孩子应拥有\n\n- 一幅「我心中的 AI 助手」画像（01）\n- 一张提问对比卡（02）\n- 一篇原创童话（03）\n- 一张角色设定卡 + 一段提示词（04）\n- 一叠科学问题卡（05）\n- 一张真假判断游戏卡（06）\n- 一张未来发明设计稿（07）\n- 一本 AI 作品集 / 小绘本（08）\n- 一份家长陪伴笔记（09）\n- 一份安全小约定（10）\n- 一个随时翻的提问模板本（11）\n\n---\n\n## 六、家长陪伴三句话\n\n1. **多问少代做**：孩子卡住时，先问「你希望它变成什么样？」而不是替他打字。\n2. **多夸过程**：夸「你想的点子真棒」「你问得真清楚」，而不是只夸「画得真像」。\n3. **守住安全**：隐私信息不输入、AI 说的不全信、屏幕时间你说了算。\n\n---\n\n## 七、贯穿全课程的红线\n\n1. **AI 不是标准答案**：任何 AI 给的内容，都要让孩子想一想「这对吗？和我知道的一样吗？」\n2. **创作优先，考试靠后**：我们做故事、做画、做发明，不做卷子、不排名次。\n3. **隐私不泄露**：名字、学校、住址、电话、照片，不 input 给 AI。\n4. **自己动脑不能少**：AI 是「一起想」的伙伴，不是「替我想」的机器。\n\n---\n\n## 八、安全总则（小朋友版）\n\n- 🔒 **不告诉 AI 秘密**：你的真实姓名、学校、家庭住址、电话号码，都不要打字告诉它。\n- 🤔 **AI 可能说错**：如果 AI 说的和你书里、老师讲的不一样，先问爸爸妈妈。\n- 🎨 **主意要自己出**：让 AI 帮你画、帮你写，但故事和发明的「点子」要来自你的大脑。\n- ⏰ **看屏幕要约定**：和爸爸妈妈约好每天能用多久，时间到了就关掉去玩真的。\n\n> 准备好开始了吗？先翻开 **01-AI 是什么**，拿起画笔，画出你心里的 AI 小伙伴吧！\n", "01-AI是什么.md": "# 01 · AI 是什么 → 画我心中的 AI 助手\n\n## 教学目标\n\n1. 用孩子能懂的话理解「AI 是什么」：它像一个很会听话、很会帮忙的聪明小伙伴，但它不是真人，也不是什么都知道的老师。\n2. 明白 AI 是**工具**：它帮我们画画、想故事、回答问题，但做决定、出主意的还是我们自己。\n3. 发挥想象，画出「我心中的 AI 助手」长什么样，并给它起一个名字。\n4. 建立第一道安全意识：AI 很厉害，但它看不到你、摸不到你，所以**不要告诉它你的秘密**。\n\n---\n\n## 导入问题\n\n> 小朋友，你有没有想过：手机里那个一问就答、一说就画的「东西」，到底是个啥？\n>\n> 它住在屏幕里，看不见也摸不着。你叫它画画，它就能画出一只戴帽子的猫；你叫它讲故事，它就能讲出会飞的小猪。它是人吗？不是。它是魔法吗？也不是。\n>\n> 它呀，是一个叫 **AI（人工智能）** 的「聪明工具」。今天，我们就要认识它，还要亲手画出一个属于你的 AI 小伙伴！\n\n---\n\n## 核心小知识（用大白话讲）\n\n- **AI 像什么？** 像一个超级爱帮忙的小帮手。你给它清楚的话，它就努力帮你做。\n- **AI 不是什么？** 不是真人（它没有身体、不会真的陪你玩）、不是老师（它会犯错）、不是百科全书（它也有不知道的事）。\n- **AI 怎么「想」的？** 你不用懂原理，只要记住：你说得越清楚，它帮得越准；你让它做的事，主意还是你出的。\n\n---\n\n## 互动任务：画我心中的 AI 助手\n\n准备：一张白纸、彩笔（或在平板上画）。\n\n1. **想一想**：你希望你的 AI 小伙伴长什么样？是圆滚滚的小机器人？是会飞的小云朵？还是一只戴眼镜的小狐狸？\n2. **画一画**：把它画在纸中间。可以给它加上你喜欢的颜色、表情、小道具（比如一只画笔、一本书）。\n3. **起个名**：给你的 AI 助手起一个可爱的名字，写在小脑袋旁边。比如「小智」「云朵朵」「帮帮狐」。\n4. **写一句它的本领**：在画下面写一句话，比如「它会帮我画恐龙」「它会陪我编故事」。\n5. **（小能手组加分）**：和爸爸妈妈说说，你希望它什么时候来帮忙？什么时候不该用？\n\n> 小提示：没有「标准答案」的画才是好画。画得歪歪扭扭也没关系，这是你独一无二的 AI 朋友！\n\n---\n\n## 家长提示\n\n- 这一步重在**打开兴趣**，不要纠正孩子「AI 不是这样的」。童真的想象正是创造力的种子。\n- 如果孩子问「AI 到底怎么工作的」，用比喻回答即可：「它像一台超级快的听话机器，看过很多很多资料，所以能猜出你想让它做什么。」不必深入技术。\n- 引导孩子区分「工具」和「伙伴」：可以说「它像一支特别聪明的彩笔，但拿笔画画的是你」。\n\n---\n\n## 安全提醒\n\n- 告诉孩子：AI 住在屏幕里，**它永远不需要知道你的真实姓名、学校、家庭住址和电话号码**。\n- 今天只是「画」AI，还没让它做事。等真正使用时，这条规则要一直守住。\n- 如果孩子画出了一个「会记住我所有秘密」的 AI，顺势聊一句：「真人的好朋友才能知道秘密，屏幕里的小伙伴只知道我们愿意分享的点子。」\n\n---\n\n## 课后作品\n\n- 🎨 **一幅画**：《我心中的 AI 助手》，包含形象 + 名字 + 一句本领说明。\n- 📝 **一句话介绍**：孩子能对着家长说清楚「我的 AI 助手叫什么、能帮我做什么」。\n- 🌟 **可选**：把画贴在家里冰箱或书桌上，作为整个启蒙营的「开营纪念」。\n\n---\n\n## 本节小结\n\nAI 是一个聪明的**工具**，不是真人，也不是什么都知道的老师。今天我们和它「初次见面」，还亲手画出了属于你的 AI 小伙伴。记住：以后让它帮忙时，**主意你来出，秘密不外说**。下一节，我们要学最重要的一件事——怎么把话说清楚，AI 才听得懂！\n", "02-如何提问.md": "# 02 · 如何提问 → 三种提问对比卡\n\n## 教学目标\n\n1. 明白一个超级重要的道理：**你说得越清楚，AI 帮得越准**。模糊的话，只会换来糊里糊涂的回答。\n2. 认识「三种提问」：说不清的、说清楚的、说清楚还加想象力的。\n3. 动手做一张「三种提问对比卡」，把坏问题和好问题并排贴在一起。\n4. 学会用一句魔法开头：**「我想让 AI 帮我……」**，把心里想要的说出来。\n\n---\n\n## 导入问题\n\n> 小明对 AI 说：「帮我写点东西。」\n> AI 懵了：写什么？给谁看？长还是短？它只好随便写一句，小明看完直摇头。\n>\n> 小红对 AI 说：「我想让 AI 帮我写一个小故事，主角是一只怕水的小鸭子，它最后勇敢地下了河，大概 5 句话。」\n> AI 一听就懂，立刻写出小红想要的故事。\n>\n> 同样都是「让 AI 帮忙」，为什么结果差这么多？——**因为小红把话说清楚啦！**\n\n---\n\n## 核心小知识：三种提问\n\n| 类型 | 样子 | AI 的反应 |\n| --- | --- | --- |\n| 🔴 说不清的 | 「帮我弄一下」「写点东西」 | 猜来猜去，答非所问 |\n| 🟢 说清楚的 | 「我想让 AI 帮我画一只红色的小龙，在雪地里」 | 照你说的做，基本满意 |\n| 🔵 说清楚 + 加想象 | 「我想让 AI 帮我画一只戴围巾的小龙，它正在雪地堆雪人，画风像童话书」 | 又准又有惊喜，像你脑子里想的那样 |\n\n> 小秘诀：清楚 = 说出「是什么 + 什么样 + 想怎么样」。想象力 = 再加一点你的小点子。\n\n---\n\n## 互动任务：做一张「三种提问对比卡」\n\n准备：一张纸折成三格，或画三个小框。\n\n1. **第一格（红／说不清）**：写一句你以前可能说过的糊涂话，比如「帮我画个动物」。\n2. **第二格（绿／说清楚）**：把上面那句改清楚，比如「我想让 AI 帮我画一只橙色的小猫，趴在窗台上晒太阳」。\n3. **第三格（蓝／加想象）**：再添一点你的创意，比如「……窗台外还飘着小雪花，整张画像一张温暖的明信片」。\n4. **比一比**：看着三格，和家长说说「哪句 AI 最听不懂？哪句最像我心里想的？」\n5. **（小能手组）**：用第三格的话，真的去请 AI 画一次，看看是不是你想要的。\n\n---\n\n## 家长提示\n\n- 让孩子**先说口语、再写下来**，别急着打字。把脑子里的想法「倒」出来，是提问训练的第一步。\n- 多用「是什么 / 什么样 / 想怎么样」三个问题引导孩子补全信息。\n- 夸具体行为：「你加了『戴围巾』这个想法，AI 就画出了你的风格！」而不是泛泛夸「真棒」。\n\n---\n\n## 安全提醒\n\n- 提问时**只说任务相关的信息**，不要顺手把名字、学校写进去。\n- 如果 AI 没画对，告诉孩子：「不是你错，是话还能说更清楚。」把「失败」变成「再试一次」的游戏。\n- 提醒：AI 给的东西不一定对，漂亮≠正确，下一节起我们会一直带着「想一想对不对」的习惯。\n\n---\n\n## 课后作品\n\n- 📋 **一张三种提问对比卡**：红／绿／蓝三格，每格一句，清楚标出「说不清 / 说清楚 / 加想象」。\n- 🗣️ **一句口头练习**：孩子能脱口而出「我想让 AI 帮我……（说清楚 + 加想象）」。\n- 🌟 **可选**：把这张卡贴在学习角，以后每次用 AI 前看一眼，提醒自己「先把话说清楚」。\n\n---\n\n## 本节小结\n\n好问题 = 说清楚（是什么＋什么样＋想怎么样）＋ 加一点你的想象力。从今天起，每次找 AI 帮忙，都先说那句魔法开头：**「我想让 AI 帮我……」**。把话说清楚，AI 就像听进了你心里的想法。下一节，我们要用这个本领，一起编一个只属于你的童话！\n", "03-一起讲故事.md": "# 03 · 一起讲故事 → 原创童话\n\n## 教学目标\n\n1. 体验「AI 是写作小伙伴」：孩子出点子、出主角、出开头，AI 帮忙把句子变得更好听、把故事接下去。\n2. 明白一个关键规则：**故事的主意要来自你自己的脑袋**。AI 是帮你把想法写漂亮、接着写的「小秘书」，不是故事的作者。\n3. 练习把模糊的想象，变成清楚的「故事三要素」：主角、问题、奇妙结局。\n4. 产出一篇孩子自己设计的原创小童话，并愿意读给家人听。\n\n---\n\n## 导入问题\n\n> 你有没有过这种时候：脑子里冒出一个超棒的点子——「要是有只小兔子会开火车就好了！」可是真要写成故事，却不知从哪写起。\n>\n> 今天，AI 就来当你的「故事小秘书」。你告诉它：主角是谁、遇到了什么麻烦、你想怎么结尾。它帮你把句子变得更有趣、替你接着写几句。**但记住：那列火车，是你先想到的！**\n\n---\n\n## 核心小知识：好故事从三个问题开始\n\n不管多长的故事，都可以从三个问题变出来：\n\n1. **主角是谁？** 一只怕黑的小猫？一个爱迟到的小精灵？\n2. **它遇到了什么麻烦？** 星星不见了？它的画笔被风吹走了？\n3. **后来怎么了？（你的奇妙想法）** 它请月亮帮忙？它自己想出了办法？\n\n把这三个问题想清楚，故事就有了骨头；AI 帮你长出血肉和漂亮的句子。\n\n---\n\n## 互动任务：写一篇原创童话\n\n准备：纸笔，或请家长帮忙在 AI 工具里打字。\n\n1. **想主角**（1 分钟）：在纸上画 or 写下一个主角，比如「一只想学跳舞的胖企鹅」。\n2. **想麻烦**：它遇到什么难事？比如「它太重了，总是摔跤，别的企鹅笑它」。\n3. **想你的结局**：你希望怎么收尾？比如「它发现胖也能滚出最可爱的雪球舞」。\n4. **请 AI 帮忙（说清楚版）**：\n   > 「我想让 AI 帮我写一个 5 句话的小童话。主角是想学跳舞的胖企鹅，麻烦是它太重总摔跤被笑话，结局是它滚出了最可爱的雪球舞。请帮我写得更生动一点，但主意都按我想的来。」\n5. **改一改**：AI 写完后，圈出你最喜欢的一句，也改掉一个你不满意的地方（比如换个名字）。\n6. **读出来**：把最终版读给爸爸妈妈听，声音大一点、加点表情更好玩！\n\n---\n\n## 家长提示\n\n- 这一步**最怕代劳**。家长只负责打字和朗读，点子、主角、结局必须来自孩子。\n- 如果孩子说「我不知道写什么」，用提问引导：「你最喜欢什么动物？它最怕什么？」而不是直接给答案。\n- 让孩子**动手改 AI 的稿子**，哪怕只改一个词，也是在行使「我是作者」的主权。\n\n---\n\n## 安全提醒\n\n- 童话里**不要写进真实姓名、学校、住址**。主角用动物或化名最安全。\n- 告诉孩子：AI 写的故事是「编出来的」，不是真的历史或新闻，不要当成事实讲给别的小朋友当真事。\n- 如果 AI 写出了奇怪、可怕、你不舒服的内容，立刻关掉，告诉家长「这段我不喜欢」，我们一起换一种说法。\n\n---\n\n## 课后作品\n\n- 📖 **一篇原创童话**：主角 + 麻烦 + 你的结局，至少 5 句话，有孩子亲手改过的痕迹。\n- 🎤 **一次朗读**：孩子读给家长听，家长给一句具体的夸奖（如「你给企鹅想的办法真暖心」）。\n- 🌟 **可选**：把童话抄进「我的作品本」，作为 08 节作品集的第一页。\n\n---\n\n## 本节小结\n\n今天你当了一回真正的「小作家」：主角、麻烦、结局都是你想的，AI 只是帮你把故事写得更漂亮、接得更顺。**主意永远是你自己的**——这是用 AI 创作最最重要的一条。下一节，我们要给故事里的人物画个像，还要学会写「给 AI 的话」让它能画出来！\n", "04-一起画角色.md": "# 04 · 一起画角色 → 角色设定 + 提示词\n\n## 教学目标\n\n1. 学会给一个角色做「设定卡」：名字、长相、性格、爱好，想得越具体，画出来越像你心里想的。\n2. 认识一个儿童版新词：**提示词**（就是「你告诉 AI 要画什么的那段话」）。它像给画家的纸条。\n3. 把角色设定，变成一段清楚的「给 AI 的话」，让 AI 帮你把角色画出来。\n4. 巩固安全习惯：角色用想象的，秘密不外说；AI 画的不一定对，你可以改。\n\n---\n\n## 导入问题\n\n> 上一节我们写了胖企鹅的故事。可是，你脑子里的那只企鹅，到底是戴红围巾还是蓝帽子？是笑眯眯还是酷酷的？\n>\n> 如果你只说「画只企鹅」，AI 可能画出一百种都不是你想要的。今天我们要做两件事：先给角色做一张「身份证」（设定卡），再把这张身份证，翻译成 AI 听得懂的「给 AI 的话」，它就能画出你心里的那个它！\n\n---\n\n## 核心小知识：角色设定四件套\n\n给角色填好这四样，它就活了：\n\n1. **名字**：闪闪 / 朵朵 / 小铁手……\n2. **长相**：什么颜色、什么身材、戴不戴帽子、有没有特别标记。\n3. **性格**：勇敢？爱睡？有点胆小但很善良？\n4. **爱好 / 标志动作**：爱收集贝壳、走路一蹦一跳、总抱着一本书。\n\n> 小词典：**提示词** = 你把上面这些，连成一段清楚的话，写给 AI 看。比如「我想让 AI 帮我画……」\n\n---\n\n## 互动任务：做角色卡 + 写「给 AI 的话」\n\n准备：一张角色设定卡纸（画四格或四行）。\n\n1. **填设定卡**：用上面的「四件套」填好你的角色。例：\n   - 名字：闪闪（一只小刺猬）\n   - 长相：橙黄色，背上有七颗星星斑点，戴一顶小蓝帽\n   - 性格：害羞但很勇敢\n   - 爱好：晚上数星星，喜欢画画\n2. **写提示词（给 AI 的话）**：把设定卡翻译成一段话：\n   > 「我想让 AI 帮我画一只叫闪闪的小刺猬：橙黄色、背上有七颗星星斑点、戴一顶小蓝帽，性格害羞但勇敢，爱好是晚上数星星和画画。画风像温暖的儿童绘本，背景是星空下的小山坡。」\n3. **请 AI 画一次**：把这段话输进去，看看画出来像不像你卡的。\n4. **比对 + 改**：哪里不像？是帽子颜色？是背景？把话说得更准一点，再画一次。\n5. **（小能手组）**：给角色写一句「自我介绍」，贴在设计稿旁边。\n\n---\n\n## 家长提示\n\n- 「提示词」对孩子是新词，就用「给 AI 的纸条 / 话」来解释，别讲成技术概念。\n- 画得「不像」是常态，这正是教孩子**迭代**：改一个词，再看一次，慢慢接近心意。\n- 鼓励孩子把设定卡留好——这是他原创的「IP」，以后写故事、做绘本都能用。\n\n---\n\n## 安全提醒\n\n- 角色设定里**不要出现孩子的真名、学校、住址**。用动物名、化名、想象的名字。\n- AI 生成的画像，不要上传带有孩子真实脸庞的照片去「变身」，保护肖像隐私。\n- 提醒：AI 画的有时候会多一只手、多一只眼，这很正常——它也会画错，正好接 06 节的「AI 也会错」。\n\n---\n\n## 课后作品\n\n- 🃏 **一张角色设定卡**：名字 / 长相 / 性格 / 爱好 四样齐全。\n- ✍️ **一段提示词**：从设定卡改写成「我想让 AI 帮我画……」的清楚的话。\n- 🖼️ **一幅 AI 角色画**：用你的提示词生成，旁边标注「原作设定：我」。\n- 🌟 **可选**：把角色卡和画一起收进作品本，它是你专属的小明星。\n\n---\n\n## 本节小结\n\n今天我们学会了一个超有用的本事：**先把角色想具体（设定卡），再把它变成 AI 听得懂的话（提示词）**。你发现没有？说得越细，画得越像。记住：角色是你创造的，AI 只是按你的纸条把它画出来。下一节，我们要用提问的本事，去问一问这个奇妙的世界！\n", "05-认识世界.md": "# 05 · 认识世界 → 科学小问题卡\n\n## 教学目标\n\n1. 把 AI 当成一个「爱回答为什么的机器」，鼓励孩子对周围世界多提问、多好奇。\n2. 练习把「好奇」变成清楚的「科学小问题」，而不是只说「为什么」。\n3. 建立重要习惯：**AI 说的，要去书里、去问真人老师/家长验证**，因为它可能说错。\n4. 产出一叠属于自己的「科学小问题卡」，保护孩子的求知欲。\n\n---\n\n## 导入问题\n\n> 小朋友，你有没有一堆「为什么」：\n> 为什么天是蓝的？为什么大象鼻子那么长？为什么泡泡是圆的？\n>\n> 大人们有时答不上来，有时随便说一句就过去了。今天，我们让 AI 当「十万个为什么」小老师——但我们要做一个聪明的小侦探：**它说的，我们要去查证对不对！**\n\n---\n\n## 核心小知识：好问题长这样\n\n把「为什么」说清楚，AI 才答得明白：\n\n- 🔴 太短：「为什么星星会亮？」——AI 会答，但你没说自己几岁、想听简单还是复杂。\n- 🟢 说清楚：「我想让 AI 用 8 岁小朋友能听懂的话，告诉我为什么星星会一闪一闪。」\n- 🔵 加想象（加分）：「……如果能用一个小比喻，比如像什么日常的东西，就更好了。」\n\n> 记住：问完之后，把答案记下来，再去翻科普书、问科学老师，看 AI 说得对不对。\n\n---\n\n## 互动任务：做一叠「科学小问题卡」\n\n准备：几张小卡片（或便签纸），每张写一个好奇。\n\n1. **列好奇（3 个）**：和孩子各想 1–2 个，比如「为什么猫从高处跳下不摔伤？」「云是怎么来的？」\n2. **写清楚版问题**：把每个改成「我想让 AI 用小朋友的话解释……」\n3. **问 AI + 记答案**：请 AI 回答，把孩子能懂的那句抄在卡片背面。\n4. **查证一步（关键！）**：选一张，和家长一起翻绘本 / 查儿童百科，看 AI 说的和书里一不一样。\n   - 一样 → 在卡片打 ✅「已查证」\n   - 不一样 → 打 ❓「要再问大人」，别急着信。\n5. **（小能手组）**：让孩子给其中一个问题，自己画一幅「我想象中的答案」小图。\n\n---\n\n## 家长提示\n\n- 这一节重点是**保护好奇心**，别批评「这问题太傻」。孩子肯问，就是科学家的起点。\n- 查证那一步最珍贵：它教孩子「不盲信」，比答案本身更重要。没有书也没关系，说「我们周末去图书馆查」也是好示范。\n- 如果孩子的问题你也不会，大方说「我也不懂，我们一起问 AI、再一起查书」，这是最好的榜样。\n\n---\n\n## 安全提醒\n\n- 提问时**不输入真实姓名、学校、住址**；只问知识，不问「我家在哪」。\n- AI 可能会一本正经地给错答案（下一节专门玩这个）。所以「查证」不是可选，是必须。\n- 涉及身体、健康、安全的问题（如「吃这个药行吗」），**永远问真人和医生**，不让 AI 替你拿主意。\n\n---\n\n## 课后作品\n\n- 🗂️ **一叠科学小问题卡**（至少 3 张）：正面清楚的问题，背面 AI 的回答 + 查证标记（✅/❓）。\n- 🔍 **一次查证记录**：至少 1 张卡完成了「翻书 / 问大人」的核对。\n- 🌟 **可选**：把问题卡串成小环，挂在书桌旁，随时加新卡片，做成「我的为什么博物馆」。\n\n---\n\n## 本节小结\n\n世界上有问不完的「为什么」，AI 可以帮我们找答案，但它**不是最后的裁判**。今天我们做了科学问题卡，更重要的是学会了「问完要去查证」。会怀疑、会核对，你就是小小科学家了。下一节，我们要专门玩一个游戏——看看 AI 到底会不会说错！\n", "06-AI也会错.md": "# 06 · AI 也会错 → 真假判断小游戏\n\n## 教学目标\n\n1. 用孩子能懂的话理解：**AI 不是全知全能的，它有时候会「编故事」、会说错话**。这叫「AI 也会犯错」。\n2. 通过一个小游戏，练习当「小侦探」：听到 AI 说的话，先想一想「这听起来对吗？」\n3. 建立判断三步法：停一停 → 想一想 → 查一查（问大人 / 翻书）。\n4. 巩固全课程红线：AI 给的答案，不能当成标准答案盲信。\n\n---\n\n## 导入问题\n\n> 你以为 AI 什么都知道？错啦！\n>\n> 有时候，AI 会非常认真、非常自信地告诉你一件**根本不存在的事**。比如它说「企鹅住在热带雨林里」，或者「太阳晚上出来上班」。听起来一本正经，其实全错。\n>\n> 今天我们来玩一个「找错侦探」游戏：我说几句话，你来判断哪句是 AI 编的假话！\n\n---\n\n## 核心小知识：AI 为什么也会错？\n\n用大白话讲给孩子：\n\n- AI 是「看过了很多很多资料」学出来的，但资料里也有错的，它就可能学错。\n- 有时候它为了「把话接下去」，会自己**编一个听起来很合理的答案**，其实根本没这回事。\n- 所以：**AI 说话很自信 ≠ AI 说的一定对**。我们要像小侦探一样，先怀疑，再查证。\n\n> 小口诀：**听 AI 说话，先停三秒，问自己「这靠谱吗？」**\n\n---\n\n## 互动任务：真假判断小游戏\n\n准备：家长念「句子卡」，孩子举 ✅（可能是真的）或 ❌（肯定是编的）。\n\n**第一轮 · 家长念，孩子判（例子）：**\n1. 「鱼的肚子里有骨头，所以要小心刺。」——✅（真）\n2. 「月亮是自己发光的大灯泡。」——❌（假，月亮不发光，是反射太阳）\n3. 「蜜蜂用翅膀说话（跳舞）告诉同伴花在哪。」——✅（真，蜜蜂真会跳舞）\n4. 「长颈鹿的脖子本来很短，是它自己拉长的。」——❌（假，是进化的）\n\n**第二轮 · 请 AI 出题（关键练习）：**\n> 对孩子说：「我们来请 AI 编 3 句『看起来像真、其实假』的话，你来当侦探找出来。」\n> 把 AI 说的话写下来，和孩子一一判断，标出哪句是编的。\n\n**第三轮 · 反向挑战：**\n让孩子自己编 1 句「假话」考家长，体会「编得真」有多容易——也就懂了 AI 为什么会骗到你。\n\n---\n\n## 家长提示\n\n- 游戏氛围要轻松像「抓鬼」，别变成考试。答错没关系，重点是**养成先怀疑的习惯**。\n- 如果孩子判断不出，引导用「三步法」：停（别急着信）→ 想（和我知道的一样吗？）→ 查（书 / 大人）。\n- 趁机强调：大人、老师、书也可能有错，但「多方核对」是最稳的办法。\n\n---\n\n## 安全提醒\n\n- 本节直接点明：**AI 会编假话**，所以任何「吓人的 / 奇怪的 / 和你认知冲突」的信息，先问家长，别慌也别信。\n- 绝不因为「AI 说吃了 XX 能怎样」就去尝试；身体和健康的事，只听真人和医生。\n- 游戏里编的假话，玩完就放下，提醒孩子「这是练习，不是真的知识」。\n\n---\n\n## 课后作品\n\n- 🕵️ **一张「找错游戏卡」**：至少 4 句话，孩子标了 ✅/❌，并圈出一句「AI 最容易骗到我的」。\n- 📝 **一句自己的提醒**：孩子能说出「AI 也会错，我要先想一想再信」。\n- 🌟 **可选**：和家长约定一个「家庭暗号」——听到 AI 给奇怪答案，就说「停一停，查一查」。\n\n---\n\n## 本节小结\n\n今天我们知道了一个大秘密：**AI 也会说错话、甚至会编故事**。所以它再自信，我们也要当小侦探——先停、再想、去查。把「不盲信」刻进小脑瓜，你就比很多大人更会用 AI 了。下一节，我们要用 AI 当「发明小助手」，设计一件未来的神奇物品！\n", "07-我的未来发明.md": "# 07 · 我的未来发明 → 未来物品设计稿\n\n## 教学目标\n\n1. 激发「解决真实问题」的创造力：先想「生活中有什么不方便」，再设计一件未来小发明去解决它。\n2. 练习用 AI 当「发明小助手」：帮你想功能、写说明、画样子——但**发明的灵感和要解决的事，来自你**。\n3. 把想法画成一张「未来物品设计稿」，含名字、样子、本领、解决什么问题。\n4. 巩固：AI 是帮你把点子变清楚的伙伴，不是替你想点子的机器。\n\n---\n\n## 导入问题\n\n> 有没有什么事让你觉得「要是有个东西帮我就好了」？\n> 比如：书包太重背不动、下雨忘带伞被淋湿、妈妈总找不到钥匙……\n>\n> 今天你就是「小小发明家」！我们要设计一件**未来才会有的神奇物品**，专门解决你最烦恼的一件小事。AI 来当你的助手：帮你把功能想全、把说明写清楚、把样子画出来。但那个「想解决什么」的好点子——是你给的！\n\n---\n\n## 核心小知识：好发明从「麻烦」开始\n\n每个孩子都能发明，只要走这三步：\n\n1. **找麻烦**：今天有什么不方便？（太重 / 太乱 / 太慢 / 会忘）\n2. **想法宝**：如果我有一样东西，它能怎么做就解决了？（自动飞、会变轻、会提醒）\n3. **画出来**：它长什么样？叫什么名字？最厉害的一招是什么？\n\n> AI 帮得上忙的地方：把你的法宝说得更具体、替你写一段产品说明、画一张概念图。\n\n---\n\n## 互动任务：画一张未来发明设计稿\n\n准备：一张大纸（横着画更像设计图）。\n\n1. **选麻烦**：和孩子聊，选一个他最有感触的「不方便」。例：「下雨天书包会湿」。\n2. **想法宝**：设计「晴雨自动书包」——下雨自己撑起小伞盖，天晴收起来。\n3. **写设计稿四块**：\n   - 名字：晴雨自动书包\n   - 样子：画一个书包，顶上有一朵会开的「伞花」\n   - 最厉害的本领：下雨自动开伞盖，还能烘干\n   - 解决什么问题：书包和书本再也不会被淋湿\n4. **请 AI 帮忙（说清楚版）**：\n   > 「我想让 AI 帮我写 3 句这个发明的介绍，再帮我画一张概念图：一个书包顶上有一朵会自动撑开的伞花，画风像未来科技绘本。」\n5. **贴一起**：把孩子的手绘图 + AI 的说明 + AI 的图，并排贴在设计稿上，这就是你的「专利图」！\n\n---\n\n## 家长提示\n\n- 这一步**保护原创性**最重要：先让孩子说出「想解决什么」，再让 AI 帮忙细化，顺序不能反。\n- 如果孩子说「我不知道发明什么」，从他的日常抱怨里挖：「你刚才说最烦的是啥？」那就是金点子。\n- 鼓励孩子给发明起古怪可爱的名字，创意比「合理」更珍贵。\n\n---\n\n## 安全提醒\n\n- 发明稿里**不写真实姓名、学校、家庭地址**；用化名或动物名署名（如「发明家小熊猫」）。\n- AI 画的图若用到「人」的形象，用想象角色，不传真实照片。\n- 提醒：AI 写的「功能」是想象，不是真能造出来；这是创作练习，不是产品承诺。\n\n---\n\n## 课后作品\n\n- 🛠️ **一张未来发明设计稿**：含名字 / 手绘样子 / 最厉害本领 / 解决什么问题 四要素。\n- 🤖 **AI 辅助产出**：一段 AI 写的介绍 + 一张 AI 画的概念图（标注「助手：AI」）。\n- 🌟 **可选**：开一场「家庭发明发布会」，孩子拿着设计稿给全家讲解，家长提问、孩子答。\n\n---\n\n## 本节小结\n\n今天你是小小发明家：从「生活里的不方便」出发，想出了只属于你的未来法宝，还请 AI 帮你写说明、画图。**点子是你的，AI 是把点子变漂亮的助手**——这正是一路以来我们练习的本事。下一节，我们要把前面所有的作品，装订成一本书！\n", "08-创作展示.md": "# 08 · 创作展示 → AI 绘本 / 作品集\n\n## 教学目标\n\n1. 把 01–07 节的所有作品，整理成一本**属于孩子自己的作品集 / AI 小绘本**，收获完成的成就感。\n2. 练习「展示与讲述」：能对着家人介绍自己的画、故事、角色、发明，并说清「哪部分是我想的，哪部分是 AI 帮的」。\n3. 强化核心认知：这一本里，**所有的点子和主意都来自你**，AI 只是帮你画得更好看、写得更好听的小助手。\n4. 在温馨的「结营小展示」里，给启蒙营画上句号，并把安全意识再念一遍。\n\n---\n\n## 导入问题\n\n> 不知不觉中，你已经有了好多作品：AI 助手画像、提问对比卡、一篇童话、一张角色卡、科学问题卡、找错游戏卡、未来发明稿……\n>\n> 它们现在是不是散得到处都是？今天，我们要给它们安一个家——一本**「我的 AI 创造力作品集」**。翻开来，全是你自己的奇妙想法！\n\n---\n\n## 核心小知识：什么是「作品集」\n\n作品集就是「我把我做过的好东西，按顺序收在一起的一本书」。\n\n- 它证明一件事：**这些主意都是我想出来的**，AI 是来帮忙实现的。\n- 它也是给未来的你看的礼物：过半年再翻，你会笑「我当时想得真好玩」。\n- 展示时最骄傲的一句话是：「这页的故事是我编的，AI 帮我写得更生动。」\n\n---\n\n## 互动任务：制作你的作品集 / AI 绘本\n\n准备：一个文件夹 / 一本空白本子，或用一个文档；胶棒、彩笔。\n\n1. **收集（5 分钟）**：把 01–07 的作品全找出来，按顺序排好。\n2. **做封面**：写上《我的 AI 创造力作品集 · 作者：〔孩子的化名〕》，画一个代表自己的小图标。\n3. **装订成书**（每页一作品）：\n   - 第 1 页：我心中的 AI 助手（画像 + 名字）\n   - 第 2 页：三种提问对比卡\n   - 第 3 页：我的原创童话\n   - 第 4 页：我的角色卡 + AI 画像\n   - 第 5 页：科学小问题卡（选 1–2 张）\n   - 第 6 页：真假判断游戏卡\n   - 第 7 页：未来发明设计稿\n4. **写一句「创作宣言」**（孩子口述，家长代写或自己写）：\n   > 「这本书里的点子都是我想的，AI 是帮我实现的好帮手。AI 也会错，所以我都会想一想。」\n5. **家庭展示会（10 分钟）**：孩子翻着书，给家人讲 2–3 页，重点说「哪是我的主意」。家长鼓掌 + 一句具体夸奖。\n\n---\n\n## 家长提示\n\n- 展示环节**重鼓励、轻指正**。这是创造力庆典，不是作业检查。\n- 帮孩子把「我想的 / AI 帮的」分清楚地说出来，这呼应全课程红线，也锻炼表达。\n- 把作品集拍照存档；未来孩子长大回看，会记得「我小时候就用 AI 创作过」。\n\n---\n\n## 安全提醒\n\n- 作品集若分享给亲友或发网上，**隐去真实姓名、学校、住址**；用化名和想象角色。\n- 不公开孩子清晰正脸照与作品混在一起；保护肖像。\n- 展示结尾，和家长一起再念一遍安全三句话（不泄密 / 不盲信 / 不依赖），作为结营约定。\n\n---\n\n## 课后作品\n\n- 📚 **一本作品集 / AI 小绘本**：含封面 + 01–07 七页作品 + 一句创作宣言。\n- 🎤 **一次家庭展示**：孩子讲 2–3 页，能清楚区分「我的主意」和「AI 帮忙」。\n- 🤝 **一份安全约定**：全家签字的「AI 使用三不」小纸条，夹在书里。\n- 🌟 **结营认证**：家长给孩子颁一张手写「AI 创造力小达人」奖状，庆祝完成！\n\n---\n\n## 本节小结（也是整个启蒙营的结尾）\n\n从「画一个 AI 小伙伴」到「做出一本自己的作品集」，你走完了一段超棒的旅程。你学会了：**AI 是工具不是权威、把话说清楚它才听得懂、用它能把想法变成故事和画、还要记得保护隐私和不盲信**。这些本事，会陪你长大。恭喜你，AI 创造力小达人！🎉\n", "09-家长指南.md": "# 第 9 课  家长指南（如何陪孩子用 AI）\n\n> 本营面向 6–12 岁儿童，需家长陪同。本文件供家长阅读，帮你成为孩子用 AI 的\"副驾\"。\n\n## 一、为什么孩子需要你陪\n\nAI 是工具不是保姆。6–12 岁的孩子：\n- 分不清\"AI 说的是真的还是编的\"（见第 6 课\"AI 也会错\"）。\n- 容易把 AI 当\"权威答案机\"，丧失自己思考。\n- 需要有人帮他把\"好玩\"变成\"有收获\"。\n\n你的角色不是\"教技术\"，是\"陪他问、陪他想、陪他把想法做出来\"。\n\n## 二、每次陪玩的 4 个动作\n\n1. **先问再答**：让孩子先说自己想做什么，再开 AI。别一上来代他打字。\n2. **一起看输出**：AI 给出东西后，和他讨论\"这是真的吗？你觉得好不好？\"\n3. **动手做**：每节课都有创作任务（画画、写故事、设计发明），陪他完成，不只是看屏幕。\n4. **收作品**：把每次作品存进\"AI 创作集\"（第 8 课），积累成就感。\n\n## 三、常见问题\n\n**Q：孩子直接抄 AI 写的作文交学校，怎么办？**\nA：明确规则——AI 是\" brainstorm 伙伴\"，最终必须用自己的话写。让他给 AI 提要求、改 AI 的草稿，而不是照搬。\n\n**Q：AI 答错了，孩子信了，怎么办？**\nA：正好是第 6 课\"真假判断\"的练习。陪他验证：\"我们查一下书/问老师，看 AI 说的对不对。\"\n\n**Q：孩子沉迷和 AI 聊天，不理人？**\nA：设屏幕时间（见下方）。AI 是补充，不是替代真实社交。\n\n**Q：用什么工具安全？**\nA：优先选有\"儿童模式/家长监控\"的产品；不用需填真实姓名电话的工具；不让孩子上传照片到不明平台。\n\n## 四、屏幕时间与边界建议\n\n- 单次陪玩 ≤ 30–45 分钟（对应每节课时长）。\n- 不在睡前 1 小时用。\n- 用完后做\"非屏幕\"延伸：把 AI 生成的故事画出来、把发明设计用手工做出来。\n\n## 五、家长红线（和孩子共同遵守）\n\n- 不把姓名、学校、家庭住址告诉 AI。\n- 不把 AI 当\"考试答案\"。\n- AI 说\"你很棒/你错了\"都只是程序，别当真。\n- 遇到不舒服的内容，马上关掉告诉家长。\n\n> 陪孩子用 AI 的目标：让他变得更会想、更会表达、更有创造力——而不是更依赖屏幕。\n", "10-安全手册.md": "# 第 10 课  安全手册（儿童能懂的版本）\n\n> 给家长和孩子的\"AI 使用安全规则\"。用孩子能懂的话写，建议家长读给孩子听、一起贴在书桌前。\n\n## 一、给孩子的 5 条安全规则（念给他听）\n\n1. **不告诉 AI 你是谁**\n   AI 不是朋友，不用告诉它你的真名、学校、家住哪、电话。就像不对陌生人说家里事。\n\n2. **AI 会\"编故事\"，不一定真**\n   有时候 AI 说\"太阳是绿色的\"\"你考试一定能满分\"，那是它乱说的。重要的话要问爸爸妈妈或老师。\n\n3. **AI 不是老师，不是考官**\n   它说\"你真聪明\"\"你答错了\"都只是电脑程序在说话，别开心也别难过。\n\n4. **作业自己写**\n   AI 可以帮你想点子，但作文、算术要自己做。抄 AI 的答案，学不到真本领。\n\n5. **不舒服就关掉**\n   看到奇怪、害怕、不懂的内容，马上关掉，告诉爸爸妈妈。\n\n## 二、给家长的 5 条守护规则\n\n1. **陪着用**：6–12 岁孩子首次使用必须有家长在场。\n2. **看工具**：只用带儿童保护/家长监控的产品，不开匿名聊天。\n3. **查内容**：定期看孩子和 AI 的对话，发现异常及时引导。\n4. **护隐私**：不让孩子输入真实身份信息；不在公共 AI 传照片。\n5. **设边界**：屏幕时间可控，AI 是玩具不是全部。\n\n## 三、真假信息小练习（配合第 6 课）\n\n家长说一句话让 AI 编，比如\"企鹅住在沙漠里吗？\"——看 AI 怎么答，再和孩子查真相。\n让孩子记住：**\"AI 说的，先打个问号。\"**\n\n## 四、依赖风险提醒\n\n如果孩子出现\"不问 AI 就不会做题\"\"只想和 AI 聊天\"——暂停使用几天，回归纸质书和真实互动。AI 是辅路，不是主路。\n\n## 五、紧急情况\n\n- 孩子收到诱导、骚扰、不当内容 → 立刻保存截图、关闭工具、向平台举报。\n- 涉及个人信息泄露 → 修改相关密码、告知学校。\n\n> 安全不是限制孩子探索，是让探索在保护里发生。\n", "11-Prompt模板库(儿童版).md": "# 第 11 课  Prompt 模板库（儿童版）\n\n> 给家长和孩子的\"会说话的小卡片\"。每条都用「我想让 AI 帮我……」开头，简单、具体、孩子能自己念。\n> 使用前先读第 9 课家长指南、第 10 课安全手册。\n\n## 一、通用开口（每条都先说这句）\n\n```\n我想让 AI 帮我[做一件具体的事]。\n我是[几岁]的小朋友，请说[简单/有趣]的话。\n```\n\n## 二、按课程分类的模板\n\n### 第 1 课 · AI 是什么\n```\n我想让 AI 帮我画一画\"我心中的 AI 助手\"长什么样。\n它有什么超能力？请描述给我，我用笔画下来。\n```\n\n### 第 2 课 · 如何提问\n```\n我想让 AI 帮我：我要问关于[恐龙/星星/小狗]的问题。\n请先教我 3 种问法，让我比比哪种问得清楚。\n```\n\n### 第 3 课 · 一起讲故事\n```\n我想让 AI 帮我写一个童话：主角是[一只会做饭的小狐狸]，\n它要去[拯救被乌云盖住的天空]。请和我一起，一段一段写。\n```\n\n### 第 4 课 · 一起画角色\n```\n我想让 AI 帮我设计一个角色：它是[住在云上的小工程师]，\n喜欢[收集彩虹]。请写出它的样子和一段画图用的提示词，我拿去画。\n```\n\n### 第 5 课 · 认识世界\n```\n我想让 AI 帮我解释：为什么[晚上星星会出来]？\n请用[8岁小朋友]听得懂的话说，再出一道小问题考我。\n```\n\n### 第 6 课 · AI 也会错\n```\n我想让 AI 帮我玩\"真假游戏\"：你故意说 3 句关于[动物]的话，\n其中 1 句是假的，让我猜哪句是编的，并告诉我答案。\n```\n\n### 第 7 课 · 我的未来发明\n```\n我想让 AI 帮我设计\"未来的[会自己收拾书包的桌子]\"：\n它怎么工作？长什么样？请写出样子，我画设计稿。\n```\n\n### 第 8 课 · 创作展示\n```\n我想让 AI 帮我：把我的[5个故事+5张画]拼成一个\"AI 绘本\"。\n请给绘本起个名字，写一段开场白。\n```\n\n## 三、给家长的\"陪问\"提示\n\n- 让孩子**自己念**想做的事，锻炼表达。\n- AI 答完，问孩子：\"你觉得它说得对吗？哪里好玩？\"\n- 鼓励孩子**改 AI 的话**：\"让 AI 换一种说法试试。\"\n\n## 四、安全提醒（每次都用）\n\n- 不填真名、学校、电话。\n- AI 说\"真的假的不确定\"时，查书或问大人。\n- 不抄 AI 答案当作业。\n\n> 模板是\"脚手架\"，孩子的想法才是主角。AI 帮他把想法变出来，主角永远是孩子。\n", "00-课程总览-en.md": "# Children's \"AI Creativity Camp\" · Course Overview\n\n> This is an \"AI creativity\" course for kids aged 6–12 to take together with mom or dad.\n> We don't teach complicated technology. We do just three things: **get to know AI, learn how to ask good questions, and use AI to turn the ideas in your head into stories and pictures.**\n> Remember one sentence: AI is a smart helper that exercises our brains, not a teacher who knows everything.\n\n---\n\n## 1. What This Course Is About\n\nThis is a beginner course in \"AI literacy + creativity.\" We treat AI like a box of crayons, a storybook, and a chatty little friend — it helps us draw faster and think further, but **the real imagination and the final decisions always belong to the child.**\n\nThis course takes the good methods from three trusted sources and turns them into something young children can understand and do with their hands:\n\n- **Middle-school AI literacy workshop (Beyond AI Hype, Chinasa T. Okolo, RESPECT'24):** teaches kids to use AI critically, to spot AI-generated content, and to understand that AI can also make mistakes.\n- **Prompt Engineering Guide (dair-ai / Prompt Engineering Guide):** teaches kids \"how to say things clearly so AI can understand.\"\n- **AI For Beginners course (Microsoft AI-For-Beginners):** explains \"what AI really is\" in the most everyday way.\n\nWhat we did is turn those big-kid methods into games that 6–12 year-olds can play and do.\n\n---\n\n## 2. Who It's For\n\n- **Ages 6–8 (Little Ones group):** need more company from mom and dad; the focus is on \"playing\" and \"feeling\" — drawing a picture or making up one sentence of a story is enough.\n- **Ages 9–12 (Little Experts group):** can operate on their own; the focus is on \"thinking\" and \"doing\" — finish a fairy tale, a character card, and a little picture book.\n- **Parents:** you are the child's most important \"safety gatekeeper\" and \"cheerleader\" — just keep them company, ask questions, and give praise.\n\n---\n\n## 3. Four Core Goals\n\n1. **AI is a tool, not an authority:** AI can help, and it can also make mistakes. You must judge the answers yourself and never believe blindly.\n2. **Say what you want clearly:** learn to express yourself clearly, like \"I want AI to help me…,\" so AI can actually help.\n3. **Turn ideas into creations:** use AI together to write stories, draw characters, and design inventions — produce work that belongs to the child.\n4. **Build three safety habits:** protect privacy, tell real from fake, and don't let AI think for you.\n\n---\n\n## 4. Learning Path (00 → 11)\n\n| No. | Topic | Main output |\n| --- | --- | --- |\n| 00 | Course Overview | the page you are reading now |\n| 01 | What is AI → draw my AI helper | a picture of an AI helper + a name |\n| 02 | How to ask → three-question comparison card | a \"good question / bad question\" comparison card |\n| 03 | Story time → original fairy tale | a little fairy tale co-written with AI |\n| 04 | Draw a character → character design + prompt | a character card + a \"message to AI\" |\n| 05 | Know the world → science question cards | a stack of \"why\" science question cards |\n| 06 | AI makes mistakes too → true/false game | a \"find the AI's mistake\" game card |\n| 07 | My future invention → future object design | a future invention design sheet |\n| 08 | Showcase → AI picture book / portfolio | a portfolio that belongs to the child |\n| 09 | Parent Guide | how parents accompany, ask, and manage screen time |\n| 10 | Safety Handbook | privacy / real-vs-fake / dependency rules kids can understand |\n| 11 | Prompt Template Library (Kids Edition) | \"I want AI to help me…\" templates ready to use anytime |\n\n---\n\n## 5. What the Child Should Have by Graduation\n\n- A drawing of \"my AI helper in my heart\" (01)\n- A question comparison card (02)\n- An original fairy tale (03)\n- A character design card + a prompt (04)\n- A stack of science question cards (05)\n- A true/false judgment game card (06)\n- A future invention design sheet (07)\n- An AI portfolio / little picture book (08)\n- A parent companion notebook (09)\n- A little safety agreement (10)\n- A prompt template booklet to flip through anytime (11)\n\n---\n\n## 6. Three Sentences for Parents to Accompany\n\n1. **Ask more, do less for them:** when the child is stuck, first ask \"what do you want it to become?\" instead of typing for them.\n2. **Praise the process more:** praise \"what a great idea you had\" or \"you asked so clearly,\" not just \"it looks so real.\"\n3. **Hold the safety line:** don't enter private info, don't believe everything AI says, and you decide the screen time.\n\n---\n\n## 7. Red Lines Running Through the Whole Course\n\n1. **AI is not the standard answer:** for anything AI gives, make the child think \"is this right? does it match what I know?\"\n2. **Creating comes first, tests come later:** we make stories, drawings, and inventions — no quizzes, no rankings.\n3. **Don't leak privacy:** names, schools, addresses, phone numbers, photos — never type them into AI.\n4. **Don't skip your own thinking:** AI is a partner that \"thinks with you,\" not a machine that \"thinks for you.\"\n\n---\n\n## 8. General Safety Rules (Kids Version)\n\n- 🔒 **Don't tell AI your secrets:** your real name, school, home address, and phone number — never type them in.\n- 🤔 **AI can be wrong:** if what AI says is different from your books or what your teacher said, ask mom or dad first.\n- 🎨 **The ideas must come from you:** let AI help you draw and write, but the \"ideas\" for the story and invention must come from your own brain.\n- ⏰ **Agree on screen time:** make a deal with mom and dad about how long each day, and when time's up, turn it off and go play for real.\n\n> Ready to start? First open **01-What is AI**, pick up your crayons, and draw the AI friend in your heart!\n", "01-AI是什么-en.md": "# 01 · What is AI → Draw My AI Helper\n\n## Learning Goals\n\n1. Understand \"what AI is\" in words a child can grasp: it's like a very obedient, very helpful smart little friend — but it's not a real person, and not a teacher who knows everything.\n2. Understand that AI is a **tool**: it helps us draw, think up stories, and answer questions, but we are the ones who make decisions and come up with ideas.\n3. Use your imagination to draw what \"my AI helper\" looks like, and give it a name.\n4. Build the first safety awareness: AI is amazing, but it can't see you or touch you, so **don't tell it your secrets**.\n\n---\n\n## Warm-up Question\n\n> Little friend, have you ever wondered: that \"thing\" in your phone that answers as soon as you ask and draws as soon as you speak — what on earth is it?\n>\n> It lives inside the screen, invisible and untouchable. You tell it to draw and it draws a cat wearing a hat; you tell it to tell a story and it tells one about a flying little pig. Is it a person? No. Is it magic? No either.\n>\n> It is a \"smart tool\" called **AI (Artificial Intelligence)**. Today we're going to meet it, and draw an AI friend that belongs to you!\n\n---\n\n## Key Concept (in plain words)\n\n- **What is AI like?** Like a super helpful little assistant. You give it clear words and it works hard to help you.\n- **What is AI NOT?** Not a real person (it has no body and won't really play with you), not a teacher (it makes mistakes), not an encyclopedia (there are things it doesn't know either).\n- **How does AI \"think\"?** You don't need to understand the mechanism — just remember: the clearer you speak, the more accurately it helps; and for whatever you ask it to do, the idea still comes from you.\n\n---\n\n## Activity: Draw My AI Helper\n\nPrep: a blank sheet of paper, crayons (or draw on a tablet).\n\n1. **Imagine:** what do you want your AI friend to look like? A round little robot? A flying little cloud? Or a little fox wearing glasses?\n2. **Draw:** draw it in the middle of the paper. You can add your favorite colors, expressions, and little props (like a paintbrush or a book).\n3. **Name it:** give your AI helper a cute name and write it next to its little head. For example, \"Xiao Zhi,\" \"Cloudy,\" or \"Helper Fox.\"\n4. **Write one of its powers:** write one sentence under the drawing, like \"it helps me draw dinosaurs\" or \"it keeps me company making up stories.\"\n5. **(Little Experts bonus):** tell mom and dad when you'd want it to help, and when it shouldn't be used.\n\n> Tip: a drawing with \"no right answer\" is the best drawing. It's fine if it's a little crooked — this is your one-and-only AI friend!\n\n---\n\n## Parent Tip\n\n- The point of this step is to **spark interest** — don't correct the child with \"AI isn't like that.\" Childlike imagination is the seed of creativity.\n- If the child asks \"how does AI actually work,\" answer with a metaphor: \"it's like a super-fast obedient machine that has read tons and tons of material, so it can guess what you want it to do.\" No need to go deep into the technology.\n- Guide the child to tell \"tool\" from \"friend\": you can say \"it's like a specially smart crayon, but the one holding the crayon and drawing is you.\"\n\n---\n\n## Safety Reminder\n\n- Tell the child: AI lives in the screen, and **it never needs to know your real name, school, home address, or phone number**.\n- Today we only \"draw\" AI, not make it do things yet. When we actually use it later, this rule must always hold.\n- If the child draws an AI that \"remembers all my secrets,\" take the chance to say: \"only real-life good friends get to know secrets; the little friend in the screen only knows the ideas we choose to share.\"\n\n---\n\n## Your Creation\n\n- 🎨 **A drawing:** \"My AI Helper in My Heart,\" including its look + a name + one sentence describing its power.\n- 📝 **A one-sentence intro:** the child can tell parents clearly \"what my AI helper is called and what it can help me with.\"\n- 🌟 **Optional:** stick the drawing on the fridge or desk at home as the \"opening-day keepsake\" of the whole camp.\n\n---\n\n## Wrapping Up\n\nAI is a smart **tool** — not a real person, and not a teacher who knows everything. Today we \"met\" it for the first time, and drew the AI friend that belongs to you. Remember: when you ask it for help later, **you provide the ideas, and don't share your secrets**. Next time, we'll learn the most important thing — how to say things clearly so AI can understand!\n", "02-如何提问-en.md": "# 02 · How to Ask → Three-Kind Question Comparison Card\n\n## Learning Goals\n\n1. Understand a super important truth: **the clearer you speak, the more accurately AI helps.** Vague words only bring back muddled answers.\n2. Recognize \"three kinds of questions\": unclear ones, clear ones, and clear ones with extra imagination.\n3. Make a \"three-kind question comparison card\" by placing a bad question and a good question side by side.\n4. Learn a magic opening sentence: **\"I want AI to help me…,\"** and say what you want in your heart.\n\n---\n\n## Warm-up Question\n\n> Xiao Ming says to AI: \"Help me write something.\"\n> AI is confused: write what? For whom? Long or short? It has to write something random, and Xiao Ming shakes his head after reading.\n>\n> Xiao Hong says to AI: \"I want AI to help me write a little story. The main character is a duckling afraid of water, and in the end it bravely goes into the river — about 5 sentences.\"\n> AI understands right away and immediately writes the story Xiao Hong wanted.\n>\n> Both said \"let AI help,\" so why such different results? — **Because Xiao Hong said it clearly!**\n\n---\n\n## Key Concept: Three Kinds of Questions\n\n| Type | Looks like | AI's reaction |\n| --- | --- | --- |\n| 🔴 Unclear | \"Help me with this,\" \"write something\" | guesses around, answers the wrong thing |\n| 🟢 Clear | \"I want AI to help me draw a red little dragon, in the snow\" | does what you said, basically satisfied |\n| 🔵 Clear + imagination | \"I want AI to help me draw a little dragon wearing a scarf, building a snowman in the snow, in a fairy-tale picture-book style\" | accurate and surprising, just like in your head |\n\n> Little secret: clear = say \"what + what kind + what you want to happen.\" Imagination = add a little of your own idea.\n\n---\n\n## Activity: Make a \"Three-Kind Question Comparison Card\"\n\nPrep: fold a sheet of paper into three columns, or draw three little boxes.\n\n1. **Column 1 (red / unclear):** write a muddled sentence you might have said before, like \"help me draw an animal.\"\n2. **Column 2 (green / clear):** rewrite the sentence above clearly, like \"I want AI to help me draw an orange little cat, lying on the windowsill in the sun.\"\n3. **Column 3 (blue / add imagination):** add a bit of your own creativity, like \"…outside the window little snowflakes are drifting, the whole picture like a warm postcard.\"\n4. **Compare:** look at the three columns and tell your parent \"which sentence does AI understand least? which is most like what's in my heart?\"\n5. **(Little Experts group):** actually ask AI to draw using the column-3 sentence, and see if it's what you wanted.\n\n---\n\n## Parent Tip\n\n- Let the child **say it out loud first, then write it down** — don't rush to typing. \"Pouring out\" the idea in their head is the first step of question training.\n- Use the three questions \"what / what kind / what you want to happen\" to guide the child to fill in the missing information.\n- Praise specific behavior: \"you added the idea 'wearing a scarf' and AI drew in your style!\" instead of a vague \"awesome.\"\n\n---\n\n## Safety Reminder\n\n- When asking, **only say information related to the task** — don't slip in your name or school.\n- If AI didn't draw it right, tell the child: \"it's not that you're wrong, the words can still be said more clearly.\" Turn \"failure\" into a \"try again\" game.\n- Remind: what AI gives isn't necessarily right; pretty ≠ correct. From next lesson on, we'll keep the habit of \"thinking about whether it's right.\"\n\n---\n\n## Your Creation\n\n- 📋 **A three-kind question comparison card:** red / green / blue columns, one sentence each, clearly marked \"unclear / clear / add imagination.\"\n- 🗣️ **One spoken practice:** the child can blurt out \"I want AI to help me… (clear + add imagination).\"\n- 🌟 **Optional:** stick this card in the study corner; glance at it before each AI use to remind yourself \"say it clearly first.\"\n\n---\n\n## Wrapping Up\n\nA good question = say it clearly (what + what kind + what you want to happen) + add a bit of your imagination. From today on, every time you ask AI for help, start with that magic opening: **\"I want AI to help me….\"** Say it clearly, and AI will feel like it heard the idea in your heart. Next time, we'll use this skill to make up a fairy tale that belongs only to you!\n", "03-一起讲故事-en.md": "# 03 · Story Time → Original Fairy Tale\n\n## Learning Goals\n\n1. Experience \"AI as a writing buddy\": the child supplies the idea, the main character, the opening — AI helps make the sentences sound nicer and continues the story.\n2. Understand one key rule: **the story's idea must come from your own head.** AI is a \"little secretary\" that helps you write the idea beautifully and continue it — not the author of the story.\n3. Practice turning a fuzzy imagination into a clear \"three story elements\": main character, problem, and a wonderful ending.\n4. Produce an original little fairy tale designed by the child, and be willing to read it to the family.\n\n---\n\n## Warm-up Question\n\n> Have you ever had this moment: a super idea pops into your head — \"wouldn't it be great if a little rabbit could drive a train!\" — but when it comes to actually writing a story, you don't know where to start.\n>\n> Today, AI becomes your \"story secretary.\" You tell it: who's the main character, what trouble they meet, and how you want it to end. It helps make the sentences more fun and writes a few lines to continue. **But remember: that train was your idea first!**\n\n---\n\n## Key Concept: A Good Story Starts with Three Questions\n\nNo matter how long the story, it can come from three questions:\n\n1. **Who is the main character?** A little cat afraid of the dark? A little elf who's always late?\n2. **What trouble do they meet?** The stars disappeared? Their paintbrush was blown away by the wind?\n3. **What happens then? (your wonderful idea)** Does it ask the moon for help? Does it figure out a way itself?\n\nGet these three questions clear, and the story has its bones; AI helps grow the flesh and the pretty sentences.\n\n---\n\n## Activity: Write an Original Fairy Tale\n\nPrep: paper and pencil, or ask a parent to type into an AI tool.\n\n1. **Think of a character (1 minute):** draw or write down a main character on paper, like \"a chubby penguin who wants to learn to dance.\"\n2. **Think of the trouble:** what hard thing does it meet? Like \"it's too heavy, always falls, and the other penguins laugh at it.\"\n3. **Think of your ending:** how do you want it to wrap up? Like \"it discovers that being chubby can roll the cutest snowball dance.\"\n4. **Ask AI for help (clear version):**\n   > \"I want AI to help me write a 5-sentence little fairy tale. The main character is a chubby penguin who wants to learn to dance; the trouble is it's too heavy and always falls and gets laughed at; the ending is it rolls the cutest snowball dance. Please make it more vivid, but keep all the ideas as I thought.\"\n5. **Edit it:** after AI writes, circle your favorite sentence, and also change one thing you're not happy with (like swap a name).\n6. **Read it out:** read the final version to mom and dad, louder and with some expressions to make it more fun!\n\n---\n\n## Parent Tip\n\n- The thing we fear most at this step is **doing it for them.** Parents only type and read aloud; the idea, the character, and the ending must come from the child.\n- If the child says \"I don't know what to write,\" guide with questions: \"what animal do you like most? what is it most afraid of?\" — don't give the answer directly.\n- Let the child **edit AI's draft by hand** — even changing just one word is exercising the sovereignty of \"I am the author.\"\n\n---\n\n## Safety Reminder\n\n- In the fairy tale, **don't write in real names, schools, or home addresses.** Using an animal or a fake name is safest.\n- Tell the child: the story AI writes is \"made up,\" not real history or news — don't present it as fact to other kids as if it were true.\n- If AI writes something weird, scary, or uncomfortable, turn it off right away, tell a parent \"I don't like this part,\" and we'll change the wording together.\n\n---\n\n## Your Creation\n\n- 📖 **An original fairy tale:** main character + trouble + your ending, at least 5 sentences, with traces of the child's own edits.\n- 🎤 **One read-aloud:** the child reads it to a parent, and the parent gives one specific compliment (like \"the solution you thought of for the penguin is so warm\").\n- 🌟 **Optional:** copy the fairy tale into \"my work book\" as the first page of the lesson-08 portfolio.\n\n---\n\n## Wrapping Up\n\nToday you were a real \"little author\": the character, the trouble, the ending — all thought up by you, AI only helped make the story prettier and flow better. **The idea is always your own** — that is the most important rule of creating with AI. Next lesson, we'll draw a portrait for the characters in the story, and learn to write \"words for AI\" so it can draw them!\n", "04-一起画角色-en.md": "# 04 · Draw a Character → Character Design + Prompt\n\n## Learning Goals\n\n1. Learn to make a \"design card\" for a character: name, look, personality, hobby — the more specific you think, the more the drawing matches what's in your heart.\n2. Meet a new kids'-version word: **prompt** (that's \"the bit of text you tell AI what to draw\"). It's like a note to a painter.\n3. Turn the character design into a clear \"message to AI\" so AI can help draw the character for you.\n4. Strengthen safety habits: use imagined characters, don't share secrets; AI's drawing may not be right, and you can change it.\n\n---\n\n## Warm-up Question\n\n> Last lesson we wrote the chubby penguin's story. But is that penguin in your head wearing a red scarf or a blue hat? Smiling or cool?\n>\n> If you only say \"draw a penguin,\" AI might draw a hundred versions and none is what you want. Today we'll do two things: first make an \"ID card\" for the character (a design card), then translate that ID card into \"words for AI\" it can understand — and it can draw the one in your heart!\n\n---\n\n## Key Concept: The Character Design Four-Piece Set\n\nFill in these four for a character and it comes alive:\n\n1. **Name:** Shanshan / Duoduo / Little Iron Hand…\n2. **Look:** what color, what body shape, wearing a hat or not, any special marks.\n3. **Personality:** brave? sleepy? a bit timid but very kind?\n4. **Hobby / signature move:** loves collecting shells, hops when walking, always hugging a book.\n\n> Mini-dictionary: **prompt** = you connect the above into one clear sentence and show it to AI. Like \"I want AI to help me draw…\"\n\n---\n\n## Activity: Make a Character Card + Write \"Words for AI\"\n\nPrep: one character design card paper (draw four boxes or four rows).\n\n1. **Fill the design card:** fill your character using the \"four-piece set\" above. Example:\n   - Name: Shanshan (a little hedgehog)\n   - Look: orange-yellow, seven star spots on its back, wearing a little blue hat\n   - Personality: shy but brave\n   - Hobby: counting stars at night, likes to draw\n2. **Write the prompt (words for AI):** translate the design card into one paragraph:\n   > \"I want AI to help me draw a little hedgehog named Shanshan: orange-yellow, seven star spots on its back, wearing a little blue hat, shy but brave, whose hobbies are counting stars and drawing at night. Picture-book warm style, background a little hillside under a starry sky.\"\n3. **Ask AI to draw once:** type this paragraph in and see if the drawing matches your card.\n4. **Compare + fix:** what doesn't match? The hat color? The background? Say it more precisely and draw again.\n5. **(Little Experts group):** write a \"self-introduction\" sentence for the character and stick it next to the design.\n\n---\n\n## Parent Tip\n\n- \"Prompt\" is a new word for the child — explain it as \"the note / words for AI,\" not as a technical concept.\n- It's normal for the drawing to \"not look right\" — this is exactly how to teach the child **iteration**: change one word, look again, slowly get closer to the heart's wish.\n- Encourage the child to keep the design card — it's their original \"IP,\" usable later for stories and picture books.\n\n---\n\n## Safety Reminder\n\n- In the character design, **don't put the child's real name, school, or home address.** Use animal names, fake names, imagined names.\n- For AI-generated portraits, don't upload photos with the child's real face to \"transform\" — protect portrait privacy.\n- Remind: AI's drawing sometimes has an extra hand or an extra eye — that's normal, it can draw wrong too, which leads nicely into lesson 06 \"AI makes mistakes too.\"\n\n---\n\n## Your Creation\n\n- 🃏 **A character design card:** name / look / personality / hobby, all four complete.\n- ✍️ **A prompt:** rewritten from the design card into clear \"I want AI to help me draw…\" words.\n- 🖼️ **An AI character drawing:** generated with your prompt, labeled beside it \"original design: me.\"\n- 🌟 **Optional:** put the character card and drawing together in the work book — it's your very own little star.\n\n---\n\n## Wrapping Up\n\nToday we learned a super useful skill: **first think the character specifically (design card), then turn it into words AI can understand (prompt).** Did you notice? The more detailed you say, the more it looks like what you want. Remember: the character is created by you, AI just draws it according to your note. Next lesson, we'll use our questioning skill to ask about this wonderful world!\n", "05-认识世界-en.md": "# 05 · Know the World → Science Question Cards\n\n## Learning Goals\n\n1. Treat AI as a \"machine that loves answering why,\" and encourage the child to ask more and be more curious about the world around them.\n2. Practice turning \"curiosity\" into a clear \"science question,\" not just saying \"why.\"\n3. Build an important habit: **what AI says must be checked in books and with real teachers / parents,** because it can be wrong.\n4. Produce a stack of \"science question cards\" that belong to the child, protecting their thirst for knowledge.\n\n---\n\n## Warm-up Question\n\n> Little friend, do you have a pile of \"whys\":\n> Why is the sky blue? Why is an elephant's nose so long? Why are bubbles round?\n>\n> Grown-ups sometimes can't answer, and sometimes just say something casual and move on. Today, we let AI be the \"100,000 Whys\" little teacher — but we'll be smart little detectives: **what it says, we must check whether it's right!**\n\n---\n\n## Key Concept: A Good Question Looks Like This\n\nSay the \"why\" clearly, and AI answers clearly:\n\n- 🔴 Too short: \"Why do stars shine?\" — AI will answer, but you didn't say how old you are or whether you want it simple or complex.\n- 🟢 Clear: \"I want AI to tell me, in words an 8-year-old can understand, why stars twinkle.\"\n- 🔵 Add imagination (bonus): \"…if you can use a little metaphor, like something from everyday life, even better.\"\n\n> Remember: after asking, write the answer down, then go flip through a science book and ask a science teacher to see if AI was right.\n\n---\n\n## Activity: Make a Stack of \"Science Question Cards\"\n\nPrep: a few little cards (or sticky notes), one curiosity written on each.\n\n1. **List curiosities (3):** parent and child each think of 1–2, like \"why don't cats get hurt jumping from high places?\" \"how do clouds form?\"\n2. **Write the clear version:** rewrite each as \"I want AI to explain in kid words…\"\n3. **Ask AI + record answer:** ask AI to answer, and copy the sentence the child can understand onto the back of the card.\n4. **One verification step (key!):** pick one card, and with a parent flip through a picture book / check a children's encyclopedia to see if AI's answer matches the book.\n   - Matches → mark ✅ \"verified\" on the card\n   - Doesn't match → mark ❓ \"ask an adult again,\" don't rush to believe.\n5. **(Little Experts group):** let the child draw a little \"my imagined answer\" picture for one of the questions.\n\n---\n\n## Parent Tip\n\n- The focus of this lesson is **protecting curiosity** — don't criticize \"that's a silly question.\" The fact that the child is willing to ask is the starting point of a scientist.\n- The verification step is the most precious: it teaches the child \"don't believe blindly,\" which matters more than the answer itself. No book? It's fine to say \"we'll check at the library this weekend\" — that's also a good example.\n- If you don't know the child's question either, say openly \"I don't know either, let's ask AI together and then check the book together\" — that's the best role model.\n\n---\n\n## Safety Reminder\n\n- When asking, **don't type real names, schools, or home addresses**; only ask for knowledge, not \"where my home is.\"\n- AI may give a wrong answer with a straight face (next lesson plays with this specifically). So \"verification\" is not optional, it's required.\n- For questions about body, health, and safety (like \"is it okay to take this medicine\"), **always ask a real person and a doctor** — don't let AI make the call for you.\n\n---\n\n## Your Creation\n\n- 🗂️ **A stack of science question cards (at least 3):** clear question on the front, AI's answer + verification mark (✅/❓) on the back.\n- 🔍 **One verification record:** at least 1 card completed the \"flip the book / ask an adult\" check.\n- 🌟 **Optional:** string the question cards into a little ring and hang it by the desk; add new cards anytime, making a \"my why museum.\"\n\n---\n\n## Wrapping Up\n\nThere are endless \"whys\" in the world, and AI can help us find answers, but it is **not the final judge.** Today we made science question cards, and more importantly learned \"check after asking.\" Know how to doubt and how to verify, and you're a little scientist. Next lesson, we'll play a game specifically — see whether AI really makes mistakes!\n", "06-AI也会错-en.md": "# 06 · AI Makes Mistakes Too → True/False Judgment Game\n\n## Learning Goals\n\n1. Understand in child-friendly words: **AI is not all-knowing; sometimes it \"makes up stories\" and says wrong things.** This is called \"AI can make mistakes too.\"\n2. Through a little game, practice being a \"little detective\": when you hear what AI says, first think \"does this sound right?\"\n3. Build a three-step judgment method: pause → think → check (ask an adult / flip a book).\n4. Strengthen the course-wide red line: the answer AI gives must not be blindly trusted as the standard answer.\n\n---\n\n## Warm-up Question\n\n> You thought AI knows everything? Wrong!\n>\n> Sometimes AI tells you something **that doesn't exist at all** very seriously and very confidently. For example it says \"penguins live in the tropical rainforest,\" or \"the sun comes out to work at night.\" It sounds perfectly serious, but it's all wrong.\n>\n> Today we'll play a \"mistake-finding detective\" game: I'll say a few sentences and you decide which one is a fake made up by AI!\n\n---\n\n## Key Concept: Why Can AI Be Wrong Too?\n\nIn plain words for the child:\n\n- AI learned from \"having read tons and tons of material,\" but there are mistakes in that material too, so it can learn wrong.\n- Sometimes, to \"keep the sentence going,\" it will **make up an answer that sounds reasonable** — but there's no such thing at all.\n- So: **AI speaking confidently ≠ what AI says is definitely right.** Like a little detective, we doubt first, then verify.\n\n> Little rhyme: **when listening to AI, pause 3 seconds first, and ask yourself \"is this reliable?\"**\n\n---\n\n## Activity: True/False Judgment Game\n\nPrep: parent reads \"sentence cards,\" child holds up ✅ (might be true) or ❌ (definitely made up).\n\n**Round 1 · parent reads, child judges (examples):**\n1. \"A fish has bones in its belly, so be careful of the bones.\" — ✅ (true)\n2. \"The moon is a big light bulb that glows by itself.\" — ❌ (false, the moon doesn't glow, it reflects the sun)\n3. \"Bees use their wings to 'talk' (dance) and tell friends where the flowers are.\" — ✅ (true, bees really do dance)\n4. \"A giraffe's neck was originally very short, and it stretched it long itself.\" — ❌ (false, it's evolution)\n\n**Round 2 · let AI make the questions (key practice):**\n> Say to the child: \"let's ask AI to make up 3 sentences that 'look true but are actually fake,' and you be the detective to find them.\"\n> Write down what AI says, judge each one with the child, and mark which sentence is made up.\n\n**Round 3 · reverse challenge:**\nLet the child make up 1 \"fake sentence\" to test the parent, and feel how easy it is to \"make it real\" — and thus understand why AI can fool you.\n\n---\n\n## Parent Tip\n\n- Keep the game atmosphere light like \"catching a ghost,\" not like an exam. Getting it wrong is fine; the point is **building the habit of doubting first.**\n- If the child can't tell, guide with the \"three-step method\": pause (don't believe in a hurry) → think (does it match what I know?) → check (book / adult).\n- Take the chance to stress: adults, teachers, and books can also be wrong, but \"checking from multiple sides\" is the steadiest way.\n\n---\n\n## Safety Reminder\n\n- This lesson points it out directly: **AI can make up fake things,** so any \"scary / weird / conflicting with your knowledge\" information — ask a parent first, don't panic and don't believe.\n- Never try something just because \"AI said eating XX would do such-and-such\"; for body and health matters, only listen to real people and doctors.\n- The fake sentences made up in the game are put down after playing — remind the child \"this is practice, not real knowledge.\"\n\n---\n\n## Your Creation\n\n- 🕵️ **A \"mistake-finding game card\":** at least 4 sentences, child marked ✅/❌, and circled one \"sentence AI most easily fooled me with.\"\n- 📝 **One reminder of their own:** the child can say \"AI can be wrong too, I should think before I believe.\"\n- 🌟 **Optional:** with a parent agree on a \"family code word\" — when AI gives a weird answer, say \"pause a moment, check it out.\"\n\n---\n\n## Wrapping Up\n\nToday we learned a big secret: **AI can say wrong things, even make up stories.** So no matter how confident it is, we must be little detectives — pause first, then think, then check. Carve \"don't believe blindly\" into your little head, and you'll use AI better than many grown-ups. Next lesson, we'll use AI as an \"invention assistant\" to design a magical future object!\n", "07-我的未来发明-en.md": "# 07 · My Future Invention → Future Object Design Sheet\n\n## Learning Goals\n\n1. Spark creativity that \"solves real problems\": first think \"what's inconvenient in life,\" then design a future little invention to solve it.\n2. Practice using AI as an \"invention assistant\": it helps you think of functions, write descriptions, and draw the look — but **the invention's inspiration and the problem to solve come from you.**\n3. Turn the idea into a \"future object design sheet\" with name, look, power, and what problem it solves.\n4. Strengthen: AI is a partner that helps you clarify your idea, not a machine that thinks up ideas for you.\n\n---\n\n## Warm-up Question\n\n> Is there something that makes you think \"if only I had a thing to help me\"?\n> Like: the backpack is too heavy to carry, you get wet forgetting an umbrella in the rain, mom can never find her keys…\n>\n> Today you are a \"little inventor\"! We'll design a **magical object that only exists in the future,** specially solving one small thing that bothers you most. AI comes as your assistant: helps you think the functions through, write the description clearly, and draw the look. But that \"what to solve\" good idea — is yours!\n\n---\n\n## Key Concept: A Good Invention Starts with \"Trouble\"\n\nEvery child can invent, just by walking these three steps:\n\n1. **Find the trouble:** what's inconvenient today? (too heavy / too messy / too slow / easy to forget)\n2. **Think of the magic tool:** if I had one thing, how could it work to solve it? (fly by itself, get lighter, give reminders)\n3. **Draw it:** what does it look like? what's its name? what's its best move?\n\n> Where AI can help: make your magic tool more specific, write a product description for you, draw a concept picture.\n\n---\n\n## Activity: Draw a Future Invention Design Sheet\n\nPrep: one big sheet of paper (draw horizontally, more like a blueprint).\n\n1. **Pick a trouble:** chat with the child, pick the \"inconvenience\" they feel most. Example: \"the backpack gets wet on rainy days.\"\n2. **Think of the magic tool:** design a \"sun-rain auto backpack\" — puts up a little umbrella cover by itself when it rains, folds away when sunny.\n3. **Write the four blocks of the design sheet:**\n   - Name: sun-rain auto backpack\n   - Look: draw a backpack with a \"umbrella flower\" on top that opens\n   - Best power: automatically opens the umbrella cover when it rains, and can also dry\n   - What problem it solves: the backpack and books never get wet again\n4. **Ask AI for help (clear version):**\n   > \"I want AI to help me write 3 sentences introducing this invention, and draw a concept picture: a backpack with an umbrella flower on top that opens automatically, in a future-tech picture-book style.\"\n5. **Put together:** stick the child's hand-drawing + AI's description + AI's picture side by side on the design sheet — that's your \"patent drawing\"!\n\n---\n\n## Parent Tip\n\n- At this step **protecting originality** matters most: let the child say \"what to solve\" first, then let AI help refine it — the order can't be reversed.\n- If the child says \"I don't know what to invent,\" dig from their daily complaints: \"what did you say just now annoys you most?\" — that's the golden idea.\n- Encourage the child to give the invention a weird cute name; creativity is more precious than \"reasonableness.\"\n\n---\n\n## Safety Reminder\n\n- In the invention sheet, **don't write real names, schools, or home addresses;** sign with a fake name or animal name (like \"inventor little panda\").\n- If AI's drawing uses a \"person\" image, use an imagined character, don't upload real photos.\n- Remind: the \"functions\" AI writes are imagination, not really buildable; this is a creation exercise, not a product promise.\n\n---\n\n## Your Creation\n\n- 🛠️ **A future invention design sheet:** contains the four elements name / hand-drawn look / best power / what problem it solves.\n- 🤖 **AI-assisted output:** a paragraph of AI-written intro + an AI-drawn concept picture (labeled \"assistant: AI\").\n- 🌟 **Optional:** hold a \"family invention launch,\" where the child presents the design sheet to the whole family, parents ask questions and the child answers.\n\n---\n\n## Wrapping Up\n\nToday you were a little inventor: starting from \"inconvenience in life,\" you thought up a future magic tool that belongs only to you, and asked AI to help write the description and draw the picture. **The idea is yours, AI is the assistant that makes the idea pretty** — exactly the skill we've practiced all along. Next lesson, we'll bind all the previous works into a book!\n", "08-创作展示-en.md": "# 08 · Showcase → AI Picture Book / Portfolio\n\n## Learning Goals\n\n1. Gather all the works from lessons 01–07 into a **portfolio / AI picture book that belongs to the child,** harvesting the pride of completion.\n2. Practice \"show and tell\": present the child's drawings, stories, characters, and inventions to the family, and clearly state \"which part I thought up, and which part AI helped with.\"\n3. Strengthen the core understanding: in this book, **all the ideas and notions come from you,** AI is just the little assistant that helped make them prettier and sound nicer.\n4. In a warm \"camp-closing little showcase,\" put a period on the camp, and read the safety awareness once more.\n\n---\n\n## Warm-up Question\n\n> Without noticing, you already have so many works: the AI helper portrait, the question comparison card, a fairy tale, a character card, science question cards, the mistake-finding game card, the future invention sheet…\n>\n> Are they scattered everywhere now? Today we'll give them a home — a book called **\"My AI Creativity Portfolio.\"** Open it, and it's all your own wonderful ideas!\n\n---\n\n## Key Concept: What Is a \"Portfolio\"\n\nA portfolio is \"a book where I gather the good things I've made, in order.\"\n\n- It proves one thing: **these ideas were all thought up by me,** AI came to help realize them.\n- It's also a gift to your future self: flip through it half a year later and you'll laugh \"I had such fun ideas back then.\"\n- The proudest sentence when showing: \"the story on this page I made up, AI helped me write it more vividly.\"\n\n---\n\n## Activity: Make Your Portfolio / AI Picture Book\n\nPrep: a folder / a blank notebook, or a document; glue stick, crayons.\n\n1. **Collect (5 minutes):** find all the works from lessons 01–07 and line them up in order.\n2. **Make a cover:** write \"My AI Creativity Portfolio · Author: [child's fake name],\" and draw a little icon representing yourself.\n3. **Bind into a book (one work per page):**\n   - Page 1: my AI helper in my heart (portrait + name)\n   - Page 2: three-kind question comparison card\n   - Page 3: my original fairy tale\n   - Page 4: my character card + AI portrait\n   - Page 5: science question cards (pick 1–2)\n   - Page 6: true/false judgment game card\n   - Page 7: future invention design sheet\n4. **Write a \"creation declaration\" (child dictates, parent writes or child writes):**\n   > \"The ideas in this book were all thought up by me; AI is the good helper that helped me realize them. AI can be wrong too, so I always think about it.\"\n5. **Family showcase (10 minutes):** the child flips through the book and tells the family 2–3 pages, focusing on \"which was my idea.\" Parents applaud + one specific compliment.\n\n---\n\n## Parent Tip\n\n- The showcase step **emphasizes encouragement, goes light on correction.** This is a creativity celebration, not a homework check.\n- Help the child clearly say \"what I thought / what AI helped with\" — this echoes the course-wide red line and also trains expression.\n- Photograph the portfolio for safekeeping; when the child grows up and looks back, they'll remember \"I created with AI when I was little.\"\n\n---\n\n## Safety Reminder\n\n- If the portfolio is shared with relatives or posted online, **hide real names, schools, home addresses;** use fake names and imagined characters.\n- Don't make the child's clear front-face photo public mixed with the works; protect the portrait.\n- At the end of the showcase, read the three safety sentences together with the parent again (no leaking secrets / no blind belief / no dependency), as the camp-closing agreement.\n\n---\n\n## Your Creation\n\n- 📚 **A portfolio / AI picture book:** cover + the seven pages of works 01–07 + one creation declaration.\n- 🎤 **One family showcase:** child presents 2–3 pages, able to clearly separate \"my idea\" from \"AI helped.\"\n- 🤝 **One safety agreement:** a little note of the family-signed \"three don'ts of AI use,\" tucked into the book.\n- 🌟 **Camp completion certificate:** parent gives the child a hand-written \"AI Creativity Little Master\" award to celebrate finishing!\n\n---\n\n## Wrapping Up (also the end of the whole camp)\n\nFrom \"draw an AI friend\" to \"make a portfolio of your own,\" you've walked a wonderful journey. You learned: **AI is a tool not an authority, say it clearly so it understands, use it to turn ideas into stories and pictures, and remember to protect privacy and not believe blindly.** These skills will grow up with you. Congratulations, AI Creativity Little Master! 🎉\n", "09-家长指南-en.md": "# Lesson 9   Parent Guide (How to Accompany Your Child Using AI)\n\n> This camp is for children aged 6–12 and requires a parent's company. This file is for parents to read, to help you become the \"co-pilot\" for your child's AI use.\n\n## 1. Why Your Child Needs You Along\n\nAI is a tool, not a babysitter. Children aged 6–12:\n- Can't tell \"is what AI said real or made up\" (see Lesson 6 \"AI Makes Mistakes Too\").\n- Easily treat AI as an \"authority answer machine\" and lose their own thinking.\n- Need someone to help turn \"fun\" into \"gain.\"\n\nYour role is not \"teach technology,\" but \"accompany them to ask, accompany them to think, accompany them to make the idea real.\"\n\n## 2. Four Moves Every Time You Play Together\n\n1. **Ask before answering:** let the child first say what they want to do, then open AI. Don't type for them right away.\n2. **Look at the output together:** after AI gives something, discuss with them \"is this real? do you think it's good?\"\n3. **Hands-on making:** every lesson has a creation task (drawing, writing stories, designing inventions) — accompany them to finish it, not just watch the screen.\n4. **Collect the works:** save each work into the \"AI creation book\" (Lesson 8), building a sense of achievement.\n\n## 3. Frequently Asked Questions\n\n**Q: My child copies AI's essay directly and hands it to school — what do I do?**\nA: Set the rule clearly — AI is a \"brainstorm partner,\" but the final version must be in their own words. Have them give AI requirements and edit AI's draft, rather than copy it wholesale.\n\n**Q: AI answered wrong and the child believed it — what do I do?**\nA: That's exactly the Lesson 6 \"true/false judgment\" practice. Accompany them to verify: \"let's check the book / ask the teacher to see if AI was right.\"\n\n**Q: My child is addicted to chatting with AI and ignores people?**\nA: Set screen time (see below). AI is a supplement, not a replacement for real socializing.\n\n**Q: What tool is safe to use?**\nA: Prefer products with \"kids mode / parent monitoring\"; don't use tools that require real name and phone; don't let the child upload photos to unknown platforms.\n\n## 4. Screen Time and Boundary Suggestions\n\n- Single play session ≤ 30–45 minutes (matching each lesson's length).\n- Not within 1 hour before bedtime.\n- After use, do a \"non-screen\" extension: draw out the AI-generated story, or make the invention design by hand.\n\n## 5. Parent Red Lines (follow together with the child)\n\n- Don't tell AI your name, school, or home address.\n- Don't treat AI as \"exam answers.\"\n- Whether AI says \"you're great / you're wrong\" is just a program — don't take it to heart.\n- When you see uncomfortable content, turn it off immediately and tell a parent.\n\n> The goal of accompanying your child with AI: make them better at thinking, better at expressing, more creative — not more dependent on the screen.\n", "10-安全手册-en.md": "# Lesson 10   Safety Handbook (a version kids can understand)\n\n> \"AI use safety rules\" for parents and children. Written in words kids can understand; parents are advised to read it to the child and stick it on the desk together.\n\n## 1. Five Safety Rules for the Child (read aloud to them)\n\n1. **Don't tell AI who you are**\n   AI is not a friend; you don't need to tell it your real name, school, where you live, or phone number. Just like you don't tell strangers about family business.\n\n2. **AI can \"make up stories,\" not necessarily true**\n   Sometimes AI says \"the sun is green\" or \"you'll definitely get full marks\" — that's it talking nonsense. For important things, ask mom, dad, or the teacher.\n\n3. **AI is not a teacher, not an examiner**\n   When it says \"you're so smart\" or \"you answered wrong,\" it's just a computer program talking — don't be happy and don't be sad.\n\n4. **Write homework yourself**\n   AI can help you think of ideas, but essays and arithmetic you must do yourself. Copying AI's answers teaches you no real skill.\n\n5. **Turn it off if uncomfortable**\n   If you see something weird, scary, or you don't understand, turn it off right away and tell mom and dad.\n\n## 2. Five Guardian Rules for Parents\n\n1. **Accompany the use:** a 6–12 year-old's first use must have a parent present.\n2. **Check the tool:** only use products with child protection / parent monitoring; no anonymous chat.\n3. **Check the content:** regularly look at the child's conversations with AI, and guide promptly if anything's off.\n4. **Protect privacy:** don't let the child enter real identity info; don't send photos on public AI.\n5. **Set boundaries:** screen time controllable; AI is a toy, not everything.\n\n## 3. Real-vs-Fake Mini Practice (with Lesson 6)\n\nParent says a sentence to make AI make something up, like \"do penguins live in the desert?\" — watch how AI answers, then check the truth with the child.\nLet the child remember: **\"what AI says, put a question mark first.\"**\n\n## 4. Dependency Risk Reminder\n\nIf the child shows \"can't do a problem without asking AI\" or \"only wants to chat with AI\" — pause use for a few days and return to paper books and real interaction. AI is a side road, not the main road.\n\n## 5. Emergency Situations\n\n- Child receives inducement, harassment, or inappropriate content → immediately save a screenshot, close the tool, and report to the platform.\n- Personal info leak involved → change related passwords and inform the school.\n\n> Safety is not limiting the child's exploration, but letting exploration happen within protection.\n", "11-Prompt模板库(儿童版)-en.md": "# Lesson 11   Prompt Template Library (Kids Edition)\n\n> \"Little talking cards\" for parents and children. Each starts with \"I want AI to help me…,\" simple, concrete, and readable by the child themselves.\n> Read Lesson 9 Parent Guide and Lesson 10 Safety Handbook before use.\n\n## 1. Universal Opening (say this first for every one)\n\n```\nI want AI to help me [do one specific thing].\nI am a [how many] year-old child, please speak in [simple / fun] words.\n```\n\n## 2. Templates by Lesson\n\n### Lesson 1 · What is AI\n```\nI want AI to help me draw what \"my AI helper in my heart\" looks like.\nWhat superpowers does it have? Please describe it for me, and I'll draw it.\n```\n\n### Lesson 2 · How to Ask\n```\nI want AI to help me: I'm going to ask about [dinosaurs / stars / puppies].\nPlease first teach me 3 ways to ask, so I can compare which asks most clearly.\n```\n\n### Lesson 3 · Story Time\n```\nI want AI to help me write a fairy tale: the main character is [a little fox who can cook],\nand it's going to [save the sky covered by dark clouds]. Please write with me, paragraph by paragraph.\n```\n\n### Lesson 4 · Draw a Character\n```\nI want AI to help me design a character: it is [a little engineer living on the clouds],\nand likes [collecting rainbows]. Please write out its look and a drawing prompt, and I'll take it to draw.\n```\n\n### Lesson 5 · Know the World\n```\nI want AI to help me explain: why [do stars come out at night]?\nPlease say it in words a [8-year-old] can understand, then give me a little question to test me.\n```\n\n### Lesson 6 · AI Makes Mistakes Too\n```\nI want AI to help me play the \"true/false game\": you deliberately say 3 sentences about [animals],\none of them false, and let me guess which is made up, and tell me the answer.\n```\n\n### Lesson 7 · My Future Invention\n```\nI want AI to help me design a \"future [desk that puts away the backpack by itself]\":\nhow does it work? what does it look like? Please write out the look, and I'll draw the design sheet.\n```\n\n### Lesson 8 · Showcase\n```\nI want AI to help me: put my [5 stories + 5 drawings] into one \"AI picture book.\"\nPlease give the picture book a name and write an opening.\n```\n\n## 3. \"Accompany-the-Ask\" Tips for Parents\n\n- Let the child **read aloud** what they want to do, training expression.\n- After AI answers, ask the child: \"do you think it's right? what was fun?\"\n- Encourage the child to **change AI's words:** \"ask AI to say it another way and try again.\"\n\n## 4. Safety Reminder (use every time)\n\n- Don't fill in real name, school, phone.\n- When AI says \"not sure if real or fake,\" check the book or ask an adult.\n- Don't copy AI's answer as homework.\n\n> The template is a \"scaffold\"; the child's idea is the main character. AI helps bring the idea out; the main character is always the child.\n"};
const toc=document.getElementById('toc'), content=document.getElementById('content');
let cur=null;
function load(name){
  if(cur) cur.classList.remove('active');
  cur=[...toc.children].find(a=>a.dataset.f===name); if(cur)cur.classList.add('active');
  content.scrollTop=0; window.scrollTo(0,0);
  const md = DATA[name] || '';
  content.innerHTML='<h1>'+name.replace(/\.md$/,'')+'</h1>'+MD.render(md);
  location.hash=encodeURIComponent(name);
}
const names = Object.keys(DATA);
names.forEach(f=>{
  const a=document.createElement('a'); a.textContent=f.replace(/\.md$/,''); a.dataset.f=f;
  a.onclick=e=>{e.preventDefault();load(f)}; toc.appendChild(a);
});
const h=decodeURIComponent(location.hash.slice(1));
load(names.includes(h)?h:names[0]);
</script>
